<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Klíčoví klienti — Nutworld</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bd:#5c381f;--br:#83502e;--kraft:#f1e6da;--acc:#da1668;--amb:#f7ab31;--leaf:#6fa044}
body{font-family:"Source Sans 3",Arial,sans-serif;background:#e8ddd4;color:#2a1a0e;min-height:100vh;overflow-x:hidden}

.topbar{background:var(--bd);padding:11px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar-title{font-family:"Exo 2",sans-serif;font-size:16px;font-weight:800;color:white}
.topbar a{color:rgba(255,255,255,.6);font-size:12px;text-decoration:none}
.topbar a:hover{color:white}
.topbar-right{margin-left:auto;display:flex;gap:8px}
.btn-top{background:var(--amb);border:none;color:var(--bd);font-family:"Exo 2",sans-serif;font-weight:800;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer}
.btn-top:hover{filter:brightness(1.08)}

.alert-bar{max-width:1200px;margin:14px auto 0;padding:0 16px;display:none}
.alert-item{border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:12.5px;display:flex;gap:10px}
.alert-overdue{background:#fde8ef;border-left:4px solid var(--acc)}
.alert-today{background:#fff8e1;border-left:4px solid var(--amb)}

.wrap{max-width:1200px;margin:0 auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}

/* KARTA KLIENTA */
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.08);display:grid;grid-template-columns:260px 1fr 270px;min-height:0}
@media(max-width:900px){.card{grid-template-columns:1fr}}

.card-header{padding:16px 18px;display:flex;gap:12px;align-items:flex-start;border-right:1px solid #f0e8df}
.avatar{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:"Exo 2",sans-serif;font-size:14px;font-weight:800;color:white;flex-shrink:0}
.av-c0{background:linear-gradient(135deg,#1a4a7a,#2e78c0)}
.av-c1{background:linear-gradient(135deg,#1a5c4a,#2da882)}
.av-c2{background:linear-gradient(135deg,#3a3a6b,#6868b8)}
.av-c3{background:linear-gradient(135deg,#6b2f6b,#a855a8)}
.av-c4{background:linear-gradient(135deg,#7a3a1a,#c06030)}
.av-c5{background:linear-gradient(135deg,#2d5a1b,#6fa044)}
.av-c6{background:linear-gradient(135deg,#4a1a3a,#8a4078)}
.av-c7{background:linear-gradient(135deg,#1a3a5c,#2e5a9e)}
.av-c8{background:linear-gradient(135deg,#5a4a1a,#a09030)}

.cl-info{flex:1;min-width:0}
.cl-company{font-family:"Exo 2",sans-serif;font-size:15px;font-weight:800;color:var(--bd);line-height:1.2;margin-bottom:1px}
.cl-sector{font-size:10px;color:#a08060;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.cl-contact{font-size:12px;color:var(--br);font-weight:600;margin-bottom:7px}
.cl-actions{display:flex;flex-wrap:wrap;gap:5px}
.act-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:12px;text-decoration:none;border:1.5px solid;cursor:pointer;background:none;font-family:inherit;transition:all .12s;white-space:nowrap}
.act-mail{color:var(--br);border-color:#d4c0a8}.act-mail:hover{background:var(--kraft)}
.act-cal{color:#0d6efd;border-color:#b3cffd}.act-cal:hover{background:#e8f0fe}
.act-web{color:#2d7a1f;border-color:#b0d89a}.act-web:hover{background:#f0f7e8}
.act-tel{color:#6b2f6b;border-color:#d4b0d4}.act-tel:hover{background:#f7f0f7}
.act-meet{color:#5c381f;border-color:#c8a882;background:var(--kraft)}.act-meet:hover{filter:brightness(.95)}
.act-del{color:#c0a880;border-color:transparent;font-size:10px}.act-del:hover{color:var(--acc)}
.act-edit{color:#0d6efd;border-color:transparent;font-size:10px}.act-edit:hover{color:#0052cc}
.act-drive{color:#188038;border-color:#a8d5b5}.act-drive:hover{background:#e8f5ec}

.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;cursor:pointer;border:2px solid #e0d0c0}
.s-ok{background:var(--leaf);border-color:var(--leaf)}
.s-watch{background:var(--amb);border-color:var(--amb)}
.s-paused{background:#c0b0a0;border-color:#c0b0a0}

.section{padding:14px 16px;border-right:1px solid #f0e8df}
.sec-title{font-family:"Exo 2",sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#a08060;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.badge{background:var(--acc);color:white;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800}
.badge-amb{background:var(--amb);color:var(--bd)}
.badge-green{background:var(--leaf);color:white}

.task-list{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.task-item{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid #f8f4f0}
.task-item:last-child{border:none}
.task-check{width:15px;height:15px;accent-color:var(--br);flex-shrink:0;cursor:pointer}
.task-text{flex:1;font-size:12px;line-height:1.4}
.task-text.done{text-decoration:line-through;color:#b0966a}
.task-due{font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;flex-shrink:0}
.due-ok{color:#a08060;background:#f5f0ea}.due-today{color:#7a4a00;background:#fff0b0}.due-over{color:white;background:var(--acc)}
.task-del{background:none;border:none;color:#d4c0a8;font-size:12px;cursor:pointer;flex-shrink:0}
.task-del:hover{color:var(--acc)}
.add-task{display:flex;gap:5px}
.task-input{flex:1;border:1.5px solid #d4c0a8;border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit;background:#fdf9f6}
.task-input:focus{outline:none;border-color:var(--br)}
.date-input{border:1.5px solid #d4c0a8;border-radius:7px;padding:4px 6px;font-size:11px;font-family:inherit;background:#fdf9f6;width:108px}
.date-input:focus{outline:none;border-color:var(--br)}
.btn-add-t{background:var(--bd);border:none;border-radius:7px;color:white;font-size:15px;width:26px;height:26px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* DOKUMENTY & POZNÁMKY — pravý sloupec */
.docs-section{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.doc-item{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#faf7f4;border-radius:8px;border:1px solid #ede0d4}
.doc-icon{font-size:14px;flex-shrink:0}
.doc-info{flex:1;min-width:0}
.doc-title{font-size:12px;font-weight:600;color:var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-type-label{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#a08060}
.doc-open{font-size:11px;color:#0d6efd;text-decoration:none;flex-shrink:0;white-space:nowrap}
.doc-open:hover{text-decoration:underline}
.doc-del{background:none;border:none;color:#d4c0a8;font-size:11px;cursor:pointer;padding:0 2px;flex-shrink:0}
.doc-del:hover{color:var(--acc)}
.btn-add-doc{width:100%;background:#f1e6da;border:1.5px dashed #c8a882;border-radius:8px;padding:7px;font-size:12px;font-weight:600;color:var(--br);cursor:pointer;font-family:inherit;transition:all .12s;margin-top:2px}
.btn-add-doc:hover{background:var(--kraft);border-color:var(--br)}
.notes{width:100%;border:1.5px solid #ede0d4;border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit;resize:none;height:74px;line-height:1.6;background:#fdf9f6;transition:border-color .15s;margin-top:6px}
.notes:focus{outline:none;border-color:var(--br)}
.notes::placeholder{color:#c0a880}

/* PANEL SCHŮZEK */
.meet-panel{position:fixed;top:0;right:-100%;width:min(600px,100vw);height:100vh;background:white;box-shadow:-4px 0 24px rgba(0,0,0,.18);z-index:200;transition:right .25s ease;display:flex;flex-direction:column;overflow:hidden}
.meet-panel.open{right:0}
.panel-topbar{background:var(--bd);padding:12px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.panel-title{font-family:"Exo 2",sans-serif;font-size:14px;font-weight:800;color:white;flex:1}
.panel-close{background:rgba(255,255,255,.2);border:none;color:white;font-size:18px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel-close:hover{background:rgba(255,255,255,.35)}
.panel-actions{padding:12px 18px;border-bottom:1px solid #f0e8df;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.panel-body{flex:1;overflow-y:auto;padding:14px 18px}
.new-meet-form{background:var(--kraft);border-radius:12px;padding:16px;margin-bottom:14px;border:2px solid #d4c0a8;display:none}
.new-meet-form.open{display:block}
.form-row{margin-bottom:10px}
.form-label{font-size:11px;font-weight:700;color:var(--br);display:block;margin-bottom:3px;font-family:"Exo 2",sans-serif;letter-spacing:.5px}
.form-input{width:100%;border:1.5px solid #d4c0a8;border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;background:white}
.form-input:focus{outline:none;border-color:var(--br)}
.form-textarea{width:100%;border:1.5px solid #d4c0a8;border-radius:7px;padding:7px 10px;font-size:12px;font-family:inherit;resize:vertical;min-height:70px;line-height:1.6;background:white}
.form-textarea:focus{outline:none;border-color:var(--br)}
.bullets-list{display:flex;flex-direction:column;gap:4px;margin-bottom:5px}
.bullet-row{display:flex;gap:5px}
.bullet-input{flex:1;border:1.5px solid #d4c0a8;border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit;background:white}
.bullet-input:focus{outline:none;border-color:var(--br)}
.btn-add-bullet{background:var(--bd);border:none;border-radius:6px;color:white;font-size:13px;padding:0 8px;cursor:pointer;flex-shrink:0}
.form-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn-sm-save{background:var(--bd);border:none;border-radius:16px;color:white;font-family:"Exo 2",sans-serif;font-weight:700;font-size:12px;padding:7px 16px;cursor:pointer}
.btn-sm-cancel{background:#e8d8c5;border:none;border-radius:16px;color:var(--br);font-family:"Exo 2",sans-serif;font-weight:700;font-size:12px;padding:7px 14px;cursor:pointer}
.meet-entry{border:1.5px solid #ede0d4;border-radius:10px;margin-bottom:10px;overflow:hidden}
.meet-entry-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;background:#fdf9f6}
.meet-entry-header:hover{background:var(--kraft)}
.meet-date{font-family:"Exo 2",sans-serif;font-size:12px;font-weight:700;color:var(--br);flex-shrink:0}
.meet-topic{font-size:13px;font-weight:600;color:var(--bd);flex:1}
.meet-body{display:none;padding:12px 14px;border-top:1px solid #ede0d4}
.meet-body.open{display:block}
.meet-section{margin-bottom:10px}
.meet-section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#a08060;margin-bottom:4px}
.meet-section-text{font-size:12px;line-height:1.6;color:#2a1a0e;white-space:pre-line}
.meet-bullets{list-style:none;display:flex;flex-direction:column;gap:3px}
.meet-bullets li::before{content:"•  ";color:var(--br);font-weight:700}
.meet-bullets li{font-size:12px;line-height:1.5}
.meet-actions{display:flex;gap:7px;margin-top:10px}
.btn-del-meet{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:14px;border:1.5px solid transparent;cursor:pointer;background:none;font-family:inherit;color:#c0a880;margin-left:auto}
.btn-del-meet:hover{color:var(--acc)}
.empty-meets{text-align:center;padding:32px 16px;color:#a08060;font-size:13px}

.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199;display:none}
.panel-overlay.open{display:block}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:16px;padding:24px;width:90%;max-width:460px;display:flex;flex-direction:column;gap:11px;max-height:90vh;overflow-y:auto}
.modal h2{font-family:"Exo 2",sans-serif;font-size:16px;font-weight:800;color:var(--bd)}
.modal label{font-size:11px;font-weight:600;color:var(--br);display:block;margin-bottom:3px}
.modal input,.modal select{width:100%;border:1.5px solid #d4c0a8;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fdf9f6}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--br)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn-cancel{background:#f0e8df;border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;color:var(--br);cursor:pointer;font-family:inherit}
.btn-save{background:var(--bd);border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;color:white;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">🏢 Klíčoví klienti</span>
  <a href="/ja.html">← Dashboard</a>
  <div class="topbar-right">
    <button class="btn-top" onclick="openAddModal()">+ Přidat klienta</button>
  </div>
</div>

<div id="alert-bar" class="alert-bar"></div>
<div class="wrap" id="grid"></div>

<!-- Panel schůzek -->
<div class="panel-overlay" id="panel-overlay" onclick="closeMeetPanel()"></div>
<div class="meet-panel" id="meet-panel">
  <div class="panel-topbar">
    <div class="panel-title" id="panel-title">Schůzky</div>
    <button class="panel-close" onclick="closeMeetPanel()">✕</button>
  </div>
  <div class="panel-actions">
    <a class="act-btn act-cal" id="panel-cal-btn" href="#" target="_blank">📅 Naplánovat schůzku</a>
    <button class="act-btn act-meet" onclick="toggleNewMeetForm()">+ Zaznamenat schůzku</button>
  </div>
  <div class="panel-body">
    <div class="new-meet-form" id="new-meet-form">
      <div class="form-row">
        <label class="form-label">Datum</label>
        <input class="form-input" type="date" id="f-date"/>
      </div>
      <div class="form-row">
        <label class="form-label">Téma schůzky</label>
        <input class="form-input" type="text" id="f-topic" placeholder="Prezentace, review, ceník, nabídka…"/>
      </div>
      <div class="form-row">
        <label class="form-label">Klíčové body</label>
        <div class="bullets-list" id="f-points"></div>
        <button class="btn-add-bullet" onclick="addBullet('f-points')">+ bod</button>
      </div>
      <div class="form-row">
        <label class="form-label">Akce & follow-up</label>
        <div class="bullets-list" id="f-actions"></div>
        <button class="btn-add-bullet" onclick="addBullet('f-actions')">+ akce</button>
      </div>
      <div class="form-row">
        <label class="form-label">Poznámky</label>
        <textarea class="form-textarea" id="f-notes" placeholder="Volné poznámky…"></textarea>
      </div>
      <div class="form-btns">
        <button class="btn-sm-cancel" onclick="toggleNewMeetForm()">Zrušit</button>
        <button class="btn-sm-save" onclick="saveMeeting()">Uložit schůzku</button>
      </div>
    </div>
    <div id="meet-list"></div>
  </div>
</div>

<!-- Modal: přidat / upravit klienta -->
<div class="modal-overlay" id="modal-client">
  <div class="modal">
    <h2 id="modal-client-title">Přidat klienta</h2>
    <div><label>Název firmy *</label><input id="c-company" placeholder="ES Cofee s.r.o."/></div>
    <div><label>Kontaktní osoba</label><input id="c-contact" placeholder="Martin Werner"/></div>
    <div><label>Sektor / typ</label><input id="c-sector" placeholder="Korporáty / B2B dárky / Retail…"/></div>
    <div><label>Email</label><input id="c-email" type="email" placeholder="martin@escofee.cz"/></div>
    <div><label>Telefon</label><input id="c-phone" placeholder="+420 777 000 000"/></div>
    <div><label>Web</label><input id="c-web" placeholder="https://escofee.cz"/></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-client')">Zrušit</button>
      <button class="btn-save" id="modal-client-save" onclick="saveClient()">Přidat</button>
    </div>
  </div>
</div>

<!-- Modal: přidat dokument/odkaz -->
<div class="modal-overlay" id="modal-doc">
  <div class="modal" style="max-width:380px">
    <h2>Přidat dokument / odkaz</h2>
    <div><label>Název *</label><input id="d-title" placeholder="Smlouva 2026, Cenová nabídka…"/></div>
    <div><label>URL</label><input id="d-url" placeholder="https://drive.google.com/…"/></div>
    <div>
      <label>Typ</label>
      <select id="d-type">
        <option value="smlouva">📄 Smlouva</option>
        <option value="nabidka">💼 Nabídka</option>
        <option value="report">📊 Report</option>
        <option value="odkaz" selected>🔗 Odkaz</option>
        <option value="ostatni">📎 Ostatní</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-doc')">Zrušit</button>
      <button class="btn-save" onclick="saveDoc()">Přidat</button>
    </div>
  </div>
</div>

<script>
const CK='nw_clients_v1', TK='nw_client_tasks_v1', NK='nw_client_notes_v1',
      MEETK='nw_client_meetings_v1', DK='nw_client_docs_v1';
const TODAY=new Date().toISOString().slice(0,10);

const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const clients=()=>ld(CK,[]);
const allTasks=()=>ld(TK,{});
const allNotes=()=>ld(NK,{});
const allMeets=()=>ld(MEETK,{});
const allDocs=()=>ld(DK,{});

const DOC_ICONS={smlouva:'📄',nabidka:'💼',report:'📊',odkaz:'🔗',ostatni:'📎'};
const STATUS_CYCLE={ok:'watch',watch:'paused',paused:'ok'};
const STATUS_CLASS={ok:'s-ok',watch:'s-watch',paused:'s-paused'};
const STATUS_TITLE={ok:'Aktivní',watch:'Sledovat',paused:'Pozastaveno'};

function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return`${d}.${m}.${y}`;}
function fmtShort(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return`${d}.${m}.`;}
function dueClass(iso){if(!iso)return'';if(iso<TODAY)return'due-over';if(iso===TODAY)return'due-today';return'due-ok';}
function dueLabel(iso){if(!iso)return'';if(iso<TODAY)return'⚠ '+fmtShort(iso);if(iso===TODAY)return'⬤ dnes';return fmtShort(iso);}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

// ── CALENDAR ──
function calUrl(c){
  const gdt=d=>d.toISOString().replace(/-|:|\.\d{3}/g,'');
  const dt=new Date();dt.setDate(dt.getDate()+1);dt.setHours(9,0,0,0);
  const en=new Date(dt.getTime()+60*60000);
  const p=new URLSearchParams({action:'TEMPLATE',text:`Schůzka — ${c.company}`,details:`Schůzka s ${c.contact||c.company} (${c.sector||''})`,dates:`${gdt(dt)}/${gdt(en)}`});
  const guests=[c.email,'claudie.nutworld.cz@gmail.com'].filter(Boolean).join(',');
  if(guests)p.set('add',guests);
  return`https://calendar.google.com/calendar/render?${p}`;
}

// ── ALERTS ──
function renderAlerts(){
  const ts=allTasks(),cs=clients();
  let html='';
  cs.forEach(c=>{
    (ts[c.id]||[]).filter(t=>!t.done&&t.due).forEach(t=>{
      if(t.due<TODAY) html+=`<div class="alert-item alert-overdue">🚨 <strong>${esc(c.company)}:</strong> ${esc(t.text)} — po termínu ${fmtShort(t.due)}</div>`;
      else if(t.due===TODAY) html+=`<div class="alert-item alert-today">⏰ <strong>${esc(c.company)}:</strong> ${esc(t.text)} — <em>dnes!</em></div>`;
    });
  });
  const bar=document.getElementById('alert-bar');
  bar.innerHTML=html; bar.style.display=html?'block':'none';
}

// ── CYCLE STATUS ──
function cycleStatus(cid){
  const cs=clients(),c=cs.find(x=>x.id===cid);
  if(c){c.status=STATUS_CYCLE[c.status||'ok'];sv(CK,cs);render();}
}

// ── RENDER ──
function render(){
  const cs=clients(),ts=allTasks(),ns=allNotes(),meets=allMeets(),docs=allDocs();
  const grid=document.getElementById('grid');
  if(!cs.length){
    grid.innerHTML=`<div style="background:white;border-radius:14px;padding:48px;text-align:center;color:#a08060;box-shadow:0 1px 8px rgba(0,0,0,.08)">
      <div style="font-size:40px;margin-bottom:12px">🏢</div>
      <div style="font-family:'Exo 2',sans-serif;font-size:15px;font-weight:700;color:var(--bd);margin-bottom:6px">Zatím žádní klienti</div>
      <div style="font-size:13px;margin-bottom:20px">Přidej prvního a začni sledovat úkoly, schůzky a dokumenty.</div>
      <button onclick="openAddModal()" style="background:var(--bd);border:none;border-radius:20px;color:white;font-family:'Exo 2',sans-serif;font-weight:700;font-size:13px;padding:9px 22px;cursor:pointer">+ Přidat prvního klienta</button>
    </div>`;
    renderAlerts(); return;
  }
  grid.innerHTML=cs.map((c,i)=>{
    const mt=ts[c.id]||[];
    const open=mt.filter(t=>!t.done);
    const overdue=open.filter(t=>t.due&&t.due<TODAY).length;
    const dueToday=open.filter(t=>t.due===TODAY).length;
    const meetCount=(meets[c.id]||[]).length;
    const cdocs=docs[c.id]||[];
    const st=c.status||'ok';
    const badge=overdue?`<span class="badge">${overdue}!</span>`:dueToday?`<span class="badge badge-amb">${dueToday} dnes</span>`:'';
    const mBadge=meetCount?`<span class="badge badge-green">${meetCount}</span>`:'';

    return`<div class="card">
      <div class="card-header">
        <div class="avatar av-c${i%9}">${esc(initials(c.company))}</div>
        <div class="cl-info">
          <div style="display:flex;align-items:flex-start;gap:6px">
            <div class="cl-company">${esc(c.company)}</div>
            <div class="status-dot ${STATUS_CLASS[st]}" onclick="cycleStatus('${esc(c.id)}')" title="${STATUS_TITLE[st]} — klikni pro změnu"></div>
          </div>
          ${c.sector?`<div class="cl-sector">${esc(c.sector)}</div>`:''}
          ${c.contact?`<div class="cl-contact">👤 ${esc(c.contact)}</div>`:''}
          <div class="cl-actions">
            ${c.email?`<a class="act-btn act-mail" href="mailto:${esc(c.email)}">✉ Email</a>`:''}
            ${c.phone?`<a class="act-btn act-tel" href="tel:${esc(c.phone)}">📞 Tel.</a>`:''}
            ${c.web?`<a class="act-btn act-web" href="${esc(c.web)}" target="_blank">🌐 Web</a>`:''}
            <a class="act-btn act-cal" href="${calUrl(c)}" target="_blank">📅 Schůzka</a>
            <button class="act-btn act-meet" onclick="openMeetPanel('${esc(c.id)}')">📓 Schůzky ${mBadge}</button>
            <a class="act-btn act-drive" href="https://drive.google.com/drive/search?q=${encodeURIComponent(c.company)}" target="_blank">📁 Drive</a>
            <button class="act-btn act-edit" onclick="openEditModal('${esc(c.id)}')">✏ Upravit</button>
            <button class="act-btn act-del" onclick="deleteClient('${esc(c.id)}')">Odebrat</button>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="sec-title">📋 Úkoly ${badge}</div>
        <div class="task-list" id="tl-${c.id}">${mt.map(t=>`
          <div class="task-item">
            <input type="checkbox" class="task-check" ${t.done?'checked':''} onchange="toggleTask('${esc(c.id)}','${esc(t.id)}',this.checked)"/>
            <span class="task-text${t.done?' done':''}">${esc(t.text)}</span>
            ${t.due?`<span class="task-due ${dueClass(t.due)}">${dueLabel(t.due)}</span>`:''}
            <button class="task-del" onclick="delTask('${esc(c.id)}','${esc(t.id)}')">✕</button>
          </div>`).join('')}
        </div>
        <div class="add-task">
          <input class="task-input" id="ti-${c.id}" placeholder="Nový úkol…" onkeydown="if(event.key==='Enter')addTask('${esc(c.id)}')"/>
          <input class="date-input" type="date" id="td-${c.id}" min="${TODAY}"/>
          <button class="btn-add-t" onclick="addTask('${esc(c.id)}')">+</button>
        </div>
      </div>
      <div class="docs-section">
        <div class="sec-title">📎 Dokumenty & poznámky</div>
        ${cdocs.map(d=>`
          <div class="doc-item">
            <span class="doc-icon">${DOC_ICONS[d.type]||'📎'}</span>
            <div class="doc-info">
              <div class="doc-title" title="${esc(d.title)}">${esc(d.title)}</div>
              <div class="doc-type-label">${esc(d.type)}</div>
            </div>
            ${d.url?`<a class="doc-open" href="${esc(d.url)}" target="_blank">Otevřít ↗</a>`:''}
            <button class="doc-del" onclick="delDoc('${esc(c.id)}','${esc(d.id)}')">✕</button>
          </div>`).join('')}
        <button class="btn-add-doc" onclick="openDocModal('${esc(c.id)}')">+ Přidat dokument / odkaz</button>
        <textarea class="notes" placeholder="Poznámky ke klientovi…" onblur="saveNote('${esc(c.id)}',this.value)">${esc(ns[c.id]||'')}</textarea>
      </div>
    </div>`;
  }).join('');
  renderAlerts();
}

// ── TASKS ──
function addTask(cid){
  const inp=document.getElementById('ti-'+cid),dat=document.getElementById('td-'+cid);
  const text=inp.value.trim();if(!text)return;
  const ts=allTasks();if(!ts[cid])ts[cid]=[];
  ts[cid].unshift({id:Date.now().toString(36),text,due:dat.value||'',done:false});
  sv(TK,ts);inp.value='';dat.value='';render();
}
function toggleTask(cid,tid,done){
  const ts=allTasks(),t=(ts[cid]||[]).find(x=>x.id===tid);
  if(t){t.done=done;sv(TK,ts);render();}
}
function delTask(cid,tid){
  const ts=allTasks();ts[cid]=(ts[cid]||[]).filter(x=>x.id!==tid);sv(TK,ts);render();
}
function saveNote(cid,val){const ns=allNotes();ns[cid]=val;sv(NK,ns);}

// ── DOCS ──
let _docCid=null;
function openDocModal(cid){
  _docCid=cid;
  ['d-title','d-url'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('d-type').value='odkaz';
  openModal('modal-doc');
  document.getElementById('d-title').focus();
}
function saveDoc(){
  const title=document.getElementById('d-title').value.trim();
  if(!title)return;
  const ds=allDocs();if(!ds[_docCid])ds[_docCid]=[];
  ds[_docCid].push({
    id:Date.now().toString(36),
    title,
    url:document.getElementById('d-url').value.trim(),
    type:document.getElementById('d-type').value
  });
  sv(DK,ds);closeModal('modal-doc');render();
}
function delDoc(cid,did){
  const ds=allDocs();ds[cid]=(ds[cid]||[]).filter(x=>x.id!==did);sv(DK,ds);render();
}

// ── CLIENTS ──
let _editCid=null;
function openAddModal(){
  _editCid=null;
  document.getElementById('modal-client-title').textContent='Přidat klienta';
  document.getElementById('modal-client-save').textContent='Přidat';
  ['c-company','c-contact','c-sector','c-email','c-phone','c-web'].forEach(id=>document.getElementById(id).value='');
  openModal('modal-client');
  document.getElementById('c-company').focus();
}
function openEditModal(cid){
  _editCid=cid;
  const c=clients().find(x=>x.id===cid);if(!c)return;
  document.getElementById('modal-client-title').textContent='Upravit klienta';
  document.getElementById('modal-client-save').textContent='Uložit';
  document.getElementById('c-company').value=c.company||'';
  document.getElementById('c-contact').value=c.contact||'';
  document.getElementById('c-sector').value=c.sector||'';
  document.getElementById('c-email').value=c.email||'';
  document.getElementById('c-phone').value=c.phone||'';
  document.getElementById('c-web').value=c.web||'';
  openModal('modal-client');
  document.getElementById('c-company').focus();
}
function saveClient(){
  const company=document.getElementById('c-company').value.trim();
  if(!company)return;
  const cs=clients();
  const data={
    company,
    contact:document.getElementById('c-contact').value.trim(),
    sector:document.getElementById('c-sector').value.trim(),
    email:document.getElementById('c-email').value.trim(),
    phone:document.getElementById('c-phone').value.trim(),
    web:document.getElementById('c-web').value.trim(),
  };
  if(_editCid){
    const c=cs.find(x=>x.id===_editCid);
    if(c)Object.assign(c,data);
  } else {
    cs.push({id:slug(company)+'-'+Date.now().toString(36),status:'ok',...data});
  }
  sv(CK,cs);closeModal('modal-client');render();
}
function deleteClient(cid){
  if(!confirm('Odebrat klienta a všechna jeho data?'))return;
  sv(CK,clients().filter(c=>c.id!==cid));
  render();
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));});

// ── MEET PANEL ──
let _meetCid=null;
function openMeetPanel(cid){
  _meetCid=cid;
  const c=clients().find(x=>x.id===cid);
  document.getElementById('panel-title').textContent=`Schůzky — ${c?.company||''}`;
  document.getElementById('panel-cal-btn').href=calUrl(c||{company:''});
  document.getElementById('new-meet-form').classList.remove('open');
  renderMeetList();
  document.getElementById('meet-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
}
function closeMeetPanel(){
  document.getElementById('meet-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
  _meetCid=null;
}
function toggleNewMeetForm(){
  const f=document.getElementById('new-meet-form');
  f.classList.toggle('open');
  if(f.classList.contains('open')){
    document.getElementById('f-date').value=TODAY;
    document.getElementById('f-topic').value='';
    document.getElementById('f-notes').value='';
    document.getElementById('f-points').innerHTML='<div class="bullet-row"><input class="bullet-input" placeholder="Klíčový bod…"/><button class="btn-add-bullet" onclick="addBullet(\'f-points\')">+</button></div>';
    document.getElementById('f-actions').innerHTML='<div class="bullet-row"><input class="bullet-input" placeholder="Akce / follow-up…"/><button class="btn-add-bullet" onclick="addBullet(\'f-actions\')">+</button></div>';
    document.getElementById('f-topic').focus();
  }
}
function addBullet(listId){
  const list=document.getElementById(listId);
  const row=document.createElement('div');row.className='bullet-row';
  row.innerHTML=`<input class="bullet-input" placeholder="…"/><button class="btn-add-bullet" onclick="addBullet('${listId}')">+</button>`;
  list.appendChild(row);row.querySelector('input').focus();
}
function getBullets(listId){
  return Array.from(document.querySelectorAll(`#${listId} .bullet-input`)).map(x=>x.value.trim()).filter(Boolean);
}
function saveMeeting(){
  const topic=document.getElementById('f-topic').value.trim();if(!topic)return;
  const ms=allMeets();if(!ms[_meetCid])ms[_meetCid]=[];
  ms[_meetCid].unshift({
    id:Date.now().toString(36),
    date:document.getElementById('f-date').value||TODAY,
    topic,
    points:getBullets('f-points'),
    actions:getBullets('f-actions'),
    notes:document.getElementById('f-notes').value.trim()
  });
  sv(MEETK,ms);
  document.getElementById('new-meet-form').classList.remove('open');
  renderMeetList();render();
}
function renderMeetList(){
  const ms=(allMeets()[_meetCid]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('meet-list');
  if(!ms.length){el.innerHTML=`<div class="empty-meets">Zatím žádné záznamy.<br><br>Přidej první kliknutím na „Zaznamenat schůzku".</div>`;return;}
  el.innerHTML=ms.map((m,i)=>`
    <div class="meet-entry">
      <div class="meet-entry-header" onclick="toggleMeetBody('mb-${i}')">
        <span class="meet-date">${fmtDate(m.date)}</span>
        <span class="meet-topic">${esc(m.topic)}</span>
        <span style="font-size:11px;color:#a08060">▸</span>
      </div>
      <div class="meet-body" id="mb-${i}">
        ${m.points?.length?`<div class="meet-section"><div class="meet-section-label">Klíčové body</div><ul class="meet-bullets">${m.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
        ${m.actions?.length?`<div class="meet-section"><div class="meet-section-label">Follow-up</div><ul class="meet-bullets">${m.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
        ${m.notes?`<div class="meet-section"><div class="meet-section-label">Poznámky</div><div class="meet-section-text">${esc(m.notes)}</div></div>`:''}
        <div class="meet-actions">
          <button class="btn-del-meet" onclick="deleteMeeting('${esc(m.id)}')">🗑 Smazat</button>
        </div>
      </div>
    </div>`).join('');
}
function toggleMeetBody(id){document.getElementById(id)?.classList.toggle('open');}
function deleteMeeting(mid){
  if(!confirm('Smazat záznam schůzky?'))return;
  const ms=allMeets();ms[_meetCid]=(ms[_meetCid]||[]).filter(x=>x.id!==mid);
  sv(MEETK,ms);renderMeetList();render();
}
