<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Nutworld — Nástěnky</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--br:#83502e;--bd:#5c381f;--kraft:#f1e6da;--bg:#e8ddd4;--line:#d4c0a8;--muted:#8a6a4a;--pink:#da1668;--amber:#f7ab31;--leaf:#6fa044;--col:#efe5da;--red:#d64545}
html,body{height:100%}
body{font-family:'Source Sans 3',Arial,sans-serif;background:var(--bg);color:#2a1a0e;font-size:14px;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--br)}
.top{background:linear-gradient(135deg,#5c381f 0%,#83502e 55%,#a0622a 100%);color:#fff;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.top .logo{font-family:'Exo 2',sans-serif;font-weight:800;font-size:18px;text-decoration:none;color:#fff;white-space:nowrap}
.top .bn{font-family:'Exo 2',sans-serif;font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.top input{border:0;border-radius:10px;padding:7px 12px;width:240px;max-width:100%;background:rgba(255,255,255,.16);color:#fff;outline:none}
.top input::placeholder{color:rgba(255,255,255,.7)}
.top input:focus{background:#fff;color:var(--bd)}
.btn{border:0;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;background:var(--kraft);color:var(--bd);white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.pri{background:var(--br);color:#fff}.btn.acc{background:var(--pink);color:#fff}.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.banner{background:#fff8e1;border-bottom:2px solid var(--amber);color:#7a5200;padding:7px 16px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.banner.own{background:#eef6e6;border-color:var(--leaf);color:#2d5a1b}
.main{flex:1;min-height:0;overflow:auto}
/* home */
.home{max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.home h2{font-family:'Exo 2',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px rgba(92,56,31,.08);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:86px}
.tile:hover{border-color:var(--br)}
.tile .tn{font-family:'Exo 2',sans-serif;font-weight:700;font-size:15px;color:var(--bd)}
.tile .who{font-size:12px;color:var(--muted);line-height:1.3}
.star{color:#d8c8b6;font-size:18px;line-height:1;cursor:pointer;padding:0 2px}.star.on{color:var(--amber)}.star:hover{color:var(--amber)}
.gsel{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);max-width:120px;padding:1px 2px}
.tile .tm{font-size:12px;color:var(--muted);margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
.badge.tr{background:#e8eef9;color:#2c5aa0}.badge.own{background:#e6f3dc;color:#2d5a1b}.badge.cl{background:#eee;color:#666}
.intro{background:#fff;border-radius:14px;padding:14px 16px;border-left:6px solid var(--amber);line-height:1.5;font-size:13.5px}
/* board */
.board{display:flex;gap:12px;align-items:flex-start;padding:14px max(14px,env(safe-area-inset-right)) 20px max(14px,env(safe-area-inset-left));min-height:100%;width:max-content}
.col{background:var(--col);border-radius:14px;width:280px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
.col.over{outline:3px dashed var(--br)}
.colh{padding:10px 12px 6px;display:flex;align-items:center;gap:6px}
.colh .cn{font-family:'Exo 2',sans-serif;font-weight:700;font-size:14px;color:var(--bd);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colh .cc{font-size:11px;color:var(--muted);font-weight:700}
.cards{padding:2px 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:20px}
.card{background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 1px 3px rgba(92,56,31,.18);cursor:pointer;font-size:13.5px;line-height:1.35;word-wrap:break-word}
.card:hover{box-shadow:0 0 0 2px var(--br)}
.card.drag{opacity:.4}
.card.arch{opacity:.6;background:#f6f2ee}
.card img.cov{display:block;width:calc(100% + 20px);margin:-8px -10px 8px;border-radius:10px 10px 0 0;max-height:150px;object-fit:cover;background:var(--kraft)}
.lbls{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.lbl{border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;color:#fff;min-width:34px;min-height:8px}
.bdg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
.bdg .due{border-radius:6px;padding:0 6px}
.due.late{background:var(--red);color:#fff}.due.soon{background:var(--amber);color:#fff}.due.ok{background:var(--leaf);color:#fff}
.mem{display:flex;gap:2px;margin-left:auto}
.av{width:24px;height:24px;border-radius:50%;background:var(--br);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.addc{margin:0 8px 8px;padding:7px;border-radius:9px;border:0;background:transparent;color:var(--muted);text-align:left;cursor:pointer;font-weight:600}
.addc:hover{background:rgba(92,56,31,.08)}
.newcol{width:260px;flex-shrink:0}
.qa{width:100%;border:2px solid var(--br);border-radius:10px;padding:7px 9px;resize:vertical;min-height:54px;outline:none}
/* modal */
.ov{position:fixed;inset:0;background:rgba(40,25,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:16px;width:760px;max-width:100%;padding:20px 22px 24px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.md .x{position:absolute;top:10px;right:12px;border:0;background:var(--kraft);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
.md h3{font-family:'Exo 2',sans-serif;font-size:20px;color:var(--bd);padding-right:40px;word-wrap:break-word}
.md h3[contenteditable=true]{outline:none;border-radius:6px}.md h3[contenteditable=true]:focus{box-shadow:0 0 0 2px var(--br)}
.md .meta{font-size:12.5px;color:var(--muted);margin:4px 0 12px}
.sec{font-family:'Exo 2',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--br);margin:16px 0 7px;display:flex;align-items:center;gap:8px}
.desc{font-size:14px;line-height:1.55;word-wrap:break-word;background:#faf6f1;border-radius:10px;padding:10px 12px}
.desc.empty{color:var(--muted);font-style:italic}
.desc h1,.desc h2,.desc h3,.desc h4{font-family:'Exo 2',sans-serif;font-size:15px;margin:8px 0 4px;color:var(--bd)}
.desc ul{margin:4px 0 4px 20px}
.zk{margin-top:14px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fffaf5}
.zk h4{font-family:'Exo 2',sans-serif;margin:0 0 6px;color:var(--bd);font-size:15px}
.zk .zst{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-bottom:6px}
.zk .zst span{background:var(--kraft);border-radius:6px;padding:2px 8px;color:var(--bd)}
.zk table{width:100%;border-collapse:collapse;font-size:12.5px;margin:2px 0 6px}
.zk td,.zk th{padding:3px 6px;border-bottom:1px solid #f0e6dc;text-align:left;vertical-align:top}
.zk th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.zk .r{text-align:right;white-space:nowrap}
.zk .warn{color:var(--pink);font-size:12.5px}
.zk .kal{background:#fff;border:1.5px dashed var(--amber);border-radius:10px;padding:8px 10px;margin-top:8px}
.zk .big{font-family:'Exo 2',sans-serif;font-weight:800;font-size:18px;color:var(--bd)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;margin:0 5px 5px 0;background:#eee}
.chip.off{opacity:.35}
.ck{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;font-size:13.5px}
.ck input{margin-top:3px;accent-color:var(--leaf)}
.ck.done span{text-decoration:line-through;color:var(--muted)}
.bar{height:6px;background:#eee;border-radius:4px;overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%;background:var(--leaf)}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.att a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--bd);font-size:12px;background:#faf6f1;border-radius:10px;padding:6px;word-break:break-all}
.att img{width:100%;height:90px;object-fit:cover;border-radius:7px;background:var(--kraft)}
.att .ic{height:90px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--kraft);border-radius:7px}
.act{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0e8df;font-size:13px}
.act .who{font-weight:700}.act .when{color:var(--muted);font-size:11.5px}
.act .cm{background:#faf6f1;border-radius:8px;padding:6px 9px;margin-top:3px;white-space:pre-wrap;word-wrap:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:2px solid var(--line);border-radius:9px;padding:6px 9px;outline:none;background:#fff}
.inp:focus{border-color:var(--br)}
.res{background:#fff;border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 3px rgba(92,56,31,.12)}
.res:hover{box-shadow:0 0 0 2px var(--br)}
.res small{color:var(--muted)}
.empty-msg{text-align:center;color:var(--muted);padding:40px 16px}
.dlg p{line-height:1.5;margin:8px 0 14px}
.qf{border:0;border-radius:8px;padding:5px 6px;background:rgba(255,255,255,.16);color:#fff;max-width:150px}
.qf option{color:#2a1a0e}
.grp{margin:18px 0 8px;font-family:'Exo 2',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.grp.late{color:var(--red)}.grp.soon{color:#b77900}.grp.week{color:var(--br)}.grp.later,.grp.none{color:var(--muted)}
.seg{display:inline-flex;background:#fff;border-radius:10px;padding:3px;gap:3px;box-shadow:0 1px 3px rgba(92,56,31,.12)}
.seg button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;background:transparent;color:var(--muted)}
.seg button.on{background:var(--br);color:#fff}
.live{font-size:11px;opacity:.85;white-space:nowrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bd);color:#fff;padding:9px 16px;border-radius:10px;z-index:99;font-weight:600}
@media (max-width:600px){.top input{width:100%;order:9}.col{width:86vw}.md{padding:16px 14px 20px}}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/index.html" title="Rozcestník">🐿</a>
  <a class="logo" href="#" onclick="go('');return false">Nástěnky</a>
  <span class="bn" id="bn"></span>
  <span class="sp"></span>
  <input id="q" type="search" placeholder="🔍 Hledat kartu na všech nástěnkách…" autocomplete="off"/>
  <span id="topbtns"></span>
</div>
<div id="banner"></div>
<div class="main" id="main"><div class="empty-msg">Načítám…</div></div>
<div id="modal"></div>

<script>
const API = '/api/nastenky';
let ME = null, SKUPINY = [], BOARDS = [], B = null, LISTS = [], CARDS = [], SHOW_ARCH = false, FILTER = '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

async function api(path, opt = {}) {
  const r = await fetch(API + path, {credentials: 'same-origin', ...opt,
    headers: {'Content-Type': 'application/json', ...(opt.headers || {})}});
  if (r.status === 401 || r.redirected) { location.href = '/_auth/login?next=' + encodeURIComponent(location.pathname + location.hash); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.chyba || ('Chyba ' + r.status));
  return j;
}
const post = (path, data) => api(path, {method: 'POST', body: JSON.stringify(data)});
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

function fmtDate(iso, time) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('cs-CZ', {day: 'numeric', month: 'numeric', year: (new Date().getFullYear() === d.getFullYear() ? undefined : 'numeric')}) +
    (time ? ' ' + d.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute: '2-digit'}) : '');
}
function dueCls(c) {
  if (!c.termin) return '';
  if (c.termin_hotovo) return 'ok';
  const h = (new Date(c.termin) - Date.now()) / 36e5;
  return h < 0 ? 'late' : h < 48 ? 'soon' : '';
}
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
function md(t) {  // small, safe markdown (Trello descriptions): escape first, then links, bold, headings, lists
  if (!t) return '';
  let h = esc(t);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, a, u) => `<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
  h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u.length > 60 ? u.slice(0, 57) + '…' : u}</a>`);
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.split('\n').map(l => /^#{1,4}\s/.test(l) ? `<h4>${l.replace(/^#+\s/, '')}</h4>` :
    /^\s*[-*]\s/.test(l) ? `<li>${l.replace(/^\s*[-*]\s/, '')}</li>` : l).join('\n');
  h = h.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m.replace(/\n/g, '')}</ul>`);
  return h.replace(/\n/g, '<br>');
}

/* ---------------- routing: #b=<board>  #k=<card> */
function go(h) { location.hash = h; }
window.addEventListener('hashchange', route);
async function route() {
  const h = new URLSearchParams(location.hash.slice(1));
  const b = h.get('b'), k = h.get('k');
  if (h.has('moje')) { B = null; renderMoje(); }
  else if (b) { if (!B || B.id !== b) await openBoard(b); else renderBoard(); }
  else { B = null; renderHome(); }
  if (k) openCard(k); else $('modal').innerHTML = '';
}

/* ---------------- home */
/* home: groups, search, sort, favourites (favourites = personal preference -> localStorage) */
let HQ = '', HSORT = 'skupiny';
const favs = () => { try { return JSON.parse(localStorage.getItem('nw_nastenky_fav') || '[]'); } catch (e) { return []; } };
function toggleFav(id, ev) {
  ev.stopPropagation();
  const f = favs(); const i = f.indexOf(id); i < 0 ? f.push(id) : f.splice(i, 1);
  try { localStorage.setItem('nw_nastenky_fav', JSON.stringify(f)); } catch (e) {}
  renderHomeList();
}
async function setGroup(id, sk, ev) {
  ev.stopPropagation();
  try { await post(`/board/${id}/skupina`, {skupina: sk}); BOARDS.find(b => b.id === id).skupina = sk; renderHomeList(); toast('Přesunuto'); }
  catch (e) { toast(e.message); }
}
function renderHome() {
  $('bn').textContent = ''; $('banner').innerHTML = '';
  $('topbtns').innerHTML = `<button class="btn ghost" onclick="go('moje')">📅 Moje karty a termíny</button>` +
    ((ME.admin || ME.plny) ? ` <button class="btn ghost" onclick="newBoard()">+ Nástěnka</button>` : '');
  const own = BOARDS.filter(b => b.mode === 'vlastni').length;
  $('main').innerHTML = `<div class="home">
    <div class="intro"><b>Naše vlastní nástěnky — náhled Trella.</b> Do Nového roku se pracuje dál v Trellu
      (přes <a href="https://nutworldcz-collab.github.io/" target="_blank" rel="noopener">nutworldcz-collab.github.io</a>); tady je jeho živá kopie —
      obnovuje se každých 10 minut (6–21 h), otevřená nástěnka se překreslí sama. Klidně si tu vše prohlížej a zkoušej hledání a přehledy.
      <b>Po Novém roce přejdeme na tento systém úplně</b> — nic se neztratí, karty, komentáře i přílohy už tu jsou.
      ${own ? `Na našem systému už běží: <b>${own}</b>.` : ''}
      ${ME.admin ? '<br>Vidíš všechny nástěnky (Jan); ostatní jen ty, kde jsou členy. Skupinu nástěnky změníš výběrem na dlaždici.' : ''}</div>
    <div class="row" style="margin:16px 0 4px">
      <input class="inp" id="hq" type="search" placeholder="🔍 Najít nástěnku… (název nebo člověk)" style="flex:1;min-width:200px;padding:9px 12px" value="${esc(HQ)}">
      <select class="inp" id="hsort" style="padding:8px">
        <option value="skupiny">Podle skupin</option><option value="aktivita">Naposledy používané</option>
        <option value="abc">Abecedně</option><option value="karty">Nejvíc karet</option></select>
    </div>
    <div id="hlist"></div></div>`;
  $('hsort').value = HSORT;
  $('hq').addEventListener('input', e => { HQ = e.target.value; renderHomeList(); });
  $('hsort').addEventListener('change', e => { HSORT = e.target.value; renderHomeList(); });
  renderHomeList();
}
function renderHomeList() {
  const f = favs(), q = HQ.trim().toLowerCase();
  const nrm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const hit = b => !q || nrm(b.nazev + ' ' + (b.trello_clenove || []).join(' ')).includes(nrm(q));
  const list = BOARDS.filter(hit);
  const groupSel = b => ME.admin ? `<select class="gsel" onclick="event.stopPropagation()" onchange="setGroup('${b.id}', this.value, event)" title="Skupina">
      ${SKUPINY.map(([k, n]) => `<option value="${k}" ${k === b.skupina ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : '';
  const tile = b => `<div class="tile" role="button" tabindex="0" onclick="go('b=${b.id}')" onkeydown="if(event.key==='Enter')go('b=${b.id}')">
    <span class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="tn" style="flex:1">${esc(b.nazev)}</span>
      <span class="star ${f.includes(b.id) ? 'on' : ''}" onclick="toggleFav('${b.id}', event)" title="Oblíbená">★</span></span>
    ${(b.trello_clenove || []).length ? `<span class="who">👥 ${esc(b.trello_clenove.slice(0, 4).join(', '))}${b.trello_clenove.length > 4 ? ` +${b.trello_clenove.length - 4}` : ''}</span>` : ''}
    <span class="tm"><span class="badge ${b.uzavrena ? 'cl' : b.mode === 'vlastni' ? 'own' : 'tr'}">${b.uzavrena ? 'uzavřená' : b.mode === 'vlastni' ? 'náš systém' : 'kopie z Trella'}</span>
    ${b.karet} karet${b.posledni ? ' · ' + fmtDate(b.posledni) : ''} ${groupSel(b)}</span></div>`;
  const tiles = arr => `<div class="tiles">${arr.map(tile).join('')}</div>`;
  const live = list.filter(b => !b.uzavrena && (b.karet > 0 || b.mode === 'vlastni'));
  const empty = list.filter(b => !b.uzavrena && b.karet === 0 && b.mode !== 'vlastni');
  const closed = list.filter(b => b.uzavrena);
  let html = '';
  const fav = live.filter(b => f.includes(b.id));
  if (fav.length && !q) html += `<h2>★ Oblíbené</h2>${tiles(fav)}`;
  if (HSORT === 'skupiny') {
    for (const [k, n] of SKUPINY) {
      const g = live.filter(b => b.skupina === k).sort((a, b) => (b.posledni || '').localeCompare(a.posledni || ''));
      if (g.length) html += `<h2>${esc(n)} (${g.length})</h2>${tiles(g)}`;
    }
  } else {
    const by = {aktivita: (a, b) => (b.posledni || '').localeCompare(a.posledni || ''), abc: (a, b) => a.nazev.localeCompare(b.nazev, 'cs'),
      karty: (a, b) => b.karet - a.karet}[HSORT];
    html += `<h2>Nástěnky (${live.length})</h2>${tiles(live.sort(by))}`;

let QF = '';
function quickMatch(c) {

}

/* drag & drop (desktop); on phones use "Přesunout" in the card */
function bindDnD() {
  let dragId = null;
  document.querySelectorAll('.card[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => { dragId = el.dataset.id; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { el.classList.remove('drag'); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('over');
      if (!dragId) return;
      const listId = col.dataset.list;
      const others = [...col.querySelectorAll('.card')].filter(x => x.dataset.id !== dragId);
      let idx = others.findIndex(x => e.clientY < x.getBoundingClientRect().top + x.offsetHeight / 2);
      if (idx < 0) idx = others.length;
      const posOf = el => CARDS.find(c => c.id === el.dataset.id).pos;
      const before = idx > 0 ? posOf(others[idx - 1]) : 0;
      const after = idx < others.length ? posOf(others[idx]) : before + 2048;
      const card = CARDS.find(c => c.id === dragId);
      const pos = (before + after) / 2;
      const moved = card.list_id !== listId;
      Object.assign(card, {list_id: listId, pos});
      renderCols();
      try { await post('/card/' + card.id, moved ? {list_id: listId, pos} : {pos}); } catch (er) { toast(er.message); openBoard(B.id); }
      dragId = null;
    });
  });
}

  if (!CARD || CARD.id !== id || !$('zkbox')) return;
  const z = j.zakazka;
  if (!z) { box.innerHTML = `<h4>📦 Zakázka</h4><p class="warn">${esc(j.chyba || 'Rozpis nejde spočítat.')}</p>`; return; }
  const v = z.vyroba, N = k => esc(z.nazvy[k] || k), stock = k => z.sklad[k] != null ? `<span style="color:var(--muted)">sklad K2 ${czn(z.sklad[k])}</span>` : '';
  const sort = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
  let h = `<h4>📦 Zakázka</h4><div class="zst"><span>📋 ${esc(z.sloupec)}</span>${z.termin ? `<span>📅 ${esc(z.termin)}</span>` : ''}` +
    `${z.rep ? `<span>👤 ${esc(z.rep)}</span>` : ''}${z.cislo ? `<span>📄 nabídka ${esc(z.cislo)}</span>` : ''}${z.doprava ? `<span>🚚 ${esc(z.doprava)}</span>` : ''}` +
    `<span>⏱ práce odhadem ${czn(v.prace_h)} h</span></div>`;
  h += `<div class="sec">🏭 Výroba</div>`;
  if (Object.keys(v.smesi).length) h += `<table><tr><th>🥣 Namíchat</th><th class="r">kg</th></tr>${sort(v.smesi).map(([k, kg]) => `<tr><td>${N(k)} <small>(${esc(k)})</small></td><td class="r">${kgf(kg)}</td></tr>`).join('')}</table>`;
  h += `<table><tr><th>🌰 ${Object.keys(v.smesi).length ? 'Suroviny celkem' : 'Suroviny / produkty'}</th><th class="r">potřeba</th><th class="r"></th></tr>` +
    sort(v.suroviny).map(([k, kg]) => `<tr><td>${N(k)} <small>(${esc(k)})</small></td><td class="r"><b>${kgf(kg)}</b></td><td class="r">${stock(k)}</td></tr>`).join('') + `</table>`;
  if (Object.keys(v.obaly).length) h += `<table><tr><th>🧰 Obaly a komponenty</th><th class="r">ks</th></tr>${sort(v.obaly).map(([n, k]) => `<tr><td>${esc(n)}</td><td class="r">${czn(k, 0)}</td></tr>`).join('')}</table>`;
  if (v.nezname.length) h += `<div class="warn">❓ ${v.nezname.map(esc).join('<br>❓ ')}</div>`;
  if (z.k2_datum) h += `<div style="font-size:11.5px;color:var(--muted)">Sklad = export K2 k ${esc(z.k2_datum)}.</div>`;
  h += `<div class="sec">🏷️ Štítky</div>` + (z.stitky_pdf.length
    ? z.stitky_pdf.map(p => `<a class="chip" href="${API}/soubor/${CARD.id}/${p.id}" target="_blank" rel="noopener">📄 ${esc(p.nazev)}</a>`).join('')
    : `<div style="font-size:13px;color:var(--muted)">${z.stitky.blok ? '⛔ Štítky neprošly kontrolou specifikace — viz komentář na kartě.'
       : z.stitky.prvni_beh ? 'Zakázka vznikla před spuštěním automatu — štítky se tvořily ručně (nebo napiš, ať je vytvořím).'
       : 'Štítky se vytvoří samy do 5 minut po zadání produktů.'}</div>`);
  h += `<div class="sec">🌐 Pro zákazníka</div><div class="row" style="gap:6px">` +
    `<a class="btn sm" href="${API}/zakaznik-nahled/${CARD.id}" target="_blank" rel="noopener">👀 Náhled stránky zákazníka</a>` +
    `<button class="btn sm" onclick="zakaznikOdkaz()">🔗 Odkaz pro zákazníka</button>` +
    `<button class="btn sm" onclick="zakaznikVyber()">🎨 Co ukázat zákazníkovi</button></div>` +
    `<div id="zkodkaz" style="font-size:12.5px;color:var(--muted);margin-top:4px"></div><div id="zkvyber"></div>`;
  h += `<div class="sec">🧾 Faktura a platba</div><div style="font-size:13px;color:var(--muted)">Napojí se z K2 (faktury) a Fia (platby).</div>`;
  if (z.kalkulace) {
    const k = z.kalkulace, mz = k.trzby_znamo ? k.zisk / k.trzby_znamo * 100 : null;
    h += `<div class="kal"><div class="sec" style="margin-top:0">💰 Kalkulace <span style="font-size:10px;color:var(--muted);letter-spacing:0;text-transform:none">vidí jen obchodník zakázky, Jan a Jana</span></div>` +
      `<div class="zst"><span>tržby bez DPH <b>${czn(k.trzby, 0)} Kč</b></span><span>náklady ${czn(k.naklady, 0)} Kč</span>` +
      `<span>zisk <b class="big">${czn(k.zisk, 0)} Kč</b></span>${mz != null ? `<span>marže <b>${czn(mz)} %</b></span>` : ''}</div>` +
      (k.polozky.length ? `<table><tr><th>položka</th><th class="r">ks</th><th class="r">cena</th><th class="r">náklad</th><th class="r">marže</th><th class="r">sleva</th></tr>` +
        k.polozky.map(p => `<tr><td>${esc(p.nazev)}</td><td class="r">${czn(p.ks, 0)}</td><td class="r">${czn(p.cena, 2)}</td><td class="r">${czn(p.nakup, 2)}</td>` +
          `<td class="r" style="${p.marze < (p.typ === 'darek' ? 30 : p.typ === 'doypack' ? 20 : 10) ? 'color:var(--pink);font-weight:700' : ''}">${czn(p.marze)} %</td>` +
          `<td class="r">${p.sleva != null ? czn(p.sleva) + ' %' : ''}</td></tr>`).join('') + `</table>` : '') +
      (k.nezname.length ? `<div class="warn">Bez nákladů (nejde spočítat): ${k.nezname.map(esc).join('; ')}</div>` : '') +
      (k.trzby_znamo < k.trzby ? `<div style="font-size:11.5px;color:var(--muted)">Zisk a marže jen ze spočitatelných položek (${czn(k.trzby_znamo, 0)} Kč tržeb).</div>` : '') + `</div>`;
  }
  box.innerHTML = h; CARD._zkHtml = h;
}
// which attachments (visuals, mock-ups) the customer sees as „Náhled vzhledu“; labels („Štítek…“) always
async function zakaznikVyber() {
  const box = $('zkvyber'); box.innerHTML = '<p style="font-size:12.5px;color:var(--muted)">Načítám přílohy…</p>';
  try {
    const j = await api('/zakaznik-nahled/' + CARD.id + '/data');
    box.innerHTML = j.vyber.length
      ? `<div style="font-size:12.5px;color:var(--muted);margin:6px 0 4px">Zaškrtni vizuály, které zákazník uvidí jako „Náhled vzhledu“ a schválí spolu se štítky (štítky se ukazují vždy):</div>` +
        j.vyber.map(p => `<label class="ck"><input type="checkbox" value="${esc(p.id)}" ${p.ukazat ? 'checked' : ''} onchange="zakaznikVyberUloz()">` +
          `<span>👁 <a href="${API}/soubor/${CARD.id}/${esc(p.id)}" target="_blank" rel="noopener">${esc(p.nazev)}</a></span></label>`).join('')
      : '<p style="font-size:12.5px;color:var(--muted)">Na kartě nejsou obrázky ani PDF, které by šly ukázat. Nahraj vizuál do příloh karty.</p>';
  } catch (e) { box.innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
}
async function zakaznikVyberUloz() {
  const ids = [...$('zkvyber').querySelectorAll('input:checked')].map(i => i.value);
  try { await post('/card/' + CARD.id + '/zakaznik-prilohy', {ids}); toast(ids.length ? `Zákazník uvidí ${ids.length} vizuál(y)` : 'Zákazník neuvidí žádný vizuál'); }
  catch (e) { toast(e.message); }
}
async function zakaznikOdkaz() {
  try {
    const j = await post('/card/' + CARD.id + '/zakaznik-odkaz', {});
    $('zkodkaz').innerHTML = `<input class="inp" style="width:100%" readonly value="${esc(j.odkaz)}" onclick="this.select()">` +
      (j.zapnuto ? 'Pošli zákazníkovi — uvidí stav zakázky, produkty a štítky ke schválení.'
                 : '⏸ Odkaz zatím nefunguje — stránky pro zákazníky spustíme společně po Janově OK. Do té doby jen náhled.');
  } catch (e) { toast(e.message); }
}
function patchLocal(field, val) {
  const s = CARDS.find(x => x.id === CARD.id);
  if (!s) return;
  if (field === 'stitky') s.stitky = CARD.stitky; else if (field === 'clenove') s.clenove = CARD.clenove;
  else if (field === 'checklisty') { const it = CARD.checklisty.flatMap(x => x.polozky); s.check = it.length ? [it.filter(i => i.hotovo).length, it.length] : null; }
  else if (field === 'popis') s.popis = !!val; else s[field] = val;
  if (field === 'uzavrena' && val && !SHOW_ARCH) CARDS = CARDS.filter(x => x.id !== CARD.id);
}
async function saveField(field, val) {
  if (field === 'nazev' && (!val || val === CARD.nazev)) return;
  try {
    await post('/card/' + CARD.id, {[field]: val});
    CARD[field] = val; patchLocal(field, val);
    if (field === 'list_id') { CARD.sloupec = (LISTS.find(l => l.id === val) || {}).nazev || ''; }
    if (B) renderCols();
    const j = await api('/card/' + CARD.id); Object.assign(CARD, j.card); CARD._akce = j.akce; renderCard();
  } catch (e) { toast(e.message); }
}
function toggleLabel(id) {
  const has = CARD.stitky.some(s => s.id === id);
  CARD.stitky = has ? CARD.stitky.filter(s => s.id !== id) : [...CARD.stitky, CARD._board.stitky.find(s => s.id === id)];
  post('/card/' + CARD.id, {stitky: CARD.stitky.map(s => s.id)}).catch(e => toast(e.message));
  patchLocal('stitky'); renderCols(); renderCard();
}
function toggleMember(m) {
  CARD.clenove = CARD.clenove.includes(m) ? CARD.clenove.filter(x => x !== m) : [...CARD.clenove, m];
  post('/card/' + CARD.id, {clenove: CARD.clenove}).catch(e => toast(e.message));
  patchLocal('clenove'); renderCols(); renderCard();
}
function saveChecklists() { patchLocal('checklisty'); renderCols(); renderCard(); return post('/card/' + CARD.id, {checklisty: CARD.checklisty}).catch(e => toast(e.message)); }
function toggleCheck(ci, ii) { const it = CARD.checklisty[ci].polozky[ii]; it.hotovo = !it.hotovo; saveChecklists(); }
function addCheck(ci, text) { text = text.trim(); if (!text) return; CARD.checklisty[ci].polozky.push({text, hotovo: false}); saveChecklists().then(() => openCard(CARD.id)); }
function addChecklist() {
  dialog(`<h3>Nový checklist</h3><div class="row" style="margin-top:10px"><input class="inp" id="ncl" value="Úkoly" style="flex:1"></div>`, 'Přidat',
    async () => { CARD.checklisty.push({nazev: $('ncl').value.trim() || 'Úkoly', polozky: []}); await saveChecklists(); openCard(CARD.id); });
}
function editDesc() {
  $('descbox').innerHTML = `<textarea class="inp" id="desc" rows="8" style="width:100%">${esc(CARD.popis)}</textarea>
    <div class="row" style="margin-top:6px"><button class="btn pri sm" onclick="saveField('popis', $('desc').value)">Uložit</button><button class="btn sm" onclick="renderCard()">Zrušit</button></div>`;
  $('desc').focus();
}
async function addComment() {
  const t = $('cmt').value.trim(); if (!t) return;
  try { await post(`/card/${CARD.id}/komentar`, {text: t}); openCard(CARD.id); } catch (e) { toast(e.message); }
}
async function upload(files) {
  for (const f of files) {
    if (f.size > 25e6) { toast(`${f.name}: max 25 MB`); continue; }
    try {
      const r = await fetch(`${API}/card/${CARD.id}/priloha`, {method: 'POST', credentials: 'same-origin', body: f,
        headers: {'Content-Type': f.type || 'application/octet-stream', 'X-Nazev': encodeURIComponent(f.name)}});
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).chyba || 'Nahrání selhalo');
    } catch (e) { toast(e.message); }
  }
  const s = CARDS.find(x => x.id === CARD.id); if (s) s.prilohy += files.length;
  openCard(CARD.id); if (B) renderCols();
}

/* ---------------- dialog (in-page confirm) */
function dialog(html, okText, onOk, danger) {
  const d = document.createElement('div'); d.id = 'dlg'; d.className = 'ov'; d.style.zIndex = 80;
  d.innerHTML = `<div class="md dlg" style="width:460px">${html}<div class="row" style="justify-content:flex-end;margin-top:14px">
    <button class="btn" onclick="closeDialog()">Zrušit</button><button class="btn ${danger ? 'acc' : 'pri'}" id="dlgok">${okText}</button></div></div>`;
  d.addEventListener('click', e => { if (e.target === d) closeDialog(); });
  document.body.appendChild(d);
  const ok = async () => { try { const r = await onOk(); if (r !== false) closeDialog(); } catch (e) { toast(e.message); } };
  $('dlgok').onclick = ok;
  d.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') closeDialog(); }));
}
function closeDialog() { $('dlg')?.remove(); }

/* ---------------- 📅 my cards + deadlines across all boards (works in the Trello preview too) */
let MOJE_VSE = false;
async function renderMoje() {
  $('bn').textContent = '· Moje karty a termíny'; $('banner').innerHTML = ''; clearTimeout(LIVE_T);
  $('topbtns').innerHTML = `<button class="btn ghost" onclick="go('')">← Nástěnky</button>`;
  $('main').innerHTML = '<div class="empty-msg">Načítám…</div>';
  let j; try { j = await api('/prehled' + (MOJE_VSE ? '?vse=1' : '')); } catch (e) { $('main').innerHTML = `<div class="empty-msg">${esc(e.message)}</div>`; return; }
  const now = Date.now(), endWeek = (() => { const d = new Date(); d.setHours(23, 59, 59); d.setDate(d.getDate() + (7 - (d.getDay() || 7))); return d.getTime(); })();
  const grp = c => { if (!c.termin) return 'none'; if (c.termin_hotovo) return 'later'; const t = new Date(c.termin).getTime();
    return t < now ? 'late' : t - now < 48 * 36e5 ? 'soon' : t <= endWeek ? 'week' : 'later'; };
  const G = [['late', '🔴 Po termínu'], ['soon', '🟠 Dnes a zítra'], ['week', '🟡 Do konce týdne'], ['later', '📆 Později'], ['none', '📋 Bez termínu']];
  const row = c => `<div class="res" onclick="go('b=${c.board_id}&k=${c.id}')"><b>${esc(c.nazev)}</b>
      ${c.stitky.filter(s => s.nazev).map(s => `<span class="lbl" style="background:${s.barva};margin-left:4px">${esc(s.nazev)}</span>`).join('')}<br>
      <small>${esc(c.nastenka)} › ${esc(c.sloupec)}${c.termin ? ` · <span class="due ${dueCls(c)}" style="border-radius:5px;padding:0 5px">🕒 ${fmtDate(c.termin)}</span>` : ''}
      ${c.clenove.length ? ' · 👤 ' + esc(c.clenove.join(', ')) : ''}${c.check ? ` · ☑ ${c.check[0]}/${c.check[1]}` : ''}</small></div>`;
  let h = `<div class="home"><div class="row" style="justify-content:space-between">
    <div class="seg"><button class="${MOJE_VSE ? '' : 'on'}" onclick="MOJE_VSE=false;renderMoje()">👤 Moje karty</button>
      <button class="${MOJE_VSE ? 'on' : ''}" onclick="MOJE_VSE=true;renderMoje()">📅 + všechny termíny</button></div>
    <small style="color:var(--muted)">${j.karty.length} karet · bez hotových sloupců</small></div>`;
  for (const [k, n] of G) {
    const cs = j.karty.filter(c => grp(c) === k);
    if (cs.length) h += `<div class="grp ${k}">${n} <span style="color:var(--muted)">(${cs.length})</span></div>${cs.map(row).join('')}`;
  }
  if (!j.karty.length) h += `<div class="empty-msg">${MOJE_VSE ? 'Žádné karty s blížícím se termínem.' : 'Nejsi přiřazený na žádné otevřené kartě. Přepni na „všechny termíny“.'}</div>`;
  $('main').innerHTML = h + '</div>';
}

/* ---------------- search across boards */
let qT = null;
$('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(search, 300); });
async function search() {
  const s = $('q').value.trim();
  if (s.length < 2) { route(); return; }
  const j = await api('/hledat?q=' + encodeURIComponent(s));
  $('banner').innerHTML = '';
  $('main').innerHTML = `<div class="home"><h2>Výsledky pro „${esc(s)}“ (${j.karty.length}${j.karty.length >= 60 ? '+' : ''})</h2>
    ${j.karty.map(c => `<div class="res" onclick="$('q').value='';go('b=${c.board_id}&k=${c.id}')"><b>${esc(c.nazev)}</b>${c.uzavrena ? ' <span class="badge cl">archiv</span>' : ''}<br>
      <small>${esc(c.nastenka)} › ${esc(c.sloupec || '')}${c.termin ? ' · 🕒 ' + fmtDate(c.termin) : ''}${c.prilohy ? ' · 📎 ' + c.prilohy : ''}</small></div>`).join('') || '<div class="empty-msg">Nic nenalezeno.</div>'}</div>`;
}

/* ---------------- start */
async function loadBoards() { const j = await api('/boards'); BOARDS = j.boards; SKUPINY = j.skupiny || []; ME = {jmeno: j.ja, admin: j.admin, lide: j.lide, plny: ['admin', 'plny'].includes(j.role)}; }
(async () => {
  try { await loadBoards(); }
  catch (e) {
    if (e.message === 'login') return;
    $('main').innerHTML = `<div class="home"><div class="intro"><b>Nástěnky běží jen na našem serveru s přihlášením</b> (jsou v nich firemní data, proto ne na veřejném GitHubu).<br><br>
      Otevři je tady: <a href="https://nastroje.nutworld.cz/nastenky.html">nastroje.nutworld.cz/nastenky.html</a>
      <br><small>(${esc(e.message)})</small></div></div>`;
    return;
  }
  route();
})();
</script>
