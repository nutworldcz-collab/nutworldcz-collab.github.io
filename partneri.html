<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Registr partnerů — Nutworld</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bd:#5c381f;--br:#83502e;--kraft:#f1e6da;--acc:#da1668;--amb:#f7ab31;--leaf:#6fa044;--bg:#e8ddd4}
body{font-family:"Source Sans 3",Arial,sans-serif;background:var(--bg);color:#2a1a0e;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar a{color:rgba(255,255,255,.6);font-size:12px;text-decoration:none}
.topbar a:hover{color:white}
.topbar-title{font-family:"Exo 2",sans-serif;font-size:16px;font-weight:800;color:white;margin-left:4px}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-add{background:var(--amb);border:none;color:var(--bd);font-family:"Exo 2",sans-serif;font-weight:800;font-size:13px;padding:7px 16px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-add:hover{filter:brightness(1.08)}

/* SEARCH BAR */
.searchbar{background:white;border-bottom:1px solid #d0c0b0;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:48px;z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.search-input{flex:1;min-width:220px;border:1.5px solid #d0c0b0;border-radius:8px;padding:8px 14px;font-family:"Source Sans 3",sans-serif;font-size:14px;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--br)}
.search-ico{width:140px;border:1.5px solid #d0c0b0;border-radius:8px;padding:8px 12px;font-family:"Source Sans 3",sans-serif;font-size:14px;outline:none;letter-spacing:1px;transition:border-color .15s}
.search-ico:focus{border-color:var(--br)}
.filter-check{display:flex;align-items:center;gap:6px;font-size:13px;color:#6a4a2a;cursor:pointer;white-space:nowrap}
.filter-check input{width:15px;height:15px;accent-color:var(--br)}
.stats{margin-left:auto;font-size:12px;color:#a08060;white-space:nowrap}

/* TABLE WRAP */
.wrap{max-width:1400px;margin:0 auto;padding:16px}

/* LOCAL BADGE */
.badge-local{background:#e8f5ec;color:#1a5c30;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid #a8d5b5;margin-left:6px;vertical-align:middle}

/* TABLE */
.tbl-wrap{background:white;border-radius:12px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bd);color:white}
th{font-family:"Exo 2",sans-serif;font-size:12px;font-weight:700;padding:10px 12px;text-align:left;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{background:#4a2c14}
th.sort-asc::after{content:" ↑"}
th.sort-desc::after{content:" ↓"}
tbody tr{border-bottom:1px solid #f0e8df;transition:background .1s}
tbody tr:hover{background:#faf6f2}
tbody tr.local-row{background:#f0faf3}
tbody tr.local-row:hover{background:#e4f5ea}
td{padding:9px 12px;font-size:13px;vertical-align:middle}
td.td-nazev{font-weight:600;color:#3a1a0e;max-width:320px}
td.td-ico{font-family:monospace;font-size:13px;color:var(--br);white-space:nowrap}
td.td-adresa{color:#6a5040;font-size:12px;max-width:280px}
td.td-kod{color:#a08060;font-size:11px;font-family:monospace;white-space:nowrap}
td.td-actions{white-space:nowrap}

.link-ares{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--leaf);text-decoration:none;padding:2px 7px;border:1px solid #b0d89a;border-radius:10px;font-weight:600;transition:all .12s}
.link-ares:hover{background:#e8f5e8}
.btn-del-local{background:none;border:none;color:#c0a080;font-size:11px;cursor:pointer;padding:2px 6px;border-radius:8px;font-family:inherit}
.btn-del-local:hover{color:var(--acc);background:#fde8ef}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0}
.page-btn{background:none;border:1.5px solid #d0c0b0;color:var(--br);font-family:"Exo 2",sans-serif;font-weight:700;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .12s}
.page-btn:hover{background:var(--kraft);border-color:var(--br)}
.page-btn.active{background:var(--bd);color:white;border-color:var(--bd)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:13px;color:#a08060}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:white;border-radius:16px;width:460px;max-width:95vw;padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-title{font-family:"Exo 2",sans-serif;font-size:18px;font-weight:800;color:var(--bd);margin-bottom:18px}
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-row label{font-size:12px;font-weight:700;color:var(--br);text-transform:uppercase;letter-spacing:.5px}
.form-row input{border:1.5px solid #d0c0b0;border-radius:8px;padding:9px 12px;font-family:"Source Sans 3",sans-serif;font-size:14px;outline:none}
.form-row input:focus{border-color:var(--br)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn-cancel{background:none;border:1.5px solid #d0c0b0;color:#a08060;font-family:"Exo 2",sans-serif;font-weight:700;font-size:13px;padding:8px 18px;border-radius:10px;cursor:pointer}
.btn-cancel:hover{background:var(--kraft)}
.btn-save{background:var(--bd);color:white;border:none;font-family:"Exo 2",sans-serif;font-weight:700;font-size:13px;padding:8px 22px;border-radius:10px;cursor:pointer}
.btn-save:hover{background:var(--br)}

/* EXPORT BAR */
.export-bar{background:#fff8e1;border:1px solid var(--amb);border-radius:10px;padding:10px 16px;margin-bottom:14px;display:none;align-items:center;gap:10px;font-size:13px;color:#5c381f}
.export-bar.show{display:flex}
.btn-export{background:var(--amb);border:none;color:var(--bd);font-family:"Exo 2",sans-serif;font-weight:700;font-size:12px;padding:5px 14px;border-radius:10px;cursor:pointer}
.btn-export:hover{filter:brightness(1.08)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 20px;color:#a08060}
.empty-state .es-icon{font-size:48px;margin-bottom:10px}
.empty-state p{font-size:14px}

@media(max-width:700px){
  .search-ico{width:120px}
  td.td-adresa,td.td-kod{display:none}
  th:nth-child(3),th:nth-child(4){display:none}
  .searchbar{top:44px}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/">← Zpět</a>
  <span class="topbar-title">🏢 Registr partnerů</span>
  <div class="topbar-right">
    <button class="btn-add" onclick="openModal()">+ Přidat</button>
  </div>
</div>

<div class="searchbar">
  <input class="search-input" id="searchQ" placeholder="🔍 Hledat podle názvu nebo adresy…" oninput="onSearch()" />
  <input class="search-ico" id="searchICO" placeholder="IČO: 12345678" maxlength="8" oninput="onSearch()" />
  <label class="filter-check">
    <input type="checkbox" id="onlyICO" onchange="onSearch()" /> Jen s IČO
  </label>
  <span class="stats" id="stats">Načítám…</span>
</div>

<div class="wrap">
  <div class="export-bar" id="exportBar">
    <span>📋 Máte <span id="localCount">0</span> lokálně přidaných záznamy</span>
    <button class="btn-export" onclick="exportLocal()">⬇ Export CSV</button>
    <button class="btn-export" style="background:#fde8ef;color:var(--acc)" onclick="clearLocal()">✕ Smazat lokální</button>
  </div>

  <div class="tbl-wrap">
    <table id="mainTable">
      <thead>
        <tr>
          <th onclick="sortBy(0)">Název</th>
          <th onclick="sortBy(1)">IČO</th>
          <th onclick="sortBy(2)">Adresa</th>
          <th onclick="sortBy(3)">K2 kód</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="es-icon">🔍</div>
      <p>Žádné výsledky pro toto vyhledávání.</p>
    </div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- ADD MODAL -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">+ Přidat nového partnera</div>
    <div class="form-row">
      <label>Název *</label>
      <input id="f-nazev" placeholder="Celý obchodní název" required />
    </div>
    <div class="form-row">
      <label>IČO</label>
      <input id="f-ico" placeholder="12345678" maxlength="8" />
    </div>
    <div class="form-row">
      <label>Adresa</label>
      <input id="f-adresa" placeholder="Ulice, PSČ Město, CZ" />
    </div>
    <div class="form-row">
      <label>K2 kód</label>
      <input id="f-kod" placeholder="Zkratka v K2" />
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Zrušit</button>
      <button class="btn-save" onclick="saveEntry()">Uložit</button>
    </div>
  </div>
</div>

<script src="/partneri-data.js"></script>
<script>
// [id, kod, nazev, ico, adresa]
const IDX = {ID:0, KOD:1, NAZEV:2, ICO:3, ADR:4};

let currentPage = 1;
const PER_PAGE = 60;
let filteredData = [];
let sortCol = -1;
let sortDir = 1;

function getLocal() {
  try { return JSON.parse(localStorage.getItem('nw_partneri') || '[]'); } catch { return []; }
}
function setLocal(arr) {
  localStorage.setItem('nw_partneri', JSON.stringify(arr));
}

function getAllData() {
  const local = getLocal().map(e => ({...e, _local: true}));
  const base = BASE_DATA.map(r => ({
    id: r[0], kod: r[1], nazev: r[2], ico: r[3], adresa: r[4], _local: false
  }));
  return [...local, ...base];
}

function onSearch() {
  currentPage = 1;
  render();
}

function normalize(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function render() {
  const q = normalize(document.getElementById('searchQ').value.trim());
  const icoQ = document.getElementById('searchICO').value.trim().replace(/\s/g,'');
  const onlyICO = document.getElementById('onlyICO').checked;
  
  const all = getAllData();
  const local = getLocal();
  
  // Update export bar
  const expBar = document.getElementById('exportBar');
  document.getElementById('localCount').textContent = local.length;
  expBar.classList.toggle('show', local.length > 0);

  filteredData = all.filter(e => {
    if (onlyICO && !e.ico) return false;
    if (icoQ) {
      return (e.ico || '').startsWith(icoQ);
    }
    if (!q) return true;
    return normalize(e.nazev).includes(q) ||
           normalize(e.adresa).includes(q) ||
           normalize(e.ico).includes(q) ||
           normalize(e.kod).includes(q);
  });

  if (sortCol >= 0) {
    const cols = ['nazev','ico','adresa','kod'];
    const col = cols[sortCol];
    filteredData.sort((a,b) => {
      const av = (a[col]||'').toLowerCase();
      const bv = (b[col]||'').toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }

  const total = filteredData.length;
  document.getElementById('stats').textContent = 
    total === all.length ? `${total.toLocaleString('cs')} záznamů celkem` :
    `${total.toLocaleString('cs')} z ${all.length.toLocaleString('cs')} záznamů`;

  const start = (currentPage - 1) * PER_PAGE;
  const page = filteredData.slice(start, start + PER_PAGE);

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  
  if (page.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = page.map(e => {
      const aresLink = e.ico ? 
        `<a class="link-ares" href="https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/${e.ico}" target="_blank" rel="noopener">ARES ↗</a>` : '';
      const delBtn = e._local ? 
        `<button class="btn-del-local" onclick="delLocal('${escHtml(e.nazev)}')" title="Smazat lokální záznam">✕</button>` : '';
      const localBadge = e._local ? '<span class="badge-local">NOVÝ</span>' : '';
      return `<tr class="${e._local ? 'local-row' : ''}">
        <td class="td-nazev">${escHtml(e.nazev)}${localBadge}</td>
        <td class="td-ico">${e.ico ? escHtml(e.ico) : '<span style="color:#ccc">—</span>'}${e.ico ? ' ' + aresLink : ''}</td>
        <td class="td-adresa">${escHtml(e.adresa||'')}</td>
        <td class="td-kod">${escHtml(e.kod||'')}</td>
        <td class="td-actions">${delBtn}</td>
      </tr>`;
    }).join('');
  }

  renderPagination(total);
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPagination(total) {
  const pages = Math.ceil(total / PER_PAGE);
  const p = document.getElementById('pagination');
  if (pages <= 1) { p.innerHTML = ''; return; }
  
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Předchozí</button>`;
  
  // Show smart range of pages
  let start = Math.max(1, currentPage - 2);
  let end = Math.min(pages, currentPage + 2);
  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>${start > 2 ? '<span class="page-info">…</span>' : ''}`;
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < pages) html += `${end < pages-1 ? '<span class="page-info">…</span>' : ''}<button class="page-btn" onclick="goPage(${pages})">${pages}</button>`;
  
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Další ›</button>`;
  html += `<span class="page-info">strana ${currentPage} / ${pages}</span>`;
  p.innerHTML = html;
}

function goPage(n) {
  const pages = Math.ceil(filteredData.length / PER_PAGE);
  currentPage = Math.max(1, Math.min(pages, n));
  render();
  window.scrollTo({top: 100, behavior: 'smooth'});
}

function sortBy(col) {
  const heads = document.querySelectorAll('th');
  heads.forEach((h,i) => { h.classList.remove('sort-asc','sort-desc'); });
  if (sortCol === col) {
    sortDir = -sortDir;
  } else {
    sortCol = col;
    sortDir = 1;
  }
  heads[col].classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  currentPage = 1;
  render();
}

function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-nazev').focus();
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  ['f-nazev','f-ico','f-adresa','f-kod'].forEach(id => document.getElementById(id).value = '');
}

function saveEntry() {
  const nazev = document.getElementById('f-nazev').value.trim();
  if (!nazev) { document.getElementById('f-nazev').focus(); return; }
  const entry = {
    id: 'local_' + Date.now(),
    kod: document.getElementById('f-kod').value.trim(),
    nazev,
    ico: document.getElementById('f-ico').value.trim(),
    adresa: document.getElementById('f-adresa').value.trim(),
    addedAt: new Date().toISOString()
  };
  const local = getLocal();
  local.unshift(entry);
  setLocal(local);
  closeModal();
  render();
}

function delLocal(nazev) {
  if (!confirm(`Smazat lokální záznam "${nazev}"?`)) return;
  const local = getLocal().filter(e => e.nazev !== nazev);
  setLocal(local);
  render();
}

function clearLocal() {
  if (!confirm('Smazat všechny lokálně přidané záznamy?')) return;
  setLocal([]);
  render();
}

function exportLocal() {
  const local = getLocal();
  if (!local.length) return;
  const header = 'Název;IČO;Adresa;K2 kód;Přidáno';
  const rows = local.map(e => [e.nazev, e.ico, e.adresa, e.kod, e.addedAt.slice(0,10)].map(v => `"${(v||'').replace(/"/g,'""')}"`).join(';'));
  const csv = '\uFEFF' + header + '\n' + rows.join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'noví_partneři_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// Keyboard shortcut: / focuses search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchQ').focus();
  }
});

// Initial render
render();
</script>
<script src="pin-guard.js"></script>
</body>
</html>
