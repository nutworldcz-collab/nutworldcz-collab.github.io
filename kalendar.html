<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendář zakázek — Nutworld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f2ec;
  --surface: #fff;
  --border: #e2d5c4;
  --text: #2d1f10;
  --text-soft: #8a6a50;
  --brand: #83502e;
  --brand-dark: #5c381f;
  --amber: #f7ab31;
  --leaf: #6fa044;
  --pink: #da1668;
  --today-ring: #f7ab31;
  --day-past: #f9f7f4;
  --shadow: 0 2px 12px rgba(83,56,31,.10);

  --chip-bg: #83502e;
  --rep-none: #aaa;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1410;
    --surface: #2a1e15;
    --border: #3d2d1e;
    --text: #f0e6d8;
    --text-soft: #a08060;
    --day-past: #221a12;
    --shadow: 0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #1c1410;
  --surface: #2a1e15;
  --border: #3d2d1e;
  --text: #f0e6d8;
  --text-soft: #a08060;
  --day-past: #221a12;
  --shadow: 0 2px 12px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ─── HEADER ─── */
.header{background:var(--brand-dark);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{font-family:'Exo 2',sans-serif;font-weight:700;font-size:18px;color:#fff;text-decoration:none}
.logo span{color:var(--amber)}
.header-title{font-family:'Exo 2',sans-serif;font-size:15px;opacity:.8;margin-left:4px}
.header-links{margin-left:auto;display:flex;gap:8px}
.header-links a{color:rgba(255,255,255,.7);font-size:13px;text-decoration:none;padding:4px 10px;border-radius:6px;transition:background .15s}
.header-links a:hover{background:rgba(255,255,255,.1);color:#fff}

/* ─── CALENDAR SHELL ─── */
.cal-wrap{max-width:1200px;margin:0 auto;padding:20px 16px}

/* ─── MONTH NAV ─── */
.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.month-nav h2{font-family:'Exo 2',sans-serif;font-size:22px;font-weight:700;color:var(--brand-dark);flex:1}
.nav-btn{background:var(--surface);border:1.5px solid var(--border);color:var(--text);cursor:pointer;padding:6px 14px;border-radius:8px;font-size:14px;font-family:inherit;transition:all .15s}
.nav-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.today-btn{background:var(--amber);color:var(--brand-dark);border-color:var(--amber);font-weight:600}
.today-btn:hover{background:#e09a1e;color:#fff;border-color:#e09a1e}
.loading-badge{font-size:12px;color:var(--text-soft);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── LEGEND ─── */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-soft)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ─── GRID ─── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-header{text-align:center;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-soft);padding:6px 0}
.day-cell{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;min-height:90px;padding:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.day-cell:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.day-cell.other-month{background:var(--day-past);opacity:.55}
.day-cell.today{border-color:var(--today-ring);border-width:2px;box-shadow:0 0 0 1px var(--today-ring)}
.day-cell.past{background:var(--day-past)}
.day-cell.weekend .day-num{color:var(--text-soft)}
.day-num{font-size:12px;font-weight:700;color:var(--text-soft);line-height:1;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.day-cell.today .day-num{color:var(--brand-dark)}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block}
.day-chips{display:flex;flex-direction:column;gap:3px}
.chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--chip-bg);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.4;cursor:pointer;transition:filter .12s}
.chip:hover{filter:brightness(.88)}
.more-badge{font-size:10px;color:var(--text-soft);padding:1px 4px;text-align:center}

/* ─── DETAIL MODAL ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.modal-header{padding:18px 20px 14px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1;border-radius:16px 16px 0 0}
.modal-header h3{font-family:'Exo 2',sans-serif;font-size:17px;font-weight:700;flex:1}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-soft);padding:2px 6px;border-radius:6px;transition:background .12s}
.modal-close:hover{background:var(--border)}
.modal-body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px}
.card-item{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .12s}
.card-item:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(83,56,31,.12)}
.card-firma{font-weight:700;font-size:15px;color:var(--text)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card-rep{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;color:#fff}
.card-status{font-size:11px;color:var(--text-soft);background:var(--border);padding:2px 8px;border-radius:12px}
.card-time{font-size:11px;color:var(--text-soft)}
.card-trello{font-size:11px;color:var(--brand);font-weight:600;text-decoration:none;margin-top:2px;display:inline-flex;align-items:center;gap:3px}
.card-trello:hover{text-decoration:underline}
.empty-day{text-align:center;color:var(--text-soft);font-size:13px;padding:20px 0}

/* ─── STATS BAR ─── */
.stats-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12px;color:var(--text-soft)}
.stat strong{color:var(--text);font-weight:700}

@media(max-width:640px){
  .cal-grid{gap:2px}
  .day-cell{min-height:64px;padding:4px}
  .chip{font-size:9px}
  .day-header{font-size:10px}
}
@media(max-width:420px){
  .day-cell{min-height:52px}
  .day-num{font-size:11px}
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">Nut<span>world</span></a>
  <span class="header-title">/ Kalendář zakázek</span>
  <div class="header-links">
    <a href="zakazy.html">📋 Zakázky</a>
    <a href="index.html">← Zpět</a>
  </div>
</div>

<div class="cal-wrap">
  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">← předchozí</button>
    <h2 id="month-title">—</h2>
    <button class="nav-btn today-btn" onclick="goToday()">Dnes</button>
    <button class="nav-btn" onclick="changeMonth(1)">následující →</button>
    <span id="loading-indicator" class="loading-badge" style="display:none">⏳ Načítám Trello…</span>
  </div>

  <div class="stats-bar" id="stats-bar"></div>

  <div id="stats-legend"></div>

  <div class="cal-grid" id="cal-grid">
    <div class="day-header">Po</div>
    <div class="day-header">Út</div>
    <div class="day-header">St</div>
    <div class="day-header">Čt</div>
    <div class="day-header">Pá</div>
    <div class="day-header">So</div>
    <div class="day-header">Ne</div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-date">—</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const KEY   = atob('MDM2M2ViYjE0OWRmMDRkMTI4NTY3MmEzMDgwMTYwYTI=');
const TOKEN = atob('QVRUQTdiMWI4YTFjZWRjMTIyODI3ZmRiMmY4MGRjMjRiNThkMTA4NTVkOTY3ZTAwNDViNWU0ZDdkNmZkMzQwYzJmZWFDNEYxMTFGRQ==');
const BOARD = '637f702c5e323c01d42feeac';

// Archive lists to exclude
const ARCHIVE_LISTS = new Set([
  '677bd7147a8536fbec401dca', // Firmy 2025
  '6593d3b72744d9c16cb20cd3', // Firmy 2024
  '637f729515012503596b76b6', // Firmy 2023
  '652784ff337098a887bae9ed', // Rok 2022
  '678e5066c9e7bb8d96b85ff4', // Vzorky 2025
  '66702c2df90ca75ec526670a', // EuroPool - Hotovo
  '65aa1e2060ffcea573ce1e0f', // Markét
]);

// List names cache
let LIST_NAMES = {};

// Member ID → name + color
// Priority for "who is the rep": Markéta > Tomáš > Martin > Jana > Renata > Jan
// (Jan is tagged on nearly every card as owner — he's the fallback, not primary)
const MEMBER_MAP = {
  '637f6dd24161b5005273c0b4': { name: 'Jan Vlček',          color: '#7b3a10', priority: 99 },
  '6540d11f0cfd371d93ed57e6': { name: 'Markéta Costachová', color: '#cc0a52', priority: 1  },
  '689c8d2e4106ec36f205e721': { name: 'Martin Werner',       color: '#1148b8', priority: 3  },
  '68c94612e57edc4cd5ee0f05': { name: 'Tomáš Hamernák',      color: '#c86000', priority: 2  },
};
// Non-exec members (balírna, doprava, nákup) — ignore for rep detection
const IGNORE_MEMBERS = new Set([
  '678e5051d29ebf26fbaecc96', // Balírna
  '652525fd7e535e3209eccbaf', // Doprava NutWorld
  '637f941aa6b49c0099ba1d48', // Nákup_Nutworld
]);

function repFromMembers(idMembers) {
  let best = null;
  for (const mid of (idMembers || [])) {
    if (IGNORE_MEMBERS.has(mid)) continue;
    const m = MEMBER_MAP[mid];
    if (!m) continue;
    if (!best || m.priority < best.priority) best = m;
  }
  return best || null;
}

function repColor(name) {
  if (!name) return '#9e9e9e';
  const key = name.toLowerCase().trim();
  for (const m of Object.values(MEMBER_MAP)) {
    if (m.name.toLowerCase() === key) return m.color;
  }
  return '#9e9e9e';
}

// List status → color
function listColor(listName) {
  const n = (listName || '').toLowerCase();
  if (n.includes('nabídky') || n.includes('nabidky')) return '#1565c0';
  if (n.includes('nové zakázky') || n.includes('nove zakázky')) return '#42a5f5';
  if (n.includes('k2')) return '#7b1fa2';
  if (n.includes('hotovo') || n.includes('hotov')) return '#2e7d32';
  if (n.includes('výroba') || n.includes('komponenty') || n.includes('kompletuje') || n.includes('verpet') || n.includes('chráněná') || n.includes('sdílená')) return '#e65100';
  if (n.includes('firma') || n.includes('informace')) return '#546e7a';
  return '#78909c';
}

// Parse card — rep determined from members (no Rep text field used in practice)
function parseCard(c) {
  const desc = c.desc || '';
  const lines = desc.split('\n');

  let firma = null;
  // Try Firma field from structured description (nabidky.html generated cards)
  for (const line of lines) {
    const mFirma = line.match(/\*\*Firma:\*\*\s*(.+)/);
    if (mFirma) { firma = mFirma[1].trim(); break; }
  }

  // Fallback: extract firm name from card title
  if (!firma) {
    let n = c.name;
    n = n.split(' — ')[0].split(' - ')[0];
    n = n.replace(/ objednávka.*$/i, '').replace(/ obj\..*$/i, '')
         .replace(/ vzorky.*$/i, '').replace(/ do \d+\.\d+.*$/i, '').trim();
    firma = n;
  }

  // Rep from members (primary = highest priority non-owner member)
  const repMember = repFromMembers(c.idMembers || []);
  const rep = repMember ? repMember.name : null;
  const color = repMember ? repMember.color : '#9e9e9e';

  // Shorten firm name for chips
  let shortFirma = firma
    .replace(/ s\.r\.o\.?$/i,'').replace(/ a\.s\.?$/i,'').replace(/ spol\. s r\.o\.?$/i,'')
    .replace(/, spol.*$/i,'').replace(/ akciová společnost.*$/i,'').trim();
  if (shortFirma.length > 20) shortFirma = shortFirma.slice(0,18) + '…';

  return { rep, firma, shortFirma, color };
}

// State
let currentYear, currentMonth, allCards = [];
const today = new Date();

// Init
async function init() {
  currentYear  = today.getFullYear();
  currentMonth = today.getMonth();
  document.getElementById('loading-indicator').style.display = 'inline';
  await fetchCards();
  document.getElementById('loading-indicator').style.display = 'none';
  render();
}

async function fetchCards() {
  try {
    // Fetch lists
    const listsRes = await fetch(
      `https://api.trello.com/1/boards/${BOARD}/lists?key=${KEY}&token=${TOKEN}&fields=name`
    );
    const lists = await listsRes.json();
    LIST_NAMES = {};
    for (const l of lists) LIST_NAMES[l.id] = l.name;

    // Fetch cards with due dates (filter=open + visible)
    const res = await fetch(
      `https://api.trello.com/1/boards/${BOARD}/cards?key=${KEY}&token=${TOKEN}&fields=name,due,desc,idList,idMembers,url&limit=1000`
    );
    const cards = await res.json();
    allCards = cards.filter(c =>
      c.due && !ARCHIVE_LISTS.has(c.idList)
    );
  } catch (e) {
    console.error('Trello fetch error:', e);
  }
}

// Group cards by date string YYYY-MM-DD
function cardsByDate() {
  const map = {};
  for (const c of allCards) {
    if (!c.due) continue;
    const d = c.due.slice(0, 10);
    if (!map[d]) map[d] = [];
    map[d].push(c);
  }
  return map;
}

const MONTHS_CS = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const MONTHS_CS2 = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];

function render() {
  const year = currentYear, month = currentMonth;
  document.getElementById('month-title').textContent =
    MONTHS_CS[month].charAt(0).toUpperCase() + MONTHS_CS[month].slice(1) + ' ' + year;

  const byDate = cardsByDate();

  // Build month grid
  const firstDay = new Date(year, month, 1);
  const lastDay  = new Date(year, month + 1, 0);
  // Mon=0 … Sun=6
  let startDow = firstDay.getDay(); // 0=Sun
  startDow = startDow === 0 ? 6 : startDow - 1; // convert to Mon-based

  const grid = document.getElementById('cal-grid');
  // Remove old day cells (keep headers = first 7 children)
  while (grid.children.length > 7) grid.removeChild(grid.lastChild);

  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // Fill leading empty cells
  for (let i = 0; i < startDow; i++) {
    const prevDate = new Date(year, month, 1 - (startDow - i));
    grid.appendChild(makeCell(prevDate, byDate, true, todayStr));
  }

  // Fill month days
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(year, month, d);
    grid.appendChild(makeCell(date, byDate, false, todayStr));
  }

  // Fill trailing cells to complete last row
  const total = startDow + lastDay.getDate();
  const trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= trailing; i++) {
    const date = new Date(year, month + 1, i);
    grid.appendChild(makeCell(date, byDate, true, todayStr));
  }

  // Stats for THIS month
  const monthCards = allCards.filter(c => {
    const d = new Date(c.due);
    return d.getFullYear() === year && d.getMonth() === month;
  });
  renderStats(monthCards);
}

function makeCell(date, byDate, otherMonth, todayStr) {
  const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const cards = byDate[dateStr] || [];
  const dow = date.getDay(); // 0=Sun,6=Sat
  const isWeekend = dow === 0 || dow === 6;
  const isToday = dateStr === todayStr;
  const isPast = dateStr < todayStr;

  const cell = document.createElement('div');
  cell.className = 'day-cell'
    + (otherMonth ? ' other-month' : '')
    + (isWeekend ? ' weekend' : '')
    + (isToday ? ' today' : '')
    + (isPast && !otherMonth ? ' past' : '');

  // Day number
  const numDiv = document.createElement('div');
  numDiv.className = 'day-num';
  numDiv.textContent = date.getDate();
  if (isToday) {
    const dot = document.createElement('span');
    dot.className = 'today-dot';
    numDiv.appendChild(dot);
  }
  cell.appendChild(numDiv);

  // Chips
  if (cards.length > 0) {
    const chipsDiv = document.createElement('div');
    chipsDiv.className = 'day-chips';
    const MAX_CHIPS = 3;
    const shown = cards.slice(0, MAX_CHIPS);
    for (const c of shown) {
      const { rep, firma, shortFirma } = parseCard(c);
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = shortFirma;
      chip.title = firma + (rep ? ` (${rep})` : '');
      chipsDiv.appendChild(chip);
    }
    if (cards.length > MAX_CHIPS) {
      const more = document.createElement('div');
      more.className = 'more-badge';
      more.textContent = `+${cards.length - MAX_CHIPS} dalších`;
      chipsDiv.appendChild(more);
    }
    cell.appendChild(chipsDiv);
    cell.addEventListener('click', () => openModal(dateStr, cards));
  }

  return cell;
}

function renderStats(cards) {
  const bar = document.getElementById('stats-bar');
  bar.innerHTML = '';

  const total = cards.length;
  const today_ = new Date(); today_.setHours(0,0,0,0);
  const overdue = cards.filter(c => new Date(c.due) < today_).length;
  const upcoming7 = cards.filter(c => {
    const d = new Date(c.due);
    const diff = (d - today_) / 86400000;
    return diff >= 0 && diff <= 7;
  }).length;

  const mkStat = (label, val) => {
    const el = document.createElement('div');
    el.className = 'stat';
    el.innerHTML = `${label}: <strong>${val}</strong>`;
    bar.appendChild(el);
  };

  mkStat('Termíny v měsíci', total);
  if (overdue) mkStat('⚠️ Po termínu', overdue);
  if (upcoming7) mkStat('📅 Příštích 7 dní', upcoming7);
}

function openModal(dateStr, cards) {
  const [y, m, d] = dateStr.split('-').map(Number);
  document.getElementById('modal-date').textContent =
    `${d}. ${MONTHS_CS2[m-1]} ${y} — ${cards.length} zakázek`;

  const body = document.getElementById('modal-body');
  body.innerHTML = '';

  if (cards.length === 0) {
    body.innerHTML = '<div class="empty-day">Žádné zakázky</div>';
  }

  for (const c of cards) {
    const { rep, firma } = parseCard(c);
    const listName = LIST_NAMES[c.idList] || '—';
    const time = c.due ? new Date(c.due).toLocaleTimeString('cs-CZ', {hour:'2-digit',minute:'2-digit'}) : '';

    const el = document.createElement('a');
    el.className = 'card-item';
    el.href = c.url || '#';
    el.target = '_blank';
    el.rel = 'noopener';
    el.innerHTML = `
      <div class="card-firma">${esc(firma)}</div>
      <div class="card-meta">
        ${rep ? `<span class="card-status">${esc(rep)}</span>` : ''}
        <span class="card-status" style="background:${listColor(listName)}22;color:${listColor(listName)};border:1px solid ${listColor(listName)}44">${esc(listName)}</span>
        ${time ? `<span class="card-time">⏰ ${time}</span>` : ''}
      </div>
      <span class="card-trello">🔗 Otevřít v Trello →</span>
    `;
    body.appendChild(el);
  }

  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
}

function goToday() {
  currentYear  = today.getFullYear();
  currentMonth = today.getMonth();
  render();
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
