<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nutworld — Rozcestník</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;background:#e8ddd4;min-height:100vh;padding:32px 16px}
.header{text-align:center;margin-bottom:36px}
.logo{font-family:'Exo 2',sans-serif;font-size:32px;font-weight:800;color:#5c381f}
.sub{font-size:12px;color:#a07850;letter-spacing:2.5px;text-transform:uppercase;margin-top:4px}
.section-label{font-family:'Exo 2',sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#a07850;margin-bottom:10px;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:860px;margin:0 auto 28px}
.card{background:white;border-radius:14px;padding:20px 18px;text-decoration:none;border:2px solid #d4c0a8;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(0,0,0,.07);display:block}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card-icon{font-size:28px;display:block;margin-bottom:10px}
.card-title{font-family:'Exo 2',sans-serif;font-size:14px;font-weight:700;color:#5c381f;margin-bottom:4px}
.card-desc{font-size:12px;color:#8a6a4a;line-height:1.45}
.card.brown{background:linear-gradient(135deg,#5c381f,#83502e);border-color:transparent}
.card.brown .card-title{color:white}
.card.brown .card-desc{color:rgba(255,255,255,.7)}
.card.pink{background:linear-gradient(135deg,#a01050,#da1668);border-color:transparent}
.card.pink .card-title{color:white}
.card.pink .card-desc{color:rgba(255,255,255,.7)}
.card.amber{background:linear-gradient(135deg,#b87a00,#f7ab31);border-color:transparent}
.card.amber .card-title{color:white}
.card.amber .card-desc{color:rgba(255,255,255,.75)}
.card.green{background:linear-gradient(135deg,#2d5a1b,#6fa044);border-color:transparent}
.card.green .card-title{color:white}
.card.green .card-desc{color:rgba(255,255,255,.7)}
.footer{text-align:center;font-size:11px;color:#b09070;margin-top:8px}
.card-hub{background:white;border-radius:14px;padding:18px 18px 14px;border:2px solid #d4c0a8;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card-hub-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-hub-icon{font-size:26px;line-height:1}
.card-hub-title{font-family:'Exo 2',sans-serif;font-size:14px;font-weight:700;color:#5c381f}
.card-sub-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:#5c381f;font-size:12px;font-weight:600;transition:background .12s;border:1.5px solid #e8d8c8;margin-bottom:6px}
.card-sub-link:hover{background:#f1e6da;border-color:#c8a882}
.card-sub-link-icon{font-size:14px;flex-shrink:0}
.card-sub-link-label{flex:1}
.card-sub-link-badge{font-size:10px;background:#d4c0a8;color:#5c381f;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.3px}

.search{position:relative;max-width:860px;margin:0 auto 26px}
.search input{width:100%;padding:13px 16px 13px 44px;font-size:16px;border:2px solid #d4c0a8;border-radius:14px;background:#fff;color:#5c381f;font-family:inherit;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search input:focus{border-color:#83502e;box-shadow:0 0 0 3px rgba(131,80,46,.15)}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px}
.search small{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:#a07850}
.section-label .cnt{display:inline-block;margin-left:6px;background:#d4c0a8;color:#5c381f;border-radius:10px;padding:0 7px;letter-spacing:0;font-size:10px}
.sec-sub{font-family:'Source Sans 3',Arial,sans-serif;letter-spacing:0;text-transform:none;font-size:11.5px;color:#b09070;margin-left:6px}
details.sec>summary{list-style:none;cursor:pointer}details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .section-label:before{content:'▸ ';}details.sec[open]>summary .section-label:before{content:'▾ ';}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:2px;background:#e6f3dc;color:#2d5a1b;font-family:'Source Sans 3',Arial,sans-serif}
.card.brown .tag,.card.pink .tag,.card.amber .tag,.card.green .tag{background:rgba(255,255,255,.25);color:#fff}
.empty{text-align:center;color:#8a6a4a;padding:30px}
.wrap{max-width:860px;margin:0 auto}

/* one colour per section (Jan 2026-11-25) */
.card.dark{background:linear-gradient(135deg,#3e2c1c,#5c381f);border-color:transparent}
.card.rust{background:linear-gradient(135deg,#6b2f2f,#b05030);border-color:transparent}
.card.gold{background:linear-gradient(135deg,#7a5200,#c9982e);border-color:transparent}
.card.rose{background:linear-gradient(135deg,#a8285e,#e0628f);border-color:transparent}
.card.terra{background:linear-gradient(135deg,#8a4f1f,#c98a4a);border-color:transparent}
.card.kraft{background:linear-gradient(135deg,#e9d9c6,#f6ede3);border-color:#c8976a}
.card.dark .card-title,.card.rust .card-title,.card.gold .card-title,.card.rose .card-title,.card.terra .card-title{color:#fff}
.card.dark .card-desc,.card.rust .card-desc,.card.gold .card-desc,.card.rose .card-desc,.card.terra .card-desc{color:rgba(255,255,255,.75)}
.card.dark .tag,.card.rust .tag,.card.gold .tag,.card.rose .tag,.card.terra .tag{background:rgba(255,255,255,.25);color:#fff}
.section-label .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
/* assistant: ask / give a task (Jan 2026-11-27) */
.search input{padding-right:118px}
.search .go{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;border-radius:10px;background:#83502e;color:#fff;font:700 13px 'Exo 2',sans-serif;padding:9px 14px;cursor:pointer}
.search .go:hover{background:#5c381f}.search .go:disabled{opacity:.5;cursor:wait}
.search small{right:120px}
.tips{max-width:860px;margin:-16px auto 22px;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:#a07850;align-items:center}
.tips button{border:1.5px solid #d4c0a8;background:#f6ede3;color:#5c381f;border-radius:14px;padding:3px 10px;font:600 12px 'Source Sans 3',Arial,sans-serif;cursor:pointer}
.tips button:hover{border-color:#83502e;background:#fff}
.ans{max-width:860px;margin:0 auto 26px;background:#fff;border:2px solid #c8976a;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06);color:#2d2013;font-size:14px;line-height:1.55}
.ans .q{font-family:'Exo 2',sans-serif;font-weight:700;color:#83502e;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:10px 0 4px}
.ans .q:first-child{margin-top:0}
.ans .a{overflow-x:auto}
.ans .a p{margin:4px 0}.ans .a ul{margin:4px 0 4px 20px}
.ans table{border-collapse:collapse;margin:6px 0;font-size:13px;white-space:nowrap}
.ans th,.ans td{border:1px solid #e8d8c8;padding:4px 9px;text-align:left}.ans th{background:#f1e6da;color:#5c381f}
.ans .akce{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ans .akce a{background:linear-gradient(135deg,#5c381f,#83502e);color:#fff;text-decoration:none;font-weight:700;border-radius:20px;padding:8px 16px;font-size:13px}
.ans .akce a:hover{filter:brightness(1.12)}
.ans .foot{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px;color:#a07850}
.ans .foot button{border:0;background:none;color:#83502e;font-weight:700;cursor:pointer;font-size:12px}
.ans .wait{color:#a07850}.ans .err{color:#8a0e44}
@media(max-width:560px){.search small{display:none}}
.tips button.poz-btn{background:#83502e;color:#fff;border-color:#83502e}
.poz{max-width:860px;margin:0 auto 26px;background:#fff;border:2px solid #f7ab31;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:14px;color:#2d2013}
.poz h3{font:700 15px 'Exo 2',sans-serif;color:#5c381f;margin-bottom:4px}
.poz .hint{font-size:12px;color:#8a6a4a;margin-bottom:10px}
.poz textarea,.poz select,.poz input{width:100%;font:inherit;border:1.5px solid #d4c0a8;border-radius:10px;padding:9px 11px;color:#2d2013;background:#fff}
.poz textarea{min-height:86px;resize:vertical;margin:8px 0}
.poz .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.poz .send{border:0;border-radius:10px;background:#83502e;color:#fff;font:700 13px 'Exo 2',sans-serif;padding:10px 16px;cursor:pointer}
.poz .msg{font-size:12.5px;margin-left:6px}
.poz .list{margin-top:14px;border-top:1px solid #e8d8c8;padding-top:10px}
.poz .it{border:1px solid #e8d8c8;border-radius:10px;padding:8px 11px;margin-top:7px;font-size:13px}
.poz .it .meta{font-size:11.5px;color:#a07850}
.poz .st{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;font-weight:700;margin-left:4px}
.poz .st.novy{background:#fff1d6;color:#7a5200}.poz .st.hotovo{background:#e6f3dc;color:#2d5a1b}.poz .st.zamitnuto{background:#f3e3e3;color:#6b2f2f}
.poz .it .odp{margin-top:4px;padding-left:8px;border-left:3px solid #6fa044;color:#2d5a1b}
.poz .it .adm{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.poz .it .adm input{flex:1;min-width:160px;padding:5px 8px;font-size:12.5px}
.poz .it .adm button{border:1.5px solid #d4c0a8;background:#f6ede3;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px;font-weight:700;color:#5c381f}
.dots:after{content:'…';animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🐿 Nutworld</div>
  <div class="sub">Interní rozcestník</div>
</div>
<div class="search"><span>🐿️</span><input id="q" type="search" placeholder="Zeptej se, zadej úkol, nebo hledej nástroj…" autocomplete="off" enterkeyhint="send"><small id="cnt"></small><button class="go" id="go" type="button">Zeptat se</button></div>
<div class="tips" id="tips">Zkus: <button>Jaká je cena 89?</button><button>Udělej banner na 89</button><button>Chci nabídku pro Alzu s 89</button><button>Štítek 89/200</button><button>Jaké alergeny má 3061?</button><button>Jak udělám nabídku?</button><button class="poz-btn" id="poz-open" type="button">📝 Napsat, co je potřeba udělat</button></div>
<div class="poz" id="poz" hidden></div>
<div class="ans" id="ans" hidden></div>
<div class="wrap" id="out"></div>
<div class="footer">Nutworld s.r.o. · interní nástroje · <a href="/index-puvodni.html" style="color:#b09070">původní rozcestník</a> · <a href="/rozcestnik-navrh.html" style="color:#b09070">návrh úklidu</a></div>
<script src="stranky-data.js"></script>
<script>
const BARVA={obchod:'pink',ceny:'amber',vyroba:'green',sklad:'brown',produkty:'rust',doprava:'gold',marketing:'rose',lide:'terra',jan:'dark',zakaznici:'kraft'};
const DOT={pink:'#da1668',amber:'#f7ab31',green:'#6fa044',brown:'#83502e',rust:'#b05030',gold:'#c9982e',rose:'#e0628f',terra:'#c98a4a',dark:'#3e2c1c',kraft:'#c8976a'};
// Rozcestník se kreslí ze stranky-data.js (registr stránek). Nová stránka = nový řádek tam.
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function card(p,cls){
  return `<a class="card ${cls||p.barva||''}" href="/${p.soubor}"><span class="card-icon">${p.ikona}</span>`+
    `<div class="card-title">${esc(p.nazev)}${p.stitek&&/nov/.test(p.stitek)?`<span class="tag">${esc(p.stitek)}</span>`:''}</div>`+
    `<div class="card-desc">${esc(p.popis)}</div></a>`;
}
function section(label,sub,items,collapsed,cls){
  const head=`<div class="section-label">${cls?`<span class="dot" style="background:${DOT[cls]}"></span>`:''}${label}<span class="cnt">${items.length}</span>${sub?`<span class="sec-sub">${esc(sub)}</span>`:''}</div>`;
  const grid=`<div class="grid">${items.map(p=>card(p,cls)).join('')}</div>`;
  return collapsed?`<details class="sec"><summary>${head}</summary>${grid}</details>`:head+grid;
}
function render(){
  const q=norm(document.getElementById('q').value.trim());
  const hit=p=>!q||norm(p.nazev+' '+p.popis+' '+p.soubor).includes(q);
  const list=NW_STRANKY.filter(hit);
  document.getElementById('cnt').textContent=q?`${list.length} z ${NW_STRANKY.length}`:`${NW_STRANKY.length} stránek`;
  let h='';
  if(!q) h+=section('⭐ Nejčastěji','',NW_STRANKY.filter(p=>p.hlavni).sort((a,b)=>a.hlavni-b.hlavni),false,'dark');
  NW_SKUPINY.forEach(g=>{ const ps=list.filter(p=>p.skupina===g.key); if(ps.length) h+=section(g.ikona+' '+esc(g.nazev),g.popis,ps,g.sbaleno&&!q,BARVA[g.key]); });
  document.getElementById('out').innerHTML=h||'<div class="empty">Nic nenalezeno.</div>';
}
document.getElementById('q').addEventListener('input',render);
render();

// ── Assistant (nw_asistent.py on the server; GitHub copy = search only) ──
const ONLINE = location.hostname.startsWith('nastroje');
let HIST = [], BUSY = false;
function md(t){
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const out = []; let tbl = null, ul = null;
  const flush = () => { if (tbl) { out.push('<table>' + tbl.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inl(c)}</td>`:`<th>${inl(c)}</th>`).join('')+'</tr>').join('') + '</table>'); tbl = null; }
                        if (ul) { out.push('<ul>' + ul.map(x=>`<li>${inl(x)}</li>`).join('') + '</ul>'); ul = null; } };
  String(t||'').split('\n').forEach(line => {
    const l = line.trim();
    if (/^\|.*\|$/.test(l)) { if (/^\|[\s:|-]+\|$/.test(l)) return; if (ul) flush(); (tbl = tbl || []).push(l.slice(1,-1).split('|').map(c=>c.trim())); return; }
    if (/^[-*•] /.test(l)) { if (tbl) flush(); (ul = ul || []).push(l.slice(2)); return; }
    flush();
    if (l) out.push('<p>' + inl(l.replace(/^#+\s*/,'')) + '</p>');
  });
  flush(); return out.join('');
}
function drawAns(pending, err){
  const box = document.getElementById('ans'); box.hidden = false;
  let h = HIST.map(x => `<div class="q">${esc(x.q)}</div><div class="a">${md(x.a)}</div>` +
    (x.akce && x.akce.length ? `<div class="akce">${x.akce.map(a=>`<a href="${esc(a.url)}">${esc(a.ikona||'➡️')} ${esc(a.nazev)}</a>`).join('')}</div>` : '')).join('');
  if (pending) h += `<div class="q">${esc(pending)}</div><div class="a wait">🐿️ Hledám v našich datech<span class="dots"></span></div>`;
  if (err) h += `<div class="a err">${esc(err)}</div>`;
  h += `<div class="foot"><span>Odpovídá jen z našich dat (ceník, e-shop, štítky, zakázky). Můžeš se doptat.</span><button id="nova" type="button">✕ Nová otázka</button></div>`;
  box.innerHTML = h;
  document.getElementById('nova').onclick = () => { HIST = []; box.hidden = true; const q = document.getElementById('q'); q.value=''; render(); q.focus(); };
}
async function ask(text){
  text = (text || document.getElementById('q').value).trim();
  if (!text || BUSY) return;
  if (!ONLINE) { drawAns(null, 'Asistent funguje jen na adrese nastroje.nutworld.cz (po přihlášení). Tady můžeš jen hledat nástroj.'); return; }
  BUSY = true; document.getElementById('go').disabled = true; drawAns(text);
  try {
    const r = await fetch('/api/asistent/dotaz', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({text, historie: HIST.slice(-4).map(x=>({q:x.q, a:x.a}))})});
    const j = await r.json().catch(()=>({chyba:'Asistent teď neodpověděl.'}));
    if (!r.ok || j.chyba) throw new Error(j.chyba || ('chyba ' + r.status));
    HIST.push({q:text, a:j.odpoved, akce:j.akce||[]}); drawAns();
    const q = document.getElementById('q'); q.value = ''; render();
  } catch(e) { drawAns(null, e.message); }
  finally { BUSY = false; document.getElementById('go').disabled = false; }
}
document.getElementById('go').onclick = () => ask();
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ask(); } });
document.querySelectorAll('#tips button:not(.poz-btn)').forEach(b => b.onclick = () => ask(b.textContent));

// ── „Co je potřeba udělat“ — requests for Jan (stored on the server, Jan gets an e-mail) ──
let POZ_ADMIN = false;
async function pozApi(path, body){
  const r = await fetch('/api/asistent/' + path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body: JSON.stringify(body)} : {credentials:'same-origin'});
  const j = await r.json().catch(()=>({chyba:'Server neodpověděl.'}));
  if (!r.ok || j.chyba) throw new Error(j.chyba || ('chyba ' + r.status));
  return j;
}
const POZ_ST = {novy:'čeká', hotovo:'hotovo ✓', zamitnuto:'nebude'};
async function pozList(){
  const box = document.getElementById('poz-list');
  try {
    const j = await pozApi('pozadavky'); POZ_ADMIN = j.admin;
    const rows = j.pozadavky;
    box.innerHTML = `<b style="font-size:12px;color:#83502e;letter-spacing:1px;text-transform:uppercase">${POZ_ADMIN ? 'Všechny požadavky' : 'Moje požadavky'}</b>` +
      (rows.length ? rows.map(r => `<div class="it"><div class="meta">${esc(r.cas.replace('T',' '))}${POZ_ADMIN ? ' · ' + esc(r.kdo) : ''}${r.stranka ? ' · ' + esc(r.stranka) : ''}<span class="st ${esc(r.stav)}">${POZ_ST[r.stav]||esc(r.stav)}</span></div>` +
        `<div>${esc(r.text).replace(/\n/g,'<br>')}</div>${r.odpoved ? `<div class="odp">Jan: ${esc(r.odpoved)}</div>` : ''}` +
        (POZ_ADMIN ? `<div class="adm"><input placeholder="Odpověď (uvidí ji autor)" value="${esc(r.odpoved||'')}" id="odp-${r.id}"><button onclick="pozSet('${r.id}','hotovo')">✓ Hotovo</button><button onclick="pozSet('${r.id}','zamitnuto')">✕ Nebude</button><button onclick="pozSet('${r.id}','novy')">↩ Otevřít</button></div>` : '') + '</div>').join('')
        : '<div class="hint" style="margin-top:6px">Zatím nic.</div>');
  } catch(e) { box.innerHTML = `<div class="msg" style="color:#8a0e44">${esc(e.message)}</div>`; }
}
async function pozSet(id, stav){
  try { await pozApi('pozadavek/' + id, {stav, odpoved: document.getElementById('odp-' + id).value}); pozList(); } catch(e) { alert(e.message); }
}
function pozOpen(){
  const box = document.getElementById('poz');
  if (!ONLINE) { box.hidden = false; box.innerHTML = '<div class="hint">Požadavky jdou zapsat jen na adrese nastroje.nutworld.cz (po přihlášení).</div>'; return; }
  box.hidden = false;
  box.innerHTML = `<h3>📝 Co je potřeba udělat?</h3>
    <div class="hint">Napiš, co chybí nebo nejde — třeba „v generátoru dárků chybí dárek Vánoční kornout 500 g“, „nefunguje…“, „potřeboval bych…“. Jan dostane e-mail a stav uvidíš tady.</div>
    <select id="poz-str"><option value="">Kde to je? (nepovinné)</option>${NW_STRANKY.filter(p=>p.skupina!=='jan').map(p=>`<option value="${esc(p.soubor)}">${esc(p.ikona+' '+p.nazev)}</option>`).join('')}</select>
    <textarea id="poz-text" maxlength="1500" placeholder="Co je potřeba udělat…"></textarea>
    <div class="row"><button class="send" id="poz-send" type="button">Odeslat Janovi</button><button class="send" style="background:#d4c0a8;color:#5c381f" type="button" onclick="document.getElementById('poz').hidden=true">Zavřít</button><span class="msg" id="poz-msg"></span></div>
    <div class="list" id="poz-list"></div>`;
  document.getElementById('poz-send').onclick = async () => {
    const t = document.getElementById('poz-text').value.trim(), m = document.getElementById('poz-msg');
    if (!t) { m.textContent = 'Napiš prosím, co je potřeba.'; return; }
    document.getElementById('poz-send').disabled = true;
    try { await pozApi('pozadavek', {text: t, stranka: document.getElementById('poz-str').value});
      document.getElementById('poz-text').value = ''; m.style.color = '#2d5a1b'; m.textContent = '✓ Odesláno, díky!'; pozList(); }
    catch(e) { m.style.color = '#8a0e44'; m.textContent = e.message; }
    finally { document.getElementById('poz-send').disabled = false; }
  };
  pozList();
  document.getElementById('poz-text').focus();
}
document.getElementById('poz-open').onclick = pozOpen;
if (location.hash === '#pozadavky') pozOpen();
if (!ONLINE) { document.getElementById('go').hidden = true; document.getElementById('tips').hidden = true;
  document.getElementById('q').placeholder = 'Hledat nástroj… (např. štítek, marže, PPL, šarže)'; document.querySelector('.search small').style.right = '14px';
  document.querySelector('.search input').style.paddingRight = '16px'; }
</script>
