<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nutworld — Rozcestník</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;background:#e8ddd4;min-height:100vh;padding:32px 16px}
.header{text-align:center;margin-bottom:36px}
.logo{font-family:'Exo 2',sans-serif;font-size:32px;font-weight:800;color:#5c381f}
.sub{font-size:12px;color:#a07850;letter-spacing:2.5px;text-transform:uppercase;margin-top:4px}
.section-label{font-family:'Exo 2',sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#a07850;margin-bottom:10px;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:860px;margin:0 auto 28px}
.card{background:white;border-radius:14px;padding:20px 18px;text-decoration:none;border:2px solid #d4c0a8;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(0,0,0,.07);display:block}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card-icon{font-size:28px;display:block;margin-bottom:10px}
.card-title{font-family:'Exo 2',sans-serif;font-size:14px;font-weight:700;color:#5c381f;margin-bottom:4px}
.card-desc{font-size:12px;color:#8a6a4a;line-height:1.45}
.card.brown{background:linear-gradient(135deg,#5c381f,#83502e);border-color:transparent}
.card.brown .card-title{color:white}
.card.brown .card-desc{color:rgba(255,255,255,.7)}
.card.pink{background:linear-gradient(135deg,#a01050,#da1668);border-color:transparent}
.card.pink .card-title{color:white}
.card.pink .card-desc{color:rgba(255,255,255,.7)}
.card.amber{background:linear-gradient(135deg,#b87a00,#f7ab31);border-color:transparent}
.card.amber .card-title{color:white}
.card.amber .card-desc{color:rgba(255,255,255,.75)}
.card.green{background:linear-gradient(135deg,#2d5a1b,#6fa044);border-color:transparent}
.card.green .card-title{color:white}
.card.green .card-desc{color:rgba(255,255,255,.7)}
.footer{text-align:center;font-size:11px;color:#b09070;margin-top:8px}
.card-hub{background:white;border-radius:14px;padding:18px 18px 14px;border:2px solid #d4c0a8;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card-hub-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-hub-icon{font-size:26px;line-height:1}
.card-hub-title{font-family:'Exo 2',sans-serif;font-size:14px;font-weight:700;color:#5c381f}
.card-sub-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:#5c381f;font-size:12px;font-weight:600;transition:background .12s;border:1.5px solid #e8d8c8;margin-bottom:6px}
.card-sub-link:hover{background:#f1e6da;border-color:#c8a882}
.card-sub-link-icon{font-size:14px;flex-shrink:0}
.card-sub-link-label{flex:1}
.card-sub-link-badge{font-size:10px;background:#d4c0a8;color:#5c381f;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.3px}

.search{position:relative;max-width:860px;margin:0 auto 26px}
.search input{width:100%;padding:13px 16px 13px 44px;font-size:16px;border:2px solid #d4c0a8;border-radius:14px;background:#fff;color:#5c381f;font-family:inherit;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search input:focus{border-color:#83502e;box-shadow:0 0 0 3px rgba(131,80,46,.15)}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px}
.search small{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:#a07850}
.section-label .cnt{display:inline-block;margin-left:6px;background:#d4c0a8;color:#5c381f;border-radius:10px;padding:0 7px;letter-spacing:0;font-size:10px}
.sec-sub{font-family:'Source Sans 3',Arial,sans-serif;letter-spacing:0;text-transform:none;font-size:11.5px;color:#b09070;margin-left:6px}
details.sec>summary{list-style:none;cursor:pointer}details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .section-label:before{content:'▸ ';}details.sec[open]>summary .section-label:before{content:'▾ ';}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:2px;background:#e6f3dc;color:#2d5a1b;font-family:'Source Sans 3',Arial,sans-serif}
.card.brown .tag,.card.pink .tag,.card.amber .tag,.card.green .tag{background:rgba(255,255,255,.25);color:#fff}
.empty{text-align:center;color:#8a6a4a;padding:30px}
.wrap{max-width:860px;margin:0 auto}

/* one colour per section (Jan 2026-11-25) */
.card.dark{background:linear-gradient(135deg,#3e2c1c,#5c381f);border-color:transparent}
.card.rust{background:linear-gradient(135deg,#6b2f2f,#b05030);border-color:transparent}
.card.gold{background:linear-gradient(135deg,#7a5200,#c9982e);border-color:transparent}
.card.rose{background:linear-gradient(135deg,#a8285e,#e0628f);border-color:transparent}
.card.terra{background:linear-gradient(135deg,#8a4f1f,#c98a4a);border-color:transparent}
.card.kraft{background:linear-gradient(135deg,#e9d9c6,#f6ede3);border-color:#c8976a}
.card.dark .card-title,.card.rust .card-title,.card.gold .card-title,.card.rose .card-title,.card.terra .card-title{color:#fff}
.card.dark .card-desc,.card.rust .card-desc,.card.gold .card-desc,.card.rose .card-desc,.card.terra .card-desc{color:rgba(255,255,255,.75)}
.card.dark .tag,.card.rust .tag,.card.gold .tag,.card.rose .tag,.card.terra .tag{background:rgba(255,255,255,.25);color:#fff}
.section-label .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🐿 Nutworld</div>
  <div class="sub">Interní rozcestník</div>
</div>
<div class="search"><span>🔍</span><input id="q" type="search" placeholder="Hledat nástroj… (např. štítek, marže, PPL, šarže)" autocomplete="off"><small id="cnt"></small></div>
<div class="wrap" id="out"></div>
<div class="footer">Nutworld s.r.o. · interní nástroje · <a href="/index-puvodni.html" style="color:#b09070">původní rozcestník</a> · <a href="/rozcestnik-navrh.html" style="color:#b09070">návrh úklidu</a></div>
<script src="stranky-data.js"></script>
<script>
const BARVA={obchod:'pink',ceny:'amber',vyroba:'green',sklad:'brown',produkty:'rust',doprava:'gold',marketing:'rose',lide:'terra',jan:'dark',zakaznici:'kraft'};
const DOT={pink:'#da1668',amber:'#f7ab31',green:'#6fa044',brown:'#83502e',rust:'#b05030',gold:'#c9982e',rose:'#e0628f',terra:'#c98a4a',dark:'#3e2c1c',kraft:'#c8976a'};
// Rozcestník se kreslí ze stranky-data.js (registr stránek). Nová stránka = nový řádek tam.
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function card(p,cls){
  return `<a class="card ${cls||p.barva||''}" href="/${p.soubor}"><span class="card-icon">${p.ikona}</span>`+
    `<div class="card-title">${esc(p.nazev)}${p.stitek&&/nov/.test(p.stitek)?`<span class="tag">${esc(p.stitek)}</span>`:''}</div>`+
    `<div class="card-desc">${esc(p.popis)}</div></a>`;
}
function section(label,sub,items,collapsed,cls){
  const head=`<div class="section-label">${cls?`<span class="dot" style="background:${DOT[cls]}"></span>`:''}${label}<span class="cnt">${items.length}</span>${sub?`<span class="sec-sub">${esc(sub)}</span>`:''}</div>`;
  const grid=`<div class="grid">${items.map(p=>card(p,cls)).join('')}</div>`;
  return collapsed?`<details class="sec"><summary>${head}</summary>${grid}</details>`:head+grid;
}
function render(){
  const q=norm(document.getElementById('q').value.trim());
  const hit=p=>!q||norm(p.nazev+' '+p.popis+' '+p.soubor).includes(q);
  const list=NW_STRANKY.filter(hit);
  document.getElementById('cnt').textContent=q?`${list.length} z ${NW_STRANKY.length}`:`${NW_STRANKY.length} stránek`;
  let h='';
  if(!q) h+=section('⭐ Nejčastěji','',NW_STRANKY.filter(p=>p.hlavni).sort((a,b)=>a.hlavni-b.hlavni),false,'dark');
  NW_SKUPINY.forEach(g=>{ const ps=list.filter(p=>p.skupina===g.key); if(ps.length) h+=section(g.ikona+' '+esc(g.nazev),g.popis,ps,g.sbaleno&&!q,BARVA[g.key]); });
  document.getElementById('out').innerHTML=h||'<div class="empty">Nic nenalezeno.</div>';
}
document.getElementById('q').addEventListener('input',render);
render();
</script>
<script src="pin-guard.js"></script>
</body>
</html>
