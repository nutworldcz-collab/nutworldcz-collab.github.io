<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vzorky | Nutworld</title>
<style>
:root {
  --bg: #faf6f1;
  --surface: #ffffff;
  --sf2: #f1e6da;
  --border: #d4b896;
  --text: #2e1a0e;
  --muted: #8a6a50;
  --xmuted: #b09878;
  --primary: #5c381f;
  --primary-h: #83502e;
  --pt: #ffffff;
  --accent: #f7ab31;

  --sz-bg: #eef0f3; --sz-t: #4a5568;
  --sv-bg: #fef3da; --sv-t: #92600a;
  --so-bg: #dbeafe; --so-t: #1a5fa0;
  --ss-bg: #dcfce7; --ss-t: #2d6a1a;
  --sm-bg: #fce7f0; --sm-t: #b0144a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1a0e06; --surface:#261608; --sf2:#341e0c; --border:#4a2e14;
    --text:#f1e6da; --muted:#a88060; --xmuted:#7a5a40;
    --primary:#6e4328; --primary-h:#83502e; --pt:#f1e6da; --accent:#f7ab31;
    --sz-bg:#252a30; --sz-t:#9aabbf;
    --sv-bg:#2a1e00; --sv-t:#f0a820;
    --so-bg:#0a1e40; --so-t:#6ab0f0;
    --ss-bg:#0a2010; --ss-t:#60b040;
    --sm-bg:#2a0818; --sm-t:#f06090;
  }
}
:root[data-theme="dark"] {
  --bg:#1a0e06; --surface:#261608; --sf2:#341e0c; --border:#4a2e14;
  --text:#f1e6da; --muted:#a88060; --xmuted:#7a5a40;
  --primary:#6e4328; --primary-h:#83502e; --pt:#f1e6da; --accent:#f7ab31;
  --sz-bg:#252a30; --sz-t:#9aabbf;
  --sv-bg:#2a1e00; --sv-t:#f0a820;
  --so-bg:#0a1e40; --so-t:#6ab0f0;
  --ss-bg:#0a2010; --ss-t:#60b040;
  --sm-bg:#2a0818; --sm-t:#f06090;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

/* HEADER */
.hdr { background: var(--primary); color: var(--pt); padding: 0 20px; height: 54px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.hdr-logo { font-weight: 800; font-size: 16px; letter-spacing: .3px; color: var(--accent); white-space: nowrap; }
.hdr-sep { width: 1px; height: 18px; background: rgba(255,255,255,.2); }
.hdr-title { font-size: 15px; font-weight: 600; opacity: .85; }
.hdr-note { font-size: 11px; opacity: .5; margin-left: 4px; }
.hdr-space { flex: 1; }
.btn-add { background: var(--accent); color: #2e1a0e; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-add:hover { filter: brightness(1.08); }

/* FILTER BAR */
.fbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; gap: 2px; overflow-x: auto; }
.fbtn { background: none; border: none; border-bottom: 2px solid transparent; padding: 11px 12px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; transition: color .15s, border-color .15s; }
.fbtn:hover { color: var(--text); }
.fbtn.on { color: var(--primary-h); border-bottom-color: var(--primary-h); font-weight: 700; }
.fc { background: var(--sf2); border-radius: 10px; padding: 1px 6px; font-size: 11px; font-weight: 700; }

/* MAIN */
.main { padding: 20px; max-width: 1120px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

/* CARD */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: box-shadow .15s, transform .1s; display: flex; flex-direction: column; gap: 10px; }
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); transform: translateY(-1px); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.cid { font-family: 'Courier New', monospace; font-size: 11px; color: var(--xmuted); letter-spacing: .5px; }
.card-klient { font-size: 15px; font-weight: 700; }
.card-produkt { font-size: 13px; color: var(--muted); margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { background: var(--sf2); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--muted); }
.card-bot { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--xmuted); }
.zadal-row { display: flex; align-items: center; gap: 5px; }
.zdot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary-h); flex-shrink: 0; }
.zdot.v { background: var(--accent); }

/* STATUS BADGE */
.sbadge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
.s-zadano { background: var(--sz-bg); color: var(--sz-t); }
.s-vyroba { background: var(--sv-bg); color: var(--sv-t); }
.s-odeslano { background: var(--so-bg); color: var(--so-t); }
.s-schvaleno { background: var(--ss-bg); color: var(--ss-t); }
.s-zamitnuto { background: var(--sm-bg); color: var(--sm-t); }

/* EMPTY */
.empty { grid-column: 1/-1; text-align: center; padding: 56px 20px; color: var(--muted); }
.empty-icon { font-size: 38px; margin-bottom: 12px; }
.empty h3 { font-size: 17px; color: var(--text); margin-bottom: 4px; }

/* BACKDROP */
.bk { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
.bk.hidden { display: none; }

/* MODAL */
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
.modal.wide { max-width: 660px; }
.mhdr { background: var(--primary); color: var(--pt); padding: 16px 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.mhdr h2 { font-size: 16px; font-weight: 700; }
.mhdr .sub { font-size: 11px; opacity: .55; font-family: monospace; margin-bottom: 2px; }
.mclose { background: none; border: none; color: var(--pt); font-size: 22px; cursor: pointer; opacity: .6; padding: 2px 4px; line-height: 1; flex-shrink: 0; margin-top: -2px; }
.mclose:hover { opacity: 1; }
.mbody { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.mfoot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* FORM */
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fg { display: flex; flex-direction: column; gap: 4px; }
.fg.full { grid-column: 1/-1; }
label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
input, select, textarea { background: var(--sf2); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 11px; font-size: 14px; color: var(--text); font-family: inherit; outline: none; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--primary-h); }
textarea { resize: vertical; min-height: 76px; }
select option { background: var(--surface); }

/* BUTTONS */
.btn-sec { background: var(--sf2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-sec:hover { background: var(--border); }
.btn-pri { background: var(--accent); color: #2e1a0e; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-pri:hover { filter: brightness(1.08); }

/* DETAIL */
.pipeline { display: flex; background: var(--sf2); border-bottom: 1px solid var(--border); }
.ps { flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; font-weight: 600; color: var(--xmuted); border-right: 1px solid var(--border); }
.ps:last-child { border-right: none; }
.ps.done { background: var(--ss-bg); color: var(--ss-t); }
.ps.cur { background: var(--primary); color: #fff; }
.ps.cur-m { background: var(--sm-bg); color: var(--sm-t); }

.dbody { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.dsec-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--xmuted); margin-bottom: 8px; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.df { display: flex; flex-direction: column; gap: 3px; }
.df-l { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--xmuted); }
.df-v { font-size: 14px; color: var(--text); }
.df.full { grid-column: 1/-1; }
.nota { background: var(--sf2); border-radius: 8px; padding: 11px 14px; font-size: 13px; border-left: 3px solid var(--accent); line-height: 1.6; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.abtn { border: none; border-radius: 8px; padding: 8px 13px; font-size: 12px; font-weight: 700; cursor: pointer; }
.abtn:hover { filter: brightness(1.08); }
.abtn-v { background: var(--sv-bg); color: var(--sv-t); }
.abtn-o { background: var(--so-bg); color: var(--so-t); }
.abtn-s { background: var(--ss-bg); color: var(--ss-t); }
.abtn-m { background: var(--sm-bg); color: var(--sm-t); }
.abtn-z { background: var(--sz-bg); color: var(--sz-t); }
.abtn-edit { background: var(--sf2); color: var(--text); border: 1px solid var(--border); }
.abtn-print { background: var(--sf2); color: var(--muted); border: 1px solid var(--border); margin-left: auto; }
.dfoot { font-size: 12px; color: var(--xmuted); display: flex; flex-wrap: wrap; gap: 16px; padding-top: 10px; border-top: 1px solid var(--border); align-items: center; }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--pt); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 560px) {
  .frow, .dgrid { grid-template-columns: 1fr; }
  .fg.full { grid-column: 1; }
  .df.full { grid-column: 1; }
}
@media print {
  .hdr, .fbar, .mclose, .mfoot, .actions, .pipeline { display: none !important; }
  .bk { position: static; background: none; padding: 0; overflow: visible; }
  .modal { box-shadow: none; max-width: 100%; border-radius: 0; }
  body { font-size: 12pt; }
  .nota { border: 1px solid #ccc; }
}
</style>

<!-- HEADER -->
<div class="hdr">
  <span class="hdr-logo">🐿 Nutworld</span>
  <div class="hdr-sep"></div>
  <span class="hdr-title">Vzorky</span>
  <div class="hdr-space"></div>
  <a href="/vyroba.html" style="color:rgba(255,255,255,.75);font-size:12px;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.1);white-space:nowrap">🏭 Výroba</a>
  <a href="https://trello.com/b/A2dMKGdY/vzorky-sacky-celofany-firmy" target="_blank" style="color:rgba(255,255,255,.75);font-size:12px;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.1);white-space:nowrap">🃏 Trello</a>
  <button class="btn-add" onclick="openAdd()">+ Nový vzorek</button>
</div>

<!-- FILTER BAR -->
<div class="fbar" id="fbar"></div>

<!-- MAIN -->
<div class="main">
  <div class="grid" id="grid"></div>
</div>

<!-- ADD MODAL -->
<div class="bk hidden" id="addBk">
  <div class="modal">
    <div class="mhdr">
      <h2 id="addTitle">Nový vzorek</h2>
      <button class="mclose" onclick="closeAdd()">×</button>
    </div>
    <div class="mbody" id="addForm"></div>
    <div class="mfoot">
      <button class="btn-sec" onclick="closeAdd()">Zrušit</button>
      <button class="btn-pri" onclick="save()">Uložit vzorek</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="bk hidden" id="detBk">
  <div class="modal wide" id="detContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const SK = 'nw_vzorky_v1';


const SC = {
  zadano:   { label:'Zadáno',    cls:'s-zadano' },
  vyroba:   { label:'Výroba',    cls:'s-vyroba' },
  odeslano: { label:'Odesláno',  cls:'s-odeslano' },
  schvaleno:{ label:'Schváleno', cls:'s-schvaleno' },
  zamitnuto:{ label:'Zamítnuto', cls:'s-zamitnuto' },
};


let filter = 'all';
let editId = null;

const SEED_IDS = ['VZ-2608-001','VZ-2608-002','VZ-2608-003'];
function cleanSeed() {
  try {
    const r = localStorage.getItem(SK);
    if (!r) return;
    const d = JSON.parse(r);
    const clean = d.filter(v => !SEED_IDS.includes(v.id));
    if (clean.length !== d.length) localStorage.setItem(SK, JSON.stringify(clean));
  } catch(e) {}
}
cleanSeed();

function load() {
  try { const r = localStorage.getItem(SK); if (r) return JSON.parse(r); } catch(e) {}
  return [];
}
function store(d) { localStorage.setItem(SK, JSON.stringify(d)); }

function genId() {
  const d = load();
  const now = new Date();
  const yy = String(now.getFullYear()).slice(2);
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const prefix = `VZ-${yy}${mm}-`;
  const n = d.filter(s => s.id.startsWith(prefix)).length + 1;
  return prefix + String(n).padStart(3,'0');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtD(iso) {
  if (!iso) return '—';
  const p = iso.split('T')[0].split('-');
  return `${p[2]}.${p[1]}.${p[0]}`;
}

function fmtDl(iso) {
  if (!iso) return '—';
  const now = new Date(); now.setHours(0,0,0,0);
  const dl = new Date(iso); dl.setHours(0,0,0,0);
  const days = Math.round((dl - now) / 86400000);
  const f = fmtD(iso);
  if (days < 0) return `<span style="color:var(--sm-t);font-weight:700">${f} (po termínu)</span>`;
  if (days === 0) return `<span style="color:var(--sv-t);font-weight:700">${f} (dnes)</span>`;
  if (days <= 5) return `<span style="color:var(--sv-t)">${f} (${days}d)</span>`;
  return f;
}

function setFilter(k) { filter = k; render(); }

function renderFilters() {
  const d = load();
  const cnt = {};
  d.forEach(s => { cnt[s.status] = (cnt[s.status]||0)+1; });
  const items = [
    { k:'all', l:'Vše', n: d.length },
    ...['zadano','vyroba','odeslano','schvaleno','zamitnuto'].map(k => ({ k, l: SC[k].label, n: cnt[k]||0 }))
  ];
  document.getElementById('fbar').innerHTML = items.map(f =>
    `<button class="fbtn ${filter===f.k?'on':''}" onclick="setFilter('${f.k}')">${f.l}<span class="fc">${f.n}</span></button>`
  ).join('');
}

function renderGrid() {
  const d = load();
  const list = (filter === 'all' ? d : d.filter(s => s.status === filter)).slice().reverse();
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><h3>Žádné vzorky</h3><p>Pro tento filtr nejsou žádné záznamy.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(s => `
    <div class="card" onclick="openDet('${s.id}')">
      <div class="card-top">
        <span class="cid">${s.id}</span>
        <span class="sbadge ${SC[s.status].cls}">${SC[s.status].label}</span>
      </div>
      <div>
        <div class="card-klient">${esc(s.klient)}</div>
        <div class="card-produkt">${esc(s.produkt)}</div>
      </div>
      <div class="tags">
        <span class="tag">📦 ${esc(s.obal)}</span>
        ${s.gramaz ? `<span class="tag">⚖️ ${esc(s.gramaz)}</span>` : ''}
        <span class="tag">× ${s.pocet} ks</span>
        ${s.motiv ? `<span class="tag">🎨 ${esc(s.motiv)}</span>` : ''}
      </div>
      <div class="card-bot">
        <div class="zadal-row">
          <span class="zdot ${s.zdroj==='vyroba'?'v':''}"></span>
          ${esc(s.zadal||'—')}
        </div>
        <div>Termín: ${fmtDl(s.deadline)}</div>
      </div>
    </div>`).join('');
}

function render() { renderFilters(); renderGrid(); }

// ADD / EDIT
function openAdd(id) {
  editId = id || null;
  const vz = id ? load().find(s => s.id === id) : null;
  document.getElementById('addTitle').textContent = id ? 'Upravit vzorek' : 'Nový vzorek';
  document.getElementById('addBk').classList.remove('hidden');

  document.getElementById('addForm').innerHTML = `
    <div class="frow">
      <div class="fg full"><label>Klient *</label>
        <input id="fk" placeholder="Název firmy nebo osoby" value="${vz?esc(vz.klient):''}"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Email *</label>
        <input id="fem" type="email" placeholder="kontakt@firma.cz" value="${vz?esc(vz.email||''):''}"></div>
      <div class="fg"><label>Telefon *</label>
        <input id="ftel" type="tel" placeholder="+420 777 123 456" value="${vz?esc(vz.telefon||''):''}"></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Produkt / surovina *</label>
        <input id="fp" placeholder="Např. Mandle pražené solené" value="${vz?esc(vz.produkt):''}"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Obal / forma</label><input id="fo" placeholder="Např. Eko kelímek 100g, vlastní krabička…" value="${vz?esc(vz.obal):''}"></div>
      <div class="fg"><label>Gramáž</label><input id="fg" placeholder="Např. 100g" value="${vz?esc(vz.gramaz):''}"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Počet vzorků *</label><input id="fn" type="number" min="1" placeholder="3" value="${vz?vz.pocet:''}"></div>
      <div class="fg"><label>Deadline</label><input id="fd" type="date" value="${vz?vz.deadline:''}"></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Motiv / téma</label>
        <input id="fm" placeholder="Např. Firemní vánoce 2026" value="${vz?esc(vz.motiv):''}"></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Adresa doručení</label>
        <textarea id="fad" placeholder="Jméno, firma&#10;Ulice č.p.&#10;PSČ Město" style="min-height:70px">${vz?esc(vz.adresa||''):''}</textarea></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Link na design</label>
        <input id="fl" type="url" placeholder="https://..." value="${vz?esc(vz.design_link):''}"></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Poznámka pro výrobu</label>
        <textarea id="fz" placeholder="Specifické požadavky, barvy, materiály, typ tisku...">${vz?esc(vz.poznamka):''}</textarea></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Zadal *</label>
        <select id="fz2">
          <option value="" ${!vz||!vz.zadal?'selected':''}>— vyber —</option>
          <option value="Jana" ${vz&&vz.zadal==='Jana'?'selected':''}>Jana</option>
          <option value="Darkovna" ${vz&&vz.zadal==='Darkovna'?'selected':''}>Darkovna</option>
          <option value="Balirna" ${vz&&vz.zadal==='Balirna'?'selected':''}>Balírna</option>
          <option value="Doprava" ${vz&&vz.zadal==='Doprava'?'selected':''}>Doprava</option>
        </select></div>
    </div>`;
}

function closeAdd() { document.getElementById('addBk').classList.add('hidden'); editId = null; }

function save() {
  const klient = document.getElementById('fk').value.trim();
  const produkt = document.getElementById('fp').value.trim();
  const email = document.getElementById('fem').value.trim();
  const telefon = document.getElementById('ftel').value.trim();
  const zadal = document.getElementById('fz2').value;
  if (!klient || !produkt) { toast('Vyplňte klienta a produkt.'); return; }
  if (!email || !telefon) { toast('Email a telefon jsou povinné.'); return; }
  if (!zadal) { toast('Vyber kdo kartu zadal.'); return; }

  const d = load();
  const now = new Date().toISOString();
  const obj = {
    klient, produkt, email, telefon,
    obal: document.getElementById('fo').value.trim(),
    gramaz: document.getElementById('fg').value.trim(),
    pocet: parseInt(document.getElementById('fn').value)||1,
    motiv: document.getElementById('fm').value.trim(),
    deadline: document.getElementById('fd').value,
    adresa: document.getElementById('fad').value.trim(),
    design_link: document.getElementById('fl').value.trim(),
    poznamka: document.getElementById('fz').value.trim(),
    zadal,
  };

  if (editId) {
    const i = d.findIndex(s => s.id === editId);
    if (i >= 0) d[i] = { ...d[i], ...obj, updated: now };
  } else {
    d.push({ id: genId(), ...obj, status:'zadano', created: now });
  }

  store(d); closeAdd(); render();
  toast(editId ? 'Vzorek upraven.' : 'Vzorek zadán.');
}

// DETAIL
function openDet(id) {
  const vz = load().find(s => s.id === id);
  if (!vz) return;
  document.getElementById('detBk').classList.remove('hidden');

  // Pipeline
  const FLOW = ['zadano','vyroba','odeslano'];
  const finished = ['schvaleno','zamitnuto'].includes(vz.status);
  const curFlowIdx = FLOW.indexOf(vz.status);
  const steps = FLOW.map((s, i) => {
    let cls = '';
    if (finished) cls = 'done';
    else if (i < curFlowIdx) cls = 'done';
    else if (i === curFlowIdx) cls = 'cur';
    return `<div class="ps ${cls}">${SC[s].label}</div>`;
  });
  // Final step
  if (vz.status === 'schvaleno') steps.push(`<div class="ps done">Schváleno ✓</div>`);
  else if (vz.status === 'zamitnuto') steps.push(`<div class="ps cur-m">Zamítnuto ✗</div>`);
  else steps.push(`<div class="ps">Výsledek</div>`);

  // Actions
  const acts = [];
  if (vz.status === 'zadano') {
    acts.push(`<button class="abtn abtn-v" onclick="chStatus('${id}','vyroba')">→ Do výroby</button>`);
    acts.push(`<button class="abtn abtn-m" onclick="chStatus('${id}','zamitnuto')">✗ Zamítnout</button>`);
  }
  if (vz.status === 'vyroba') {
    acts.push(`<button class="abtn abtn-o" onclick="chStatus('${id}','odeslano')">→ Odesláno klientovi</button>`);
    acts.push(`<button class="abtn abtn-m" onclick="chStatus('${id}','zamitnuto')">✗ Zamítnout</button>`);
  }
  if (vz.status === 'odeslano') {
    acts.push(`<button class="abtn abtn-s" onclick="chStatus('${id}','schvaleno')">✓ Klient schválil</button>`);
    acts.push(`<button class="abtn abtn-m" onclick="chStatus('${id}','zamitnuto')">✗ Klient zamítl</button>`);
  }
  if (vz.status === 'schvaleno' || vz.status === 'zamitnuto') {
    acts.push(`<button class="abtn abtn-z" onclick="chStatus('${id}','zadano')">↺ Vrátit do fronty</button>`);
  }
  acts.push(`<button class="abtn abtn-edit" onclick="closeDetRaw(); openAdd('${id}')">✏️ Upravit</button>`);
  acts.push(`<button class="abtn abtn-print" onclick="window.print()">🖨️ Tisknout</button>`);

  document.getElementById('detContent').innerHTML = `
    <div class="mhdr">
      <div>
        <div class="sub">${vz.id}</div>
        <h2>${esc(vz.klient)}</h2>
      </div>
      <button class="mclose" onclick="closeDet()">×</button>
    </div>
    <div class="pipeline">${steps.join('')}</div>
    <div class="dbody">
      <div>
        <div class="dsec-label">Výrobní podmínky</div>
        <div class="dgrid">
          <div class="df">
            <div class="df-l">Produkt</div>
            <div class="df-v" style="font-weight:700">${esc(vz.produkt)}</div>
          </div>
          <div class="df">
            <div class="df-l">Typ obalu</div>
            <div class="df-v">${esc(vz.obal)}</div>
          </div>
          <div class="df">
            <div class="df-l">Gramáž</div>
            <div class="df-v">${esc(vz.gramaz)||'—'}</div>
          </div>
          <div class="df">
            <div class="df-l">Počet vzorků</div>
            <div class="df-v" style="font-weight:700">${vz.pocet} ks</div>
          </div>
          <div class="df">
            <div class="df-l">Motiv / téma</div>
            <div class="df-v">${esc(vz.motiv)||'—'}</div>
          </div>
          <div class="df">
            <div class="df-l">Deadline</div>
            <div class="df-v">${fmtDl(vz.deadline)}</div>
          </div>
          ${vz.email ? `<div class="df"><div class="df-l">Email</div><div class="df-v"><a href="mailto:${esc(vz.email)}" style="color:var(--primary-h)">${esc(vz.email)}</a></div></div>` : ''}
          ${vz.telefon ? `<div class="df"><div class="df-l">Telefon</div><div class="df-v"><a href="tel:${esc(vz.telefon)}" style="color:var(--primary-h)">${esc(vz.telefon)}</a></div></div>` : ''}
          ${vz.adresa ? `<div class="df full"><div class="df-l">Adresa</div><div class="df-v" style="white-space:pre-line">${esc(vz.adresa)}</div></div>` : ''}
          ${vz.design_link ? `<div class="df full"><div class="df-l">Design</div><div class="df-v"><a href="${esc(vz.design_link)}" target="_blank" style="color:var(--primary-h)">${esc(vz.design_link)}</a></div></div>` : ''}
        </div>
      </div>
      ${vz.poznamka ? `<div><div class="dsec-label">Poznámka pro výrobu</div><div class="nota">${esc(vz.poznamka)}</div></div>` : ''}
      <div>
        <div class="dsec-label">Posun statusu</div>
        <div class="actions">${acts.join('')}</div>
      </div>
      <div class="dfoot">
        <span>Zadal: <strong>${esc(vz.zadal||'—')}</strong></span>
        <span>Zadáno: ${fmtD(vz.created)}</span>
        <span>Stav: <span class="sbadge ${SC[vz.status].cls}">${SC[vz.status].label}</span></span>
      </div>
    </div>`;
}

function closeDetRaw() { document.getElementById('detBk').classList.add('hidden'); }
function closeDet() { closeDetRaw(); render(); }

function chStatus(id, status) {
  const d = load();
  const i = d.findIndex(s => s.id === id);
  if (i >= 0) {
    d[i].status = status;
    d[i].updated = new Date().toISOString();
    store(d);
    render();
    openDet(id);
    toast(`Status → ${SC[status].label}`);
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Close on backdrop click
document.getElementById('addBk').addEventListener('click', e => { if (e.target === e.currentTarget) closeAdd(); });
document.getElementById('detBk').addEventListener('click', e => { if (e.target === e.currentTarget) closeDet(); });

render();
</script>

</body>
