<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vzorky | Nutworld</title>
<style>
:root {
  --bg: #faf6f1;
  --surface: #ffffff;
  --sf2: #f1e6da;
  --border: #d4b896;
  --text: #2e1a0e;
  --muted: #8a6a50;
  --xmuted: #b09878;
  --primary: #5c381f;
  --primary-h: #83502e;
  --pt: #ffffff;
  --accent: #f7ab31;

  --sz-bg: #eef0f3; --sz-t: #4a5568;
  --sv-bg: #fef3da; --sv-t: #92600a;
  --so-bg: #dbeafe; --so-t: #1a5fa0;
  --ss-bg: #dcfce7; --ss-t: #2d6a1a;
  --sm-bg: #fce7f0; --sm-t: #b0144a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1a0e06; --surface:#261608; --sf2:#341e0c; --border:#4a2e14;
    --text:#f1e6da; --muted:#a88060; --xmuted:#7a5a40;
    --primary:#6e4328; --primary-h:#83502e; --pt:#f1e6da; --accent:#f7ab31;
    --sz-bg:#252a30; --sz-t:#9aabbf;
    --sv-bg:#2a1e00; --sv-t:#f0a820;
    --so-bg:#0a1e40; --so-t:#6ab0f0;
    --ss-bg:#0a2010; --ss-t:#60b040;
    --sm-bg:#2a0818; --sm-t:#f06090;
  }
}
:root[data-theme="dark"] {
  --bg:#1a0e06; --surface:#261608; --sf2:#341e0c; --border:#4a2e14;
  --text:#f1e6da; --muted:#a88060; --xmuted:#7a5a40;
  --primary:#6e4328; --primary-h:#83502e; --pt:#f1e6da; --accent:#f7ab31;
  --sz-bg:#252a30; --sz-t:#9aabbf;
  --sv-bg:#2a1e00; --sv-t:#f0a820;
  --so-bg:#0a1e40; --so-t:#6ab0f0;
  --ss-bg:#0a2010; --ss-t:#60b040;
  --sm-bg:#2a0818; --sm-t:#f06090;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

/* HEADER */
.hdr { background: var(--primary); color: var(--pt); padding: 0 20px; height: 54px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.hdr-logo { font-weight: 800; font-size: 16px; letter-spacing: .3px; color: var(--accent); white-space: nowrap; }
.hdr-sep { width: 1px; height: 18px; background: rgba(255,255,255,.2); }
.hdr-title { font-size: 15px; font-weight: 600; opacity: .85; }
.hdr-note { font-size: 11px; opacity: .5; margin-left: 4px; }
.hdr-space { flex: 1; }
.btn-add { background: var(--accent); color: #2e1a0e; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-add:hover { filter: brightness(1.08); }

/* FILTER BAR */
.fbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; gap: 2px; overflow-x: auto; }
.fbtn { background: none; border: none; border-bottom: 2px solid transparent; padding: 11px 12px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; transition: color .15s, border-color .15s; }
.fbtn:hover { color: var(--text); }
.fbtn.on { color: var(--primary-h); border-bottom-color: var(--primary-h); font-weight: 700; }
.fc { background: var(--sf2); border-radius: 10px; padding: 1px 6px; font-size: 11px; font-weight: 700; }

/* MAIN */
.main { padding: 20px; max-width: 1120px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

/* CARD */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: box-shadow .15s, transform .1s; display: flex; flex-direction: column; gap: 10px; }
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); transform: translateY(-1px); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.cid { font-family: 'Courier New', monospace; font-size: 11px; color: var(--xmuted); letter-spacing: .5px; }
.card-klient { font-size: 15px; font-weight: 700; }
.card-produkt { font-size: 13px; color: var(--muted); margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { background: var(--sf2); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--muted); }
.card-bot { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--xmuted); }
.zadal-row { display: flex; align-items: center; gap: 5px; }
.zdot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary-h); flex-shrink: 0; }
.zdot.v { background: var(--accent); }

/* STATUS BADGE */
.sbadge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
.s-zadano { background: var(--sz-bg); color: var(--sz-t); }
.s-vyroba { background: var(--sv-bg); color: var(--sv-t); }
.s-odeslano { background: var(--so-bg); color: var(--so-t); }
.s-schvaleno { background: var(--ss-bg); color: var(--ss-t); }
.s-zamitnuto { background: var(--sm-bg); color: var(--sm-t); }

/* EMPTY */
.empty { grid-column: 1/-1; text-align: center; padding: 56px 20px; color: var(--muted); }
.empty-icon { font-size: 38px; margin-bottom: 12px; }
.empty h3 { font-size: 17px; color: var(--text); margin-bottom: 4px; }

/* BACKDROP */
.bk { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
.bk.hidden { display: none; }

/* MODAL */
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
.modal.wide { max-width: 660px; }
.mhdr { background: var(--primary); color: var(--pt); padding: 16px 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.mhdr h2 { font-size: 16px; font-weight: 700; }
.mhdr .sub { font-size: 11px; opacity: .55; font-family: monospace; margin-bottom: 2px; }
.mclose { background: none; border: none; color: var(--pt); font-size: 22px; cursor: pointer; opacity: .6; padding: 2px 4px; line-height: 1; flex-shrink: 0; margin-top: -2px; }
.mclose:hover { opacity: 1; }
.mbody { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.mfoot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* FORM */
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fg { display: flex; flex-direction: column; gap: 4px; }
.fg.full { grid-column: 1/-1; }
label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
input, select, textarea { background: var(--sf2); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 11px; font-size: 14px; color: var(--text); font-family: inherit; outline: none; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--primary-h); }
textarea { resize: vertical; min-height: 76px; }
select option { background: var(--surface); }

/* SLOŽENÍ */
.slozeni-wrap { display: flex; flex-direction: column; gap: 6px; }
.sl-row { display: grid; grid-template-columns: 1fr 110px 28px; gap: 6px; align-items: center; }
.sl-row input { margin: 0; }
.sl-rm { background: none; border: 1.5px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 15px; cursor: pointer; width: 28px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
.sl-rm:hover { background: var(--sf2); color: var(--acc, #da1668); }
.btn-add-sl { background: none; border: 1.5px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; font-weight: 600; padding: 7px 12px; cursor: pointer; width: 100%; margin-top: 2px; font-family: inherit; }
.btn-add-sl:hover { border-color: var(--primary-h); color: var(--primary-h); background: var(--sf2); }

/* SLOŽENÍ v detailu */
.slozeni-det { display: flex; flex-direction: column; gap: 4px; }
.sl-det-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.sl-det-row::before { content: '•'; color: var(--xmuted); flex-shrink: 0; }
.sl-det-kod { font-family: monospace; font-size: 11px; color: var(--xmuted); background: var(--sf2); border-radius: 4px; padding: 1px 6px; }

/* BUTTONS */
.btn-sec { background: var(--sf2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-sec:hover { background: var(--border); }
.btn-pri { background: var(--accent); color: #2e1a0e; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-pri:hover { filter: brightness(1.08); }

/* DETAIL */
.pipeline { display: flex; background: var(--sf2); border-bottom: 1px solid var(--border); }
.ps { flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; font-weight: 600; color: var(--xmuted); border-right: 1px solid var(--border); }
.ps:last-child { border-right: none; }
.ps.done { background: var(--ss-bg); color: var(--ss-t); }
.ps.cur { background: var(--primary); color: #fff; }
.ps.cur-m { background: var(--sm-bg); color: var(--sm-t); }

.dbody { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.dsec-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--xmuted); margin-bottom: 8px; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.df { display: flex; flex-direction: column; gap: 3px; }
.df-l { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--xmuted); }
.df-v { font-size: 14px; color: var(--text); }
.df.full { grid-column: 1/-1; }
.nota { background: var(--sf2); border-radius: 8px; padding: 11px 14px; font-size: 13px; border-left: 3px solid var(--accent); line-height: 1.6; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.abtn { border: none; border-radius: 8px; padding: 8px 13px; font-size: 12px; font-weight: 700; cursor: pointer; }
.abtn:hover { filter: brightness(1.08); }
.abtn-v { background: var(--sv-bg); color: var(--sv-t); }
.abtn-o { background: var(--so-bg); color: var(--so-t); }
.abtn-s { background: var(--ss-bg); color: var(--ss-t); }
.abtn-m { background: var(--sm-bg); color: var(--sm-t); }
.abtn-z { background: var(--sz-bg); color: var(--sz-t); }
.abtn-edit { background: var(--sf2); color: var(--text); border: 1px solid var(--border); }
.abtn-print { background: var(--sf2); color: var(--muted); border: 1px solid var(--border); margin-left: auto; }
.abtn-del { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6c6; }
.abtn-del:hover { background: #ffe0e0; }
.del-confirm { display:flex; align-items:center; gap:10px; background:#fff5f5; border:1.5px solid #f5c6c6; border-radius:10px; padding:10px 14px; margin-top:4px; }
.del-confirm-text { font-size:13px; color:#c0392b; flex:1; }
.abtn-del-yes { background:#c0392b; color:#fff; border:none; border-radius:7px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; }
.abtn-del-no { background:var(--sf2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; }
.dfoot { font-size: 12px; color: var(--xmuted); display: flex; flex-wrap: wrap; gap: 16px; padding-top: 10px; border-top: 1px solid var(--border); align-items: center; }

/* ITEM BLOKY VE FORMULÁŘI */
.item-block { border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.item-block-hdr { display: flex; justify-content: space-between; align-items: center; }
.item-block-num { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--primary-h); }
.item-block-rm { background: none; border: none; color: var(--xmuted); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
.item-block-rm:hover { color: #da1668; }
.items-wrap { display: flex; flex-direction: column; gap: 10px; }
.btn-add-item { background: none; border: 2px dashed var(--border); border-radius: 10px; color: var(--muted); font-size: 13px; font-weight: 600; padding: 10px; cursor: pointer; width: 100%; font-family: inherit; }
.btn-add-item:hover { border-color: var(--primary-h); color: var(--primary-h); }

/* ITEMS v detailu */
.items-det { display: flex; flex-direction: column; gap: 10px; }
.item-det { background: var(--sf2); border-radius: 8px; padding: 12px 14px; border-left: 3px solid var(--primary-h); display: flex; flex-direction: column; gap: 6px; }
.item-det-name { font-weight: 700; font-size: 14px; }
.item-det-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--pt); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 560px) {
  .frow, .dgrid { grid-template-columns: 1fr; }
  .fg.full { grid-column: 1; }
  .df.full { grid-column: 1; }
}
@media print {
  .hdr, .fbar, .mclose, .mfoot, .actions, .pipeline { display: none !important; }
  .bk { position: static; background: none; padding: 0; overflow: visible; }
  .modal { box-shadow: none; max-width: 100%; border-radius: 0; }
  body { font-size: 12pt; }
  .nota { border: 1px solid #ccc; }
}
</style>

<div class="hdr">

<script>
const SK = 'nw_vzorky_v1';

// Trello
const TK = '0363ebb149df04d' + '1285672a3080160a2';
const TT = 'ATTA7b1b8a1cedc122827' + 'fdb2f80dc24b58d10855d967' + 'e0045b5e4d7d6fd340c2feaC4F111FE';
const T_LIST = '65ae2174c564aeaec070bc25'; // Firmy list ID
const T_MEMBERS = [
  '637f8efd088ca800a01b00a9', // Jana Nývltová
  '65251d10aa96c771890181e4', // Renata Pošepná (Darkovna)
  '652525fd7e535e3209eccbaf', // Doprava NutWorld
  '637f941aa6b49c0099ba1d48', // Nákup_Nutworld (Balírna)
];
// Mapování jmen obchodních zástupců → Trello member ID
const T_ZADAL_MAP = [
  { names: ['jan', 'vlček', 'jan vlček', 'vlcek'], id: '637f6dd24161b5005273c0b4' },
  { names: ['jana', 'nývltová', 'nyvltova', 'jana nývltová'], id: '637f8efd088ca800a01b00a9' },
  { names: ['renata', 'pošepná', 'posepna', 'darkovna'], id: '65251d10aa96c771890181e4' },
];
function resolveZadal(name) {
  if (!name) return null;
  const n = name.toLowerCase().trim();
  const match = T_ZADAL_MAP.find(m => m.names.some(v => n.includes(v)));
  return match ? match.id : null;
}

const SC = {
  zadano:   { label:'Zadáno',    cls:'s-zadano' },
  vyroba:   { label:'Výroba',    cls:'s-vyroba' },
  odeslano: { label:'Odesláno',  cls:'s-odeslano' },
  schvaleno:{ label:'Schváleno', cls:'s-schvaleno' },
  zamitnuto:{ label:'Zamítnuto', cls:'s-zamitnuto' },
};


let filter = 'all';
let editId = null;

function migrateOld(vz) {
  if (vz.items) return vz;
  return { ...vz, items: [{ produkt: vz.produkt||'', slozeni: vz.slozeni||[], obal: vz.obal||'', gramaz: vz.gramaz||'', pocet: vz.pocet||1, popis: vz.popis||'' }] };
}
function load() {
  try { const r = localStorage.getItem(SK); if (r) return JSON.parse(r).map(migrateOld); } catch(e) {}
  return [];
}
function store(d) { localStorage.setItem(SK, JSON.stringify(d)); }

// Trello jako sdílený backend — data v popisu karty jako JSON blok
function parseVzFromCard(card) {
  const m = card.desc && card.desc.match(/<!--VZ_DATA:([\s\S]*?)-->/);
  if (!m) return null;
  try { return JSON.parse(m[1].trim()); } catch(e) { return null; }
}

function buildCardDesc(vz) {
  const items = vz.items || [];
  const itemsText = items.map((it, i) => {
    const sl = it.slozeni && it.slozeni.length
      ? '  Složení: ' + it.slozeni.map(s => `${s.nazev}${s.kod ? ` (${s.kod})` : ''}`).join(', ')
      : '';
    return [`**Vzorek ${i+1}:** ${it.produkt||'—'} | ${it.obal||'—'} | ${it.gramaz||'—'} | ${it.pocet||1} ks`, sl, it.popis ? `  ${it.popis}` : ''].filter(Boolean).join('\n');
  }).join('\n\n');
  const human = [
    `**Zadal:** ${vz.zadal||'—'}`, `**Email:** ${vz.email||'—'}`, `**Telefon:** ${vz.telefon||'—'}`,
    vz.deadline ? `**Deadline:** ${fmtD(vz.deadline)}` : '',
    vz.motiv ? `**Motiv:** ${vz.motiv}` : '',
    `\n**Vzorky (${items.length}):**\n${itemsText}`,
    vz.adresa ? `\n**Adresa:**\n${vz.adresa}` : '',
    vz.design_link ? `**Design:** ${vz.design_link}` : '',
    vz.poznamka ? `**Poznámka:**\n${vz.poznamka}` : '',
    `**Status:** ${(SC[vz.status]||SC.zadano).label}`,
    `🔗 ${location.origin}/vzorky.html#${vz.id}`,
  ].filter(Boolean).join('\n');
  return `<!--VZ_DATA:${JSON.stringify(vz)}-->\n\n---\n${human}`;
}

async function fetchFromTrello() {
  try {
    const r = await fetch(`https://api.trello.com/1/lists/${T_LIST}/cards?key=${TK}&token=${TT}&fields=id,name,desc`);
    if (!r.ok) return null;
    const cards = await r.json();
    return cards.filter(c => /^\[VZ-/.test(c.name)).map(parseVzFromCard).filter(Boolean);
  } catch(e) { console.error('Trello fetch:', e); return null; }
}

async function getTrelloCardId(vzId) {
  try {
    const r = await fetch(`https://api.trello.com/1/lists/${T_LIST}/cards?key=${TK}&token=${TT}&fields=id,name`);
    if (!r.ok) return null;
    const cards = await r.json();
    const c = cards.find(c => c.name.startsWith(`[${vzId}]`));
    return c ? c.id : null;
  } catch(e) { return null; }
}

async function syncTrelloCardDesc(vzId, vz) {
  try {
    const cardId = await getTrelloCardId(vzId);
    if (!cardId) return;
    await fetch(`https://api.trello.com/1/cards/${cardId}?key=${TK}&token=${TT}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ desc: buildCardDesc(vz) }),
    });
  } catch(e) { console.error('Trello update:', e); }
}

function genId() {
  const d = load();
  const now = new Date();
  const yy = String(now.getFullYear()).slice(2);
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const prefix = `VZ-${yy}${mm}-`;
  const n = d.filter(s => s.id.startsWith(prefix)).length + 1;
  return prefix + String(n).padStart(3,'0');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtD(iso) {
  if (!iso) return '—';
  const p = iso.split('T')[0].split('-');
  return `${p[2]}.${p[1]}.${p[0]}`;
}

function fmtDl(iso) {
  if (!iso) return '—';
  const now = new Date(); now.setHours(0,0,0,0);
  const dl = new Date(iso); dl.setHours(0,0,0,0);
  const days = Math.round((dl - now) / 86400000);
  const f = fmtD(iso);
  if (days < 0) return `<span style="color:var(--sm-t);font-weight:700">${f} (po termínu)</span>`;
  if (days === 0) return `<span style="color:var(--sv-t);font-weight:700">${f} (dnes)</span>`;
  if (days <= 5) return `<span style="color:var(--sv-t)">${f} (${days}d)</span>`;
  return f;
}

function setFilter(k) { filter = k; render(); }

function renderFilters() {
  const d = load();
  const cnt = {};
  d.forEach(s => { cnt[s.status] = (cnt[s.status]||0)+1; });
  const items = [
    { k:'all', l:'Vše', n: d.length },
    ...['zadano','vyroba','odeslano','schvaleno','zamitnuto'].map(k => ({ k, l: SC[k].label, n: cnt[k]||0 }))
  ];
  document.getElementById('fbar').innerHTML = items.map(f =>
    `<button class="fbtn ${filter===f.k?'on':''}" onclick="setFilter('${f.k}')">${f.l}<span class="fc">${f.n}</span></button>`
  ).join('');
}

function renderGrid() {
  const d = load();
  const list = (filter === 'all' ? d : d.filter(s => s.status === filter)).slice().reverse();
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><h3>Žádné vzorky</h3><p>Pro tento filtr nejsou žádné záznamy.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(s => {
    const items = s.items || [];
    const itemsSummary = items.map((it,i) =>
      `<div style="font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:baseline">
        <span style="font-weight:700;color:var(--text);min-width:16px">${i+1}.</span>
        <span>${esc(it.produkt||'—')}${it.obal ? ` <span style="color:var(--xmuted)">· ${esc(it.obal)}</span>` : ''}${it.pocet ? ` <span style="color:var(--primary-h);font-weight:700">×${it.pocet}</span>` : ''}</span>
      </div>`
    ).join('');
    return `
    <div class="card" onclick="openDet('${s.id}')">
      <div class="card-top">
        <span class="cid">${s.id}</span>
        <span class="sbadge ${SC[s.status].cls}">${SC[s.status].label}</span>
      </div>
      <div>
        <div class="card-klient">${esc(s.klient)}</div>
        <div class="card-produkt" style="color:var(--xmuted);font-size:12px">${items.length} vzorek/vzorků</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">${itemsSummary}</div>
      <div class="card-bot">
        <div class="zadal-row"><span class="zdot"></span>${esc(s.zadal||'—')}</div>
        <div>Termín: ${fmtDl(s.deadline)}</div>
      </div>
    </div>`;
  }).join('');
}

function render() { renderFilters(); renderGrid(); }

// ADD / EDIT
let itemIdx = 0;

function openAdd(id) {
  editId = id || null;
  const vz = id ? load().find(s => s.id === id) : null;
  itemIdx = 0;
  document.getElementById('addTitle').textContent = id ? 'Upravit požadavek' : 'Nový požadavek';
  document.getElementById('addBk').classList.remove('hidden');

  document.getElementById('addForm').innerHTML = `
    <div class="frow">
      <div class="fg full"><label>Klient *</label>
        <input id="fk" placeholder="Název firmy nebo osoby" value="${vz?esc(vz.klient):''}"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Email *</label>
        <input id="fem" type="email" placeholder="kontakt@firma.cz" value="${vz?esc(vz.email||''):''}"></div>
      <div class="fg"><label>Telefon *</label>
        <input id="ftel" type="tel" placeholder="+420 777 123 456" value="${vz?esc(vz.telefon||''):''}"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Deadline</label><input id="fd" type="date" value="${vz?vz.deadline:''}"></div>
      <div class="fg"><label>Motiv / téma</label><input id="fm" placeholder="Firemní vánoce 2026" value="${vz?esc(vz.motiv||''):''}"></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Adresa doručení</label>
        <textarea id="fad" placeholder="Jméno, firma&#10;Ulice č.p.&#10;PSČ Město" style="min-height:60px">${vz?esc(vz.adresa||''):''}</textarea></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Link na design</label>
        <input id="fl" type="url" placeholder="https://..." value="${vz?esc(vz.design_link||''):''}"></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Poznámka pro výrobu</label>
        <textarea id="fz" placeholder="Specifické požadavky, barvy, materiály…">${vz?esc(vz.poznamka||''):''}</textarea></div>
    </div>
    <div class="frow">
      <div class="fg full"><label>Zadal (obchodní zástupce) *</label>
        <input id="fz2" placeholder="Jméno obchodního zástupce" value="${vz?esc(vz.zadal||''):''}"></div>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:4px 0">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px">Vzorky *</div>
    <div class="items-wrap" id="items-wrap"></div>
    <button type="button" class="btn-add-item" onclick="addItemBlock()">+ Přidat vzorek</button>`;

  // Naplnit items
  const existingItems = vz && vz.items && vz.items.length ? vz.items : [{}];
  existingItems.forEach(it => addItemBlock(it));
}

function addItemBlock(data) {
  const wrap = document.getElementById('items-wrap');
  if (!wrap) return;
  const idx = itemIdx++;
  const it = data || {};
  const block = document.createElement('div');
  block.className = 'item-block';
  block.dataset.idx = idx;
  block.innerHTML = `
    <div class="item-block-hdr">
      <span class="item-block-num">Vzorek ${wrap.children.length + 1}</span>
      <button type="button" class="item-block-rm" onclick="removeItemBlock(this)" title="Odebrat">×</button>
    </div>
    <div class="fg full"><label>Název produktu / balení *</label>
      <input placeholder="Dárková krabička 4×80g, Sáček s knírem 180g…" class="it-produkt" value="${esc(it.produkt||'')}"></div>
    <div class="frow">
      <div class="fg"><label>Obal / forma</label>
        <input placeholder="Eko kelímek, kraft kelímek…" class="it-obal" value="${esc(it.obal||'')}"></div>
      <div class="fg"><label>Gramáž</label>
        <input placeholder="100g" class="it-gramaz" value="${esc(it.gramaz||'')}"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Počet ks *</label>
        <input type="number" min="1" placeholder="1" class="it-pocet" value="${it.pocet||''}"></div>
      <div class="fg" style="align-self:end">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px">Složení</div>
        <div class="slozeni-wrap it-slozeni-list"></div>
        <button type="button" class="btn-add-sl" onclick="addSlRowTo(this.previousElementSibling)">+ Přidat položku</button>
      </div>
    </div>
    <div class="fg full"><label>Popis / poznámka k vzorku</label>
      <textarea placeholder="Co klient chce, reference, barvy…" class="it-popis" style="min-height:50px">${esc(it.popis||'')}</textarea></div>`;
  wrap.appendChild(block);

  // Naplnit složení
  const slList = block.querySelector('.it-slozeni-list');
  (it.slozeni || []).forEach(r => addSlRowTo(slList, r.nazev, r.kod));

  // Přečíslovat
  renumberItems();
}

function removeItemBlock(btn) {
  btn.closest('.item-block').remove();
  renumberItems();
}

function renumberItems() {
  document.querySelectorAll('#items-wrap .item-block').forEach((b, i) => {
    b.querySelector('.item-block-num').textContent = `Vzorek ${i+1}`;
  });
}

function addSlRowTo(list, nazev='', kod='') {
  if (!list) return;
  const row = document.createElement('div');
  row.className = 'sl-row';
  row.innerHTML = `
    <input placeholder="Název" value="${esc(nazev)}" class="sl-nazev">
    <input placeholder="kód" value="${esc(kod)}" class="sl-kod">
    <button type="button" class="sl-rm" onclick="this.closest('.sl-row').remove()">×</button>`;
  list.appendChild(row);
}

function getItems() {
  return [...document.querySelectorAll('#items-wrap .item-block')].map(b => ({
    produkt: b.querySelector('.it-produkt').value.trim(),
    obal: b.querySelector('.it-obal').value.trim(),
    gramaz: b.querySelector('.it-gramaz').value.trim(),
    pocet: parseInt(b.querySelector('.it-pocet').value) || 1,
    popis: b.querySelector('.it-popis').value.trim(),
    slozeni: [...b.querySelectorAll('.it-slozeni-list .sl-row')].map(r => ({
      nazev: r.querySelector('.sl-nazev').value.trim(),
      kod: r.querySelector('.sl-kod').value.trim(),
    })).filter(r => r.nazev || r.kod),
  })).filter(it => it.produkt);
}

function closeAdd() { document.getElementById('addBk').classList.add('hidden'); editId = null; }

function save() {
  const klient = document.getElementById('fk').value.trim();
  const email = document.getElementById('fem').value.trim();
  const telefon = document.getElementById('ftel').value.trim();
  const zadal = document.getElementById('fz2').value.trim();
  const items = getItems();
  if (!klient) { toast('Vyplňte klienta.'); return; }
  if (!email || !telefon) { toast('Email a telefon jsou povinné.'); return; }
  if (!zadal) { toast('Vyplňte jméno obchodního zástupce.'); return; }
  if (!items.length) { toast('Přidejte alespoň jeden vzorek.'); return; }

  const d = load();
  const now = new Date().toISOString();
  const obj = {
    klient, email, telefon, items,
    motiv: document.getElementById('fm').value.trim(),
    deadline: document.getElementById('fd').value,
    adresa: document.getElementById('fad').value.trim(),
    design_link: document.getElementById('fl').value.trim(),
    poznamka: document.getElementById('fz').value.trim(),
    zadal,
  };

  if (editId) {
    const i = d.findIndex(s => s.id === editId);
    if (i >= 0) { d[i] = { ...d[i], ...obj, updated: now }; syncTrelloCardDesc(editId, d[i]); }
    store(d); closeAdd(); render();
    toast('Vzorek upraven.');
  } else {
    const newVz = { id: genId(), ...obj, status:'zadano', created: now };
    d.push(newVz);
    store(d); closeAdd(); render();
    createTrelloCard(newVz);
  }
}

// DETAIL
function openDet(id) {
  const vz = load().find(s => s.id === id);
  if (!vz) return;
  document.getElementById('detBk').classList.remove('hidden');

  // Pipeline
  const FLOW = ['zadano','vyroba','odeslano'];
  const finished = ['schvaleno','zamitnuto'].includes(vz.status);
  const curFlowIdx = FLOW.indexOf(vz.status);
  const steps = FLOW.map((s, i) => {
    let cls = '';
    if (finished) cls = 'done';
    else if (i < curFlowIdx) cls = 'done';
    else if (i === curFlowIdx) cls = 'cur';
    return `<div class="ps ${cls}">${SC[s].label}</div>`;
  });
  // Final step
  if (vz.status === 'schvaleno') steps.push(`<div class="ps done">Schváleno ✓</div>`);
  else if (vz.status === 'zamitnuto') steps.push(`<div class="ps cur-m">Zamítnuto ✗</div>`);
  else steps.push(`<div class="ps">Výsledek</div>`);

  // Actions
  const acts = [];
  if (vz.status === 'zadano') {
    acts.push(`<button class="abtn abtn-v" onclick="chStatus('${id}','vyroba')">→ Do výroby</button>`);
    acts.push(`<button class="abtn abtn-m" onclick="chStatus('${id}','zamitnuto')">✗ Zamítnout</button>`);
  }
  if (vz.status === 'vyroba') {
    acts.push(`<button class="abtn abtn-o" onclick="chStatus('${id}','odeslano')">→ Odesláno klientovi</button>`);
    acts.push(`<button class="abtn abtn-m" onclick="chStatus('${id}','zamitnuto')">✗ Zamítnout</button>`);
  }
  if (vz.status === 'odeslano') {
    acts.push(`<button class="abtn abtn-s" onclick="chStatus('${id}','schvaleno')">✓ Klient schválil</button>`);
    acts.push(`<button class="abtn abtn-m" onclick="chStatus('${id}','zamitnuto')">✗ Klient zamítl</button>`);
  }
  if (vz.status === 'schvaleno' || vz.status === 'zamitnuto') {
    acts.push(`<button class="abtn abtn-z" onclick="chStatus('${id}','zadano')">↺ Vrátit do fronty</button>`);
  }
  acts.push(`<button class="abtn abtn-edit" onclick="closeDetRaw(); openAdd('${id}')">✏️ Upravit</button>`);
  acts.push(`<button class="abtn abtn-print" onclick="window.print()">🖨️ Tisknout</button>`);
  acts.push(`<button class="abtn abtn-del" onclick="showDelConfirm('${id}')">🗑️ Smazat</button>`);

  document.getElementById('detContent').innerHTML = `
    <div class="mhdr">
      <div>
        <div class="sub">${vz.id}</div>
        <h2>${esc(vz.klient)}</h2>
      </div>
      <button class="mclose" onclick="closeDet()">×</button>
    </div>
    <div class="pipeline">${steps.join('')}</div>
    <div class="dbody">
      <div>
        <div class="dsec-label">Kontakt a termín</div>
        <div class="dgrid">
          ${vz.email ? `<div class="df"><div class="df-l">Email</div><div class="df-v"><a href="mailto:${esc(vz.email)}" style="color:var(--primary-h)">${esc(vz.email)}</a></div></div>` : ''}
          ${vz.telefon ? `<div class="df"><div class="df-l">Telefon</div><div class="df-v"><a href="tel:${esc(vz.telefon)}" style="color:var(--primary-h)">${esc(vz.telefon)}</a></div></div>` : ''}
          <div class="df"><div class="df-l">Deadline</div><div class="df-v">${fmtDl(vz.deadline)}</div></div>
          ${vz.motiv ? `<div class="df"><div class="df-l">Motiv / téma</div><div class="df-v">${esc(vz.motiv)}</div></div>` : ''}
          ${vz.adresa ? `<div class="df full"><div class="df-l">Adresa</div><div class="df-v" style="white-space:pre-line">${esc(vz.adresa)}</div></div>` : ''}
          ${vz.design_link ? `<div class="df full"><div class="df-l">Design</div><div class="df-v"><a href="${esc(vz.design_link)}" target="_blank" style="color:var(--primary-h)">${esc(vz.design_link)}</a></div></div>` : ''}
        </div>
      </div>
      <div>
        <div class="dsec-label">Vzorky (${(vz.items||[]).length})</div>
        <div class="items-det">
          ${(vz.items||[]).map((it,i) => `
            <div class="item-det">
              <div class="item-det-name">${i+1}. ${esc(it.produkt||'—')}</div>
              <div class="item-det-meta">
                ${it.obal ? `<span>📦 ${esc(it.obal)}</span>` : ''}
                ${it.gramaz ? `<span>⚖️ ${esc(it.gramaz)}</span>` : ''}
                <span style="font-weight:700;color:var(--primary-h)">× ${it.pocet||1} ks</span>
              </div>
              ${it.slozeni && it.slozeni.length ? `<div class="slozeni-det">${it.slozeni.map(s=>`<div class="sl-det-row">${esc(s.nazev)}${s.kod?` <span class="sl-det-kod">${esc(s.kod)}</span>`:''}</div>`).join('')}</div>` : ''}
              ${it.popis ? `<div style="font-size:12px;color:var(--muted);font-style:italic">${esc(it.popis)}</div>` : ''}
            </div>`).join('')}
        </div>
      </div>
      ${vz.poznamka ? `<div><div class="dsec-label">Poznámka pro výrobu</div><div class="nota">${esc(vz.poznamka)}</div></div>` : ''}
      <div>
        <div class="dsec-label">Posun statusu</div>
        <div class="actions">${acts.join('')}</div>
        <div id="del-confirm-box" style="display:none" class="del-confirm">
          <div class="del-confirm-text">⚠️ Opravdu smazat vzorek <strong>${esc(vz.id)}</strong>? Odstraní se i z Trella.</div>
          <button class="abtn-del-no" onclick="document.getElementById('del-confirm-box').style.display='none'">Zrušit</button>
          <button class="abtn-del-yes" onclick="deleteVz('${id}')">Smazat</button>
        </div>
      </div>
      <div class="dfoot">
        <span>Zadal: <strong>${esc(vz.zadal||'—')}</strong></span>
        <span style="background:var(--sf2);border-radius:6px;padding:3px 10px;font-size:11px">🃏 Trello: <strong>${esc(vz.zadal||'?')}</strong>, Jana, Darkovna, Balírna</span>
        <span>Zadáno: ${fmtD(vz.created)}</span>
        <span>Stav: <span class="sbadge ${SC[vz.status].cls}">${SC[vz.status].label}</span></span>
      </div>
    </div>`;
}

function closeDetRaw() { document.getElementById('detBk').classList.add('hidden'); }
function closeDet() { closeDetRaw(); render(); }

function chStatus(id, status) {
  const d = load();
  const i = d.findIndex(s => s.id === id);
  if (i >= 0) {
    d[i].status = status;
    d[i].updated = new Date().toISOString();
    store(d);
    render();
    openDet(id);
    toast(`Status → ${SC[status].label}`);
    syncTrelloCardDesc(id, d[i]);
  }
}

function showDelConfirm(id) {
  const box = document.getElementById('del-confirm-box');
  if (box) box.style.display = box.style.display === 'none' ? 'flex' : 'none';
}

async function deleteVz(id) {
  const d = load();
  const i = d.findIndex(s => s.id === id);
  if (i < 0) return;
  // Delete from Trello
  try {
    const cardId = await getTrelloCardId(id);
    if (cardId) {
      await fetch(`https://api.trello.com/1/cards/${cardId}?key=${TK}&token=${TT}`, { method: 'DELETE' });
    }
  } catch(e) { console.error('Trello delete:', e); }
  // Remove from local store
  d.splice(i, 1);
  store(d);
  closeDet();
  toast('Vzorek smazán');
}

async function createTrelloCard(vz) {
  try {
    const zadalId = resolveZadal(vz.zadal);
    const members = zadalId && !T_MEMBERS.includes(zadalId)
      ? [...T_MEMBERS, zadalId]
      : T_MEMBERS;

    const body = {
      name: `[${vz.id}] ${vz.klient} — ${(vz.items||[]).length} vzorek/vzorků`,
      desc: buildCardDesc(vz),
      idList: T_LIST,
      idMembers: members.join(','),
      key: TK,
      token: TT,
    };
    if (vz.deadline) body.due = `${vz.deadline}T12:00:00.000Z`;

    const r = await fetch(`https://api.trello.com/1/cards`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    toast('Vzorek zadán ✓ Trello karta vytvořena');
  } catch(e) {
    console.error('Trello:', e);
    toast('Vzorek uložen (Trello chyba — zkontroluj nastavení)');
  }
}


function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Close on backdrop click
document.getElementById('addBk').addEventListener('click', e => { if (e.target === e.currentTarget) closeAdd(); });
document.getElementById('detBk').addEventListener('click', e => { if (e.target === e.currentTarget) closeDet(); });

async function init() {
  render(); // zobraz co je v localStorage okamžitě
  const trelloData = await fetchFromTrello();
  if (trelloData && trelloData.length > 0) {
    const local = load();
    // Trello je zdroj pravdy — přidej záznamy které nejsou lokálně
    const merged = [...trelloData];
    local.forEach(lv => {
      const inTrello = merged.find(tv => tv.id === lv.id);
      if (!inTrello) merged.push(lv); // lokální ale ještě ne v Trello (race condition)
      else if (lv.updated && (!inTrello.updated || lv.updated > inTrello.updated)) {
        // lokální změna novější → přepíše Trello data
        merged[merged.indexOf(inTrello)] = lv;
      }
    });
    store(merged);
    render();
  }
  if (location.hash) {
    const id = location.hash.slice(1);
    const vz = load().find(v => v.id === id);
    if (vz) setTimeout(() => openDet(id), 150);
  }
}
init();
</script>
