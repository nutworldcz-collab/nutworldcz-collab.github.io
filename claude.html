<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Claude — Nutworld</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#83502e">
<style>
:root {
  --brown: #83502e;
  --brown-dark: #5c381f;
  --kraft: #f1e6da;
  --kraft-dark: #e8d5c4;
  --amber: #f7ab31;
  --accent: #da1668;
  --text: #2c1a0e;
  --text-light: #7a5a40;
  --bubble-user: #5c381f;
  --bubble-ai: #fff;
  --border: #d4b896;
  --shadow: rgba(92,56,31,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5ede3; color: var(--text); }

/* Layout */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 600px; margin: 0 auto; background: #fff; position: relative; box-shadow: 0 0 40px var(--shadow); }

/* Header */
#header { background: var(--brown); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 56px; }
#header-logo { width: 32px; height: 32px; background: var(--amber); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
#header-title { flex: 1; }
#header-title h1 { font-size: 16px; font-weight: 700; line-height: 1.2; }
#header-title .subtitle { font-size: 11px; opacity: 0.75; }
#btn-new { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
#btn-new:active { background: rgba(255,255,255,0.25); }
#btn-history { background: none; border: none; color: #fff; padding: 6px; cursor: pointer; opacity: 0.85; display: flex; align-items: center; }

/* Chat area */
#messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }

/* Welcome screen */
#welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 20px; text-align: center; gap: 16px; }
#welcome .logo-big { width: 64px; height: 64px; background: var(--amber); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; }
#welcome h2 { font-size: 20px; color: var(--brown-dark); }
#welcome p { font-size: 14px; color: var(--text-light); line-height: 1.5; max-width: 280px; }
#quick-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
.quick-btn { background: var(--kraft); border: 1.5px solid var(--border); color: var(--brown-dark); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 500; }
.quick-btn:active { background: var(--kraft-dark); }

/* Messages */
.msg { display: flex; flex-direction: column; max-width: 88%; animation: fadeIn 0.2s ease; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; align-items: flex-start; }
.msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-break: break-word; }
.msg.user .msg-bubble { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: var(--kraft); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
.msg-time { font-size: 10px; color: var(--text-light); margin-top: 3px; padding: 0 4px; }
.msg.user .msg-time { text-align: right; }

/* Markdown in AI messages */
.msg.assistant .msg-bubble p { margin-bottom: 8px; }
.msg.assistant .msg-bubble p:last-child { margin-bottom: 0; }
.msg.assistant .msg-bubble strong { color: var(--brown-dark); font-weight: 700; }
.msg.assistant .msg-bubble code { background: #fff; border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', monospace; }
.msg.assistant .msg-bubble pre { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; margin: 6px 0; }
.msg.assistant .msg-bubble pre code { background: none; border: none; padding: 0; font-size: 12px; }
.msg.assistant .msg-bubble ul, .msg.assistant .msg-bubble ol { padding-left: 18px; margin: 6px 0; }
.msg.assistant .msg-bubble li { margin-bottom: 3px; }
.msg.assistant .msg-bubble h1, .msg.assistant .msg-bubble h2, .msg.assistant .msg-bubble h3 { color: var(--brown-dark); margin: 8px 0 4px; }
.msg.assistant .msg-bubble h1 { font-size: 16px; }
.msg.assistant .msg-bubble h2 { font-size: 15px; }
.msg.assistant .msg-bubble h3 { font-size: 14px; }
.msg.assistant .msg-bubble table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0; }
.msg.assistant .msg-bubble th { background: var(--kraft-dark); padding: 5px 8px; text-align: left; border: 1px solid var(--border); color: var(--brown-dark); }
.msg.assistant .msg-bubble td { padding: 5px 8px; border: 1px solid var(--border); }
.msg.assistant .msg-bubble blockquote { border-left: 3px solid var(--amber); padding-left: 10px; color: var(--text-light); margin: 6px 0; }
.msg.assistant .msg-bubble a { color: var(--accent); text-decoration: none; }
.msg.assistant .msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

/* Typing indicator */
.typing { display: flex; align-items: center; gap: 4px; padding: 12px 14px; background: var(--kraft); border-radius: 18px; border-bottom-left-radius: 4px; border: 1px solid var(--border); width: fit-content; }
.typing span { width: 7px; height: 7px; background: var(--brown); border-radius: 50%; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

/* Input area */
#input-area { border-top: 1px solid var(--border); padding: 10px 12px; background: #fff; flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end; }
#msg-input { flex: 1; border: 1.5px solid var(--border); border-radius: 22px; padding: 10px 14px; font-size: 15px; resize: none; max-height: 120px; overflow-y: auto; outline: none; background: var(--kraft); color: var(--text); font-family: inherit; line-height: 1.4; }
#msg-input:focus { border-color: var(--brown); background: #fff; }
#msg-input::placeholder { color: var(--text-light); }
#btn-send { width: 42px; height: 42px; border-radius: 50%; background: var(--brown); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
#btn-send:active { background: var(--brown-dark); }
#btn-send:disabled { background: var(--border); cursor: default; }
#btn-send svg { width: 18px; height: 18px; }

/* History drawer */
#drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; }
#drawer { position: fixed; left: -280px; top: 0; bottom: 0; width: 280px; background: #fff; z-index: 101; transition: left 0.25s ease; box-shadow: 4px 0 20px var(--shadow); display: flex; flex-direction: column; }
#drawer.open { left: 0; }
#drawer-overlay.open { display: block; }
#drawer-header { background: var(--brown-dark); color: #fff; padding: 16px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; min-height: 56px; }
#drawer-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 0; }
#conv-list { flex: 1; overflow-y: auto; }
.conv-item { padding: 12px 16px; border-bottom: 1px solid var(--kraft); cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.conv-item:active { background: var(--kraft); }
.conv-item.active { background: var(--kraft); border-left: 3px solid var(--amber); }
.conv-title { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-date { font-size: 11px; color: var(--text-light); }
.conv-del { float: right; background: none; border: none; color: #ccc; font-size: 16px; cursor: pointer; padding: 0 0 0 8px; }
.conv-del:active { color: var(--accent); }
#drawer-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
.context-badge { font-size: 11px; color: var(--text-light); text-align: center; padding: 4px; }

/* Error */
.msg-error { background: #fff0f0; color: #c00; border: 1px solid #fcc; border-radius: 8px; padding: 10px 14px; font-size: 13px; align-self: center; max-width: 90%; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* Safe area on iOS */
#input-area { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
#key-input:focus { border-color: #83502e; background: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="btn-history" onclick="openDrawer()" aria-label="Historie">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div id="header-logo">🐿️</div>
    <div id="header-title">
      <h1>Nutworld AI</h1>
      <div class="subtitle" id="conv-name">Nová konverzace</div>
    </div>
    <button id="btn-new" onclick="newChat()">+ Nová</button>
    <button id="btn-key" onclick="showKeySetup()" title="API klíč" style="background:none;border:none;color:#fff;padding:6px;cursor:pointer;opacity:0.7;display:flex;align-items:center;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="3"/><path d="M11 12l9-9m-3 0l2 2m-4-4l2 2"/></svg>
    </button>
  </div>

  <div id="messages">
    <div id="welcome">
      <div class="logo-big">🐿️</div>
      <h2>Ahoj, Vlčáku!</h2>
      <p>Mám plný kontext Nutworld projektu. Zeptej se na cokoliv nebo vyber rychlou akci:</p>
      <div id="quick-actions">
        <button class="quick-btn" onclick="quickSend('Co je v backlogu? Shrň urgentní věci.')">📋 Backlog</button>
        <button class="quick-btn" onclick="quickSend('Zkontroluj/vypočítej cenu — ')">💰 Kalkulace ceny</button>
        <button class="quick-btn" onclick="quickSend('Nový produkt — potřebuji přidat do pipeline: ')">📦 Nový produkt</button>
        <button class="quick-btn" onclick="quickSend('Jak jsme na tom s dárkovými produkty? Co zbývá?')">🎁 Dárky status</button>
        <button class="quick-btn" onclick="quickSend('Shrň aktuální stav SK pipeline a co je potřeba udělat.')">🇸🇰 SK pipeline</button>
        <button class="quick-btn" onclick="quickSend('Napiš si úkol pro Claude Code: ')">📝 Zadej úkol</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="Napiš zprávu…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="btn-send" onclick="sendMessage()" aria-label="Odeslat" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- API key modal -->
<div id="key-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;padding:24px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-size:36px;margin-bottom:8px;">🔑</div>
      <h2 style="font-size:18px;color:#5c381f;margin-bottom:6px;">API klíč</h2>
      <p style="font-size:13px;color:#7a5a40;line-height:1.5;">Zadej Anthropic API klíč. Uloží se pouze v tomto prohlížeči.</p>
    </div>
    <input id="key-input" type="password" placeholder="sk-ant-api03-..."
      style="width:100%;padding:12px;border:1.5px solid #d4b896;border-radius:10px;font-size:14px;outline:none;margin-bottom:12px;font-family:monospace;background:#f1e6da;"
      onkeydown="if(event.key==='Enter')saveKey()">
    <button onclick="saveKey()"
      style="width:100%;padding:12px;background:#83502e;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;">
      Uložit
    </button>
    <button onclick="hideKeySetup()"
      style="width:100%;padding:10px;background:none;border:none;color:#7a5a40;font-size:14px;cursor:pointer;">
      Zrušit
    </button>
  </div>
</div>

<div id="drawer-overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div id="drawer-header">
    <span>💬 Konverzace</span>
    <button id="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="conv-list"></div>
  <div id="drawer-footer">
    <div class="context-badge" id="context-info">Kontext načten</div>
  </div>
</div>

<script>
const MODEL = "claude-sonnet-4-6";
const SYSTEM_PROMPT = "Jsi Claude \u2014 AI asistent Nutworld.cz, p\u0159istupovan\u00fd p\u0159es mobiln\u00ed chat.\n\nN\u00ed\u017ee je kompletn\u00ed projektov\u00fd kontext. Dr\u017e se ho.\n\n# CLAUDE.md\n# CLAUDE.md\n\n\u017div\u00fd dokument. Pr\u016fb\u011b\u017en\u011b aktualizuj, udr\u017euj kr\u00e1tk\u00fd a p\u0159ehledn\u00fd.\n\n## Projekt\n- N\u00e1zev: Nutworld automatizace & web\n- Firma: Nutworld.cz \u2014 e-shop s o\u0159echy, su\u0161en\u00fdm ovocem, sem\u00ednky, sladkostmi a d\u00e1rkov\u00fdmi produkty. Produkty p\u0159ebalujeme a vytv\u00e1\u0159\u00edme vlastn\u00ed obaly. Stav\u00edme na kvalit\u011b, designu a originalit\u011b.\n- Klienti firmy: B2C (koncov\u00ed z\u00e1kazn\u00edci), B2B (firmy a korpor\u00e1ty \u2014 firemn\u00ed d\u00e1rky zejm. v\u00e1noce), agentury, priv\u00e1tn\u00ed zna\u010dky\n- Popis: Dva paraleln\u00ed projekty \u2014 (1) Python pipeline pro automatizaci Shoptet export\u016f CZ+SK, (2) Next.js webov\u00e1 aplikace (nutworld-demo.vercel.app)\n- C\u00edl / Vize: Automatizovat rutinn\u00ed procesy (cen\u00edky, popisy produkt\u016f, importy do Shoptetu), \u0161et\u0159it \u010das a umo\u017enit \u0161k\u00e1lov\u00e1n\u00ed sortimentu bez manu\u00e1ln\u00ed pr\u00e1ce. Web jako prodejn\u00ed kan\u00e1l s konfigur\u00e1torem d\u00e1rk\u016f.\n- C\u00edlov\u00e1 skupina: Intern\u00ed n\u00e1stroj \u2014 prim\u00e1rn\u011b zakladatel, p\u0159\u00edpadn\u011b delegace p\u0159es email nebo osobn\u011b\n- Brand t\u00f3n: P\u0159\u00e1telsk\u00fd a hrav\u00fd. Love brand. Autentick\u00fd \u010desk\u00fd hlas, originalita, teplo. \"Veverkov\u00fd\" charakter.\n- Jazyky UI: \u010ce\u0161tina (prim\u00e1rn\u00ed), Sloven\u0161tina (sekund\u00e1rn\u00ed)\n\n## U\u017eivatel\n- Skill level: Pokro\u010dil\u00fd podnikatel, ne v\u00fdvoj\u00e1\u0159\n- Neptej se na technick\u00e9 detaily. Rozhoduj s\u00e1m, vysv\u011btluj jednodu\u0161e. Komunikuj v \u010de\u0161tin\u011b.\n\n## Stack\n\n### Python pipeline (Shoptet automati 0e1ln\u00ed produkty (ne roll-up) \u2014 ka\u017ed\u00fd druh samostatn\u00fd k\u00f3d v Shoptetu\n\n#### S\u00e1\u010dek s kol\u00ed\u010dkem \u2014 pravidla (od 2026-06-07)\n- Gram\u00e1\u017e: **150g**, obsah: jeden produkt nebo roll-up v\u00edce variant\n- Vzorec: `z\u00e1klad = (kg_czk \u00d7 0,15 \u00d7 1,12) + 15 + 10` \u2192 `MO = z\u00e1klad \u00d7 2` \u2192 zaokrouhlit na nejbli\u017e\u0161\u00ed \u010d\u00edslo kon\u010d\u00edc\u00ed 9\n- VO = MO \u00d7 0,8\n- Roll-up produkt: jeden popis se slo\u017een\u00edm v\u0161ech variant, ceny variant individu\u00e1ln\u011b\n- Pozor: varianty \"L\u00edskov\u00e9 o\u0159echy\" \u2014 spr\u00e1vn\u00fd n\u00e1zev je \"L\u00edskov\u00e9 o\u0159echy\", ne \"L\u00edskovce\"\n- V\u017dDY uk\u00e1zat kalkulaci a \u010dekat na potvrzen\u00ed ceny p\u0159ed zm\u011bnou\n\n#### V\u00e1no\u010dn\u00ed s\u00e1\u010dek SOB \u2014 pravidla (od 2026-06-07)\n- Gram\u00e1\u017e: **180g**, obsah: jeden produkt nebo roll-up v\u00edce variant\n- Vzorec: `z\u00e1klad = (kg_czk \u00d7 0,18 \u00d7 1,12) + 5 + 5` \u2192 `MO = z\u00e1klad \u00d7 2` \u2192 zaokrouhlit na nejbli\u017e\u0161\u00ed \u010d\u00edslo kon\u010d\u00edc\u00ed 9\n- VO = MO \u00d7 0,8\n- Roll-up produkt: jeden popis se slo\u017een\u00edm v\u0161ech variant, ceny variant individu\u00e1ln\u011b\n- V\u017dDY uk\u00e1zat kalkulaci a \u010dekat na potvrzen\u00ed ceny p\u0159ed p\u0159id\u00e1n\u00edm\n\n#### D\u00e1rkov\u00e1 kazetka \u2014 pravidla (od 2026-06-05)\n- Gram\u00e1\u017e: **50g**, rozm\u011bry: **200\u00d7100\u00d735 mm** (ploch\u00e1 kraftov\u00e1 krabi\u010dka)\n- Obsah: celof\u00e1nov\u00fd s\u00e1\u010dek s o\u0159echy, p\u0159ev\u00e1zan\u00fd jutovou stu\u017ekou\n- C\u00edlov\u00e1 MO: **69 K\u010d** (mar\u017ee 44\u201349 % podle produktu), VO: **55 K\u010d** (MO\u00d70.8)\n- V\u017dDY uk\u00e1zat kalkulaci a \u010dekat na potvrzen\u00ed ceny p\u0159ed p\u0159id\u00e1n\u00edm do darky.csv\n- V textech: \u0159\u00edkat \"kazetka\" nebo \"d\u00e1re\u010dek\" \u2014 NIKDY \"krabi\u010dka\"\n- Produkty s n\u00e1kupn\u00ed cenou >300 K\u010d/kg nemus\u00ed na 69 K\u010d vyj\u00edt \u2192 individu\u00e1ln\u011b dohodnout\n\n### Canva legislativn\u00ed \u0161t\u00edtky\n- \u0160ablony: \"Vzor AI CZ\" (DAHIpVNxUgM) + \"vzor 105 x 148 SK\" (DAHIsKNI7aU)\n- Element ID mappings jsou ulo\u017eeny v canva-label-generator.py (ELEMENTS_CZ / ELEMENTS_SK)\n- Canva \u00fa\u010det: nov\u00e1 Canva (p\u0159es claude.ai \u2192 Settings \u2192 Integrations)\n- Postup: canva-generator.py \u2192 canva-label-generator.py \u2192 Claude \"Vypl\u0148 Canva \u0161t\u00edtky\"\n- Claude \u010dte canva_jobs.json a pro ka\u017ed\u00fd produkt: copy-design \u2192 fill \u2192 commit\n- Po ka\u017ed\u00e9m \u00fasp\u011b\u0161n\u00e9m commitu: p\u0159idat z\u00e1znam do canva_done.json \u2192 {\"title\": \"...\", \"lang\": \"cz/sk\", \"design_id\": \"...\"}\n- Po dokon\u010den\u00ed V\u0160ECH \u0161t\u00edtk\u016f: spustit `python3 canva_email_report.py` \u2192 po\u0161le email s linky na legislativa@nutworld.cz\n- canva_done.json za\u010d\u00ednat jako [] pokud neexistuje, resetuje se automaticky po odesl\u00e1n\u00ed emailu\n\n### Kategorie HTML popisy (Shoptet CZ + SK)\n\nKa\u017ed\u00e1 kategorie m\u00e1 `description` (nad produkty) a `secondDescription` (pod produkty).\n\n#### Layout podle typu\n- **Hlavn\u00ed kategorie** (O\u0159echy, Su\u0161en\u00e9 ovoce, Sem\u00ednka...): `description` = jen hero blok; `secondDescription` = 6 karet + tagline\n- **Podkategorie** (Mandle, Chia, Ananas...): `description` = hero + H3 intro + odstavec + alergen box; `secondDescription` = 4 karty + tagline\n\n#### Barevn\u00e9 sch\u00e9ma (CZ i SK shodn\u00e9)\n| Skupina | Hero gradient | Akcent / karta linka | Kruh |\n|---------|--------------|----------------------|------|\n| Ovoce / Su\u0161en\u00e9 ovoce | `#6b2f2f \u2192 #8b4040 \u2192 #b05030` | `#da1668` r\u016f\u017eov\u00e1 | `rgba(218,22,104,.15)` |\n| O\u0159echy | `#5c381f \u2192 #83502e \u2192 #a0622a` | `#f7ab31` zlat\u00e1 | `rgba(247,171,49,.15)` |\n| Sem\u00ednka | `#2d5a1b \u2192 #4a7c2f \u2192 #6fa044` | `#6fa044` zelen\u00e1 | `rgba(111,160,68,.2)` |\n| D\u00e1rky | `#7a5200 \u2192 #b8860b \u2192 #c9982e` | `#f7ab31` zlat\u00e1 | `rgba(247,171,49,.15)` |\n| Zast\u0159e\u0161uj\u00edc\u00ed (O\u0159echy a su\u0161en\u00e9 plody) | `#5c381f \u2192 #83502e \u2192 #a0622a` | `#f7ab31` zlat\u00e1 | `rgba(247,171,49,.15)` |\n\nGradient v\u017edy: `linear-gradient(135deg, X 0%, Y 55%, Z 100%)`\n\n#### HTML kon\u0161tanty (plat\u00ed pro v\u0161echny skupiny)\n- `font-family: Arial, sans-serif`\n- Karty: `background:#f1e6da; border:2px solid #c8976a; border-radius:12px; padding:16px 18px`\n- Karta linka: `width:28px; height:2px; border-radius:2px; background:[akcent skupiny]`\n- Karta nadpis: `color` = tmav\u00fd t\u00f3n gradientu (ovoce `#6b2f2f`, o\u0159echy/d\u00e1rky `#5c381f`, sem\u00ednka `#2d5a1b`)\n- Alergen box: `background:#fff5f7; border:1.5px solid #da1668` (v\u017edy v\u00fdstra\u017en\u00e1 r\u016f\u017eov\u00e1)\n- Label nad H2 v hero: barva = akcent skupiny, `font-size:13px; letter-spacing:2px; text-transform:uppercase`\n- Dekorativn\u00ed kruh: `position:absolute; top:-20px; right:-20px; width:140px; height:140px; border-radius:50%`\n\n#### CZ specifika\n- \u010c\u00e1st kategori\u00ed pou\u017e\u00edv\u00e1 **Pobo Page Builder** \u2192 tyto p\u0159esko\u010dit (nelze bezpe\u010dn\u011b editovat)\n- Detekce Pobo: `if 'pobo' in desc[:60].lower(): skip`\n- CZ color-swap script: `/tmp/color_swap_cz.py` (funkce `swap_ovoce`, `swap_orechy`, `swap_seminka`)\n\n### Web aplikace\n- Framework: Next.js (App Router) + TypeScript + React\n- Hosting: Vercel (nutworld-demo.vercel.app \u2192 www.nutworld.cz)\n- Kontejnerizace: Docker (pro lok\u00e1ln\u00ed v\u00fdvoj)\n- Datab\u00e1ze: TODO (dopln\u00ed se v procesu)\n- Auth: TODO\n\n### Meta Ads (Facebook) \u2014 spr\u00e1va kampan\u00ed\n\n#### P\u0159\u00edstup a autentizace\n- **NIKDY nepou\u017e\u00edvat MCP OAuth flow** (`mcp__meta-ads__authenticate`) \u2014 token je ji\u017e nastaven\n- Token: `META_ACCESS_TOKEN` v `.env.local` \u2014 platn\u00fd dlouhodob\u011b\n- P\u0159\u00edm\u00e9 API vol\u00e1n\u00ed p\u0159es `meta_ads.py` nebo inline Python s `requests`\n- V\u017edy: `load_dotenv(\".env.local\")` \u2192 `TOKEN = os.getenv(\"META_ACCESS_TOKEN\")`\n- Base URL: `https://graph.facebook.com/v21.0`\n\n#### \u00da\u010dty\n- CZ: `act_1367393200144` (m\u011bna CZK)\n- SK: `act_1306037980788341` (m\u011bna EUR)\n- Pixel: `2623119374418034` (NutWorld's Pixel)\n\n#### Report (spustit p\u0159\u00edmo)\n```bash\npython3 meta_ads.py 7    # 7denn\u00ed report\npython3 meta_ads.py 30   # 30denn\u00ed report\n```\n\n#### Vytvo\u0159en\u00ed kampan\u011b p\u0159es API\n```python\n# 1. Kampa\u0148 (PAUSED)\ncampaign = api_post(f\"{ACC}/campaigns\", {\n    \"name\": \"DD/MM/YY - ASC (N\u00e1zev)\",\n    \"objective\": \"OUTCOME_SALES\",\n    \"status\": \"PAUSED\",\n    \"buying_type\": \"AUCTION\",\n    \"special_ad_categories\": \"[]\",\n    \"is_adset_budget_sharing_enabled\": \"false\",\n})\n\n# 2. Ad set (PAUSED) \u2014 Advantage+ Shopping\nadset = api_post(f\"{ACC}/adsets\", {\n    \"name\": \"N\u00e1zev ad setu\",\n    \"campaign_id\": campaign[\"id\"],\n    \"optimization_goal\": \"OFFSITE_CONVERSIONS\",\n    \"billing_event\": \"IMPRESSIONS\",\n    \"bid_strategy\": \"LOWEST_COST_WITHOUT_CAP\",\n    \"daily_budget\": \"50000\",  # v hal\u00e9\u0159\u00edch (500 CZK)\n    \"destination_type\": \"WEBSITE\",\n    \"targeting\": json.dumps({\n        \"geo_locations\": {\"countries\": [\"CZ\"]},\n        \"targeting_automation\": {\"advantage_audience\": 1}\n    }),\n    \"promoted_object\": json.dumps({\n        \"pixel_id\": \"2623119374418034\",\n        \"custom_event_type\": \"PURCHASE\"\n    }),\n    \"status\": \"PAUSED\",\n})\n```\n\n#### Pravidla kampan\u00ed\n- Pojmenov\u00e1n\u00ed: `DD/MM/YY - ASC (N\u00e1zev)` nebo `DD/MM/YY - ADV+ (N\u00e1zev)`\n- V\u017edy vytvo\u0159it jako PAUSED \u2014 spustit a\u017e po p\u0159id\u00e1n\u00ed kreativ\n- 5 kreativ na ad set (foto produkt, foto lifestyle, video 15s, karusel, UGC)\n- Ne\u0161ahat do kampan\u011b prvn\u00edch 7 dn\u00ed \u2014 learning phase\n- \u0160k\u00e1lov\u00e1n\u00ed: ROAS >5x \u2192 zdvojn\u00e1sob budget; <3x \u2192 vym\u011b\u0148 kreativy; max +30 %/3\u20134 dny\n- Katalogov\u00e1 kampa\u0148 (ADV+) v\u017edy b\u011b\u017e\u00ed jako z\u00e1klad\n\n#### Revenue metriky\n- Revenue: `action_values` \u2192 typ `offsite_conversion.fb_pixel_purchase`\n- PNO = spend / revenue \u00d7 100 | c\u00edl <20 % | break-even 40 %\n- ROAS = revenue / spend | c\u00edl >5x\n\n### Google Ads \u2014 spr\u00e1va kampan\u00ed\n\n#### P\u0159\u00edstup a autentizace\n- Soubory: `google_ads.py` + `google-ads.yaml`\n- \u00da\u010det pro OAuth: **`nutworld.cz@gmail.com`** (NE claudie! \u2014 ten nem\u00e1 p\u0159\u00edstup k Ads)\n- Refresh token: v `google-ads.yaml` jako `refresh_token`\n- OAuth app: **In Production** (tokeny neexpiruj\u00ed)\n- Spu\u0161t\u011bn\u00ed: `python3 google_ads.py` nebo `python3 google_ads.py 7`\n\n#### Obnova tokenu (pokud expiruje)\n```python\n# 1. Vygeneruj URL bez PKCE\nimport json, urllib.parse\nwith open(\"google_credentials.json\") as f:\n    creds = json.load(f)[\"installed\"]\nparams = {\n    \"response_type\": \"code\", \"client_id\": creds[\"client_id\"],\n    \"redirect_uri\": \"http://localhost:8085/\",\n    \"scope\": \"https://www.googleapis.com/auth/adwords\",\n    \"access_type\": \"offline\", \"prompt\": \"consent\",\n    \"login_hint\": \"nutworld.cz@gmail.com\",\n}\nprint(\"https://accounts.google.com/o/oauth2/auth?\" + urllib.parse.urlencode(params))\n# 2. U\u017eivatel otev\u0159e v anonymn\u00edm okn\u011b, p\u0159ihl\u00e1s\u00ed se jako nutworld.cz@gmail.com\n# 3. Zkop\u00edruje callback URL \u2192 extrahuje code=...\n# 4. Exchange:\nr = requests.post(\"https://oauth2.googleapis.com/token\", data={\n    \"code\": \"<CODE>\", \"client_id\": creds[\"client_id\"],\n    \"client_secret\": creds[\"client_secret\"],\n    \"redirect_uri\": \"http://localhost:8085/\",\n    \"grant_type\": \"authorization_code\",\n})\n# 5. r.json()[\"refresh_token\"] \u2192 zapsat do google-ads.yaml\n```\n\n#### \u00da\u010dty\n- CZ customer_id: `6118016097`\n- SK customer_id: `5523123745`\n- MCC login_customer_id: `6677365733`\n- CPA baseline: 120 K\u010d (c\u00edl <120 K\u010d)\n\n## Pravidla\n\n### Prost\u0159ed\u00ed\n- NIKDY needituj .env \u2014 pou\u017e\u00edvej pouze .env.local\n- Komunikace v chatu: \u010desky\n- K\u00f3d (prom\u011bnn\u00e9, koment\u00e1\u0159e, commity): anglicky\n- Python skripty: spou\u0161t\u011bt lok\u00e1ln\u011b na Macu, bez Dockeru\n- Web projekt: spou\u0161t\u011bt p\u0159es Docker\n\n### Git a commity\n- V\u017edy pracuj na dev branch (nebo feature branch z dev)\n- Nikdy nepushuj p\u0159\u00edmo na main\n- P\u0159ed ka\u017ed\u00fdm commitem a pushem se zeptej u\u017eivatele na potvrzen\u00ed\n- Commit zpr\u00e1vy: anglicky, stru\u010dn\u00e9 (feat: add user auth, fix: resolve CSV encoding)\n- Merge dev \u2192 main: upozorni, \u017ee main = produk\u010dn\u00ed deploy na Vercel\n\n### Produk\u010dn\u00ed m\u00f3d\n- \u017d\u00e1dn\u00e9 destruktivn\u00ed operace bez explicitn\u00edho potvrzen\u00ed\n- V\u017edy upozorni, \u017ee b\u011b\u017e\u00ed produkce\n\n### Knihovny a verze\n- V\u017edy pou\u017e\u00edvej nejnov\u011bj\u0161\u00ed stabiln\u00ed verze\n- P\u0159ed instalac\u00ed ov\u011b\u0159 aktu\u00e1ln\u00ed verzi na internetu (npm, PyPI)\n- Nepou\u017e\u00edvej deprecated bal\u00ed\u010dky\n\n### Testy\n- Nem\u00e1me automatick\u00e9 testy \u2014 ov\u011b\u0159ov\u00e1n\u00ed prob\u00edh\u00e1 p\u0159es Shoptet exporty a datov\u00e9 v\u00fdstupy\n- Postupn\u011b roz\u0161i\u0159ovat o analytiku a statistiky produkt\u016f\n\n### Bezpe\u010dnost\n- U ka\u017ed\u00e9 nov\u00e9 funkce kontroluj: auth, validace vstup\u016f, SQL injection, XSS, CSRF\n- Pokud najde\u
