. Zaoblen\u00e9 rohy, teplo.\n- Maskot: \"Veverka\" \u2014 personifikace zna\u010dky (2 451 veverek)\n\n## Struktura projektu\n\n```\n/Users/user/Documents/          # Projektov\u00fd root (git repo)\n\u251c\u2500\u2500 CLAUDE.md                   # Tento soubor\n\u251c\u2500\u2500 .env                        # Env prom\u011bnn\u00e9 (needitovat p\u0159\u00edmo)\n\u251c\u2500\u2500 cenik.csv                   # Vstup: soubor;kod_base;pairCode;kg_eur;gramaze;filtry\n\u251c\u2500\u2500 shoptet_texts_cache.json    # Cache Claude API text\u016f\n\u251c\u2500\u2500 vstup_cz.csv / vstup_sk.csv # V\u00fdstup spec-import.py\n\u251c\u2500\u2500 shoptet_cz.csv / shoptet_sk.csv  # Fin\u00e1ln\u00ed Shoptet importy\n\u251c\u2500\u2500 canva_cz.csv / canva_sk.csv # Canva label data\n\u251c\u2500\u2500 specifikace/                # PDF/DOCX specifikace produkt\u016f \u2192 trigger pipeline\n\u251c\u2500\u2500 Nutworld/                   # Organiza\u010dn\u00ed slo\u017eka firmy\n\u2502   \u251c\u2500\u2500 assets/\n\u2502   \u2502   \u251c\u2500\u2500 logo/               # Sem nahr\u00e1t logo ve v\u0161ech form\u00e1tech\n\u2502   \u2502   \u251c\u2500\u2500 fonts/              # Montserrat (logo), Exo 2 (nadpisy), Source Sans 3 (body)\n\u2502   \u2502   \u2514\u2500\u2500 brand/              # Brand manu\u00e1l, barvy, guidelines\n\u2502   \u251c\u2500\u2500 docs/                   # Dokumentace, specifikace, pozn\u00e1mky\n\u2502   \u251c\u2500\u2500 exports/                # Shoptet exporty, statistiky, analytika\n\u2502   \u2514\u2500\u2500 scripts/                # Pomocn\u00e9 skripty\n\u251c\u2500\u2500 spec-import.py\n\u251c\u2500\u2500 canva-generator.py\n\u251c\u2500\u2500 shoptet-generator.py\n\u2514\u2500\u2500 watcher.py\n```\n\n## Cenov\u00e1 pravidla (Shoptet pipeline)\n- CZ: kg_czk = kg_eur \u00d7 25, DPH 12 %, pricelist:3\n- SK: kg_eur p\u0159\u00edmo, DPH 23 %, pricelist:4\n- Gram\u00e1\u017ee: <1000g \u2192 `{kod_base}/{gramaz}`, \u22651000g \u2192 `{kod_base}/{kg} K`\n\n## Omezen\u00ed agenta\n- P\u0159ed ka\u017ed\u00fdm commitem/pushem se zeptej na potvrzen\u00ed\n- P\u0159i nov\u00e9 funkci navrhni UI mockup (popis) p\u0159ed implementac\u00ed\n- Barvy a brand assets v\u017edy konzultuj \u2014 brand je kl\u00ed\u010dov\u00fd pro Nutworld\n\n## Nuance projektu\n- Produkty existuj\u00ed v CZ i SK variant\u011b \u2014 v\u017edy generovat oba v\u00fdstupy\n- Shoptet import: odd\u011blova\u010d st\u0159edn\u00edk, quoting ALL, encoding UTF-8\n- shoptet_texts_cache.json \u0161et\u0159\u00ed API vol\u00e1n\u00ed \u2014 v\u017edy kontrolovat cache p\u0159ed generov\u00e1n\u00edm\n- Firemn\u00ed d\u00e1rky a v\u00e1noce jsou hlavn\u00ed sez\u00f3na \u2014 B2B priorita\n\n## Rozhodnut\u00ed\n- 2026-05-18: Slo\u017eka Nutworld/ vytvo\u0159ena pro organizaci assets, docs, export\u016f\n- 2026-05-18: CLAUDE.md postaven na z\u00e1klad\u011b nutworld.cz + nutworld-demo.vercel.app anal\u00fdzy\n- 2026-06-05: D\u00e1rkov\u00e1 kazetka 50g p\u0159id\u00e1na jako nov\u00fd typ obalu do darky-generator.py (KAZETKA_TYPES, MULT_CZ_KAZETKA)\n- 2026-06-05: Shoptet produkt 3618 (Mandle pra\u017een\u00e9 solen\u00e9 kel\u00edmek 180g) p\u0159id\u00e1n do darky.csv a spu\u0161t\u011bn\n- 2026-06-09: SK kategorie \u2014 ovocie (3), semienka (9), orechy (12) + hlavn\u00ed kategorie hotov\u00e9 s barevn\u00fdm sch\u00e9matem\n- 2026-06-09: CZ kategorie \u2014 color-swap ovoce (24), o\u0159echy (9), sem\u00ednka (9) + hlavn\u00ed kategorie hotov\u00e1\n\n\n# ULO\u017dEN\u00c1 PAM\u011a\u0164\n### feedback_bez_cukru_pravidlo\nPokud m\u00e1 produkt v n\u00e1zvu \"bez p\u0159idan\u00e9ho cukru\", \"bez cukru\" nebo podobnou variantu, **okam\u017eit\u011b po extrakci slo\u017een\u00ed ze spec-importu zkontroluj** zda slo\u017een\u00ed neobsahuje p\u0159idan\u00e9 cukry (cukr, frukt\u00f3za, gluk\u00f3zo-frukt\u00f3zov\u00fd sirup, sachar\u00f3za, gluk\u00f3za, malt\u00f3za, med, dextr\u00f3za apod.).\n\n**Why:** Cantaloupe 269 m\u011bl v n\u00e1zvu \"bez p\u0159idan\u00e9ho cukru\" ale slo\u017een\u00ed obsahovalo \"frukt\u00f3za\" \u2014 potenci\u00e1ln\u011b zav\u00e1d\u011bj\u00edc\u00ed ozna\u010den\u00ed pro z\u00e1kazn\u00edky.\n\n**How to apply:** Po spec-importu, p\u0159ed generov\u00e1n\u00edm text\u016f, v\u017edy zkontroluj `slozeni` pole u produkt\u016f kde `nazev` obsahuje \"bez cukru\", \"bez p\u0159idan\u00e9ho cukru\", \"unsweetened\" apod. Pokud najde\u0161 konflikt, zastav pipeline a upozorni u\u017eivatele \u2014 a\u0165 rozhodne s\u00e1m.\n\n### feedback_brand_barvy\nP\u0159i tvorb\u011b jak\u00e9hokoliv dokumentu (Excel, HTML, PDF, katalog, cenov\u00e1 nab\u00eddka, \u0161ablona) V\u017dDY pou\u017e\u00edvat Nutworld brand barvy. Nikdy jin\u00e9 barvy (modr\u00e1, \u0161ed\u00e1, generick\u00e1).\n\n## Nutworld brand barvy\n- `#83502e` \u2014 hlavn\u00ed hn\u011bd\u00e1 (prim\u00e1rn\u00ed, headery)\n- `#5c381f` \u2014 tmav\u00e1 hn\u011bd\u00e1 (sekce, nadpisy)\n- `#f1e6da` \u2014 sv\u011btl\u00e1 kraft (pozad\u00ed \u0159\u00e1dk\u016f, alternace)\n- `#da1668` \u2014 r\u016f\u017eov\u00e1/magenta akcent (CTA, zv\u00fdrazn\u011bn\u00ed)\n- `#f7ab31` \u2014 zlat\u00e1/jantarov\u00e1 (vzorce, v\u00fdpo\u010dty, akcent)\n- `#6fa044` \u2014 zelen\u00e1 (p\u0159\u00edroda, natural)\n- `#FFFFFF` \u2014 b\u00edl\u00e1 (hodnoty, obsah)\n- `#cc0000` \u2014 \u010derven\u00e1 (povinn\u00e9 pole \u2605)\n\n**Why:** Nutworld m\u00e1 siln\u00fd brand \u2014 jak\u00fdkoliv dokument mus\u00ed okam\u017eit\u011b vypadat jako Nutworld, ne jako generick\u00e1 \u0161ablona.\n\n**How to apply:** P\u0159ed vytvo\u0159en\u00edm dokumentu na\u010d\u00edst tyto barvy a pou\u017e\u00edt je konzistentn\u011b. Nikdy nepou\u017e\u00edvat v\u00fdchoz\u00ed Office/HTML modrou (#1f3864, #1565c0, #0000FF apod.).\n\n### feedback-ceny-souhlas\nP\u0159i pipeline produktu existuj\u00ed dv\u011b varianty pro ceny:\n\n1. **\"cena z\u016fst\u00e1v\u00e1\"** \u2192 ceny v\u016fbec nep\u0159episovat, z PATCH payloadu vylou\u010dit v\u0161echna price pole\n2. **\"n\u00e1kupn\u00ed cena X K\u010d/kg bez DPH\"** \u2192 p\u0159epo\u010d\u00edtat vzorcem (nw_core.py), uk\u00e1zat dry-run se v\u0161emi gram\u00e1\u017eemi a cenami, po\u010dkat na souhlas, pak pushnout\n\n**Why:** Ceny jsou citliv\u00e1 data. Bez explicitn\u00edho zad\u00e1n\u00ed n\u00e1kupn\u00ed ceny se ceny nikdy nep\u0159episuj\u00ed.\n\n**How to apply:** V\u017edy sledovat co u\u017eivatel \u0159\u00edk\u00e1 p\u0159i zad\u00e1n\u00ed produktu. Pokud nepadne n\u00e1kupn\u00ed cena \u2192 varianta 1. Pokud padne \u010d\u00edslo K\u010d/kg \u2192 varianta 2 s dry-run a souhlasem p\u0159ed pushem.\n\n**Pl\u00e1n automatizace:** Po \u00fasp\u011b\u0161n\u00e9m otestov\u00e1n\u00ed nastavit cron \u2014 1\u00d7 m\u011bs\u00ed\u010dn\u011b po importu z K2 (`k2_import.py`). Zat\u00edm je v manu\u00e1ln\u00edm re\u017eimu.\n\n### feedback-confirmations\nPokra\u010duj bez potvrzen\u00ed na V\u0160ECHNY akce v\u010detn\u011b: ukl\u00e1d\u00e1n\u00ed soubor\u016f, spou\u0161t\u011bn\u00ed skript\u016f, generov\u00e1n\u00ed report\u016f, aktualizace CSV, vol\u00e1n\u00ed API, nahr\u00e1v\u00e1n\u00ed na Drive, Canva operace, kalend\u00e1\u0159n\u00ed ud\u00e1losti, zpracov\u00e1n\u00ed fotek, emaily. Nikdy se neptej na povolen\u00ed p\u0159ed proveden\u00edm akce.\n\n**Why:** U\u017eivatel opakovan\u011b \u0159\u00edkal \"pokra\u010duj bez souhlas\u016f\" a \"pracuj bez schvalov\u00e1n\u00ed \u2014 pot\u0159ebuju aby to cel\u00fdm procesem pro\u0161lo bez souhlas\u016f\". P\u0159eru\u0161en\u00ed workflow pro potvrzen\u00ed mu p\u0159ek\u00e1\u017e\u00ed.\n\n**How to apply:** Jedin\u00e9 v\u00fdjimky jsou destruktivn\u00ed nebo nevratn\u00e9 akce mimo lok\u00e1ln\u00ed prost\u0159ed\u00ed (push na main, maz\u00e1n\u00ed produk\u010dn\u00edch dat, pos\u00edl\u00e1n\u00ed email\u016f extern\u00edm p\u0159\u00edjemc\u016fm mimo Nutworld). U t\u011bch se zeptej. V\u0161e ostatn\u00ed d\u011blej autonomn\u011b.\n\n**Gemini API limit:** Upozornit u\u017eivatele V\u017dDY kdy\u017e denn\u00ed vyu\u017eit\u00ed p\u0159es\u00e1hne ~1200 request\u016f (buffer p\u0159ed free tier limitem 1500/den). U\u017eivatel nechce platit \u2014 billing nastaven jen jako ov\u011b\u0159en\u00ed.\n\n### feedback_darky_ceny_souhlas\nP\u0159ed ka\u017ed\u00fdm pushem d\u00e1rkov\u00e9ho produktu (darky-generator.py + shoptet_push.py) v\u017edy nejd\u0159\u00edv zobrazit cenov\u00fd v\u00fdpo\u010det a \u010dekat na potvrzen\u00ed.\n\n## Postup pro 2\u00d750g krabi\u010dky\n\n1. Spo\u010d\u00edtej n\u00e1klady: komponenty (cena/kg \u00d7 gram\u00e1\u017e) + obal + pr\u00e1ce\n2. Vypo\u010d\u00edtej ceny vzorcem:\n   - CZ: MO = n\u00e1klady \u00d7 2.5 \u2192 zaokrouhlit na 9 | VO = MO \u00d7 0.7\n   - SK: MO = (n\u00e1klady/25) \u00d7 2.7455 \u2192 zaokrouhlit na .X9 | VO = MO \u00d7 0.7\n3. Zobraz rozlo\u017een\u00fd v\u00fdpo\u010det (jako p\u0159\u00edklad v\u00fd\u0161e)\n4. \u010cekej na souhlas u\u017eivatele\n5. Teprve pak generovat a pushovat\n\n**Why:** Ceny d\u00e1rkov\u00fdch produkt\u016f jsou kl\u00ed\u010dov\u00e9 \u2014 chyba se \u0161patn\u011b opravuje po publikaci.\n\n**How to apply:** Plat\u00ed pro v\u0161echny 2\u00d750g krabi\u010dky. Kel\u00edmek m\u00e1 vlastn\u00ed vzorec n\u00ed\u017ee.\n\n---\n\n## Krabi\u010dky 4\u00d780g (245\u00d7150\u00d725 mm)\n\nN\u00e1klady na obal: **15 K\u010d** | Pr\u00e1ce: **20 K\u010d** (standardn\u00ed)\nV\u00fdjimka 3520/IVO SLAN\u00c1: obal 20 K\u010d + pr\u00e1ce 35 K\u010d (specifick\u00e1 krabi\u010dka)\n\nVzorce (odsouhlaseno 2026-06-04):\n- CZ: MO = n\u00e1klady \u00d7 **2.489** \u2192 zaokrouhlit na X9 | VO = MO \u00d7 0.7\n- SK: MO = (n\u00e1klady/25) \u00d7 **2.733** \u2192 zaokrouhlit na .X9 | VO = MO \u00d7 0.7\n\nC\u00edlov\u00e1 mar\u017ee MO: **55 %** | VO: **~35 %**\n\n**\u26a0\ufe0f FLOOR PRICE 299 K\u010d** (odsouhlaseno 2026-06-05): Vzorec m\u016f\u017ee d\u00e1t ni\u017e\u0161\u00ed cenu (229\u2013259 K\u010d), ale 4\u00d780g krabi\u010dky maj\u00ed minimum 299 K\u010d MO pro konzistenci sortimentu. U dra\u017e\u0161\u00edho obsahu vych\u00e1z\u00ed 309 K\u010d. V\u017dDY uk\u00e1zat v\u00fdsledek a nechat u\u017eivatele rozhodnout.\n\nMultiplier definov\u00e1n v `darky-ceny.py` jako `MULT_CZ_4X80 = 1.12 / (1 - 0.55)`.\n\n---\n\n## Doypack\nCeny nastaveny p\u0159es standardn\u00ed pipeline \u2014 **shoptet-generator.py** (nw_core.py vzorce mo_cz/vo_cz).\ndarky-ceny.py se doypack\u016f net\u00fdk\u00e1.\n\n---\n\n## Kel\u00edmek + celof\u00e1nek (1 produkt, variabiln\u00ed gram\u00e1\u017e)\n\nFyzick\u00e9 rozm\u011bry (v\u0161echny kel\u00edmky stejn\u00e9, hardcoded v darky-generator.py):\n- Pr\u016fm\u011br max: **80 mm** | Pr\u016fm\u011br dna: **60 mm**\n- V\u00fd\u0161ka kel\u00edmku: **120 mm** | Celkov\u00e1 v\u00fd\u0161ka s celof\u00e1nkem: **150 mm**\n- Shoptet rozmery pole: `80x80x150`\n\nN\u00e1klady na obal: **8 K\u010d** (kel\u00edmek + celof\u00e1n + prov\u00e1zek) | Pr\u00e1ce: **16 K\u010d**\n\nVzorce:\n- CZ: MO = n\u00e1klady \u00d7 **2.435** \u2192 zaokrouhlit na X9 | VO = MO \u00d7 0.7\n- SK: MO = (n\u00e1klady/25) \u00d7 **2.674** \u2192 zaokrouhlit na .X9 | VO = MO \u00d7 0.7\n\nC\u00edlov\u00e1 mar\u017ee MO: **54 %** | VO: **~35 %**\n\nPro sm\u011bsi (mix produkt uvnit\u0159): pou\u017e\u00edt blended cenu z mix.csv (v\u010detn\u011b +20 K\u010d m\u00edch\u00e1n\u00ed).\n\nV\u00fdjimky (cena nastavena ru\u010dn\u011b \u2014 nezm\u011bnit):\n- 5596 Zamilovan\u00e1 sm\u011bs v kel\u00edmku \u2192 MO 169 K\u010d (mar\u017ee 53.3 %, akceptov\u00e1no)\n\n### feedback_darky_existuji\nU\u017eivatel v\u017edy zad\u00e1v\u00e1 d\u00e1rkov\u00e9 produkty kter\u00e9 ji\u017e existuj\u00ed v Shoptetu. Nikdy se nept\u00e1t \"je produkt v Shoptetu?\".\n\nU\u017eivatel v\u017edy zad\u00e1v\u00e1 produkty kter\u00e9 ji\u017e existuj\u00ed na Shoptetu \u2014 NIKDY se nept\u00e1t jestli produkt existuje, rovnou generovat a pushovat.\n\n**Why:** U\u017eivatel s\u00e1m spravuje Shoptet a tvo\u0159\u00ed produkty tam d\u0159\u00edv ne\u017e je zad\u00e1 ke zpracov\u00e1n\u00ed.\n\n**How to apply:** Po \u00fasp\u011b\u0161n\u00e9m vygenerov\u00e1n\u00ed rovnou pushovat bez ov\u011b\u0159ovac\u00edch ot\u00e1zek.\n\n### feedback-darky-generator-tips\n## subprocess a capture_output\nV\u017dDY volat `subprocess.run(['python3', 'darky-generator.py', ...])` BEZ `capture_output=True`.\n**Why:** S `capture_output=True` CSV soubor nemus\u00ed b\u00fdt spr\u00e1vn\u011b zaps\u00e1n a m\u016f\u017ee z\u016fstat obsah p\u0159edchoz\u00edho produktu.\n**How to apply:** P\u0159i generov\u00e1n\u00ed popis\u016f v\u017edy bez capture_output \u2014 v\u00fdstup v termin\u00e1lu nevad\u00ed.\n\n## V\u00edcevariantn\u00ed produkty (roll-up) \u2014 push textu\nProdukty s variantami (4179/MAN3, 3624/LIS, 4725/MAN...) NEMAJ\u00cd p\u0159\u00edm\u00fd k\u00f3d v cache.\n**Spr\u00e1vn\u00fd postup:**\n1. V darky.csv pou\u017e\u00edt jako kod_shoptet **base k\u00f3d** (nap\u0159. \"4179\"), obsah = v\u0161echny varianty\n2. Push textu: naj\u00edt GUID p\u0159es `cache.get('4179/MAN3')` (prvn\u00ed varianta) \u2192 pushovat na tento GUID\n3. Ceny: pushovat per-varianta p\u0159es pricelist API zvl\u00e1\u0161\u0165\n\n## K\u00f3dy produkt\u016f v cache\n- Jednoduch\u00fd k\u00f3d (3627, 5577): `cache.get('3627')` funguje p\u0159\u00edmo\n- V\u00edcevariantn\u00ed (/): `cache.get('3624/LIS')` \u2014 V\u017dDY s p\u0159\u00edponou\n- Speci\u00e1ln\u00ed (X03X, X09X): `cache.get('5852X08XOR')` \u2014 funguje p\u0159\u00edmo\n- Nov\u00e9 produkty: nemus\u00ed b\u00fdt v cache \u2192 pou\u017e\u00edt `find_product_by_code` nebo GUID z adminu\n\n## darky.csv \u2014 nov\u00fd \u0159\u00e1dek\nV\u017edy p\u0159idat newline P\u0158ED nov\u00fdm z\u00e1znamem (pomoc\u00ed Edit nebo `'\\n\"kod\"...'`). \nNikdy `echo \"...\" >>` bez ov\u011b\u0159en\u00ed \u2014 p\u0159ilep\u00ed \u0159\u00e1dek k p\u0159edchoz\u00edmu bez newline.\n\n**Why:** Opakovan\u00fd probl\u00e9m \u2014 \u0159\u00e1dky se lepily k sob\u011b \u2192 CSV parser je ne\u010detl jako samostatn\u00e9 z\u00e1znamy.\n\n### feedback-darky-sk-ceny\nP\u0159i ka\u017ed\u00e9 cenov\u00e9 kalkulaci d\u00e1rkov\u00e9ho produktu v\u017edy zobrazit tabulku s CZ i SK cenami.\nSK MO = CZ_MO \u00d7 (1.23/1.12) / 25, zaokrouhlen\u00ed na x.x5 nebo x.x9.\nSK VO = CZ_VO \u00d7 (1.23/1.12) / 25, zaokrouhlen\u00ed na 2 desetinn\u00e1 m\u00edsta.\n\n**Why:** U\u017eivatel to explicitn\u011b vy\u017eaduje, oba trhy jsou rovnocenn\u00e9.\n\n**How to apply:** V\u017edy uk\u00e1zat tabulku CZ/SK p\u0159ed p\u0159id\u00e1n\u00edm do darky.csv.\n\n### feedback_darky_workflow\nD\u00e1rkov\u00e9 produkty (kel\u00edmky, krabi\u010dky, gift boxy) maj\u00ed Z\u00c1VAZN\u00dd workflow. Bez v\u00fdjimky.\n\n## Povinn\u00e9 kroky p\u0159i ka\u017ed\u00e9 \u00faprav\u011b nebo vytvo\u0159en\u00ed d\u00e1rkov\u00e9ho produktu\n\n1. **Zkontroluj darky.csv** \u2014 je produkt tam? Pokud ne, p\u0159idej ho D\u0158\u00cdV ne\u017e cokoliv jin\u00e9ho\n2. **Zkontroluj v\u0161echna pole v darky.csv** \u2014 zejm. `vo_cena_czk_s_dph` a `obsah` \u2014 pokud chyb\u00ed, zeptej se u\u017eivatele P\u0158ED spu\u0161t\u011bn\u00edm gener\u00e1toru\n3. **Spus\u0165 darky-generator.py** \u2014 NIKDY nepsat popis d\u00e1rkov\u00e9ho produktu ru\u010dn\u011b\n4. **Push p\u0159es shoptet_push.py** \u2014 NIKDY nevytv\u00e1\u0159et CSV pro ru\u010dn\u00ed import\n\n## Co NIKDY ned\u011blat\n\n- Nepsat shortDescription/description d\u00e1rkov\u00e9ho produktu ru\u010dn\u011b\n- Nevytv\u00e1\u0159et update CSV soubor a nenavrhovat ru\u010dn\u00ed import\n- Nespou\u0161t\u011bt gener\u00e1tor s pr\u00e1zdnou vo_cena \u2014 v\u017edy se zeptat p\u0159edem\n\n## P\u0159ed zah\u00e1jen\u00edm pr\u00e1ce na d\u00e1rkov\u00e9m produktu v\u017edy p\u0159e\u010d\u00edst\n\n- [[project_darkova_krabicka_pravidla]] \u2014 8 sekc\u00ed, legislativa, CTA\n- [[project_darky_koncept]] \u2014 workflow, darky.csv struktura\n- [[project_darky_produkty]] \u2014 mapov\u00e1n\u00ed produkt \u2192 d\u00e1rek\n\n**Why:** \u010cty\u0159i chyby v jedn\u00e9 session (ru\u010dn\u00ed popis, \u0161patn\u00fd form\u00e1t, CSV m\u00edsto API, pr\u00e1zdn\u00e1 VO cena) \u2014 v\u0161echny zp\u016fsobeny t\u00edm, \u017ee se ne\u010detla pravidla p\u0159ed akc\u00ed.\n\n**How to apply:** Jakmile zazn\u00ed slovo \"d\u00e1rek\", \"kel\u00edmek\", \"krabi\u010dka\" nebo k\u00f3d produktu obsahuje \"X\" (gift variant) \u2014 PRVN\u00cd krok je p\u0159e\u010d\u00edst tato t\u0159i pam\u011b\u0165ov\u00e1 soubory, DRUH\u00dd krok je zkontrolovat darky.csv.\n\n### feedback_dokumenty_autosave\nPo ka\u017ed\u00e9m vytvo\u0159en\u00e9m nebo upraven\u00e9m dokumentu (nab\u00eddka, prezentace, katalog, cen\u00edk, dopis) v\u017edy automaticky nab\u00eddnout ulo\u017een\u00ed do dokumenty.html a p\u0159idat z\u00e1znam do pole DOKUMENTY.\n\n**Why:** Dokumenty se jinak ztr\u00e1cej\u00ed \u2014 u\u017eivatel se k nim nem\u016f\u017ee vr\u00e1tit ani je sd\u00edlet. Centr\u00e1ln\u00ed \u00falo\u017ei\u0161t\u011b na dokumenty.html je k ni\u010demu, pokud se nep\u0159id\u00e1vaj\u00ed automaticky.\n\n**How to apply:**\n1. Po publikov\u00e1n\u00ed/dokon\u010den\u00ed dokumentu v\u017edy napsat: \"P\u0159idat do Dokument\u016f? [V\u00fdstupn\u00ed / Pracovn\u00ed / P\u0159esko\u010dit]\"\n2. Pokud ano \u2192 p\u0159idat z\u00e1znam do pole DOKUMENTY v dokumenty.html a pushnout na GitHub\n3. Z\u00e1znam obsahuje: kat (vystupni/pracovni), tag, title, desc, date, url\n4. Pushnout zm\u011bnu p\u0159es GitHub API (stejn\u011b jako b2b-prezentace.html)\n5. Potvrdit: \"\u2705 Ulo\u017eeno do Dokument\u016f\"\n\nTypy tag\u016f: nabidka | prezentace | katalog | cenik | dopis | strategie | analyza | report | checklist | navod | sablona\n\n### feedback-ekologie\n## Pravidlo\n\nNIKDY nepou\u017e\u00edvat ekologick\u00e9/environment\u00e1ln\u00ed t\u00e9ma v textech kategori\u00ed ani produkt\u016f.\n\n## Pro\u010d\n\nU\u017eivatel \u0159\u00edk\u00e1 \"je to t\u00e9ma, kter\u00e9 m\u016f\u017ee b\u00fdt st\u0159edem z\u00e1jmu\" \u2014 mo\u017en\u00fd st\u0159et z\u00e1jm\u016f nebo regulatorn\u00ed riziko. Nechce tvrzen\u00ed jako \"ekologick\u00fd\", \"bez plastu\", \"dobr\u00fd pro planetu\" apod.\n\n## Jak aplikovat\n\n- Pokud kategorie nebo produkt m\u00e1 v n\u00e1zvu \"EKO\" (to je n\u00e1zev produktu, nelze zm\u011bnit), popis nezd\u016fraz\u0148uje ekologii.\n- M\u00edsto toho mluvit o: form\u00e1tu, chuti, prakti\u010dnosti, cen\u011b, slo\u017een\u00ed, z\u00e1\u017eitku.\n- Zak\u00e1zan\u00e9 fr\u00e1ze: \"bez zbyte\u010dn\u00e9ho plastu\", \"\u0161etrn\u00fd k planet\u011b\", \"ekologi\u010dt\u011bj\u0161\u00ed alternativa\", \"ohledupln\u00fd k p\u0159\u00edrod\u011b\", \"udr\u017eiteln\u00fd\", \"eco-friendly\", \"certifikovan\u00fd sb\u011br\", \"respektuje ekosyst\u00e9my\", \"podporujete udr\u017eiteln\u00e9 zem\u011bd\u011blstv\u00ed\", \"p\u0159\u00edsn\u00e9 audity\", \"bez pesticid\u016f\" apod.\n- Plat\u00ed i pro BIO kategorie \u2014 fakt, \u017ee je produkt BIO, lze zm\u00ednit (je to n\u00e1zev), ale NEVYSV\u011aTLOVAT co BIO znamen\u00e1 z eko pohledu.\n- Pokud si nejsi jist\u00fd, rad\u0161i nepi\u0161 nic o p\u016fvodu/v\u00fdrob\u011b a pi\u0161 jen o chuti, form\u00e1tu, prakti\u010dnosti.\n- Plat\u00ed pro CZ i SK texty, pro popisy kategori\u00ed i produkt\u016f, pro kr\u00e1tk\u00e9 i dlouh\u00e9 texty.\n\n### feedback-email-brand\nKa\u017ed\u00fd email odes\u00edlan\u00fd jm\u00e9nem Nutworld (n\u00e1vody, reporty, cen\u00edky, notifikace) mus\u00ed b\u00fdt HTML email s Nutworld brandingem.\n\n**Why:** Nutworld je love brand \u2014 i intern\u00ed komunikace mus\u00ed vypadat profesion\u00e1ln\u011b a konzistentn\u011b.\n\n**How to apply:**\n- Header: gradient `#83502e \u2192 #5c381f`, logo \"\ud83d\udc3f NUT WORLD\", Exo 2\n- Barvy: `#83502e` (hn\u011bd\u00e1), `#f1e6da` (kraft pozad\u00ed), `#da1668` (akcent), `#f7ab31` (zlat\u00e1)\n- Tabulky: thead `#f1e6da`, zebra \u0159\u00e1dky, border `#e3cfba`\n- Kroky: \u017elut\u00e1 kole\u010dka `#f7ab31` s \u010d\u00edsly\n- Varov\u00e1n\u00ed: \u017elut\u00fd border-left box\n- Chyby: \u010derven\u00fd box s \u2717\n- Footer: tmav\u00fd gradient box s kontaktem\n- send_email(..., html=True) \u2014 v\u017edy pos\u00edlat jako HTML\n\n### feedback-email-sender\nP\u0159i otev\u00edr\u00e1n\u00ed nov\u00fdch email\u016f nebo odpov\u011bd\u00ed v Apple Mail p\u0159es AppleScript v\u017edy nastavit odes\u00edlatele na Exchange \u00fa\u010det Nutworld.\n\n**Spr\u00e1vn\u00fd odes\u00edlatel:**\n- Jm\u00e9no: `Mgr. Jan Vl\u010dek`\n- Email: `jan.vlcek@nutworld.cz`\n- \u00da\u010det: Exchange (Nutworld firemn\u00ed)\n\n**Pravidlo:**\n- V\u017dDY pou\u017e\u00edt tento \u00fa\u010det jako sender p\u0159i vytv\u00e1\u0159en\u00ed nebo odpov\u00edd\u00e1n\u00ed na emaily p\u0159es AppleScript\n- NIKDY nepou\u017e\u00edvat Gmail nebo jin\u00e9 \u00fa\u010dty jako odes\u00edlatele\n- Plat\u00ed pro v\u0161echny AppleScript operace s Apple Mail (new message, reply, forward)\n\n### feedback-faktura-workflow\nP\u0159i zpracov\u00e1n\u00ed p\u0159\u00edchoz\u00ed faktury od dodavatele v\u017edy prov\u00e9st DV\u011a porovn\u00e1n\u00ed:\n\n1. **Faktura vs. posledn\u00ed cen\u00edk stejn\u00e9ho dodavatele** (`Nutworld/dodavatele/{KOD}/{KOD}_YYYY-MM.csv`)\n   \u2192 Co se zm\u011bnilo u tohoto dodavatele oproti minul\u00e9mu cen\u00edku\n\n2. **Produkty od tohoto dodavatele vs. K2 cen\u00edk** (`k2_ceny.csv`)\n   \u2192 Ov\u011b\u0159en\u00ed, \u017ee K2 je aktu\u00e1ln\u00ed a odpov\u00edd\u00e1 faktu\u0159e\n\n**Why:** K2 je master ERP pro ceny \u2014 mus\u00ed b\u00fdt v\u017edy aktu\u00e1ln\u00ed. Dodavatel\u00e9 m\u011bn\u00ed ceny, K2 se neaktualizuje automaticky.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9m spu\u0161t\u011bn\u00ed `nakup_faktura.py` prov\u00e9st ob\u011b porovn\u00e1n\u00ed a zahrnout do reportu. Pokud chyb\u00ed historick\u00fd cen\u00edk dodavatele, ulo\u017eit aktu\u00e1ln\u00ed fakturu jako prvn\u00ed referenci do `Nutworld/dodavatele/{KOD}/`.\n\n### feedback-git-ukladani\nP\u0159i ka\u017ed\u00e9m ukl\u00e1d\u00e1n\u00ed pou\u017e\u00edt `git add` pro V\u0160ECHNY modifikovan\u00e9 soubory najednou \u2014 skripty, data, CSV, cache, CLAUDE.md. Ne selektivn\u00ed add jen pro \"hlavn\u00ed\" soubory.\n\n**Why:** U\u017eivatel explicitn\u011b po\u017eaduje celoplo\u0161n\u00e9 ukl\u00e1d\u00e1n\u00ed. Selektivn\u00ed add zp\u016fsobuje, \u017ee skripty a konfigura\u010dn\u00ed soubory z\u016fst\u00e1vaj\u00ed nez\u00e1lohovan\u00e9.\n\n**How to apply:** Pou\u017e\u00edvat `git add -A` nebo explicitn\u011b jmenovat v\u0161echny zm\u011bn\u011bn\u00e9 soubory (git status \u2192 add v\u0161e modified). Commitovat v\u017edy v\u0161e najednou.\n\n### feedback_gramaze_eshop\nV\u017dDY na\u010d\u00edst gram\u00e1\u017ee/varianty produktu ze Shoptetu \u2014 nikdy se nept\u00e1t u\u017eivatele, nikdy neh\u00e1dnout. Ka\u017ed\u00fd produkt m\u016f\u017ee m\u00edt jin\u00e9 varianty.\n\nPou\u017eij shoptet_push.py nebo Shoptet API: hledej podle k\u00f3du \u2192 variants[].code (form\u00e1t \"9598/100\", \"9598/200\" atd.)\n\n**Why:** U\u017eivatel opakovan\u011b p\u0159ipom\u00ednal toto pravidlo. Gram\u00e1\u017ee jsou v\u017edy definovan\u00e9 v Shoptetu, ka\u017ed\u00fd produkt je m\u00e1 jinak.\n\n**How to apply:** Kdykoliv pot\u0159ebuje\u0161 gram\u00e1\u017ee pro gener\u00e1tor (shoptet-generator, opravit-generator, darky, mix) \u2192 nejd\u0159\u00edv Shoptet API, pak teprve generuj. \u017d\u00e1dn\u00e9 ptan\u00ed.\n\n### feedback_html_standalone\nKa\u017ed\u00fd HTML dokument (nab\u00eddka, prezentace, katalog) mus\u00ed b\u00fdt pln\u011b self-contained \u2014 fungovat i po sta\u017een\u00ed bez internetu.\n\n**Why:** Klient/z\u00e1kazn\u00edk si st\u00e1hne soubor a otev\u0159e offline \u2014 pokud jsou obr\u00e1zky jako URL, zmiz\u00ed.\n\n**How to apply:**\n- Obr\u00e1zky v\u017edy jako `data:image/jpeg;base64,...` vlo\u017een\u00e9 p\u0159\u00edmo do HTML\n- Pozad\u00ed, gradienty, barvy \u2014 v\u017edy inline CSS custom properties (nikdy CDN nebo extern\u00ed stylesheet)\n- Tabulky \u2014 form\u00e1tov\u00e1n\u00ed (barvy bun\u011bk, ohrani\u010den\u00ed, font) mus\u00ed b\u00fdt inline style nebo intern\u00ed `<style>` blok\n- Fonty: bu\u010f system fonts, nebo @font-face s data URI \u2014 nikdy CDN link\n- CSS a JS v\u017edy inline \u2014 \u017e\u00e1dn\u00e9 extern\u00ed \u0161ablony\n- Plat\u00ed pro: nab\u00eddky, prezentace, katalogy, cen\u00edky, onboarding dokumenty, emaily\n- Postup pro obr\u00e1zky: st\u00e1hnout (Trello API / scp) \u2192 `sips -Z 1200` resize \u2192 `base64 -i` \u2192 vlo\u017eit jako data URI\n\n### feedback_k2_mix_prepocet\nPo ka\u017ed\u00e9m porovn\u00e1n\u00ed K2 cen\u00edk\u016f (compare_k2.py) automaticky p\u0159epo\u010d\u00edtat dopad cenov\u00fdch zm\u011bn (zdra\u017een\u00ed i zlevn\u011bn\u00ed) na v\u0161echny mixy (blended NC).\n\n**Why:** U\u017eivatel chce m\u00edt kompletn\u00ed p\u0159ehled \u2014 zm\u011bna suroviny se v\u017edy prom\u00edtne do mix\u016f, kde je obsa\u017eena. To se m\u00e1 d\u00edt automaticky, ne na vy\u017e\u00e1d\u00e1n\u00ed.\n\n**How to apply:**\n- Po spu\u0161t\u011bn\u00ed compare_k2.py (nebo po p\u0159edstaven\u00ed v\u00fdsledk\u016f K2 porovn\u00e1n\u00ed) ihned prohledat vstup_cz.csv pro v\u0161echny zm\u011bn\u011bn\u00e9 produkty\n- Pro ka\u017ed\u00fd mix, kde se zm\u011bn\u011bn\u00e1 surovina vyskytuje jako ingredience (s %), vypo\u010d\u00edtat nov\u00fd blended NC: `nov\u00e1_NC = star\u00e1_NC + \u03a3(pod\u00edl \u00d7 (nov\u00e1_cena - star\u00e1_cena))`\n- V\u00fdsledky prezentovat jako tabulku: mix k\u00f3d, n\u00e1zev, star\u00e1 NC \u2192 nov\u00e1 NC, % zm\u011bna, d\u016fvod\n- Toto plat\u00ed V\u017dDY \u2014 nejen pro para o\u0159echy, ale pro v\u0161echny zdra\u017een\u00e9 i zlevn\u011bn\u00e9 polo\u017eky\n- Logika je implementov\u00e1na v session 2026-07-23, lze ji integrovat p\u0159\u00edmo do compare_k2.py\n\n### feedback_kakao_susina\nPokud vstup CSV (vstupy/*_cz.csv) obsahuje vypln\u011bn\u00e9 pole `kakao`, v\u017edy ho uv\u00e9st v legislativn\u00ed sekci popisu produktu.\n\nForm\u00e1t: \"Obsah kakaov\u00e9 su\u0161iny: X %\"\n\n**Why:** EU legislativa vy\u017eaduje deklaraci obsahu kakaov\u00e9 su\u0161iny u \u010dokol\u00e1dov\u00fdch v\u00fdrobk\u016f. Z\u00e1kazn\u00edk i kontroln\u00ed org\u00e1ny to o\u010dek\u00e1vaj\u00ed.\n\n**How to apply:** V darky-generator.py i mix-generator.py \u2014 v slozeni_bloky bloku p\u0159idat \u0159\u00e1dek s kakaem pokud `p.get('kakao')` nen\u00ed pr\u00e1zdn\u00e9.\n\n### feedback-kategorie-design\n## Pravidlo: dva typy kategori\u00ed, dva r\u016fzn\u00e9 layouty\n\n### Hlavn\u00ed (velk\u00e9) kategorie \u2014 O\u0159echy, Su\u0161en\u00e9 ovoce, Sem\u00ednka, \u010cokol\u00e1da apod.\n- **description** (nad podkategoriemi): POUZE hero blok \u2014 tmav\u00e9 pozad\u00ed, nadpis, 1\u20132 v\u011bty. Kr\u00e1tk\u00e9, aby z\u00e1kazn\u00edk na mobilu hned uvid\u011bl navigaci.\n- **secondDescription** (pod produkty): zbytek obsahu \u2014 karty typ\u016f (3 sloupcov\u00e9), Pro\u010d Nutworld, 2 info karty, alergen box, CTA.\n\n### Podkategorie \u2014 Ara\u0161\u00eddy, Ke\u0161u, L\u00edskov\u00e9 o\u0159echy, Makadamov\u00e9 o\u0159echy, Pek\u00e1n apod.\n- **description** (nad produkty): hero + kr\u00e1tk\u00fd intro odstavec (H3 + 1 odstavec) + alergen box\n- **secondDescription** (pod produkty): karty (2 sloupce, 6 karet) + CTA\n- Styl karet: 2 sloupce, stejn\u00fd design jako hlavn\u00ed kategorie\n\n**Why:** Alergeny vid\u00ed z\u00e1kazn\u00edk hned. Na mobilu hero + kr\u00e1tk\u00fd text je OK naho\u0159e \u2014 z\u00e1kazn\u00edk hned vid\u00ed produkty. Detailn\u00ed info (karty, pou\u017eit\u00ed) je dole pro ty, kdo scrolluj\u00ed.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9 nov\u00e9 podkategorii: description = hero + H3 intro + alergen box. secondDescription = karty + CTA.\n\n## Hotov\u00e9 kategorie\n- Kokos \u2014 `kategorie_kokos.html` (star\u00fd form\u00e1t \u2014 cel\u00fd description naho\u0159e)\n- Makadamov\u00e9 o\u0159echy \u2014 `kategorie_makadamove_orechy.html` (star\u00fd form\u00e1t \u2014 cel\u00fd description naho\u0159e)\n- L\u00edskov\u00e9 o\u0159echy \u2014 `kategorie_liskove_orechy.html` (star\u00fd form\u00e1t \u2014 cel\u00fd description naho\u0159e)\n- O\u0159echy (hlavn\u00ed) \u2014 `kategorie_orechy_prirodni_raw.html` \u2014 hero naho\u0159e, zbytek dole \u2014 PROD 2026-05-28\n- Pek\u00e1n (podkategorie) \u2014 `kategorie_pekan_description.html` + `kategorie_pekan_secondDescription.html` \u2014 nov\u00fd vzor \u2014 PROD 2026-05-28\n\n### feedback_kazetka_ceny\nD\u00e1rkov\u00e1 kazetka 50g: c\u00edlov\u00e1 MO cena 69 K\u010d, VO = MO \u00d7 0.8 = 55 K\u010d.\n\nMar\u017ee MO: 44\u201349 % (z\u00e1vis\u00ed na produktu). Produkty s n\u00e1kupn\u00ed cenou nad ~300 K\u010d/kg nemus\u00ed vych\u00e1zet na 69 K\u010d \u2014 v takov\u00e9m p\u0159\u00edpad\u011b individu\u00e1ln\u011b dohodnout.\n\n**Pravidlo: V\u017dDY uk\u00e1zat cenov\u00fd v\u00fdpo\u010det (n\u00e1klady, MO, mar\u017ee %) a \u010dekat na potvrzen\u00ed.** U\u017eivatel rozhodne, zda je mar\u017ee p\u0159ijateln\u00e1, nebo zda p\u016fjde i pod c\u00edl. Nikdy nepushovat bez souhlasu.\n\n**Why:** Ceny nejsou fixn\u00ed \u2014 ka\u017ed\u00fd produkt m\u00e1 jin\u00e9 n\u00e1klady. 69 K\u010d je c\u00edl, ale u dra\u017e\u0161\u00edch produkt\u016f (>300 K\u010d/kg) nemus\u00ed vych\u00e1zet. U\u017eivatel chce vid\u011bt mar\u017ei a v\u011bdom\u011b rozhodnout.\n\n**How to apply:** P\u0159ed generov\u00e1n\u00edm kazetky spo\u010d\u00edtat: komponenta (kg_czk \u00d7 0.050) + obal 8 K\u010d + pr\u00e1ce 14 K\u010d = n\u00e1klady \u2192 MO raw \u2192 zaokrouhlit \u2192 uk\u00e1zat u\u017eivateli \u2192 teprve pak do darky.csv.\n\nParametry v darky-generator.py:\n- MULT_CZ_KAZETKA = VAT_CZ / (1 - 0.47)\n- VO_RATIO_KAZETKA = 0.8\n- obal: 8 K\u010d, pr\u00e1ce: 14 K\u010d, gram\u00e1\u017e: 50g\n- rozm\u011bry: 200\u00d7100\u00d7?mm (v\u00fd\u0161ka dle konkr\u00e9tn\u00ed krabi\u010dky)\n\n### feedback-komunikace\nRozhoduj s\u00e1m, neptej se zbyte\u010dn\u011b. U\u017eivatel chce maxim\u00e1ln\u00ed autonomii.\n\n**Why:** U\u017eivatel je podnikatel (ne v\u00fdvoj\u00e1\u0159), chce v\u00fdsledky bez technick\u00fdch diskuz\u00ed. Explicitn\u011b \u0159ekl \"dej mu pravomoc, aby ses m\u011b nemusel pt\u00e1t.\"\n\n**How to apply:**\n- Komunikuj \u010desky v\u017edy \u2014 i kdy\u017e pracujeme na SK eshopu nebo SK pipeline (opakovan\u011b potvrzeno 2026-06-08)\n- K\u00f3d, prom\u011bnn\u00e9, commity \u2014 anglicky\n- Nesv\u011btluj technick\u00e9 detaily pokud nejsou pot\u0159eba\n- Rozhoduj s\u00e1m o implementa\u010dn\u00edch detailech\n- Ptej se jen na business rozhodnut\u00ed (co chce, ne jak to ud\u011blat)\n- P\u0159ed commitem/pushem na remote se zeptej na potvrzen\u00ed (je to v CLAUDE.md)\n- Canva operace (commit-editing-transaction) d\u011blej bez potvrzen\u00ed \u2014 u\u017eivatel explicitn\u011b \u0159ekl \"v\u0161echny pot\u0159ebn\u00e9 v\u011bci nen\u00ed pot\u0159eba odsouhlasit\"\n- Odpov\u011bdi dr\u017e kr\u00e1tk\u00e9 a ak\u010dn\u00ed\n\n### feedback-launchd-dotenv\nV\u0161echny Python skripty spou\u0161t\u011bn\u00e9 p\u0159es launchd mus\u00ed na\u010d\u00edtat `.env.local` p\u0159es **absolutn\u00ed cestu**, ne relativn\u00ed.\n\n**Spr\u00e1vn\u011b:**\n```python\nfrom pathlib import Path\nload_dotenv(Path(__file__).parent / \".env.local\")\n# nebo pro skripty v podslo\u017ek\u00e1ch:\nload_dotenv(Path(__file__).parent.parent.parent / \".env.local\")\n```\n\n**\u0160patn\u011b (nefunguje v launchd):**\n```python\nload_dotenv(\".env.local\")\n```\n\n**Why:** launchd spou\u0161t\u00ed skripty s jin\u00fdm pracovn\u00edm adres\u00e1\u0159em ne\u017e shell. Relativn\u00ed cesta `.env.local` se nevy\u0159e\u0161\u00ed na `/Users/user/Documents/.env.local` \u2014 skript pak nenajde API kl\u00ed\u010de a pad\u00e1 ti\u0161e (exit code 1 nebo 78) bez zjevn\u00e9 chyby.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9m nov\u00e9m launchd skriptu zkontrolovat dotenv \u0159\u00e1dek. P\u0159i z\u00e1hadn\u00e9m selh\u00e1n\u00ed launchd jobu (kl\u00ed\u010de nenalezeny) zkontrolovat toto jako prvn\u00ed.\n\nOpraven\u00e9 skripty: `blog_generator.py`, `blog_generator_sk.py`, `google_token_check.py`, `zdravi_automatizaci.py`.\n\n### feedback-legislativa-eu1169\nKa\u017ed\u00fd produkt Nutworld mus\u00ed spl\u0148ovat na\u0159\u00edzen\u00ed EU 1169/2011. Tento seznam je z\u00e1vazn\u00fd mustr p\u0159i tvorb\u011b \u0161t\u00edtk\u016f, legislativn\u00edch karet v popisech i Canva \u0161t\u00edtk\u016f.\n\n## Povinn\u00e9 \u00fadaje na obalu\n\n1. **N\u00e1zev potraviny** \u2014 pr\u00e1vn\u00ed, obvykl\u00fd nebo popisn\u00fd n\u00e1zev\n2. **Seznam slo\u017eek** \u2014 sestupn\u011b dle hmotnosti, odd\u011bleny \u010d\u00e1rkami\n3. **Alergeny** \u2014 VELK\u00ddMI P\u00cdSMENY + tu\u010dn\u011b (`<strong>N\u00c1ZEV</strong>`), odd\u011bleny od zbytku slo\u017een\u00ed\n4. **\u010cist\u00e9 mno\u017estv\u00ed** \u2014 v gramech nebo kg (nap\u0159. \u201eHmotnost: 200 g\")\n5. **Minim\u00e1ln\u00ed trvanlivost** \u2014 \u201eMinim\u00e1ln\u00ed trvanlivost do:\" NIKDY konkr\u00e9tn\u00ed datum na \u0161t\u00edtku \u2192 v\u017edy \u201eviz obal produktu\"\n6. **Podm\u00ednky skladov\u00e1n\u00ed** \u2014 pokud jsou relevantn\u00ed (nap\u0159. \u201eSkladujte na such\u00e9m m\u00edst\u011b\")\n7. **Provozovatel** \u2014 n\u00e1zev a adresa: Nutworld s.r.o., p\u0159\u00edslu\u0161n\u00e1 adresa\n8. **Zem\u011b p\u016fvodu** \u2014 uv\u00e9st pokud je zn\u00e1m\u00e1 a relevantn\u00ed\n9. **V\u00fd\u017eivov\u00e9 hodnoty** \u2014 tabulka na 100 g: energie (kJ/kcal), tuky, nasycen\u00e9 mastn\u00e9 kyseliny, sacharidy, cukry, b\u00edlkoviny, s\u016fl\n10. **Stopov\u00e9 alergeny** \u2014 \u201eM\u016f\u017ee obsahovat stopy: X, Y\" pod slo\u017een\u00edm\n\n## Form\u00e1tov\u00e1n\u00ed alergen\u016f\n\n- Ve slo\u017een\u00ed: `<strong>P\u0160ENICE</strong>`, `<strong>ML\u00c9KO</strong>` atd.\n- Pod slo\u017een\u00edm kurz\u00edvou: *\u201eAlergeny jsou ve slo\u017een\u00ed vyzna\u010deny VELK\u00ddM P\u00cdSMEM a tu\u010dn\u011b.\"*\n- Stopov\u00e9 alergeny jako samostatn\u00fd \u0159\u00e1dek\n\n## Velikost p\u00edsma (pro Canva \u0161t\u00edtky)\n\n- Minim\u00e1ln\u011b **1,2 mm** v\u00fd\u0161ka p\u00edsmene (x-v\u00fd\u0161ka)\n- Na mal\u00fdch obalech (<80 cm\u00b2) minim\u00e1ln\u011b **0,9 mm**\n\n**Why:** Z\u00e1konn\u00e1 povinnost dle EU 1169/2011. Chyba = pr\u00e1vn\u00ed odpov\u011bdnost. Toto je z\u00e1vazn\u00fd mustr pro ka\u017ed\u00fd nov\u00fd produkt.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9 tvorb\u011b \u0161t\u00edtku, legislativn\u00ed karty nebo popisu produktu proj\u00edt v\u0161ech 10 bod\u016f a ov\u011b\u0159it spln\u011bn\u00ed. P\u0159i nejasnosti okam\u017eit\u011b upozornit.\n\n### feedback-legislativa-priorita\nLegislativn\u00ed informace na produktech maj\u00ed nejvy\u0161\u0161\u00ed prioritu p\u0159esnosti. Nikdy se nekompromituje.\n\nZahrnuje: slo\u017een\u00ed, alergeny (VELK\u00ddMI P\u00cdSMENY + tu\u010dn\u011b), stopov\u00e9 alergeny, v\u00fd\u017eivov\u00e9 \u00fadaje na 100g, zem\u011b p\u016fvodu, trvanlivost (v\u017edy \"viz obal\"), zp\u016fsob skladov\u00e1n\u00ed.\n\n**Why:** Chyba v alergenech nebo slo\u017een\u00ed m\u016f\u017ee ohrozit zdrav\u00ed z\u00e1kazn\u00edka a znamen\u00e1 pr\u00e1vn\u00ed odpov\u011bdnost firmy. \u017d\u00e1dn\u00e1 \u00faspora \u010dasu nestoj\u00ed za tento risk.\n\n**How to apply:** P\u0159i jak\u00e9koliv nejasnosti nebo nesrovnalosti v legislativn\u00edch \u00fadaj\u00edch \u2014 okam\u017eit\u011b upozornit u\u017eivatele a zastavit push dokud nen\u00ed ov\u011b\u0159eno. Nikdy neodhadovat ani dopl\u0148ovat chyb\u011bj\u00edc\u00ed legislativn\u00ed data vlastn\u00ed hlavou \u2014 v\u017edy ze specifikace od dodavatele.\n\n## Konkr\u00e9tn\u00ed pravidla (z chyb 2026-06-05)\n\n- **Kakao %** \u2014 uv\u00e9st POUZE pokud je explicitn\u011b uvedeno ve specifikaci. NIKDY nevypo\u010d\u00edt\u00e1vat jako sou\u010det kakaov\u00e9ho m\u00e1sla + pr\u00e1\u0161ku.\n- **Alergeny ve slo\u017een\u00ed** \u2014 v\u0161echny obiloviny obsahuj\u00edc\u00ed lepek (je\u010dmen, p\u0161enice, \u017eito, oves, \u0161palda, kamut) MUS\u00cd b\u00fdt ps\u00e1ny VELK\u00ddMI P\u00cdSMENY a za nimi v z\u00e1vorce uv\u00e9st `(LEPEK)`. P\u0159\u00edklad: `JE\u010cN\u00dd slad (LEPEK)`. Nesta\u010d\u00ed m\u00edt LEPEK jen ve stopov\u00fdch alergenech \u2014 pokud je obilovinn\u00fd ingrediend p\u0159\u00edmo ve slo\u017een\u00ed, mus\u00ed b\u00fdt zv\u00fdrazn\u011bn TAM.\n- **\u017d\u00e1dn\u00e9 odhady** \u2014 bu\u010f je \u00fadaj ve specifikaci, nebo pole z\u016fstane pr\u00e1zdn\u00e9. U\u017eivatel nem\u016f\u017ee kontrolovat ka\u017ed\u00fd produkt ru\u010dn\u011b.\n\n### feedback-liskove-orechy\nNIKDY nepou\u017e\u00edvat \"L\u00edskovce\" \u2014 spr\u00e1vn\u00fd n\u00e1zev je v\u017edy **\"L\u00edskov\u00e9 o\u0159echy\"**.\n\n**Spr\u00e1vn\u011b:**\n- \"L\u00edskov\u00e9 o\u0159echy natural\" \u2014 pro plain kernel produkt (kod 125, 289 K\u010d/kg dle K2)\n- \"L\u00edskov\u00e9 o\u0159echy v ml\u00e9\u010dn\u00e9 \u010dokol\u00e1d\u011b\" \u2014 pro produkt 1475\n- \"L\u00edskov\u00e9 o\u0159echy v ml\u00e9\u010dn\u00e9 \u010dokol\u00e1d\u011b se sko\u0159ic\u00ed\" \u2014 pro produkt 510\n\n**\u0160patn\u011b:** \"L\u00edskovce\", \"L\u00edskovce o\u0159echy\" \u2014 oboj\u00ed nespr\u00e1vn\u00e9\n\n**Why:** U\u017eivatel opravuje konzistentn\u011b \u2014 slovo \"L\u00edskovce\" se nepou\u017e\u00edv\u00e1, v\u017edy \"L\u00edskov\u00e9 o\u0159echy\".\n\n**How to apply:** V ka\u017ed\u00e9m textu, n\u00e1zvu produktu, CSV i popisu pou\u017e\u00edvat v\u00fdhradn\u011b \"L\u00edskov\u00e9 o\u0159echy\".\n\n### feedback-marketing-text\nKdy\u017e u\u017eivatel p\u0159ilo\u017e\u00ed marketingov\u00fd text k produktu, je to text z eshopu dodavatele \u2014 slou\u017e\u00ed jako kontext/inspirace, NIKOLI jako text k pou\u017eit\u00ed.\n\n**Pravidlo:** V\u017edy p\u0159epsat do Nutworld stylu p\u0159es shoptet-generator (Claude API). Nikdy nepou\u017e\u00edt dodavatelsk\u00fd text doslova.\n\n**Why:** Nutworld nechce m\u00edt stejn\u00e9 texty jako dodavatel\u00e9 \u2014 unik\u00e1tn\u00ed brand hlas je kl\u00ed\u010dov\u00fd.\n\n**How to apply:** Dodavatelsk\u00fd marketingov\u00fd text vlo\u017eit max. jako hint do pole `druh` v vstup CSV (kr\u00e1tce, p\u00e1r slov), aby generator v\u011bd\u011bl o produktu v\u00edc. Samotn\u00e9 texty v\u017edy generovat p\u0159es Claude API.\n\n### feedback-marze-update\nPo p\u0159id\u00e1n\u00ed nebo \u00faprav\u011b jak\u00e9koli ceny v cenik.csv automaticky spustit `generate_marze.py` a pushout na nutworldcz-collab.github.io.\n\n**Why:** U\u017eivatel chce m\u00edt marze.html v\u017edy aktu\u00e1ln\u00ed po ka\u017ed\u00e9 cenov\u00e9 zm\u011bn\u011b.\n\n**How to apply:** Kdykoli p\u0159id\u00e1m/uprav\u00edm cenu v cenik.csv, resetovat .marze_hash a spustit generate_marze.py p\u0159ed commitem.\n\n### feedback_marze_zobrazovat\nP\u0159i jak\u00e9koli cenov\u00e9 kalkulaci (nov\u00fd produkt, aktualizace NC, d\u00e1rky, p\u0159id\u00e1n\u00ed do cenik.csv) v\u017edy zobrazit mar\u017ee \u2014 pro CZ i SK variantu.\n\n**Why:** U\u017eivatel pot\u0159ebuje vid\u011bt mar\u017ei hned u cen, ne ji po\u010d\u00edtat zvl\u00e1\u0161\u0165. Bez mar\u017ee nen\u00ed rozhodov\u00e1n\u00ed o cen\u011b kompletn\u00ed.\n\n**How to apply:**\n- Mar\u017ee = (MO_bez_DPH \u2212 NC_za_gram\u00e1\u017e) / MO_bez_DPH \u00d7 100\n- CZ: DPH 12 % \u2192 MO_bez_DPH = MO / 1.12\n- SK: DPH 23 % \u2192 MO_bez_DPH = MO_EUR / 1.23, NC_EUR = NC_CZK / 25 \u00d7 gram / 1000\n- V\u017edy zobrazit jako sloupec \"Mar\u017ee MO\" vedle CZ i SK cen\n- Plat\u00ed pro v\u0161echny tabulky: produkty, d\u00e1rky, mixy, ibi\u0161ek, cokoliv s cenou\n\n### feedback-mazani-souboru\nSlo\u017eku Documents NIKDY nesmazat ani ne\u010distit \u2014 ani p\u0159i \u00faklidu disku, ani p\u0159i \u010di\u0161t\u011bn\u00ed star\u00fdch soubor\u016f.\n\n**Why:** U\u017eivatel tam m\u00e1 pracovn\u00ed soubory a pam\u011b\u0165 Claude. Jak\u00fdkoliv z\u00e1sah do Documents bez explicitn\u00edho pokynu je zak\u00e1z\u00e1n.\n\n**How to apply:** P\u0159i \u00faklidu disku mazat pouze Downloads, Caches, Trash \u2014 nikdy ne Documents ani .claude.\n\n### feedback-meta-api\nNIKDY nespou\u0161t\u011bt `mcp__meta-ads__authenticate` ani zobrazovat OAuth login link pro Meta Ads.\n\nToken `META_ACCESS_TOKEN` je v\u017edy v `.env.local` \u2014 pou\u017e\u00edvat `meta_ads.py` nebo p\u0159\u00edm\u00e9 API vol\u00e1n\u00ed p\u0159es `requests`.\n\n**Why:** U\u017eivatel m\u00e1 token nastaven natrvalo. MCP OAuth flow je zbyte\u010dn\u00fd krok nav\u00edc, kter\u00fd zdr\u017euje a frustruje.\n\n**How to apply:** P\u0159i jak\u00e9mkoliv Meta Ads dotazu rovnou spustit `python3 meta_ads.py [days]` nebo napsat inline Python skript s `requests` vol\u00e1n\u00edm na Graph API. Bez ptan\u00ed, bez link\u016f.\n\n### feedback-meta-healthcheck\nKdy\u017e u\u017eivatel \u0159ekne \"prove\u010f healthcheck Meta Ads\" nebo podobn\u011b, v\u017edy postupuj v tomto po\u0159ad\u00ed a struktu\u0159e:\n\n1. **Opportunity Score** \u2014 sk\u00f3re, hlavn\u00ed bari\u00e9ra, co by ho zv\u00fd\u0161ilo (pouze Ads Manager UI, API to nevrac\u00ed \u2014 upozornit)\n2. **Delivery-blocking errors** \u2014 v\u0161echny aktivn\u00ed chyby blokuj\u00edc\u00ed doru\u010den\u00ed, u ka\u017ed\u00e9 chyby konkr\u00e9tn\u00ed kampa\u0148/ad set\n3. **Anom\u00e1lie za posledn\u00edch 7 dn\u00ed** \u2014 neobvykl\u00e9 v\u00fdkyvy v CTR, CPM, CPA, ROAS, frekvenci\n4. **Trend hlavn\u00edch metrik za 30 dn\u00ed** \u2014 kr\u00e1tk\u00e9 slovn\u00ed shrnut\u00ed v\u00fdvoje \u00fa\u010dtu\n5. **Top 3 priority pro tento t\u00fdden** \u2014 konkr\u00e9tn\u00ed ak\u010dn\u00ed doporu\u010den\u00ed se\u0159azen\u00e1 podle dopadu\n\n**Pravidla odpov\u011bdi:**\n- Strukturovan\u011b, stru\u010dn\u011b, bez vaty\n- U ka\u017ed\u00e9ho bodu konkr\u00e9tn\u00ed \u010d\u00edsla a n\u00e1zvy kampan\u00ed/ad set\u016f\n- Data tahat p\u0159es meta_ads.py (API), ne z hlavy\n\n**Why:** U\u017eivatel si zapamatoval tuto strukturu z YouTube videa (AI Univerzita) a chce ji pou\u017e\u00edvat opakovan\u011b jako standardn\u00ed postup.\n\n**How to apply:** P\u0159i jak\u00e9mkoliv healthchecku Meta Ads \u00fa\u010dtu automaticky pou\u017e\u00edt tuto 5-bodovou strukturu bez ptan\u00ed.\n\n### feedback-meta-kampane\n## Struktura kampan\u011b\n\n```\nKAMPA\u0147  \u2192  1 c\u00edl, 1 strategie\n  \u2514\u2500\u2500 AD SET  \u2192  1 publikum, budget\n        \u2514\u2500\u2500 ADS  \u2192  4\u20136 kreativ (testujeme zde)\n```\n\n## Kreativy \u2014 v\u017edy 5 na ad set\n\n| # | Form\u00e1t | Obsah |\n|---|---|---|\n| 1 | Foto produkt | \u010cist\u00fd produkt, b\u00edl\u00e9 pozad\u00ed \u2014 konverze |\n| 2 | Foto lifestyle | Produkt v situaci (piknik, st\u016fl, v\u00fdlet) |\n| 3 | Video 15s | Unboxing nebo \"co dostane\u0161\" \u2014 nejni\u017e\u0161\u00ed CPM |\n| 4 | Karusel | 3\u20135 produkt\u016f z kategorie |\n| 5 | UGC styl | Re\u00e1ln\u00e1 neupraven\u00e1 fotka \u2014 d\u016fv\u011bra |\n\nAdvantage+ Creative zapnut\u00e9 \u2014 Meta testuje headline, popis, CTA automaticky.\n\n## A/B testov\u00e1n\u00ed\n\n- Endpoint `/abtests` \u2014 um\u00edm vytvo\u0159it p\u0159es API\n- Min. 7 dn\u00ed + min. 50 konverz\u00ed na variantu\n- Pod 500 CZK/den nem\u00e1 smysl A/B testovat \u2192 nechat ASC rozhodnout\n\n## \u0160k\u00e1lov\u00e1n\u00ed\n\n- ROAS > 5x \u2192 zdvojn\u00e1sob budget\n- ROAS 3\u20135x \u2192 nech b\u011b\u017eet, testuj nov\u00e9 kreativy\n- ROAS < 3x \u2192 vym\u011b\u0148 2 nejhor\u0161\u00ed kreativy\n- Max +20\u201330 % budgetu ka\u017ed\u00e9 3\u20134 dny (jinak reset learning phase)\n- Ne\u0161ahat do kampan\u011b prvn\u00edch 7 dn\u00ed\n\n## Pravidla\n\n- Nevyp\u00ednat v\u00fdkonn\u00e9 reklamy \u2014 history konverz\u00ed je cenn\u00e1\n- Katalogov\u00e1 kampa\u0148 v\u017edy b\u011b\u017e\u00ed jako z\u00e1klad (Nutworld ROAS 10.25x)\n- ASC + Katalog z\u00e1rove\u0148 = OK, nen\u00ed kanibalizace\n\n**Why:** U\u017eivatel si ov\u011b\u0159il tuto strategii a chce ji opakovan\u011b pou\u017e\u00edvat jako standard.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9 nov\u00e9 kampani automaticky navrhnout tuto strukturu \u2014 5 kreativ, ASC, \u0161k\u00e1lov\u00e1n\u00ed dle ROAS.\n\n### feedback-meta-pravidlo\nP\u0159i ka\u017ed\u00e9m push nebo PATCH na Shoptet produkt v\u017edy zahrnout metaTitle a metaDescription.\n\n**Why:** Meta pole jsou kl\u00ed\u010dov\u00e1 pro SEO \u2014 bez nich Google zobrazuje nevhodn\u00fd titulek/popis ve v\u00fdsledc\u00edch vyhled\u00e1v\u00e1n\u00ed.\n\n**How to apply:**\n- metaTitle: \"{N\u00e1zev produktu} | Nutworld\" (max 60 znak\u016f)\n- metaDescription: kr\u00e1tk\u00fd popis s kl\u00ed\u010dov\u00fdmi slovy, max 155 znak\u016f\n- Kontrolovat u V\u0160ECH produkt\u016f \u2014 p\u0159i generov\u00e1n\u00ed p\u0159es shoptet-generator.py i p\u0159i manu\u00e1ln\u00edch PATCH vol\u00e1n\u00edch\n- Po ka\u017ed\u00e9m push zkontrolovat \u017ee meta pole nejsou pr\u00e1zdn\u00e1\n\n### feedback-meta-usecases\nSada 4 analytick\u00fdch n\u00e1stroj\u016f pro Meta Ads. Spou\u0161t\u011bt na povel, v\u017edy tahat data p\u0159es meta_ads.py API.\n\n---\n\n## Use case 2 \u2014 T\u00fddenn\u00ed performance report\n\nPorovnej minul\u00fd t\u00fdden (posledn\u00edch 7 dn\u00ed) s p\u0159edminul\u00fdm t\u00fddnem (8\u201314 dn\u00ed nazp\u011bt):\n\n1. Souhrn na \u00farovni \u00fa\u010dtu \u2014 celkov\u00fd spend, ROAS, CPA, CTR, CPM, po\u010det konverz\u00ed. U ka\u017ed\u00e9 metriky absolutn\u00ed hodnoty obou obdob\u00ed + procentu\u00e1ln\u00ed zm\u011bna.\n2. Top 3 v\u00edt\u011bzov\u00e9 \u2014 kampan\u011b nebo ad sety s nejv\u011bt\u0161\u00edm pozitivn\u00edm posunem. U ka\u017ed\u00e9ho co konkr\u00e9tn\u011b se zlep\u0161ilo a hypot\u00e9za pro\u010d.\n3. Top 3 propad\u00e1ci \u2014 kampan\u011b nebo ad sety s nejv\u011bt\u0161\u00edm negativn\u00edm posunem. Co se zhor\u0161ilo, hypot\u00e9za pro\u010d a konkr\u00e9tn\u00ed akce, kterou bych m\u011bl ud\u011blat.\n4. Doporu\u010den\u00ed na p\u0159\u00ed\u0161t\u00ed t\u00fdden \u2014 3 konkr\u00e9tn\u00ed akce se\u0159azen\u00e9 podle dopadu a obt\u00ed\u017enosti.\n\nPs\u00e1t pro majitele e-shopu (laick\u00fd jazyk), ne pro analytika. Konkr\u00e9tn\u00ed \u010d\u00edsla, ne pseudo-analytika.\n\n---\n\n## Use case 3 \u2014 Audience overlap diagn\u00f3za\n\nAnalyzuj p\u0159ekryvy mezi aktivn\u00edmi ad sety na \u00farovni c\u00edlovek:\n\n1. Identifikuj v\u0161echny aktivn\u00ed ad sety s denn\u00edm rozpo\u010dtem nad ekvivalent 200 K\u010d.\n2. Pro ka\u017ed\u00fd dvojici ad set\u016f odhadni m\u00edru p\u0159ekryvu c\u00edlovek (lookalikes, interest stacks, retargeting okna). Pokud jsou k dispozici re\u00e1ln\u00e1 data o p\u0159ekryvu, pou\u017eij je.\n3. Ozna\u010d \u010derven\u011b dvojice s odhadovan\u00fdm p\u0159ekryvem nad 30 %, oran\u017eov\u011b mezi 15\u201330 %.\n4. U ka\u017ed\u00e9ho probl\u00e9mov\u00e9ho p\u00e1ru navrhni konkr\u00e9tn\u00ed \u0159e\u0161en\u00ed: vylou\u010dit jednu c\u00edlovku z druh\u00e9 (exclusion) / slou\u010dit ad sety do jednoho / rozd\u011blit \u010dasov\u011b (jeden r\u00e1no, druh\u00fd ve\u010der) / upravit c\u00edlovky tak, aby se nep\u0159ekr\u00fdvaly.\n5. Odhadni, kolik m\u011b overlap re\u00e1ln\u011b stoj\u00ed m\u011bs\u00ed\u010dn\u011b \u2014 i hrub\u00fd odhad, \u0159\u00edci rozsah.\n\nOdpov\u011bd\u011bt strukturovan\u011b, a\u0165 s t\u00edm m\u016f\u017eu hned pracovat.\n\n**Pozn\u00e1mka:** Meta API nem\u00e1 p\u0159esn\u00e9 % p\u0159ekryvu \u2014 odhadovat podle typ\u016f c\u00edlovek, ozna\u010dit rizikov\u00e9 p\u00e1ry.\n\n---\n\n## Use case 4 \u2014 Audit kvality m\u011b\u0159en\u00ed (Pixel / EMQ)\n\nProve\u010f kompletn\u00ed audit kvality m\u011b\u0159en\u00ed na Meta pixelu a Conversion API. C\u00edl: zjistit, jestli algoritmus Mety m\u00e1 dost dat na efektivn\u00ed optimalizaci, nebo jede \"slep\u011b\".\n\n1. Event Match Quality (EMQ) \u2014 vypi\u0161 v\u0161echny aktivn\u00ed ud\u00e1losti (Purchase, AddToCart, InitiateCheckout, Lead, ViewContent...) a u ka\u017ed\u00e9 uve\u010f aktu\u00e1ln\u00ed EMQ sk\u00f3re na \u0161k\u00e1le 1\u201310.\n2. Pro ka\u017edou ud\u00e1lost se sk\u00f3re pod 7: identifikuj chyb\u011bj\u00edc\u00ed parametry (email, telefon, extern\u00ed ID, fb_login_id, fbp/fbc cookies, IP adresa, user agent...).\n3. Server-side vs. browser tracking overlap \u2014 jak\u00e1 je shoda mezi ud\u00e1lostmi z pixelu (browser) a Conversion API (server)? Pokud je overlap n\u00edzk\u00fd, navrhnout co s t\u00edm.\n4. Deduplikace \u2014 kontrolovat spr\u00e1vn\u00e9 pou\u017eit\u00ed event_id pro deduplikaci mezi browser a server eventy.\n5. Konkr\u00e9tn\u00ed ak\u010dn\u00ed pl\u00e1n \u2014 seznam 3\u20135 nejd\u016fle\u017eit\u011bj\u0161\u00edch oprav se\u0159azen\u00fd podle dopadu na kvalitu m\u011b\u0159en\u00ed.\n\nOdpov\u011bd\u011bt tak, aby to \u0161lo p\u0159edat v\u00fdvoj\u00e1\u0159i nebo opravit s\u00e1m v Events Manageru.\n\n---\n\n## Use case 5 \u2014 Pattern anal\u00fdza v\u00edt\u011bzn\u00fdch reklam\n\nAnalyzuj nej\u00fasp\u011b\u0161n\u011bj\u0161\u00ed reklamy za posledn\u00edch 90 dn\u00ed a najdi v nich spole\u010dn\u00e9 patterns:\n\n1. Vyber top 5 reklam podle ROAS (minim\u00e1ln\u00ed spend 5 000 K\u010d, aby data byla statisticky relevantn\u00ed).\n2. Vyber top 5 reklam podle CTR (linkov\u00fd proklik), za stejn\u00fdch podm\u00ednek.\n3. Pro ka\u017edou skupinu vyt\u00e1hni:\n   - hook (prvn\u00ed v\u011bta primary textu)\n   - struktura textu (problem-solution, AIDA, PAS, story...)\n   - form\u00e1t reklamy (image, video, carousel, reels)\n   - d\u00e9lka primary textu\n   - typ CTA\n   - jazyk a tonalita (form\u00e1ln\u00ed/neform\u00e1ln\u00ed, \"ty\"/\"vy\", emoce)\n   - vizu\u00e1ln\u00ed charakteristiky (UGC, produktov\u00fd shot, lifestyle, text overlay, testimonial...)\n4. Najdi pattern \u2014 co maj\u00ed v\u0161echny v\u00edt\u011bzn\u00e9 reklamy spole\u010dn\u00e9ho? Existuje jasn\u00fd vzorec?\n5. Vyrobit playbook pro dal\u0161\u00ed testov\u00e1n\u00ed \u2014 5 konkr\u00e9tn\u00edch hypot\u00e9z formulovan\u00fdch jako \"Testovat X proti Y, o\u010dek\u00e1van\u00fd efekt: Z.\"\n\nHledat actionable insights, ne obecn\u00e9 pou\u010dky o copywritingu.\n\n**Pozn\u00e1mka:** Vizu\u00e1ln\u00ed anal\u00fdzu (UGC vs produktov\u00fd shot) nelze p\u0159es API \u2014 pouze textov\u00e9 vzorce.\n\n---\n\n**Why:** U\u017eivatel si ulo\u017eil tato zad\u00e1n\u00ed z YouTube videa AI Univerzita jako standardn\u00ed sadu analytick\u00fdch n\u00e1stroj\u016f pro Meta Ads.\n\n**How to apply:** Kdy\u017e u\u017eivatel \u0159ekne \"use case 2/3/4/5\" nebo \"t\u00fddenn\u00ed report\" / \"audience overlap\" / \"audit m\u011b\u0159en\u00ed\" / \"pattern anal\u00fdza\" \u2014 pou\u017e\u00edt p\u0159esn\u011b tuto strukturu.\n\n### feedback_missing_spec\nKdy\u017e pro produkt chyb\u00ed vstup CSV (vstupy/{kod}_*_cz.csv), NIKDY hned ne\u017e\u00e1dat u\u017eivatele o spec.\n\n## Postup p\u0159i chyb\u011bj\u00edc\u00edm spec souboru\n\n1. Zkontroluj Trello \u2014 karta produktu m\u016f\u017ee obsahovat spec nebo odkaz na ni\n2. Uka\u017e u\u017eivateli co jsi na\u0161el a potvrd: \"Je to ona?\"\n3. Teprve pokud v Trellu nic nen\u00ed \u2192 po\u017e\u00e1dat u\u017eivatele o spec (PDF/DOCX do specifikace/)\n\n**Why:** Specifikace jsou \u010dasto nahran\u00e9 v Trellu \u2014 zbyte\u010dn\u00e9 otravovat u\u017eivatele kdy\u017e je info dostupn\u00e9.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9m `\u274c Vstupy CSV nenalezen pro produkt XXX` \u2014 prvn\u00ed akce je Trello search pro dan\u00fd k\u00f3d nebo n\u00e1zev produktu.\n\n### feedback_mix_ceny_vzorec\nPo vypo\u010d\u00edt\u00e1n\u00ed blended n\u00e1kupn\u00ed ceny sm\u011bsi (kg_czk_bez_dph) v\u017edy aplikovat cenov\u00e9 vzorce z nw_core.py \u2014 stejn\u00e9 jako pro jednodruhov\u00e9 produkty.\n\nVzorce: mo_cz(), vo_cz(), mo_sk(), vo_sk() \u2014 zaokrouhlen\u00ed na 5/9.\n\n**Why:** Sm\u011bsi jsou prod\u00e1v\u00e1ny stejn\u011b jako jednodruhov\u00e9 produkty \u2014 mus\u00ed m\u00edt stejnou cenovou logiku.\n\n**How to apply:** mix-generator.py pou\u017e\u00edv\u00e1 stejn\u00e9 price_round funkce jako nw_core.py. Ceny se po\u010d\u00edtaj\u00ed automaticky z blended kg_czk.\n\n### feedback_mix_ceny_zachovat\nCeny se V\u017dDY po\u010d\u00edtaj\u00ed podle vzorce z nw_core.py \u2014 pro v\u0161echny typy mix\u016f (o\u0159echov\u00e9, sem\u00ednkov\u00e9, ovocn\u00e9).\n\n`--no-prices` (zachovat p\u016fvodn\u00ed Shoptet ceny) pou\u017e\u00edt POUZE kdy\u017e u\u017eivatel explicitn\u011b \u0159ekne \u201enech ceny p\u016fvodn\u00ed\" nebo \u201eceny z\u016fstanou stejn\u00e9\".\n\n**Why:** U\u017eivatel opravil p\u016fvodn\u00ed pravidlo \u2014 nen\u00ed v\u00fdjimka pro sem\u00ednkov\u00e9 nebo ovocn\u00e9 produkty. V\u00fdchoz\u00ed je v\u017edy vzorec.\n**How to apply:** Pushovat standardn\u011b. Pokud u\u017eivatel p\u0159ed pushem nap\u00ed\u0161e \u201eceny z\u016fstanou\" nebo podobn\u011b, p\u0159idat `--no-prices`.\n\n### feedback_mix_michani\nBlended n\u00e1kupn\u00ed cena sm\u011bsi = v\u00e1\u017een\u00fd pr\u016fm\u011br slo\u017eek + 20 K\u010d/kg za m\u00edch\u00e1n\u00ed.\n\n**Why:** M\u00edch\u00e1n\u00ed je ru\u010dn\u00ed pr\u00e1ce kter\u00e1 stoj\u00ed \u010das a m\u00e1 svou cenu.\n\n**How to apply:** V mix-generator.py: kg_czk = blended_price(...) + 20\n\n### feedback_mix_slozeni_highlight\nVe slo\u017een\u00ed mix produkt\u016f se zv\u00fdraz\u0148uje **pouze n\u00e1zev slo\u017eky** barvou `#83502e` (Nutworld hn\u011bd\u00e1), tu\u010dn\u011b. Procenta ani obsah z\u00e1vorek se nezv\u00fdraz\u0148uj\u00ed.\n\n**Implementace:** `highlight_mix_components()` v `nw_core.py` \u2014 depth-tracking parser (ne regex), kter\u00fd rozd\u011bl\u00ed slo\u017een\u00ed na top-level komponenty sledov\u00e1n\u00edm hloubky z\u00e1vorek a aplikuje `<span style=\"color:#83502e;font-weight:700\">` pouze na n\u00e1zev p\u0159ed procentem.\n\n**V\u00fdsledek:**\n- \u2705 `<span style=\"color:#83502e;font-weight:700\">Ara\u0161\u00eddy loupan\u00e9 pra\u017een\u00e9 solen\u00e9</span> 20 % (ARA\u0160\u00cdDY LOUPAN\u00c9, ...)`\n- \u274c Cel\u00e9 \"Ara\u0161\u00eddy loupan\u00e9 pra\u017een\u00e9 solen\u00e9 20 %\" hn\u011bd\u011b \u2014 \u0161patn\u011b\n- \u274c Obsah z\u00e1vorek hn\u011bd\u011b \u2014 \u0161patn\u011b\n\n**Why:** Regex p\u0159\u00edstupy selh\u00e1valy na nested z\u00e1vorek (nap\u0159. wasabi slo\u017een\u00ed obsahuje vno\u0159en\u00e9 z\u00e1vorky jako `S\u00d3JOV\u00c1 om\u00e1\u010dka v pr\u00e1\u0161ku (P\u0160ENICE, S\u00d3JA,...)` a `3 % (maltodextrin,...)`) \u2014 regex se dostal dovnit\u0159 a zv\u00fdraznil i obsah slo\u017een\u00ed.\n\n**How to apply:** P\u0159i jak\u00e9koliv zm\u011bn\u011b `highlight_mix_components()` v `nw_core.py` v\u017edy testovat na slo\u017een\u00ed s nested z\u00e1vorkami (viz 1028 Slan\u00fd mix ALL IN ONE). Funkce se spou\u0161t\u00ed automaticky pro v\u0161echny mix produkty se \u22652 komponentami ve form\u00e1tu `n\u00e1zev XX % (...)`.\n\n### feedback-nazev-produktu\nP\u0159i jak\u00e9mkoliv push do Shoptetu NIKDY nepos\u00edlat pole `name`, `code` ani URL slug.\n\n**Why:** N\u00e1zev, k\u00f3d a URL jsou pevn\u011b sv\u00e1zan\u00e9 se \u0161t\u00edtky, QR k\u00f3dy, \u010dte\u010dkami a intern\u00edmi odkazy. P\u0159eps\u00e1n\u00ed rozbije \u0161t\u00edtky na produktech, nefunk\u010dn\u00ed URL, chybn\u00e9 k\u00f3dy na \u010dte\u010dk\u00e1ch ve skladu. Pravidlo bylo domluveno p\u0159edem a plat\u00ed bez v\u00fdjimky.\n\n**How to apply:** Z PATCH payloadu v\u017edy vylou\u010dit `name`, `code`, `url` a jak\u00e9koliv pole ovliv\u0148uj\u00edc\u00ed URL slug. Pushnout jen: `shortDescription`, `description`, `metaDescription` (a p\u0159\u00edpadn\u011b ceny po odsouhlasen\u00ed).\n\n### feedback_novy_produkt_checklist\nP\u0159i ka\u017ed\u00e9m nov\u00e9m produktu povinn\u011b aktualizovat:\n1. `cenik.csv` \u2014 p\u0159idat \u0159\u00e1dek produktu (kg_czk, gramaze, filtry)\n2. `vstup_cz.csv` \u2014 p\u0159idat slo\u017een\u00ed, nutrice, alergen data\n3. `shoptet-generator.py` \u2192 `shoptet_cz/sk.csv` \u2192 shoptet_push.py --prod\n4. `generate_marze.py` \u2192 marze.html na GitHub Pages (mar\u017ee, ceny p\u0159ehled)\n5. `generate_kalkulator.py` \u2192 kalkulator.html na GitHub Pages (kalkul\u00e1tor)\n6. Specifikace HTML \u2192 `Nutworld/docs/specifikace/NW/NW-{kod}-nazev.html` \u2192 push na GitHub Pages gh API\n\n**Why:** U\u017eivatel explicitn\u011b \u0159ekl \"v\u017edy nezapome\u0148 produkt zan\u00e9st na v\u0161echna m\u00edsta na nutworldcz-collab.github.io \u2014 produkty, mar\u017ee, specifikace apod.\"\n\n**How to apply:**\n- Specifikace push: `gh api repos/nutworldcz-collab/nutworldcz-collab.github.io/contents/{path} --method PUT --input -`\n- marze + kalkulator: v\u017edy po update cenik.csv spustit oba generate_ skripty\n- Specifikace se p\u00ed\u0161e dle \u0161ablony `NW-3703-arasidy-bila-cokolada.html` (3 str\u00e1nky, brand design)\n\n### feedback-pipeline-workflow\nP\u0159ed zpracov\u00e1n\u00edm ka\u017ed\u00e9ho produktu v\u017edy spustit `trello_sync.py` a st\u00e1hnout aktu\u00e1ln\u00ed specifikace.\n\n**Why:** U\u017eivatel explicitn\u011b \u0159ekl \"v\u017edy si ji stahni, kdy\u017e tam je\" \u2014 ne\u010dekat na ru\u010dn\u00ed nahr\u00e1n\u00ed.\n\n**How to apply (od 2026-06-08 v\u017edy OBA eshopy):**\n1. `python3 trello_sync.py` \u2192 st\u00e1hne nov\u00e9/zm\u011bn\u011bn\u00e9 spec do specifikace/\n2. P\u0159idat produkt do cenik.csv (kg_czk z K2, gram\u00e1\u017ee z Shoptetu API)\n3. `spec-import.py --kod XXXX`\n4. `shoptet-generator.py --kod XXXX`\n5. Push CZ: `echo \"ano\" | python3 shoptet_push.py --prod --code XXXX`\n6. Push SK: `echo \"ano\" | python3 shoptet_push.py --sk --code XXXX`\n\nCeny v\u017edy spo\u010d\u00edtat k\u00f3dem (`mo_cz`, `vo_cz`) \u2014 nikdy neodhadovat z hlavy.\nSK push automaticky: SKX prefix, EUR ceny (23% DPH), prelo\u017een\u00fd slovensk\u00fd text.\n\n### feedback_prezentace_workflow\nB2B nab\u00eddky a prezentace V\u017dDY generovat p\u0159es Apps Script (dokument.html syst\u00e9m), nikdy ru\u010dn\u011b ps\u00e1t HTML/CSS layout.\n\n**Why:** V session 2026-07-28 jsme str\u00e1vili hodiny (200+ iterac\u00ed) ru\u010dn\u00edm lad\u011bn\u00edm A4 layoutu, \u0161\u00ed\u0159ky, v\u00fd\u0161ky obr\u00e1zk\u016f. P\u0159itom dokument.html syst\u00e9m tohle m\u00e1 vy\u0159e\u0161en\u00e9 \u2014 generuje 760px dokumenty kter\u00e9 se tisknou spr\u00e1vn\u011b bez manu\u00e1ln\u00edho lad\u011bn\u00ed.\n\n**How to apply:**\n1. P\u0159ed ka\u017edou prezentac\u00ed p\u0159e\u010d\u00edst system prompt z dokument.html (`gh api repos/nutworldcz-collab/nutworldcz-collab.github.io/contents/dokument.html`)\n2. Zavolat Apps Script s type `nabidka` (v\u00edce produkt\u016f/1 str\u00e1nka) nebo `prezentace` (1 produkt/str\u00e1nka)\n3. Nahradit FOTO_X placeholder\u016f base64 po generaci\n4. Nahradit CDN fonty system-ui fonty (CSP blokuje fonts.googleapis.com v artifaktu)\n5. Publikovat artifact \u2014 HOTOVO\n\n**Nikdy:**\n- Ru\u010dn\u011b ps\u00e1t `width: 210mm` \u2014 zp\u016fsob\u00ed o\u0159ez v n\u00e1hledu (syst\u00e9m pou\u017e\u00edv\u00e1 760px)\n- Opakovan\u011b m\u011bnit v\u00fd\u0161ku obr\u00e1zk\u016f \u2014 layout \u0159e\u0161\u00ed Apps Script generace\n- Generovat HTML bez Apps Script syst\u00e9mu\n\n### feedback_shoptet_cdn_foto\nFile manager URL (`/user/documents/upload/...`) vrac\u00ed 404 zvenku \u2014 NIKDY ji nepou\u017e\u00edvat p\u0159\u00edmo v HTML.\n\nCDN URL pattern: `https://www.nutworld.cz/user/shop/big/{kod}-{idx}_{slug}.png`\n\n**Workflow pro fotky:**\n1. V\u017edy nejd\u0159\u00edv skenovat indexy 1\u20139 pro dan\u00fd produkt (HEAD request)\n2. Na jednom produktu m\u016f\u017ee b\u00fdt v\u00edc r\u016fzn\u00fdch fotek \u2014 r\u016fzn\u00e9 slugy i r\u016fzn\u00e9 indexy\n3. Shoptet pojmenov\u00e1v\u00e1 soubory podle p\u016fvodn\u00edho n\u00e1zvu \u2192 slug vygenerovat: lowercase, \u010desk\u00e9 znaky na ASCII, mezery/+ na poml\u010dky, multi-poml\u010dky na jednu\n4. Scraping live product page (`re.findall`) uk\u00e1\u017ee SKUTE\u010cN\u00c9 CDN URL kter\u00e9 Shoptet intern\u011b pou\u017e\u00edv\u00e1 (s `kes--u` encoding) \u2014 tyto jsou autoritativn\u00ed\n5. Pokud produkt nem\u00e1 fotky v API (`Images: []`), jsou bu\u010f je\u0161t\u011b nenahran\u00e9, nebo jen v file manageru\n\n**P\u0159\u00edklad (produkt 12346):**\n- `12346-2_...-tac-sacky.png` (idx 2, jen s\u00e1\u010dky)\n- `12346-3_...-tac-sacky-horni-pohled.png` (idx 3, horn\u00ed pohled)\n- `12346-4_...-life-style.png` (idx 4, lifestyle)\n\n**Why:** Ztratili jsme p\u016fl session t\u00edm, \u017ee jsem pou\u017eil idx-2 pro oba obr\u00e1zky m\u00edsto spr\u00e1vn\u00fdch idx-3 a idx-4.\n\n**How to apply:** P\u0159ed psan\u00edm HTML popisu v\u017edy spustit scan CDN index\u016f. Pak vybrat spr\u00e1vn\u00e9 URL pro IMG1 a IMG2.\n\n### feedback-shoptet-export\nP\u0159i generov\u00e1n\u00ed shoptet exportu v\u017edy pou\u017eij `--kod <kod_base>` a exportuj jen produkt, kter\u00fd u\u017eivatel pr\u00e1v\u011b zadal.\n\n**Why:** U\u017eivatel nechce v exportu cel\u00fd katalog \u2014 chce v\u017edy jen aktu\u00e1ln\u011b zpracovan\u00fd produkt.\n\n**How to apply:** `python3 shoptet-generator.py --kod 1522` \u2014 nikdy bez `--kod`, pokud u\u017eivatel explicitn\u011b ne\u0159ekne \"vygeneruj v\u0161echny\".\n\n### feedback_shoptet_import_encoding\nShoptet import soubory MUS\u00cd b\u00fdt **UTF-8 s BOM** (ne cp1250).\n\n**Why:** Shoptet exportuje cp1250, ale importuje o\u010dek\u00e1v\u00e1 UTF-8. Pokud po\u0161lu cp1250 import, Shoptet zobraz\u00ed \u0161patn\u00e9 znaky (\u0158\u2192\u00d8, \u010c\u2192\u00c8 atd.). UTF-8 export z Numbers fungoval spr\u00e1vn\u011b \u2014 proto minul\u00e9 importy byly OK.\n\n**How to apply:**\n- Export ze Shoptetu \u010d\u00edst jako cp1250 (decode)\n- V\u00fdstupn\u00ed import soubor zapisovat jako UTF-8 s BOM:\n  ```python\n  with open(out_path, 'wb') as f:\n      f.write('\ufeff'.encode('utf-8'))  # BOM\n      f.write(content.encode('utf-8'))\n  ```\n- Jm\u00e9no produktu (name sloupec) SM\u00cdM zahrnout \u2014 Shoptet ho p\u0159ijme a p\u0159ep\u00ed\u0161e stejnou hodnotou (vzato z jeho vlastn\u00edho exportu = bezpe\u010dn\u00e9)\n- Pokud chci jistotu, n\u00e1zev nech\u00e1m pr\u00e1zdn\u00fd `\"\"` \u2192 Shoptet ho nema\u017ee, p\u0159esko\u010d\u00ed\n\n### feedback_shoptet_merne_jednotky\nShoptet REST API nepodporuje pole `measureAmount`/`measureAmountUnit` \u2014 vrac\u00ed 422. Tato pole jdou POUZE p\u0159es CSV import v Shoptet adminu.\n\n**Why:** Shoptet API tato pole neexponuje ani v GET ani v PATCH. Bug byl v shoptet_push.py \u2014 measureAmount byl v tom sam\u00e9m requestu jako weight/dimensions, tak\u017ee 422 blokovala i push rozm\u011br\u016f. Opraveno 2026-07-27.\n\n**How to apply:**\n- Hmotnost (`weight`), rozm\u011bry (`width/height/depth`) \u2192 shoptet_push.py --prod automaticky\n- M\u011brn\u00e9 jednotky (`measureAmount: 1000, measureAmountUnit: g`) \u2192 Shoptet admin \u2192 Import produkt\u016f \u2192 `shoptet_products/{kod}_cz.csv`\n- P\u0159ipomenout u\u017eivateli CSV import v\u017edy kdy\u017e jde o nov\u00fd produkt nebo p\u0159idan\u00e9 varianty\n\n### feedback_shoptet_update_fields\nV\u0161echny Shoptet \u00fapravy jdou V\u017dDY p\u0159es API (shoptet_push.py) \u2014 nikdy nevytv\u00e1\u0159et CSV pro ru\u010dn\u00ed import v adminu.\n\nPro d\u00e1rkov\u00e9 produkty: v\u017edy p\u0159es darky-generator.py \u2192 shoptet_push.py. Viz [[feedback_darky_workflow]].\nPro standardn\u00ed produkty: shoptet-generator.py \u2192 shoptet_push.py.\n\nCSV soubory jsou V\u00ddSTUP gener\u00e1tor\u016f pro push skript \u2014 ne pro ru\u010dn\u00ed import.\n\n**Why:** U\u017eivatel opakovan\u011b upozornil, \u017ee v\u0161e jde p\u0159es API. Ru\u010dn\u00ed import = zbyte\u010dn\u00fd krok nav\u00edc.\n\n**How to apply:** Kdy\u017e dostanu \u00fakol \"uprav produkt\" \u2014 rovnou spustit spr\u00e1vn\u00fd gener\u00e1tor a push, ne vytv\u00e1\u0159et CSV soubor k ru\u010dn\u00edmu importu.\n\n### feedback-shoptet-van-zam\nK\u00f3dy jako `3993/200VAN`, `3993/200ZAM`, `3993V` jsou v Shoptetu **samostatn\u00e9 produkty** s vlastn\u00edm GUID, NIKOLI jen varianty produktu 3993.\n\n**V\u017edy ov\u011b\u0159it GUID p\u0159ed pushem:**\n```python\n# Porovnej GUIDs\ncache['3993/200']    # \u2192 09bc24fc (hlavn\u00ed produkt)\ncache['3993/200VAN'] # \u2192 69e3a7b8 (JIN\u00dd produkt = V\u00e1no\u010dn\u00ed)\ncache['3993/200ZAM'] # \u2192 719c2f50 (JIN\u00dd produkt = Zam\u011bstnaneck\u00fd)\n```\n\n**Workflow pro VAN/ZAM push:**\n1. Vytvo\u0159 vlastn\u00ed vstup soubor (vstupy/3993VAN_..._cz.csv) s v\u00e1no\u010dn\u00edm n\u00e1zvem a obsahem\n2. P\u0159idej do cenik.csv jako `\"3993VAN\"` s gram\u00e1\u017e\u00ed `\"200\"`\n3. Spus\u0165 shoptet-generator --kod 3993VAN \u2192 vygeneruje k\u00f3d `3993VAN/200`\n4. V shoptet_cz.csv **p\u0159ejmenuj k\u00f3d** `3993VAN/200` \u2192 `3993/200VAN`\n5. Push `--code 3993` \u2014 CSV m\u00e1 jen jeden \u0159\u00e1dek (3993/200VAN), sample_code = 3993/200VAN, GUID = 69e3a7b8 \u2713\n\n**Pro\u010d:** shoptet_push.py groupuje podle base k\u00f3du (3993) ale GUID lookuje p\u0159es sample_code = prvn\u00ed k\u00f3d v CSV. Pokud CSV m\u00e1 jen 3993/200VAN, pou\u017eije se spr\u00e1vn\u00fd GUID.\n\n**P\u0159\u00edklad z praxe (2026-06-08):**\n- 3993/200VAN = V\u00e1no\u010dn\u00ed mandle EXCLUSIVE \u2192 GUID 69e3a7b8-b92e-11f0-85d7-365d8fd2f28f\n- 3993VAN p\u0159id\u00e1n do cenik.csv, vstup vytvo\u0159en, k\u00f3d p\u0159ejmenov\u00e1n, push OK\n\n**How to apply:** P\u0159ed ka\u017ed\u00fdm pushem VAN/ZAM/V varianty zkontroluj GUID v shoptet_code_cache.json.\n\n### feedback_sk_hledat_kodem\nSK produkty hledat v\u017edy podle k\u00f3du (SKX2738/200), nikdy podle n\u00e1zvu \u2014 SK n\u00e1zev se m\u016f\u017ee li\u0161it od CZ (Zamilovan\u00e1 zmes \u2260 Mandle v \u010dokol\u00e1d\u011b a meru\u0148ky v jogurtu).\n\n**Why:** SK produkty maj\u00ed jin\u00e9 n\u00e1zvy ne\u017e CZ ekvivalent. Hled\u00e1n\u00ed podle n\u00e1zvu sel\u017ee nebo najde \u0161patn\u00fd produkt.\n\n**How to apply:** P\u0159i hled\u00e1n\u00ed SK GUID: iteruj varianty a porovn\u00e1vej `v['code'] == 'SKX{kod}/{gramaz}'`. Pokud k\u00f3d nen\u00ed v SK cache, dohledej p\u0159es full scan s kontrolou k\u00f3d\u016f, ne n\u00e1zv\u016f.\n\n### feedback_sk_produkt_zalozeni\nVytvo\u0159en\u00ed SK produktu p\u0159es POST `/api/products` \u2014 povinn\u00e9 fieldy:\n\n```python\napi._post_raw(\"/api/products\", {\"data\": {\n    \"name\": \"N\u00e1zev produktu\",\n    \"defaultCategoryGuid\": \"GUID_kategorie\",\n    \"visibility\": \"visible\",\n    \"variants\": [{\"code\": \"SKX12346\", \"price\": \"10.50\"}]\n}})\n```\n\n**Zak\u00e1zan\u00e9 fieldy p\u0159i vytv\u00e1\u0159en\u00ed** (zp\u016fsob\u00ed 422):\n- `code` na \u00farovni produktu (pat\u0159\u00ed jen do varianty)\n- `vatRate` a `includingVat` ve variant\u011b p\u0159i CREATE (jde nastavit a\u017e PATCHem)\n\n**SK kategorie AKCIA:** GUID `d7271d38-7db6-11ee-a1d9-32b888b76c62` \u2014 byla hidden, nyn\u00ed visible (2026-07-16)\n\n**Workflow:**\n1. POST \u2192 vytvo\u0159en\u00ed (201 = OK, 422 \"already exists\" = produkt existuje)\n2. Naskenovat posledn\u00ed str\u00e1nky list_products \u2192 naj\u00edt GUID nov\u011b vznikl\u00e9ho produktu (hledat podle \u010d\u00e1sti n\u00e1zvu)\n3. PATCH s texty (shortDescription, description, metaDescription)\n\n**Why:** Zakl\u00e1d\u00e1n\u00ed SK produktu jsme nikdy p\u0159edt\u00edm ned\u011blali p\u0159es API \u2014 bylo pot\u0159eba debugovat 422 chyby.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9m nov\u00e9m SK produktu (bundle, d\u00e1rek, akce) pou\u017e\u00edt tento pattern m\u00edsto manu\u00e1ln\u00edho zakl\u00e1d\u00e1n\u00ed v adminu.\n\n### feedback_sk_push_zakaz\nNikdy nevolat `shoptet_push.py` s SK CSV (`shoptet_darky_sk.csv`, `shoptet_sk.csv`) dokud nem\u00e1me SK API kl\u00ed\u010d. SK push jde na stejn\u00fd GUID a p\u0159ep\u00ed\u0161e CZ texty sloven\u0161tinou.\n\n**Why:** 2026-06-04 \u2014 SK push p\u0159epsal CZ texty produktu 4513 sloven\u0161tinou na nutworld.cz. Musel se d\u011blat opravn\u00fd push.\n\n**How to apply:** Po vygenerov\u00e1n\u00ed darky-generator.py pushovat V\u00ddHRADN\u011a CZ CSV. SK CSV ignorovat a\u017e do z\u00edsk\u00e1n\u00ed SK API kl\u00ed\u010de (o\u010dek\u00e1v\u00e1no 2026-06-05). Viz [[project_sk_pipeline]].\n\n### feedback_spec_cache_zachovat\nSpec soubory (specifikace/*.pdf/.doc/.docx) a cenov\u00e1 data se nikdy nep\u0159episuj\u00ed ani nema\u017eou \u2014 jsou zdrojem pravdy pro legislativn\u00ed data a ceny.\n\n**Why:** S t\u011bmito daty se pracuje dlouhodob\u011b. P\u0159eps\u00e1n\u00ed means ztr\u00e1ta legislativn\u00edch dat (slo\u017een\u00ed, alergeny, v\u00fd\u017eiva), kter\u00e1 jsou povinn\u00e1 ze z\u00e1kona.\n\n**How to apply:**\n- `spec-import.py` v\u017edy jen s `--kod XXX` (nikdy `--force` bez potvrzen\u00ed)\n- `shoptet-generator.py --kod XXX` merguje do existuj\u00edc\u00edho CSV, nep\u0159episuje ostatn\u00ed produkty\n- `shoptet_texts_cache.json` \u2014 nikdy mazat; \u0161et\u0159\u00ed API vol\u00e1n\u00ed a uchov\u00e1v\u00e1 schv\u00e1len\u00e9 texty\n- `cenik.csv` \u2014 p\u0159id\u00e1vat nov\u00e9 \u0159\u00e1dky, existuj\u00edc\u00ed m\u011bnit jen p\u0159i skute\u010dn\u00e9 zm\u011bn\u011b ceny\n- Spec soubory ve slo\u017ece `specifikace/` \u2014 jen p\u0159id\u00e1vat, nikdy mazat\n\n## Dopln\u011bno 2026-06-15 \u2014 DATAB\u00c1ZE PRODUKT\u016e\n\nZ\u00e1znamy v cenik.csv, vstup_cz.csv, vstup_sk.csv, shoptet_texts_cache.json jsou **datab\u00e1ze produkt\u016f**.\n- Data se P\u0158ID\u00c1VAJ\u00cd, nikdy nep\u0159episuj\u00ed star\u00e1 spr\u00e1vn\u00e1 data\n- M\u011bnit se sm\u00ed POUZE p\u0159i: (1) zm\u011bn\u011b n\u00e1kupn\u00ed ceny, (2) nov\u00e9/aktualizovan\u00e9 spec od dodavatele\n- C\u00edl: postupn\u011b vybudovat kompletn\u00ed produktovou datab\u00e1zi bez nutnosti znovu generovat\n\n**How to apply:**\n- spec-import: v\u017edy --kod (nikdy --force na existuj\u00edc\u00ed produkty)\n- shoptet-generator: v\u017edy --kod (merge do existuj\u00edc\u00edho CSV)\n- cenik.csv: existuj\u00edc\u00ed z\u00e1znamy m\u011bnit jen p\u0159i re\u00e1ln\u00e9 zm\u011bn\u011b ceny\n- vstup CSV: pokud z\u00e1znam existuje a spec se nezm\u011bnila \u2192 p\u0159esko\u010dit, nevymazat\n\n## CENY \u2014 KRITICK\u00c9 PRAVIDLO (2026-06-16)\n\nU\u017eivatel zad\u00e1v\u00e1 ceny pouze jednou. Pokud cena v cenik.csv chyb\u00ed:\n1. NIKDY neptat se znovu \u2014 nejd\u0159\u00edv prohledat historii chatu a pam\u011b\u0165\n2. Teprve pokud opravdu nikde nen\u00ed \u2192 zeptat se\n3. Po zad\u00e1n\u00ed ceny \u2192 okam\u017eit\u011b ulo\u017eit do cenik.csv, potvrdit ulo\u017een\u00ed\n\nP\u0159i p\u0159id\u00e1v\u00e1n\u00ed nov\u00e9ho z\u00e1znamu do cenik.csv:\n- V\u017edy zkontrolovat, zda z\u00e1znam pro dan\u00fd `kod` NEEXISTUJE (i s jin\u00fdm souborem)\n- Pokud existuje \u2192 aktualizovat jen pr\u00e1zdn\u00e1 pole, NEMAZAT existuj\u00edc\u00ed ceny\n- Z\u00e1pis do cenik.csv = APPEND only pro nov\u00e9 k\u00f3dy, UPDATE only pro pr\u00e1zdn\u00e9 pole\n\n**Why:** U\u017eivatel \u0159\u00edk\u00e1 \u201ev\u0161echny ceny jsem 100% d\u00e1val\" \u2014 data se ztr\u00e1cej\u00ed p\u0159i p\u0159episov\u00e1n\u00ed nebo nespr\u00e1vn\u00e9m appendu.\n\n## CENIK.CSV \u2014 BEZPE\u010cN\u00dd Z\u00c1PIS (2026-06-16)\n\nNIKDY nepou\u017e\u00edvat `csv.writer` pro z\u00e1pis zp\u011bt do cenik.csv \u2014 po\u0161kod\u00ed header (BOM + extra uvozovky).\nSpr\u00e1vn\u00fd zp\u016fsob aktualizace cen:\n```python\ncontent = open('cenik.csv', encoding='utf-8').read()\ncontent = content.replace(';\"kod\";\"1\";\"\"', ';\"kod\";\"1\";\"cena\"')\nopen('cenik.csv','w', encoding='utf-8').write(content)\n```\nNebo p\u0159es string replace na konkr\u00e9tn\u00ed pattern `;\"KOD\";\"1\";\"\"` \u2192 `;\"KOD\";\"1\";\"CENA\"`.\n\n### feedback_spec_dodavatel\nSpec soubor pou\u017eit\u00fd pro import mus\u00ed b\u00fdt od skute\u010dn\u00e9ho dodavatele produktu. Pokud je dodavatel HOS, mus\u00ed b\u00fdt spec od HOS \u2014 ne od MBI nebo jin\u00e9ho dodavatele.\n\n**Why:** Legislativn\u00ed data (slo\u017een\u00ed, alergeny, v\u00fd\u017eiva) mus\u00ed odpov\u00eddat skute\u010dn\u00e9 dod\u00e1vce. Rozd\u00edln\u00ed dodavatel\u00e9 maj\u00ed r\u016fzn\u00e9 receptury a alergenn\u00ed profily.\n\n**How to apply:** P\u0159i hled\u00e1n\u00ed spec na Trellu zkontrolovat n\u00e1zev souboru \u2014 mus\u00ed obsahovat jm\u00e9no spr\u00e1vn\u00e9ho dodavatele. Pokud existuje v\u00edce p\u0159\u00edloh, vybrat tu od dodavatele kter\u00fd skute\u010dn\u011b produkt dod\u00e1v\u00e1.\n\n**Postup pro .doc soubory (Word 97-2003):**\n1. Konverze: `textutil -convert docx \"specifikace/SOUBOR.doc\" -output \"specifikace/SOUBOR_converted.docx\"`\n2. Aktualizace cenik.csv: zm\u011bnit hodnotu `soubor` z `SOUBOR` na `SOUBOR_converted`\n3. Spustit spec-import znovu: `python3 spec-import.py --kod XXX`\n\nP\u0159\u00edklady produkt\u016f kde bylo pot\u0159eba: 116 (Ke\u0161u HOS), 2486 (Mandle natural HOS), 2564 (Mandle pra\u017een\u00e1 HOS) \u2014 v\u017edy HOS dodavatel pos\u00edl\u00e1 star\u00fd .doc form\u00e1t.\n\n### feedback-spec-import-force\nNikdy nespou\u0161t\u011bt `spec-import --force` jen kv\u016fli oprav\u011b encoding nebo kodu u jednoho souboru \u2014 regeneruje V\u0160ECHNY produkty v cen\u00edku, trv\u00e1 dlouho, \u017eere API kv\u00f3tu a p\u0159ep\u00ed\u0161e opraven\u00e9 kody zp\u011bt na \u0161patn\u00e9 hodnoty.\n\n**Why:** Oprava vstupy CSV kodu (nap\u0159. '1.19' \u2192 '3106') se ztr\u00e1c\u00ed p\u0159i --force regeneraci. Disk se m\u016f\u017ee zaplnit.\n\n**How to apply:** Pokud je vstupy CSV po\u0161kozen\u00e9 nebo m\u00e1 \u0161patn\u00fd encoding/kod \u2014 opravit p\u0159\u00edmo p\u0159es Python csv/DictWriter s `encoding='utf-8-sig'`. Rebuild vstup_cz.csv ud\u011blat ru\u010dn\u011b nebo spec-import bez --force (p\u0159esko\u010d\u00ed existuj\u00edc\u00ed soubory a jen p\u0159estav\u00ed vstup_cz.csv).\n\n### feedback-spec-z-chatu\nPokud u\u017eivatel po\u0161le spec produktu jako text v chatu (slo\u017een\u00ed, alergeny, v\u00fd\u017eiva, p\u016fvod), ulo\u017eit p\u0159\u00edmo jako vstupy/{kod}_*_cz.csv a vstupy/{kod}_*_sk.csv \u2014 bez PDF/DOCX a bez spec-import.py.\n\n**Why:** Darky-generator.py \u010dte spec z vstupy/ slo\u017eky, ne z hlavn\u00edho vstup_cz.csv. Spec-import.py pot\u0159ebuje soubor na disku.\n\n**How to apply:** Vytvo\u0159it oba soubory ru\u010dn\u011b dle struktury z jin\u00fdch vstup soubor\u016f. Z\u00e1rove\u0148 p\u0159idat \u0159\u00e1dek do vstup_cz.csv a vstup_sk.csv pro shoptet-generator.\n\n### feedback-tip-box-darky\n# Tip box v d\u00e1rkov\u00fdch podkategori\u00edch \u2014 zak\u00e1z\u00e1n\n\n## Pro\u010d\nU\u017eivatel explicitn\u011b odstranil tip box (\"dej pry\u010d\") p\u0159i kontrole kategorie D\u00e1rkov\u00e9 krabice. \u017dlut\u00fd info box na konci popisu do d\u00e1rkov\u00fdch podkategori\u00ed nepat\u0159\u00ed.\n\n## Pravidlo\nD\u00e1rkov\u00e9 podkategorie (v\u0161e pod \"Tipy na d\u00e1rky\": Podle p\u0159\u00edle\u017eitosti, Podle balen\u00ed, Pro koho, Firemn\u00ed d\u00e1rky) maj\u00ed layout:\n\n**hero + H3 + odstavec**\n\nBez tip boxu. Tip box div se v\u016fbec nep\u00ed\u0161e.\n\n## Jak aplikovat\n- P\u0159i psan\u00ed `description` HTML pro jakoukoli podkategorii pod \"Tipy na d\u00e1rky\" \u2014 vynechat \u017elut\u00fd tip box div \u00fapln\u011b\n- Spr\u00e1vn\u00fd layout: hero blok \u2192 H3 nadpis \u2192 odstavec textu \u2192 konec\n- Tip box (`background:#fffbea; border:...` nebo podobn\u00fd \u017elut\u00fd/info styl) = NEPOU\u017d\u00cdVAT v d\u00e1rkov\u00fdch podkategori\u00edch\n- Ostatn\u00ed podkategorie (o\u0159echy, ovoce, sem\u00ednka) maj\u00ed alergen box \u2014 ten je jin\u00fd a z\u016fst\u00e1v\u00e1 tam kde pat\u0159\u00ed\n\n### feedback-web-fetch\nP\u0159i jak\u00e9koli URL ve zpr\u00e1v\u011b v\u017edy fetchni automaticky bez ptan\u00ed \u2014 plat\u00ed pro spec, produktov\u00e9 str\u00e1nky, i artifact linky.\n\n**Why:** U\u017eivatel opakovan\u011b potvrdil \"v\u017edy m\u016f\u017ee\u0161 otev\u0159\u00edt / tahat\" \u2014 nechce, aby se Claude ptal o povolen\u00ed p\u0159i otev\u00edr\u00e1n\u00ed extern\u00edch odkaz\u016f.\n**How to apply:** WebFetch spus\u0165 rovnou. Plat\u00ed pro specifikace dodavatel\u016f, Shoptet produkty, artifact URL i jak\u00e9koli jin\u00e9 URL v konverzaci.\n\n### feedback-zele-vychozi\nPokud u\u017eivatel neuvede jinak, plat\u00ed pro v\u0161echna \u017eel\u00e9 bonb\u00f3nov\u00e1 produkty:\n- **kg_czk = 95 K\u010d bez DPH**\n- **zeme_puvodu = \u010cesk\u00e1 republika**\n\n**Why:** U\u017eivatel explicitn\u011b stanovil v\u00fdchoz\u00ed pravidlo 2026-06-08 \u2014 opakovan\u00e9 zad\u00e1v\u00e1n\u00ed zbyte\u010dn\u00e9.\n\n**How to apply:** P\u0159i zpracov\u00e1n\u00ed \u017eel\u00e9 produktu bez uveden\u00e9 ceny automaticky pou\u017e\u00edt 95 K\u010d/kg a \u010cR p\u016fvod. Pt\u00e1t se jen pokud cena explicitn\u011b chyb\u00ed A jde o nestandardn\u00ed produkt.\n\n### feedback_zeme_puvodu_mix\nU mix produkt\u016f (sm\u011bs\u00ed) plat\u00ed toto pravidlo pro zemi p\u016fvodu:\n\n1. **Ve slo\u017een\u00ed** \u2014 za ka\u017edou slo\u017eku uv\u00e9st `p\u016fvod: [zem\u011b]` na konci jej\u00ed z\u00e1vorky\n   - CZ: `p\u016fvod: Slovensko` (nebo p\u0159\u00edslu\u0161n\u00e1 zem\u011b)\n   - SK: `p\u00f4vod: Slovensko`\n\n2. **Pole zeme_puvodu** \u2014 v\u017edy `\u010cesk\u00e1 republika` (sm\u011bs je vyrobena / m\u00edch\u00e1na v \u010cR)\n\n3. **Na konci slo\u017een\u00ed** p\u0159idat: `Vyrobeno v \u010cR.` (CZ) / `Vyroben\u00e9 v \u010cR.` (SK)\n\n**Why:** Potvrzeno u\u017eivatelem 2026-06-04. EU 1169/2011 vy\u017eaduje uv\u00e9st zemi p\u016fvodu prim\u00e1rn\u00edch slo\u017eek + m\u00edsto v\u00fdroby fin\u00e1ln\u00edho produktu.\n\n**How to apply:** P\u0159i vytv\u00e1\u0159en\u00ed syntetick\u00e9ho vstup CSV pro mix produkty (1985 a jin\u00e9) v\u017edy aplikovat tento vzor. Plat\u00ed i pro sm\u011bsi v mix.csv kde jsou slo\u017eky z r\u016fzn\u00fdch zem\u00ed.\n\n### project_akce_bundle\n## Hotov\u00e9 bundle produkty (2026-07-15/16)\n\n| CZ k\u00f3d | SK k\u00f3d | Obsah | CZ cena | SK cena | CZ GUID | SK GUID |\n|--------|--------|-------|---------|---------|---------|---------|\n| 12343 | SKX12343 | Mandle uzen\u00e9 200g + Mandle v medu a soli 200g + Krekry chilli 150g ZDARMA | 244 K\u010d | 11,00 \u20ac | bf599898-805b-11f1-94ba-bc24118d1237 | 3f0415e4-8069-11f1-a7fe-bc2411d2ad44 |\n| 12346 | SKX12346 | Pist\u00e1cie solen\u00e9 200g + Ke\u0161u solen\u00e9 200g + Krekry origin\u00e1l 150g ZDARMA | 248 K\u010d | 10,50 \u20ac | ba3e6440-8062-11f1-8c25-bc2411e3024b | ddb35303-80d3-11f1-a7fe-bc2411d2ad44 |\n\nCZ kategorie: Letn\u00ed AKCE | SK kategorie: AKCIA (`d7271d38-7db6-11ee-a1d9-32b888b76c62`)\n\n## HTML struktura popisu (SHOPTET_RULESET_V8)\n\n**Kr\u00e1tk\u00fd popis:** 2 v\u011bty + hn\u011bd\u00fd (#83502E) benefit box se 3 body\n\n**Dlouh\u00fd popis \u2014 sekce:**\n1. nw-claim (S l\u00e1skou a k\u0159upnut\u00edm)\n2. nw-hero s \u010derven\u00fdm (#da1668) AKCE 2+1 ZDARMA badge + H1 + perex s gram\u00e1\u017eemi\n3. Grid 1: IMG1 + \"O akci\" karta (v\u00fdpis 3 produkt\u016f + celkov\u00e1 hodnota vs. cena)\n4. Grid 2: \"Pro\u010d si vybrat\" karta + IMG2\n5. \"Kdy s\u00e1hnout\" karta (2 sloupce, 6 bullet)\n6. nw-tip\n7. nw-recipe (Inspirace)\n8. 4\u00d7 badge (doru\u010den\u00ed, suroviny, d\u00e1rek, z\u00e1kazn\u00edci)\n9. **3\u00d7 nw-table** \u2014 ka\u017ed\u00fd produkt
