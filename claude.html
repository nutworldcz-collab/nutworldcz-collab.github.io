vu)\nScript: `/tmp/color_swap_cz.py` obsahuje funkce:\n- `swap_ovoce(html)` \u2014 hn\u011bd\u00e1 \u2192 \u010dervenohn\u011bd\u00e1 + `#da1668`\n- `swap_orechy(html)` \u2014 solid \u2192 gradient, zlat\u00e1 z\u016fst\u00e1v\u00e1\n- `swap_seminka(html)` \u2014 star\u00fd zelen\u00fd \u2192 nov\u00fd zelen\u00fd, kruh a linka\n\n**Why:** CZ color-swap proveden 2026-06-09 pro sjednocen\u00ed s definovan\u00fdm barevn\u00fdm sch\u00e9matem.\n\n### project-darkova-krabicka-pravidla\n## Dva vzory \u2014 kde jsou ulo\u017eeny\n\n### Vzor 1: Single produkt\n- **K\u00f3d:** `nw_core.py` \u2192 funkce `generate_texts()` + `build_description()`\n- **Gener\u00e1tor:** `shoptet-generator.py` (Claude API, RULESET V8, 21 sekc\u00ed)\n- Pou\u017e\u00edv\u00e1 se pro: v\u0161echny samostatn\u00e9 produkty (o\u0159echy, su\u0161en\u00e9 ovoce, snacky...)\n- V\u00fdstup: shoptet_cz.csv + shoptet_sk.csv \u2192 import do Shoptetu\n\n### Vzor 2: D\u00e1rkov\u00e1 krabi\u010dka\n- **K\u00f3d:** ru\u010dn\u011b psan\u00fd HTML, pushnut\u00fd p\u0159es `nw_shoptet.py` (PATCH API)\n- **Vzorov\u00e9 produkty:** 4621XRED (\u010derven\u00e1 krabice pro \u017eeny), 4621XBLACK (\u010dern\u00e1 krabice pro mu\u017ee), 2x50g v\u00e1no\u010dn\u00ed\n- Pou\u017e\u00edv\u00e1 se pro: v\u0161echny gift boxy, limitovan\u00e9 edice, sestaven\u00e9 krabi\u010dky\n- V\u00fdstup: p\u0159\u00edmo do Shoptetu p\u0159es API\n\n## Struktura popisu d\u00e1rkov\u00e9 krabi\u010dky (povinn\u00e9 sekce v tomto po\u0159ad\u00ed)\n\n1. **Kr\u00e1tk\u00fd popis (shortDescription)** \u2014 prodejn\u00ed, podpo\u0159uje SEO, max 2 v\u011bty\n2. **Hero motivace** \u2014 emocion\u00e1ln\u00ed sekce, pro\u010d si krabi\u010dku koupit\n3. **Co se skr\u00fdv\u00e1 uvnit\u0159** \u2014 grid nebo seznam obsahu s gram\u00e1\u017eemi\n4. **Pro\u010d zrovna tento d\u00e1rek** \u2014 diferenciace, co d\u011bl\u00e1 krabi\u010dku v\u00fdjime\u010dnou\n5. **Pro koho je ide\u00e1ln\u00ed** \u2014 seznam p\u0159\u00edle\u017eitost\u00ed (narozeniny, V\u00e1noce, firemn\u00ed d\u00e1rek...)\n6. **Rozm\u011br krabi\u010dky** \u2014 pokud je uveden (form\u00e1t: X \u00d7 Y \u00d7 Z cm)\n7. **Fin\u00e1ln\u00ed CTA sekce** \u2014 v\u00fdzva k akci + odkaz/zm\u00ednka Nutworld pro firmy (vzor: produkt 250XZXVAN)\n8. **Legislativn\u00ed informace** \u2014 karty pro ka\u017ed\u00fd produkt v krabi\u010dce\n\n## Legislativa \u2014 pravidla (stejn\u00e1 jako single produkt)\n\n- Ka\u017ed\u00fd produkt dostane vlastn\u00ed kartu (div)\n- Karta obsahuje: N\u00e1zev (gram\u00e1\u017e) | Slo\u017een\u00ed | Alergeny v CAPS+tu\u010dn\u011b | Stopov\u00e9 alergeny | Info \u0159\u00e1dek | V\u00fd\u017eivov\u00e1 tabulka na 100g\n- Alergeny ve slo\u017een\u00ed: vyzna\u010deny **VELK\u00ddM P\u00cdSMEM a tu\u010dn\u011b** (`<strong>N\u00c1ZEV</strong>`)\n- Kurziv\u00e1lou pod slo\u017een\u00edm: *\"Alergeny jsou ve slo\u017een\u00ed vyzna\u010deny VELK\u00ddM P\u00cdSMEM a tu\u010dn\u011b.\"*\n- **Trvanlivost: NEVKL\u00c1DAT konkr\u00e9tn\u00ed \u010d\u00edslo** \u2014 m\u00edsto toho v\u017edy: *\"Aktu\u00e1ln\u00ed trvanlivost je uvedena na obalu produktu.\"*\n- Zem\u011b p\u016fvodu: uv\u00e9st pokud je zn\u00e1m\u00e1\n- Info \u0159\u00e1dek form\u00e1t: `Aktu\u00e1ln\u00ed trvanlivost je uvedena na obalu produktu. | Zem\u011b p\u016fvodu: X`\n\n## CTA sekce \u2014 vzor\n\n- Odkazovat na mo\u017enost Nutworld pro firmy (B2B firemn\u00ed d\u00e1rky)\n- Vzorov\u00fd produkt: 250XZXVAN \u2014 ov\u011b\u0159it aktu\u00e1ln\u00ed zn\u011bn\u00ed z live webu\n- Sekce by m\u011bla b\u00fdt vizu\u00e1ln\u011b odd\u011blen\u00e1 (tmav\u00e9 pozad\u00ed, v\u00fdrazn\u00e9 CTA)\n\n## Vizu\u00e1ln\u00ed pravidla\n\n- Barvy dle designu krabi\u010dky (\u010derven\u00e1 = #da1668 akcent, \u010dern\u00e1 = #f7ab31 akcent)\n- Obsah grid: 2 sloupce, sv\u011btl\u00e9 pozad\u00ed dle barvy krabi\u010dky\n- Legislativn\u00ed karty: b\u00edl\u00e9, border-radius, border-left barevn\u00fd akcent\n- V\u00fd\u017eivov\u00e1 tabulka: sv\u011btle r\u016f\u017eov\u00e1/hn\u011bd\u00e1 z\u00e1hlav\u00ed dle barvy krabi\u010dky\n\n**Why:** Z\u00e1kazn\u00edk pot\u0159ebuje vid\u011bt motivaci \u2192 obsah \u2192 zd\u016fvodn\u011bn\u00ed \u2192 legislativu v logick\u00e9m po\u0159ad\u00ed. CTA na konci s firemn\u00edm odkazem zvy\u0161uje B2B konverze.\n**How to apply:** P\u0159i ka\u017ed\u00e9m vytv\u00e1\u0159en\u00ed nebo \u00faprav\u011b d\u00e1rkov\u00e9 krabi\u010dky zkontrolovat v\u0161ech 8 sekc\u00ed. Trvanlivost NIKDY konkr\u00e9tn\u00ed \u010d\u00edslo \u2014 v\u017edy odkaz na obal.\n\n### project_darky_filtry\nFin\u00e1ln\u00ed sada filteringProperty filtr\u016f pro d\u00e1rkov\u00e9 produkty (368 produkt\u016f z darky.csv).\nSkript: `darky_filtry.py` \u2192 v\u00fdstup `darky_filtry_import.csv`\n\n**Why:** Shoptet API neum\u00ed vytv\u00e1\u0159et parametrov\u00e9 skupiny \u2014 jde to p\u0159es CSV import produkt\u016f s filteringProperty sloupci.\n\n**How to apply:** P\u0159ed importem spustit `python3 darky_filtry.py`, zkontrolovat preview, pak importovat CSV v Shoptet adminu (Zbo\u017e\u00ed \u2192 Import/Export \u2192 Import produkt\u016f). Po importu ru\u010dn\u011b p\u0159i\u0159adit skupiny ke kategori\u00edm v adminu.\n\n## Fin\u00e1ln\u00ed filtry (5 skupin)\n\n| Filtr | Hodnoty |\n|-------|---------|\n| **Cena** | do 150 K\u010d \u00b7 151\u2013300 K\u010d \u00b7 301\u2013500 K\u010d \u00b7 500+ K\u010d |\n| **Typ balen\u00ed** | D\u00e1rkov\u00e1 krabice \u00b7 S\u00e1\u010dek/kornout \u00b7 EKO kel\u00edmek \u00b7 Kazetka 50g \u00b7 Skleni\u010dka EXCLUSIVE \u00b7 Skleni\u010dka DELUXE |\n| **Slo\u017een\u00ed** | O\u0159echy \u00b7 Mix \u00b7 Solen\u00e9/uzen\u00e9 \u00b7 \u010cokol\u00e1dov\u00e9 \u00b7 Su\u0161en\u00e9 ovoce (multi-value p\u0159es \\|) |\n| **Proveden\u00ed** | Pr\u016fhledn\u00e1 \u00b7 S v\u00fd\u0159ezem \u00b7 Nepr\u016fhledn\u00e1 |\n| **Specifikace d\u00e1rku** | S pe\u010det\u00ed \u00b7 S vlastn\u00edm vzkazem (multi-value p\u0159es \\|) |\n\n## K\u00f3dy krabi\u010dek S V\u00dd\u0158EZEM (vnit\u0159n\u00ed v\u00fdsek dr\u017e\u00ed produkty)\n\n```\n4561XSLAD, 4561XSLAN, 4561XMIX, 4561XMIX2,\n4563XMIX, 4563XSLAD, 4563XSLAN,\n4562XSLAD, 4562XDSLAN, 4562XSLAN,\n4565XMIXXE1, 4565XMIXXE2,\n4568XMIXXE1, 4568XMIXXE2,\n4598XEXMAN, 4598XEXKES, 4598XEXMIX, 4598XEXAR,\n4563XMIKU, 4561XZAM, 4563XZAM, 4563XVEL, 4561XVEL\n```\n\nZdroj: soubor \"d\u00e1rkov\u00e9 krabi\u010dky s v\u00fdsekem.csv\" od u\u017eivatele (2026-07-09)\n\n## Rozhodnut\u00ed (2026-07-09)\n\n- Pro koho a P\u0159\u00edle\u017eitost NEJSOU filtry \u2014 \u0159e\u0161\u00ed je stromem kategori\u00ed (lep\u0161\u00ed pro reklamy = \u010dist\u00e9 URL)\n- `/darkove-krabice-orechy-ovoce/` je nejvyt\u00ed\u017een\u011bj\u0161\u00ed kategorie krabi\u010dky (1 981 klik\u016f, 54 931 zobrazen\u00ed) \u2014 nechat, zbytek schovat\n- `/darkove-krabice-s-prekvapenim/` (312 klik\u016f) \u2014 schovat te\u010f, p\u0159idat 301 redirect na `/darkove-krabice-orechy-ovoce/` po potvrzen\u00ed\n- Stav: CSV p\u0159ipraveno, \u010dek\u00e1 na import a ru\u010dn\u00ed nastaven\u00ed filtr\u016f v kategori\u00edch\n\n## Celof\u00e1nek & kel\u00edmek filtry (2026-07-14)\n\n- Skript: `/Users/user/Documents/apply_filtry_kelimek.py`\n- V\u00fdstup: `import_filtry_kelimek_utf8.csv` (UTF-8 s BOM, 183 produkt\u016f)\n- Vypln\u011bno: Cenov\u00e1 relace + Lyofilizace + MIX + Natural + Sladk\u00e9 + Slan\u00e9\n- Nov\u00e1 hodnota Sladk\u00e9 p\u0159id\u00e1na: **Bonb\u00f3ny a cukrovinky** (marshmallow, \u017eel\u00e9, gummies)\n- Stav: p\u0159ipraveno k nahr\u00e1n\u00ed do Shoptetu\n\n### project-darky-koncept\nSyst\u00e9m pro automatizaci popis\u016f d\u00e1rkov\u00fdch krabi\u010dek. Pln\u011b funk\u010dn\u00ed od 2026-05-28.\n\n**Why:** D\u00e1rky jsou kl\u00ed\u010dov\u00fd B2B segment (v\u00e1noce, firemn\u00ed), produkt\u016f budou des\u00edtky, ru\u010dn\u00ed psan\u00ed popis\u016f nen\u00ed \u0161k\u00e1lovateln\u00e9.\n\n**How to apply:** P\u0159i p\u0159id\u00e1n\u00ed nov\u00e9 krabi\u010dky p\u0159idat \u0159\u00e1dek do darky.csv a spustit darky-generator.py. Viz workflow n\u00ed\u017ee.\n\n## Soubory\n\n- `darky.csv` \u2014 master seznam krabi\u010dek (zdroj pravdy)\n- `darky-generator.py` \u2014 gener\u00e1tor popis\u016f\n- `Nutworld/docs/darkova-krabicka-nahled.html` \u2014 HTML n\u00e1hled \u0161ablony\n\n## darky.csv struktura\n\n| pole | popis |\n|---|---|\n| `kod_shoptet` | k\u00f3d v Shoptetu (nap\u0159. 250XZXVAN) |\n| `nazev_cz` / `nazev_sk` | n\u00e1zev produktu |\n| `obsah` | `4794:50,4038:50` \u2014 kod:gram\u00e1\u017e, \u010d\u00e1rkou |\n| `tema` | vanoce / narozeniny / firemni / univerzalni |\n| `obal_krabicky` | v\u00e1no\u010dn\u00ed krabi\u010dka / d\u0159ev\u011bn\u00e1 bed\u00fdnka / ... |\n| `obal_obsahu` | sacek / doypack / celofan / mix |\n| `cena_czk_s_dph` | MO cena s DPH v K\u010d |\n| `vo_cena_czk_s_dph` | VO cena s DPH v K\u010d |\n| `rozmery` | \"140x90x25\" mm |\n\n## Workflow pro novou krabi\u010dku\n\n1. U\u017eivatel nap\u00ed\u0161e: k\u00f3d, produkty (kod:gram\u00e1\u017e), ceny, rozm\u011bry, obal\n2. P\u0159idat \u0159\u00e1dek do darky.csv\n3. Ov\u011b\u0159it, \u017ee v\u0161echny produkty maj\u00ed vstupy CSVs (jinak spec-import)\n4. `python3 darky-generator.py --kod XXX`\n5. Naj\u00edt GUID v Shoptetu \u2192 p\u0159idat do shoptet_code_cache.json\n6. `echo \"ano\" | python3 shoptet_push.py --code XXX --prod --csv shoptet_darky_cz.csv`\n\n## P\u0159\u00edkazy\n\n```bash\npython3 darky-generator.py --krabicky                   # p\u0159ehled v\u0161ech krabi\u010dek a slo\u017een\u00ed\npython3 darky-generator.py --kod 250XZXVAN              # jedna krabi\u010dka\npython3 darky-generator.py --update-produkt 4038        # p\u0159egeneruj v\u0161echny krabi\u010dky s 4038\n```\n\n## D\u016fle\u017eit\u00e9 technick\u00e9 pozn\u00e1mky\n\n- Push pou\u017e\u00edv\u00e1 `--csv shoptet_darky_cz.csv` (ne v\u00fdchoz\u00ed shoptet_cz.csv)\n- D\u00e1rkov\u00e9 krabi\u010dky jsou v Shoptetu v kategorii \"Tipy na d\u00e1rky\" (GUID: 2a648227-d7b1-11e0-9a5c-feab5ed617ed) \u2014 1147 produkt\u016f, hled\u00e1n\u00ed trv\u00e1 d\u00e9le\n- `druh` pole ve vstupy CSV mus\u00ed b\u00fdt spr\u00e1vn\u00e9 \u2014 \"dra\u017eovan\u00e9\" plat\u00ed jen pro \u010dokol\u00e1dov\u00e9/jogurtov\u00e9 produkty, NE pro med a s\u016fl\n- obal_obsahu `sacek` = pr\u016fhledn\u00fd zataven\u00fd s\u00e1\u010dek (ne doypack, ne celof\u00e1n)\n\n## Princip slou\u010den\u00e9 etikety (legislativa)\n\n- Slo\u017een\u00ed: ka\u017ed\u00fd produkt zvl\u00e1\u0161\u0165 v bloku (z\u00e1kon to tak vy\u017eaduje pro slo\u017een\u00e9 bal\u00ed\u010dky)\n- Alergeny: sjednocen\u00e9 ze v\u0161ech produkt\u016f automaticky (union stopy pol\u00ed)\n- V\u00fd\u017eiva: tabulka per produkt (z\u00e1kon nevy\u017eaduje v\u00e1\u017een\u00fd pr\u016fm\u011br)\n- Trvanlivost: nejkrat\u0161\u00ed z obsahu\n\n## B2B sekce (pevn\u00e1, na ka\u017ed\u00e9 krabi\u010dce)\n\nT\u0159i pil\u00ed\u0159e \u2014 p\u0159id\u00e1ny automaticky gener\u00e1torem:\n1. **Velkoobchodn\u00ed n\u00e1kup** \u2014 cel\u00fd sortiment pro firmy\n2. **Firemn\u00ed d\u00e1rky pod Nutworld brandem** \u2014 custom balen\u00ed, slo\u017een\u00ed, p\u0159\u00e1n\u00ed\n3. **Priv\u00e1tn\u00ed zna\u010dka** \u2014 jejich logo, Nutworld kvalita\n\nKontakt: info@nutworld.cz, do 24 hodin. Bez \"Ru\u010dn\u011b baleno v Praze\" \u2014 jen \"Ru\u010dn\u011b baleno\".\n\n## Typy obal\u016f a cenov\u00e9 vzorce\n\n| obal_krabicky | MO vzorec | VO pom\u011br | Obal | Pr\u00e1ce | Gram\u00e1\u017e |\n|---|---|---|---|---|---|\n| kraft kel\u00edmek | VAT/(1-0.54) | \u00d70.7 | 8 K\u010d | 16 K\u010d | r\u016fzn\u00e9 |\n| d\u00e1rkov\u00e1 krabi\u010dka | VAT/(1-0.5) | \u00d70.7 | 15\u201320 K\u010d | 20\u201335 K\u010d | r\u016fzn\u00e9 |\n| **d\u00e1rkov\u00e1 kazetka** | VAT/(1-0.47) | **\u00d70.8** | **8 K\u010d** | **14 K\u010d** | **50g** |\n\n## D\u00e1rkov\u00e1 kazetka \u2014 specifikace (2026-06-05)\n- Ploch\u0 `zaj\u00ed\u010dek` | 180g | 10 K\u010d | 10 K\u010d | **velikonoce** | V\u017dDY velikonoce, ne narozeniny! |\n| `celof\u00e1nek s ma\u0161li\u010dkou` | variabiln\u00ed | 10 K\u010d | 10 K\u010d | univerzalni | ~50% mar\u017ee c\u00edl |\n| `d\u00e1rkov\u00e1 krabice s kel\u00edmky` | 2\u00d7 variabiln\u00ed (v\u00fdchoz\u00ed 2\u00d7180g) | **69 K\u010d** | **17 K\u010d** | univerzalni/velikonoce | krabice 250\u00d7220\u00d760 mm, obal_obsahu=celofan, MO=(total\u00d71,12)/0,50, VO=MO\u00d70,8 |\n| `d\u00e1rkov\u00e1 krabi\u010dka 3x eko kel\u00edmek` | 3\u00d7 variabiln\u00ed (v\u00fdchoz\u00ed 3\u00d7100g) | **70 K\u010d** | **30 K\u010d** | univerzalni/vanoce/velikonoce | krabi\u010dka 350\u00d7130\u00d790 mm, obal_obsahu=celofan, MO=(total\u00d71,12)/0,50, VO=MO\u00d70,8 |\n| `d\u00e1rkov\u00e1 krabice deluxe 3x skleni\u010dka` | 3\u00d7 variabiln\u00ed (v\u00fdchoz\u00ed 3\u00d7180g) | **82 K\u010d** | **33 K\u010d** | univerzalni | krabice 350\u00d7130\u00d790 mm, obal_obsahu=sacek, MO=(total\u00d71,12)/0,50, VO=MO\u00d70,8 |\n| `d\u00e1rkov\u00e1 krabice v\u00fdsekov\u00e1 l` | 5\u00d7 variabiln\u00ed | **85 K\u010d** | **50 K\u010d** | univerzalni | krabice 320\u00d7210\u00d790 mm, obal_obsahu=sacek, MO=(total\u00d71,12)/0,50, VO=MO\u00d70,8 |\n| `d\u00e1rkov\u00e1 krabice v\u00fdsekov\u00e1 xl` | 7\u00d7 variabiln\u00ed | **129 K\u010d** | **55 K\u010d** | univerzalni | krabice 300\u00d7310\u00d790 mm, obal_obsahu=sacek, MO=(total\u00d71,12)/0,50, VO=MO\u00d70,8 |\n\n## Workflow\n1. P\u0159idat \u0159\u00e1dek do `darky.csv` (kod_shoptet; nazev_cz; nazev_sk; tema; obal_krabicky; obal_obsahu; obsah; cena_czk_s_dph; vo_cena_czk_s_dph; rozmery; naklady_obal; naklady_prace)\n2. `python3 darky-generator.py --kod XXX --lang cz`\n3. Push p\u0159es `shoptet_push.py` nebo p\u0159\u00edmo p\u0159es GUID pro produkty s lom\u00edtkem v k\u00f3du\n4. Ceny pushovat zvl\u00e1\u0161\u0165 p\u0159es pricelist API (1 = MO, 3 = VO)\n\n## D\u016fle\u017eit\u00e9 pozn\u00e1mky\n- L\u00edskovce o\u0159echy: v\u017edy \"L\u00edskovce o\u0159echy\", nikdy jen \"L\u00edskovce\"\n- Roll-up produkty (4725, 3624): push textu p\u0159es GUID (ne shoptet_push --code)\n- find_vstup() zvl\u00e1d\u00e1 mezeru i podtr\u017e\u00edtko v n\u00e1zvu souboru vstupy/\n- Varianty s lom\u00edtkem (3703/150, 3702/150...): ceny pushovat p\u0159es pricelist API p\u0159\u00edmo, texty p\u0159es GUID parentu\n\n**Why:** Syst\u00e9m byl roz\u0161\u00ed\u0159en 2026-06-07 z p\u016fvodn\u00edch 3 typ\u016f na 7 typ\u016f obal\u016f.\n**How to apply:** P\u0159i p\u0159id\u00e1v\u00e1n\u00ed nov\u00e9ho d\u00e1rkov\u00e9ho produktu vybrat spr\u00e1vn\u00fd typ a pou\u017e\u00edt workflow v\u00fd\u0161e.\n\n### project_dokument_generator\n# Gener\u00e1tor dokument\u016f \u2014 chat rozhran\u00ed\n\nLive: https://nutworldcz-collab.github.io/dokument.html\n\n## Architektura\n- **Frontend**: statick\u00e1 HTML str\u00e1nka na GitHub Pages (repo: nutworldcz-collab/nutworldcz-collab.github.io)\n- **Backend**: Google Apps Script proxy \u2014 p\u0159ij\u00edm\u00e1 requesty z browseru, vol\u00e1 Anthropic API\n- **API kl\u00ed\u010d**: ulo\u017een v Apps Scriptu (ne v browseru, ne v k\u00f3du)\n\n## Apps Script URL (aktu\u00e1ln\u00ed \u2014 ov\u011b\u0159eno z dokument.html)\n`https://script.google.com/macros/s/AKfycbyB2V0l9gc3OFh-yx2SlfTkWP4PmPhus7IF00g3qIjTzpSbRskXiJ5a0rGBQ0EKlyU/exec`\n\n## \u0160\u00ed\u0159ka dokument\u016f\nDokumenty generovan\u00e9 syst\u00e9mem maj\u00ed **\u0161\u00ed\u0159ku ~760px** \u2014 NE `210mm`. Tisk funguje p\u0159es CSS `@media print` a automatick\u00e9 \u0161k\u00e1lov\u00e1n\u00ed prohl\u00ed\u017ee\u010de. NIKDY ned\u00e1vat `width: 210mm` do ru\u010dn\u011b generovan\u00fdch dokument\u016f \u2014 zp\u016fsob\u00ed o\u0159ez v n\u00e1hledu.\n\n## SPR\u00c1VN\u00dd WORKFLOW pro B2B prezentace\n\n**V\u017edy pou\u017e\u00edt Apps Script syst\u00e9m \u2014 NIKDY ru\u010dn\u011b ps\u00e1t CSS/HTML pro prezentace.**\n\n```python\nimport requests, json, base64, re\n\nAPPS_SCRIPT = \"https://script.google.com/macros/s/AKfycbyB2V0l9gc3OFh-yx2SlfTkWP4PmPhus7IF00g3qIjTzpSbRskXiJ5a0rGBQ0EKlyU/exec\"\n\nSYSTEM = \"\"\"[system prompt z dokument.html \u2014 p\u0159e\u010d\u00edst p\u0159ed ka\u017edou generac\u00ed]\"\"\"\n\n# 1. Vygenerovat HTML p\u0159es Apps Script\npayload = {\"model\": \"claude-sonnet-4-6\", \"max_tokens\": 8000, \"system\": SYSTEM,\n           \"messages\": [{\"role\": \"user\", \"content\": \"Vytvo\u0159 nab\u00eddku pro [firma]...\"}]}\nr = requests.post(APPS_SCRIPT, data=json.dumps({\"action\":\"claude\",\"payload\":payload}),\n                  headers={\"Content-Type\":\"text/plain\"}, timeout=180)\nraw = r.json()[\"content\"][0][\"text\"]\nhtml = re.search(r'<DOC>\\n?(.*?)(?:</DOC>|$)', raw, re.DOTALL).group(1).strip()\n\n# 2. Nahradit fonty (CDN blokov\u00e1no v artifaktu)\nhtml = html.replace(\"'Exo 2'\", \"'Segoe UI', system-ui, sans-serif\")\nhtml = html.replace(\"'Source Sans 3'\", \"system-ui, sans-serif\")\nhtml = re.sub(r'<link[^>]*fonts\\.googleapis[^>]*>', '', html)\n\n# 3. Nahradit FOTO_X placeholdery base64\n# sips -Z 1200 foto.jpg --out foto_resized.jpg\n# b64 = \"data:image/jpeg;base64,\" + base64.b64encode(open(\"foto_resized.jpg\",\"rb\").read()).decode()\nhtml = html.replace('src=\"FOTO_1\"', f'src=\"{b64_foto1}\"')\n\n# 4. Ulo\u017eit\nwith open(\"nabidka_firma.html\", \"w\") as f:\n    f.write(html)\n```\n\n## Typy dokument\u016f (z system promptu)\n- `prezentace` \u2014 ka\u017ed\u00fd produkt VLASTN\u00cd STR\u00c1NKA (page-break-after:always), velk\u00fd obr\u00e1zek, cena \u010derven\u011b, tagy\n- `nabidka` \u2014 v\u00edce produkt\u016f na 1 str\u00e1nce, tabulka s cenami, prodejn\u00ed text\n- `katalog` \u2014 tituln\u00ed + produktov\u00e9 str\u00e1nky (1\u20133 na str\u00e1nku) + z\u00e1v\u011br\n- `cenik` \u2014 tabulka, sou\u010det\n- `dopis` \u2014 p\u0159\u00edjemce, text, podpis\n- `infolist` \u2014 sekce s nadpisy\n\n**Pro B2B nab\u00eddku v\u00edce produkt\u016f na 1 str\u00e1nce \u2192 typ `nabidka`, ne `prezentace`.**\n\n## Fotky produkt\u016f\n- Placeholders: FOTO_1, FOTO_2... (\u010d\u00edslovan\u00e9)\n- Workflow: st\u00e1hnout (Trello API / curl) \u2192 `sips -Z 1200 foto.jpg` \u2192 `base64 -i foto.jpg` \u2192 inject\n- `object-fit: contain` (ne cover) \u2014 aby bylo vid\u011bt cel\u00e9 foto\n\n## Form\u00e1t odpov\u011bdi (Claude)\n```\nTYPE:prezentace\nNOTE:Kr\u00e1tk\u00e1 zpr\u00e1va\n<DOC>\n...HTML obsah...\n</DOC>\n```\n- `</DOC>` je voliteln\u00e9 (funguje i p\u0159i truncated response)\n- HTML: inline CSS, \u017e\u00e1dn\u00fd DOCTYPE/html/head/body/JS\n\n## Pravidla pro Apps Script vol\u00e1n\u00ed\n- `POST` s `Content-Type: text/plain`\n- Body: `json.dumps({\"action\": \"claude\", \"payload\": {Anthropic payload}})`\n- NIKDY `json=` parametr \u2014 CORS fix vy\u017eaduje text/plain\n- Response: `r.json()[\"content\"][0][\"text\"]`\n\n## Co P\u0158E\u010c\u00cdST p\u0159ed ka\u017edou prezentac\u00ed\n1. P\u0159e\u010d\u00edst system prompt z dokument.html (grep SYSTEM= v k\u00f3du)\n2. Ov\u011b\u0159it Apps Script URL (grep AKfycb v k\u00f3du)\n3. Zvolit spr\u00e1vn\u00fd typ dokumentu (nabidka vs prezentace)\n\n## Kl\u00ed\u010dov\u00e9 bugy kter\u00e9 byly opraveny\n- `history` shadowing `window.history` \u2192 p\u0159ejmenov\u00e1no na `chatHistory`\n- Backtick v template liter\u00e1lu \u2192 rozbil cel\u00fd JS\n- JSON s embedded HTML \u2192 p\u0159echod na TYPE/NOTE/DOC form\u00e1t\n- CORS: `Content-Type: text/plain`\n- `max_tokens: 7000` \u2192 truncation \u2192 zv\u00fd\u0161eno na 16000\n- CDN fonty v generovan\u00e9m HTML \u2192 nahradit system-ui po generaci\n\n**Why:** Intern\u00ed n\u00e1stroj pro rychl\u00e9 tvo\u0159en\u00ed dokument\u016f. Syst\u00e9m je vylad\u011bn\u00fd \u2014 v\u017edy ho pou\u017e\u00edt m\u00edsto ru\u010dn\u00edho psan\u00ed HTML.\n**How to apply:** P\u0159i ka\u017ed\u00e9 B2B prezentaci V\u017dDY pou\u017e\u00edt Apps Script pipeline. Nikdy neza\u010d\u00ednat ru\u010dn\u011b ps\u00e1t CSS layout.\n\n### project-generator-nabidek\n## Live URL\n**https://nutworldcz-collab.github.io/nabidky**\n\nZdrojov\u00fd soubor: `/Users/user/Documents/Nutworld/docs/generator_nabidky.html`\nGitHub repo: `nutworldcz-collab/nutworldcz-collab.github.io`\n\n## Co to d\u011bl\u00e1\n- Rep vypln\u00ed formul\u00e1\u0159 (klient, produkty, podm\u00ednky) \u2192 klikne Generovat nab\u00eddku\n- Vygeneruje HTML nab\u00eddku v Nutworld brand designu (stejn\u00fd styl jako Steripak nab\u00eddka)\n- Klikne St\u00e1hnout PDF \u2192 otev\u0159e nov\u00e9 okno \u2192 Cmd+P \u2192 PDF\n- PDF po\u0161le klientovi s\u00e1m\n\n## Jak funguje\n- \u010cist\u011b statick\u00fd HTML soubor, \u017e\u00e1dn\u00fd server\n- Produkty: voln\u00e9 textov\u00e9 pole (n\u00e1zev + gram\u00e1\u017e ru\u010dn\u011b), po\u010det ks, cena/ks bez DPH\n- Auto-v\u00fdpo\u010det celkov\u00e9 ceny + DPH 12 %\n- Podm\u00ednky: splatnost, dod\u00e1n\u00ed, trvanlivost (selecty)\n- \u010c\u00edslo nab\u00eddky: auto-generovan\u00e9 (NW-YYYYMMDD-XXX)\n\n## Jak aktualizovat\n```python\npython3 -c \"\nimport base64, json, subprocess\n# Na\u010dti SHA\nsha = json.loads(subprocess.run(['gh','api',\n  'repos/nutworldcz-collab/nutworldcz-collab.github.io/contents/nabidky.html'],\n  capture_output=True, text=True).stdout)['sha']\n# Nahraj\nwith open('/Users/user/Documents/Nutworld/docs/generator_nabidky.html','rb') as f:\n    content = base64.b64encode(f.read()).decode()\nsubprocess.run(['gh','api',\n  'repos/nutworldcz-collab/nutworldcz-collab.github.io/contents/nabidky.html',\n  '--method','PUT','--input','-'],\n  input=json.dumps({'message':'update offer generator','content':content,'sha':sha}),\n  capture_output=True, text=True)\nprint('OK')\n\"\n```\n\n## zakazka.html \u2014 potvrzen\u00ed zak\u00e1zky\nURL: **https://nutworldcz-collab.github.io/zakazka.html**\n\nWorkflow:\n1. Rep otev\u0159e odkaz (zkop\u00edrovan\u00fd z nabidky.html) \u2192 data se na\u010dtou automat : 3 (opraveno 2026-05-25)\n\n## Shoptet Articles API (blog)\n- Endpoint: `POST /api/articles` | GET seznam: `GET /api/articles?page=N`\n- CZ sekce ID (blog): **682** | SK sekce ID (blog): **706**\n- CZ token: `SHOPTET_TOKEN` | SK token: `SHOPTET_SK_TOKEN` + SK URL: `https://www.nutworld.sk`\n- Pole p\u0159i vytvo\u0159en\u00ed: `defaultSectionId`, `language` (\"cs\"/\"sk\"), `title`, `content`, `metaTitle`, `metaDescription`, `visible`, `access`, `publishDate`\n- Detaily: viz [[project-blog-automatizace]]\n\n**Why:** Zakladatel pracuje s\u00e1m \u2014 Claude mus\u00ed zn\u00e1t v\u0161echna napojen\u00ed bez opakov\u00e1n\u00ed.\n**How to apply:** P\u0159ed prac\u00ed s konkr\u00e9tn\u00ed integrac\u00ed ov\u011b\u0159 token/credentials. P\u0159i chyb\u011b tokenu: sma\u017e json a reautorizuj.\n\n### project-k2-porovnani\n## K2 porovn\u00e1n\u00ed cen\u00edk\u016f (od 2026-06-18)\n\n### N\u00e1stroje\n- `compare_k2.py` \u2014 generuje k2.html na GitHub Pages (565 produkt\u016f: K2 + 30 vlastn\u00edch mix\u016f)\n- `poptavka_k2.py` \u2014 ka\u017ed\u00fd 1. v m\u011bs\u00edci po\u0161le reminder email na nutworld.cz@gmail.com\n- `generate_marze.py` \u2014 ka\u017ed\u00fdch 30 min regeneruje marze.html pokud se zm\u011bn\u00ed cenik.csv nebo darky.csv\n\n### GitHub Pages\n- `k2.html` \u2014 porovn\u00e1n\u00ed K2 cen\u00edk\u016f s filtry a z\u00e1lo\u017ekami dle dodavatele\n- `marze.html` \u2014 p\u0159ehled mar\u017e\u00ed (281 d\u00e1rk\u016f + 254 s\u00e1\u010dk\u016f), auto-aktualizace\n\n### Slo\u017eka K2_exports/\n- `k2_2026-05.csv` \u2014 form\u00e1t: `64;kod;nazev;dodavatel;cena` (5 sloupc\u016f)\n- `k2_2026-06.csv` \u2014 form\u00e1t: `kod;nazev;dodavatel;cena` (4 sloupce)\n- Soubory se V\u017dDY ukl\u00e1daj\u00ed sem p\u0159ed spu\u0161t\u011bn\u00edm compare_k2.py\n\n### Workflow ka\u017ed\u00fd m\u011bs\u00edc\n1. **1. v m\u011bs\u00edci** \u2014 p\u0159ijde reminder email se seznamem 10 dodavatel\u016f\n2. **Oslov\u00ed\u0161 dodavatele** \u2014 po\u0161le\u0161 jim \u0161ablonu z emailu\n3. **Obdr\u017e\u00ed\u0161 cen\u00edky** \u2014 po\u0161le\u0161 je v chatu, Claude ulo\u017e\u00ed do `Nutworld/dodavatele/{KOD}/`\n4. **Uprav\u00ed\u0161 K2** \u2014 zad\u00e1\u0161 nov\u00e9 ceny do K2\n5. **Exportuje\u0161 K2** \u2192 ulo\u017e\u00ed\u0161 jako `K2_exports/k2_YYYY-MM.csv`\n6. **Spust\u00ed\u0161** `python3 compare_k2.py` \u2192 automaticky nahraje porovn\u00e1n\u00ed\n\n### Mar\u017ee \u2014 zdroj pravdy\n- Mar\u017ee se po\u010d\u00edtaj\u00ed z **cenik.csv** (n\u00e1kupn\u00ed ceny za kg) \u2014 NIKOLI z K2 exportu\n- K2 export m\u00e1 n\u011bkter\u00e9 produkty (King Nuts) v jin\u00e9 jednotce (za kus, ne za kg)\n- Po ka\u017ed\u00e9 aktualizaci K2 cen je pot\u0159eba aktualizovat i cenik.csv\n\n### Vlastn\u00ed mixy\n- 30 vlastn\u00edch mix\u016f Nutworld nen\u00ed v K2 \u2014 p\u0159id\u00e1vaj\u00ed se z cenik.csv automaticky\n- Dodavatel: \"MIXOVAN\u00c9\", \u017elut\u00fd badge \ud83e\udd5c\n- Cena = blended cena z cenik.csv slo\u017een\u00ed\n\n**Why:** M\u011bs\u00ed\u010dn\u00ed p\u0159ehled zm\u011bn cen od dodavatel\u016f, z\u00e1klad pro K2 aktualizace.\n**How to apply:** V\u017edy zkontrolovat compare_k2.py po dod\u00e1n\u00ed nov\u00fdch cen\u00edk\u016f od dodavatel\u016f.\n\n### project-k2-shoptet\nNutworld intern\u011b b\u011b\u017e\u00ed na ERP syst\u00e9mu K2. Shoptet ceny jsou aktu\u00e1ln\u011b nevalidn\u00ed (star\u00e1 data) \u2014 budou se cel\u00e9 resetovat a nastavit nov\u011b.\n\n**Dohodnut\u00fd workflow pro ceny:**\n1. K2 export (n\u00e1kupn\u00ed ceny/kg) \u2192 aktualizuje `cenik.csv`\n2. `shoptet_push.py --prices` \u2192 zap\u00ed\u0161e prodejn\u00ed i n\u00e1kupn\u00ed ceny p\u0159es API (vzorec `mo_cz()` / `mo_sk()`)\n3. `nw_shoptet.py check-prices` \u2192 pr\u016fb\u011b\u017en\u00e9 hl\u00edd\u00e1n\u00ed odchylek\n\n**Why:** Shoptet ceny se dlouho neaktualizovaly, jsou vy\u0161\u0161\u00ed ne\u017e vzorec (nap\u0159. 1kg produkty: Shoptet 399 K\u010d vs vzorec ~329 K\u010d). K2 export = source of truth pro n\u00e1kupn\u00ed ceny; `mo_cz()` vzorec = source of truth pro prodejn\u00ed ceny.\n\n**How to apply:** Nikdy nebrat st\u00e1vaj\u00edc\u00ed Shoptet ceny jako spr\u00e1vn\u00e9. Neopravovat `--fix` dokud nen\u00ed `cenik.csv` aktualizovan\u00fd z K2 exportu. V\u017dDY hledat cenu v `k2_ceny.csv` \u2014 nikdy v Shoptetu. Soubor se aktualizuje ka\u017ed\u00fd m\u011bs\u00edc.\n</content>\n</invoke>\n\n### project-kalkulator\n\u017div\u00fd webov\u00fd kalkul\u00e1tor bez Excelu. URL: nutworldcz-collab.github.io/kalkulator.html\n\n## Tab Produkty\n- Vyhled\u00e1va\u010d z PRODUKTY[] pole (stejn\u00e1 data jako cenik.csv)\n- Gram\u00e1\u017e ze selectu nebo vlastn\u00ed, po\u010det ks\n- Roll-up: m\u00edch\u00e1n\u00ed v\u00edce produkt\u016f (+20 K\u010d/kg za m\u00edch\u00e1n\u00ed)\n- V\u00fdsledek: MO/VO dle vzorc\u016f nw_core.py, mar\u017ee %, zisk, celkem pro N ks\n\n## Tab D\u00e1rky\n- 1\u201312 produkt\u016f se search + gram\u00e1\u017e\n- \u0160ablona obalu \u2192 p\u0159edvypln\u00ed obal/pr\u00e1ce/mar\u017ei/VO faktor\n- Vlastn\u00ed zad\u00e1n\u00ed: obal K\u010d + pr\u00e1ce K\u010d ru\u010dn\u011b\n- Zp\u016fsob v\u00fdpo\u010dtu: **Mar\u017ee %** (20/30/40/50/60 nebo vlastn\u00ed) nebo **N\u00e1sobek \u00d7N**\n  - Mar\u017ee %: `MO = (n\u00e1klady \u00d7 DPH) / (1 - m)`\n  - N\u00e1sobek: `MO = (produkty + obal + pr\u00e1ce) \u00d7 N` \u2014 DPH v n\u00e1sobku (pro krabi\u010dky)\n- DPH: 12 % nebo 21 %, VO faktor editovateln\u00fd\n\n## \u0160ablony obal\u016f (D_VZORCE)\n| Kl\u00ed\u010d | Obal | Pr\u00e1ce | Mar\u017ee/vzorec | VO |\n|---|---|---|---|---|\n| sacek_knir | 10 | 5 | 50 % | 0.8 |\n| sacek_kolick | 15 | 10 | 50 % | 0.8 |\n| sacek_vanoce | 5 | 5 | 50 % | 0.8 |\n| zajicek | 10 | 10 | 50 % | 0.8 |\n| celofan | 10 | 10 | 50 % | 0.8 |\n| kornout | 12 | 7 | 50 % | 0.8 |\n| eko_kelimek | 9.5 | 7 | 45 % | 0.8 |\n| sklenic_deluxe | 14 | 7 | 50 % | 0.8 |\n| sklenic_exclusive | 15 | 6 | 50 % | 0.8 |\n| kazetka | 8 | 14 | 47 % | 0.8 |\n| krabice_kelimky | 69 | 17 | 50 % | 0.8 |\n| krabicka | 17.5 | 27.5 | 50 % | 0.7 |\n| kraft | 8 | 16 | 54 % | 0.7 |\n| krabicka_2x50 | 15 | 20 | \u00d72.5 | 0.7 |\n| krabicka_4x80 | 15 | 20 | 55 %, floor 299 | 0.7 |\n| vanocni_krabicka | 15 | 20 | \u00d72.5 | 0.7 |\n\n**Why:** Kalkul\u00e1tor nahrazuje ru\u010dn\u00ed Excel, kl\u00ed\u010dov\u00fd pro B2B cenov\u00e9 nab\u00eddky na m\u00edst\u011b.\n\n### project_kategorie_darky\nFin\u00e1ln\u00ed struktura kategori\u00ed \"Tipy na d\u00e1rky\" odsouhlasena 2026-07-02. Postaveno na GSC datech (1.3.2025\u201330.6.2026).\n\n**Why:** 80+ kategori\u00ed \u2192 26, max 3 \u00farovn\u011b, sub-sub-kategorie nahrazeny filtry. \u0158e\u0161\u00ed: cannibalization Pro mu\u017ee (pos 41), firemn\u00ed d\u00e1rky (144k impr., pos 22), narozeniny (120k impr., pos 17).\n\n**How to apply:** P\u0159i ka\u017ed\u00e9 zm\u011bn\u011b kategori\u00ed \"Tipy na d\u00e1rky\" vych\u00e1zet z tohoto stromu. Netvo\u0159it nov\u00e9 podkategorie tam, kde m\u00e1 b\u00fdt filtr.\n\n## Fin\u00e1ln\u00ed strom (test shop hotovo, produkce \u010dek\u00e1)\n\n```\nTipy na d\u00e1rky\n\u251c\u2500\u2500 Pro koho\n\u2502   \u251c\u2500\u2500 D\u00e1rky pro \u017dENY          [filtry m\u00edsto podkategori\u00ed]\n\u2502   \u251c\u2500\u2500 D\u00e1rky pro MU\u017dE          [filtry m\u00edsto podkategori\u00ed]\n\u2502   \u251c\u2500\u2500 D\u00e1rky pro D\u011aTI\n\u2502   \u2514\u2500\u2500 Pro p\u00e1r\n\u251c\u2500\u2500 Podle p\u0159\u00edle\u017eitosti\n\u2502   \u251c\u2500\u2500 V\u00c1NOCE\n\u2502   \u2502   \u251c\u2500\u2500 Adventn\u00ed kalend\u00e1\u0159\n\u2502   \u2502   \u2514\u2500\u2500 Tipy do 150 K\u010d\n\u2502   \u251c\u2500\u2500 MIKUL\u00c1\u0160\n\u2502   \u251c\u2500\u2500 VELIKONOCE              [pos 10 \u2705]\n\u2502   \u251c\u2500\u2500 VALENT\u00ddN\n\u2502   \u251c\u2500\u2500 DEN MATEK\n\u2502   \u2502   \u2514\u2500\u2500 MD\u017d\n\u2502   \u251c\u2500\u2500 \u0160kola & sport           [celoro\u010dn\u00ed \u2014 konec roku + back to school]\n\u2502   \u2502   \u251c\u2500\u2500 Konec \u0161koln\u00edho roku [13 762 klik\u016f \u2014 sez\u00f3nn\u00ed #1]\n\u2502   \u2502   \u2514\u2500\u2500 Back to school\n\u2502   \u251c\u2500\u2500 Den otc\u016f\n\u2502   \u251c\u2500\u2500 Narozeniny a sv\u00e1tek     [120k zobr., pos 17 \u2014 velk\u00fd potenci\u00e1l]\n\u2502   \u251c\u2500\u2500 Svatby a oslavy\n\u2502   \u251c\u2500\u2500 Silvestr\n\u2502   \u2514\u2500\u2500 Halloween\n\u251c\u2500\u2500 Podle balen\u00ed\n\u2502   \u251c\u2500\u2500 D\u00e1rkov\u00e9 krabice\n\u2502   \u2502   \u251c\u2500\u2500 4x 80g / 2x 50g / 3x EKO kel\u00edmek / 3x Skleni\u010dka DELUXE / L / XL\n\u2502   \u251c\u2500\u2500 D\u00e1rkov\u00e9 kornouty        [pos 6.7 \u2b50 nejlep\u0161\u00ed]\n\u2502   \u251c\u2500\u2500 EKO kel\u00edmek\n\u2502   \u251c\u2500\u2500 O\u0159echy ve skle (EXCLUSIVE + DELUXE)\n\u2502   \u2514\u2500\u2500 D\u00e1rkov\u00e9 s\u00e1\u010dky & celof\u00e1nek\n\u2514\u2500\u2500 Firemn\u00ed D\u00c1RKY               [816 klik\u016f, 144k zobr. \u2014 B2B hub]\n```\n\n## K smaz\u00e1n\u00ed (17 kategori\u00ed \u2014 zat\u00edm jen na test shopu)\n\n- Sub-sub Pro \u017eeny: Maminku, Man\u017eelku, Babi\u010dku \u2192 stanou se **filtry**\n- Sub-sub Pro mu\u017ee: Tat\u00ednka, Man\u017eela, D\u011bde\u010dka, Pana u\u010ditele \u2192 stanou se **filtry**\n- Tipy na d\u00e1rky na SVATBY (pod Pro koho) \u2192 merge do Svatby a oslavy\n- 1. M\u00c1J \u2192 smazat\n- D\u00e1rkov\u00e9 krabice s pe\u010det\u00ed/p\u0159ekvapen\u00edm/p\u0159\u00edb\u011bhem/XXL/pr\u016fhledn\u00e9/p\u00e1rty \u2192 merge do D\u00e1rkov\u00e9 krabice\n- D\u00e1rkov\u00e9 celof\u00e1nov\u00e9 s\u00e1\u010dky v kel\u00edmku + 3 subcats \u2192 merge do S\u00e1\u010dky & celof\u00e1nek\n- O\u0159echy PRO MU\u017dE s kn\u00edrem (jako kategorie) \u2192 jen produkt\n\n## Fin\u00e1ln\u00ed filtry (5 Shoptet parametr\u016f \u2014 zat\u00edm nenastaveno)\n\n**1. Pro koho** (v Pro \u017eeny + Pro mu\u017ee)\n- \u017deny: Maminku \u00b7 Babi\u010dku \u00b7 Man\u017eelku/p\u0159\u00edtelkyni \u00b7 \u0160\u00e9fovou \u00b7 Kolegyni \u00b7 Tren\u00e9rku \u00b7 Pan\u00ed u\u010ditelku \u00b7 L\u00e9ka\u0159ku/zdravotn\u00ed sestru \u00b7 Kamar\u00e1dku\n- Mu\u017ei: Tat\u00ednka \u00b7 D\u011bde\u010dka \u00b7 Man\u017eela/p\u0159\u00edtele \u00b7 \u0160\u00e9fa \u00b7 Kolegu \u00b7 Tren\u00e9ra \u00b7 Pana u\u010ditele \u00b7 L\u00e9ka\u0159e \u00b7 Kamar\u00e1da\n\n**2. P\u0159\u00edle\u017eitost** (v Pro koho + Firemn\u00ed d\u00e1rky)\nV\u00e1noce \u00b7 Mikul\u00e1\u0161 \u00b7 Velikonoce \u00b7 Valent\u00fdn \u00b7 Narozeniny \u00b7 Den matek \u00b7 Konec \u0161k. roku \u00b7 Den otc\u016f \u00b7 Svatba \u00b7 Halloween \u00b7 Silvestr\n\n**3. Cena** (v\u0161ude): do 150 K\u010d \u00b7 151\u2013300 \u00b7 301\u2013500 \u00b7 500+ K\u010d\n\n**4. Typ balen\u00ed** (v Pro koho + P\u0159\u00edle\u017eitosti): Skleni\u010dka EXCLUSIVE \u00b7 DELUXE \u00b7 EKO kel\u00edmek \u00b7 D\u00e1rkov\u00e1 krabice \u00b7 S\u00e1\u010dek/kornout \u00b7 Kazetka 50g\n\n**5. Slo\u017een\u00ed** (voliteln\u011b): O\u0159echy \u00b7 Su\u0161en\u00e9 ovoce \u00b7 Mix \u00b7 \u010cokol\u00e1dov\u00e9 \u00b7 Solen\u00e9/uzen\u00e9\n\n## Stav implementace\n\n- \u2705 Test shop: struktura hotov\u00e1, themed popisy pushnuty (v\u0161echny p\u0159\u00edle\u017eitosti)\n- \u2705 GSC anal\u00fdza provedena (gsc-darky-report.html)\n- \u23f3 Produkce: \u010dek\u00e1 na schv\u00e1len\u00ed\n- \u23f3 Filtry: nastavit v Shoptet admin (ru\u010dn\u011b) + hromadn\u00fd import parametr\u016f\n- \u23f3 Smaz\u00e1n\u00ed 17 kategori\u00ed: po schv\u00e1len\u00ed produkce\n\n### project-kategorie-design\n## Layout pravidla\n\n### Hlavn\u00ed kategorie (O\u0159echy, Su\u0161en\u00e9 ovoce, Sem\u00ednka, D\u00e1rky, ROOT...)\n- `description` (nad podkategoriemi): **POUZE hero blok** \u2014 kr\u00e1tk\u00e9, z\u00e1kazn\u00edk ihned vid\u00ed navigaci\n- `secondDescription` (pod produkty): 6 karet + tagline\n\n### Podkategorie (Mandle, Chia, Ananas, Ara\u0161\u00eddy...)\n- `description` (nad produkty): hero + H3 + odstavec + alergen box\n- `secondDescription` (pod produkty): 4 karty + tagline\n\n## HTML vzor \u2014 hero blok\n```html\n<div style=\"font-family:Arial,sans-serif;color:#231f20;line-height:1.65;\">\n  <div style=\"background:linear-gradient(135deg,#X 0%,#Y 55%,#Z 100%);border-radius:16px;padding:32px 28px;margin-bottom:24px;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;top:-20px;right:-20px;width:140px;height:140px;background:rgba(R,G,B,.15);border-radius:50%;\"></div>\n    <div style=\"position:relative;z-index:1;\">\n      <div style=\"font-size:13px;color:[AKCENT];font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;\">[LABEL]</div>\n      <h2 style=\"margin:0 0 12px 0;font-size:24px;color:#fff;font-weight:700;line-height:1.3;\">[NADPIS]</h2>\n      <p style=\"margin:0;font-size:15px;color:rgba(255,255,255,.85);line-height:1.6;max-width:480px;\">[SUBTITLE]</p>\n    </div>\n  </div>\n  [H3 + odstavec + alergen box \u2014 jen pro podkategorie]\n</div>\n```\n\n## HTML vzor \u2014 karta (secondDescription)\n```html\n<div style=\"flex:0 0 calc(50% - 6px);box-sizing:border-box;background:#f1e6da;border:2px solid #c8976a;border-radius:12px;padding:16px 18px;min-width:160px;\">\n  <div style=\"font-size:22px;margin-bottom:6px;\">[EMOJI]</div>\n  <div style=\"font-size:15px;font-weight:700;color:[NADPIS_BARVA];margin-bottom:4px;\">[TITULEK]</div>\n  <div style=\"width:28px;height:2px;background:[AKCENT];border-radius:2px;margin-bottom:8px;\"></div>\n  <p style=\"margin:0;font-size:13px;color:#3d2912;line-height:1.6;\">[TEXT]</p>\n</div>\n```\nFlex wrapper: `display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px`\n\n## HTML vzor \u2014 alergen box\n```html\n<div style=\"background:#fff5f7;border:1.5px solid #da1668;border-radius:10px;padding:14px 18px;font-size:13px;color:#6b2f2f;\">\n  <strong>Alergeny:</strong> [TEXT]\n</div>\n```\nV\u017edy `#fff5f7` + `#da1668` border \u2014 v\u00fdstra\u017en\u00e1 r\u016f\u017eov\u00e1 bez ohledu na skupinu.\n\n## Shoptet API \u2014 push kategorie\n```python\napi.update_category(guid,\n    description=\"<html>\",\n    secondDescription=\"<html>\",\n    title=\"N\u00e1zev | Nutworld.cz\",\n    metaTagDescription=\"SEO popis...\",\n)\n```\n\n## CZ vs SK rozd\u00edly\n- SK: v\u017edy \u010dist\u00fd HTML, lze editovat\n- CZ: \u010d\u00e1st kategori\u00ed pou\u017e\u00edv\u00e1 **Pobo Page Builder** \u2192 p\u0159esko\u010dit (`if 'pobo' in desc[:60].lower()`)\n- CZ star\u00e9 kategorie: solid `background-color: #5c381f` bez gradientu \u2192 p\u0159i editaci p\u0159ev\u00e9st na gradient\n\n## Hotov\u00e9 kategorie\n\u2192 Sledovat v [[project-sk-kategorie]] (SK) a [[project-cz-kategorie]] (CZ)\n\u2192 Barevn\u00e9 sch\u00e9ma v [[project-kategorie-farby]]\n\n### project-kategorie-farby\n## Syst\u00e9m farebn\u00e9ho k\u00f3dovania SK kateg\u00f3ri\u00ed\n\nKa\u017ed\u00e1 hlavn\u00e1 skupina m\u00e1 vlastn\u00fd hero gradient, akcent a farbu linky na kart\u00e1ch.\n\n| Skupina | Hero gradient | Akcent & linka | Label color |\n|---------|--------------|----------------|-------------|\n| **Ovocie / Su\u0161en\u00e9 ovocie** | `#6b2f2f \u2192 #8b4040 \u2192 #b05030` | `#da1668` ru\u017eov\u00e1 | `#da1668` |\n| **Orechy** | `#5c381f \u2192 #83502e \u2192 #a0622a` | `#f7ab31` zlat\u00e1 | `#f7ab31` |\n| **Semienka** | `#2d5a1b \u2192 #4a7c2f \u2192 #6fa044` | `#6fa044` zelen\u00e1 | `#c8e89a` |\n| **Dar\u010deky** | `#7a5200 \u2192 #b8860b \u2192 #c9982e` | `#f7ab31` zlat\u00e1 | `#f7e29a` |\n\nGradient v\u017edy: `linear-gradient(135deg, [farba1] 0%, [farba2] 55%, [farba3] 100%)`\n\n## Kon\u0161tanty platn\u00e9 pre v\u0161etky skupiny\n- Karty: `background:#f1e6da; border:2px solid #c8976a; border-radius:12px; padding:16px 18px`\n- Karta \u2013 linka pod n\u00e1zvom: `width:28px; height:2px; border-radius:2px` \u2014 farba = akcent skupiny\n- Nadpisy kariet: `color` = tmav\u0161\u00ed odtie\u0148 gradientu (ovocie: `#6b2f2f`, orechy/dar\u010deky: `#5c381f`, semienka: `#2d5a1b`)\n- Alerg\u00e9ny box: V\u017dDY `background:#fff5f7; border:1.5px solid #da1668` (v\u00fdstra\u017en\u00e1 ru\u017eov\u00e1, bez oh\u013eadu na skupinu)\n- Dekorat\u00edvny kruh v hero: `rgba([R,G,B], .15\u2013.20)` pod\u013ea akcentu skupiny\n- Font: `font-family:Arial,sans-serif`\n\n## Layout pravidl\u00e1 (SK aj CZ)\n- **Hlavn\u00e1 kateg\u00f3ria**: `description` = iba hero blok, `secondDescription` = 6 karet + tagline\n- **Podkateg\u00f3ria**: `description` = hero + H3 + odstavec + alerg\u00e9ny, `secondDescription` = 4 karty + tagline\n\n## Hotov\u00e9 SK kateg\u00f3rie \u2014 ovocie\n- Kiwi: `da1a08ac-7db6-11ee-b0f3-32b888b76c62`\n- Kustovnica: `da7eaa46-7db6-11ee-a1c7-32b888b76c62`\n- Zmesi ovocia: `dc64a6da-7db6-11ee-b031-32b888b76c62`\n\n## Hotov\u00e9 SK kateg\u00f3rie \u2014 semienka (2026-06-09)\n- Semienka (hlavn\u00e1): `d955e6a2-7db6-11ee-b430-32b888b76c62`\n- Chia semienka: `d9ab8760-7db6-11ee-99b4-32b888b76c62`\n- Konopn\u00e9 semienka: `da349398-7db6-11ee-8e48-32b888b76c62`\n- Tekvicov\u00e9 semienka: `d956e6c4-7db6-11ee-8939-32b888b76c62`\n- \u013danov\u00e9 semienka: `daaa829c-7db6-11ee-ac4e-32b888b76c62`\n- Mak: `dabf411e-7db6-11ee-9915-32b888b76c62`\n- Sezamov\u00e9 semienka: `dc90772e-7db6-11ee-93bf-32b888b76c62` \u26a0 sezam = alerg\u00e9n\n- Slne\u010dnicov\u00e9 semienka: `dcb75074-7db6-11ee-a3cd-32b888b76c62`\n- Zmes semien: `dc81a42e-7db6-11ee-a4b7-32b888b76c62`\n\n## D\u00f4le\u017eit\u00e9\n- Sch\u00e9ma plat\u00ed **iba pre SK** \u2014 CZ kateg\u00f3rie sa bud\u00fa rie\u0161i\u0165 samostatne s in\u00fdm dizajnom\n- Sezam je deklarovan\u00fd alerg\u00e9n (EU \u010d. 11) \u2014 v\u017edy \u0161peci\u00e1lny text v alerg\u00e9n boxe\n- [[project-sk-kategorie]] \u2014 \u017eiv\u00fd tracker postupu SK kategori\u00ed\n\n**Why:** Sch\u00e9ma definova ace Nutworld. V\u0161e ulo\u017eeno v `/Users/user/Documents/Nutworld/docs/`.\n\n**Why:** Nutworld buduje intern\u00ed syst\u00e9m kvality pro potravin\u00e1\u0159sk\u00fd provoz \u2014 HACCP, \u0161kolen\u00ed, legislativa. Dokumenty jsou \u017eiv\u00e9, budeme je roz\u0161i\u0159ovat.\n**How to apply:** P\u0159i ka\u017ed\u00e9 pr\u00e1ci s kvalitou, \u0161kolen\u00edm nebo HACCP v\u017edy otev\u0159\u00edt p\u0159\u00edslu\u0161n\u00fd dokument a nav\u00e1zat na n\u011bj.\n\n---\n\n## Dokumenty \u2014 p\u0159ehled\n\n### 1. Onboarding kvalit\u00e1\u0159\n**Soubor:** `nutworld_kvalitar_onboarding.html`\n**Obsah (12 sekc\u00ed):**\n1. O firm\u011b a produktech\n2. Onboarding pl\u00e1n \u2014 4 t\u00fddny krok po kroku\n3. HACCP \u2014 tvorba a spr\u00e1va, CCP, z\u00e1znamy\n4. Legislativa a ozna\u010dov\u00e1n\u00ed \u2014 EU 1169/2011, checklist 10 povinn\u00fdch \u00fadaj\u016f\n5. Dodavatel\u00e9 a suroviny \u2014 vstupn\u00ed kontrola, sledovatelnost, recall\n6. \u0160kolen\u00ed zam\u011bstnanc\u016f \u2014 pl\u00e1n, obsah, evidence\n7. Reklamace a neshody \u2014 postup, CAPA\n8. Intern\u00ed audity a SZPI \u2014 frekvence, co p\u0159i inspekci\n9. \u00daklid, hygiena a provoz \u2014 pl\u00e1n \u00faklidu, od\u011bv, odpady, skladov\u00e1n\u00ed\n10. \u010cistic\u00ed prost\u0159edky a DDD \u2014 food-grade chemik\u00e1lie, deratizace\n11. Matice alergen\u016f \u2014 vzorov\u00e1 tabulka, 14 alergen\u016f, pravidla p\u0159ebalovny\n12. Workflow nov\u00e9ho produktu \u2014 9 krok\u016f od specifikace po e-shop\n\n---\n\n### 2. HACCP Pl\u00e1n \u2014 mustr\n**Soubor:** `nutworld_haccp_mustr.html`\n**Obsah (12 sekc\u00ed):**\n1. Popis podniku a produkt\u016f \u2014 doplnit adresu, I\u010cO\n2. HACCP t\u00fdm \u2014 role a odpov\u011bdnosti\n3. Popis produkt\u016f \u2014 vzor pro o\u0159echy a su\u0161en\u00e9 ovoce\n4. V\u00fdvojov\u00fd diagram \u2014 vizu\u00e1ln\u00ed tok s CCP vyzna\u010den\u00fdmi\n5. Anal\u00fdza nebezpe\u010d\u00ed \u2014 biologick\u00e1, chemick\u00e1, fyzik\u00e1ln\u00ed\n6. CCP 1 (p\u0159ebalov\u00e1n\u00ed \u2014 k\u0159\u00ed\u017eov\u00e1 kontaminace) + CCP 2 (etiketov\u00e1n\u00ed \u2014 z\u00e1m\u011bna etikety)\n7. Monitorov\u00e1n\u00ed \u2014 den\u00edky CCP 1, CCP 2, sklad (teplota/vlhkost)\n8. Verifikace + podpisov\u00e1 strana\n9. Formul\u00e1\u0159 p\u0159\u00edjmu zbo\u017e\u00ed \u2014 kontroln\u00ed body, P\u0158IJATO/ODM\u00cdTNUTO\n10. Z\u00e1znam o neshod\u011b \u2014 \u010d\u00edslovan\u00fd formul\u00e1\u0159, 8 typ\u016f, CAPA, rozhodnut\u00ed o recallu\n11. Recall postup \u2014 8 krok\u016f s \u010dasov\u00fdmi limity + kontaktn\u00ed list (SZPI, dodavatel\u00e9, pr\u00e1vn\u00edk)\n12. Kalibrace vah a teplom\u011br\u016f \u2014 z\u00e1znamy, frekvence, p\u0159\u00edpustn\u00e9 odchylky\n\n**\u017dlut\u00e1 pole = doplnit p\u0159i re\u00e1ln\u00e9m nasazen\u00ed** (adresa, jm\u00e9na, kontakty)\n\n---\n\n### 3. \u0160kolen\u00ed zam\u011bstnanc\u016f \u2014 mustr\n**Soubor:** `nutworld_skoleni_mustr.html`\n**Obsah:**\n- Pl\u00e1n \u0161kolen\u00ed \u2014 6 typ\u016f, frekvence, evidence\n- Modul 1: Osobn\u00ed hygiena (myt\u00ed rukou, od\u011bv, nemoc, n\u00e1v\u0161t\u011bvy)\n- Modul 2: HACCP z\u00e1klady (CP vs CCP, CCP 1 a 2, z\u00e1znamy, neshoda)\n- Modul 3: Alergeny (14 alergen\u016f, k\u0159\u00ed\u017eov\u00e1 kontaminace, postup p\u0159echodu)\n- Modul 4: Ozna\u010dov\u00e1n\u00ed produkt\u016f (etiketa, z\u00e1m\u011bna, po\u0161kozen\u00e1 etiketa)\n- Test znalost\u00ed \u2014 6 ot\u00e1zek, spr\u00e1vn\u00e9 odpov\u011bdi (b, c, b, b, c, b), min. 5/6\n- Prezen\u010dn\u00ed listina \u2014 10 zam\u011bstnanc\u016f, podpisy \u0161kolitele a kvalit\u00e1\u0159e\n\n---\n\n## Kl\u00ed\u010dov\u00e9 pojmy pro referenci\n\n**CCP 1 \u2014 P\u0159ebalovna:** k\u0159\u00ed\u017eov\u00e1 kontaminace alergen\u016f \u2014 nulov\u00e1 tolerance, \u00faklid + dezinfekce + v\u00fdm\u011bna rukavic + z\u00e1znam\n**CCP 2 \u2014 Etiketov\u00e1n\u00ed:** z\u00e1m\u011bna etikety \u2014 100% vizu\u00e1ln\u00ed kontrola p\u0159ed ka\u017edou \u0161ar\u017e\u00ed + z\u00e1znam\n**CP:** kontroln\u00ed bod \u2014 nekritick\u00fd, chyba jde napravit v dal\u0161\u00edm kroku\n**CCP:** kritick\u00fd bod \u2014 selh\u00e1n\u00ed p\u0159\u00edmo ohro\u017euje zdrav\u00ed, nelze napravit, okam\u017eit\u00e9 n\u00e1pravn\u00e9 opat\u0159en\u00ed\n\n**14 alergen\u016f EU 1169/2011:** obiloviny s lepkem, kor\u00fd\u0161i, vejce, ryby, ara\u0161\u00eddy, s\u00f3ja, ml\u00e9ko, stromov\u00e9 o\u0159echy, celer, ho\u0159\u010dice, sezam, oxid si\u0159i\u010dit\u00fd, vl\u010d\u00ed bob, m\u011bkk\u00fd\u0161i\n\n**Recall \u010dasov\u00e9 limity:** Ihned blokovat \u2192 30 min informovat jednatele \u2192 2 hod identifikovat z\u00e1kazn\u00edky \u2192 24 hod SZPI \u2192 48 hod dodavatel\n\n**Archivace:** z\u00e1znamy min. 5 let, \u0161kolen\u00ed min. doba PP + 3 roky\n\n---\n\n## Co p\u0159\u00ed\u0161t\u011b doplnit\n- Matice alergen\u016f \u2014 kompletn\u00ed tabulka pro cel\u00fd sortiment (vzor je v onboardingu)\n- Kontaktn\u00ed list recall \u2014 doplnit re\u00e1ln\u00e1 \u010d\u00edsla (SZPI krajsk\u00fd inspektor\u00e1t, dodavatel\u00e9, pr\u00e1vn\u00edk)\n- KPI kvalit\u00e1\u0159e \u2014 zat\u00edm odlo\u017eeno\n- Karta zam\u011bstnance \u2014 evidence \u0161kolen\u00ed per person\n- Sanita\u010dn\u00ed pl\u00e1n s konkr\u00e9tn\u00edmi chemik\u00e1liemi a koncentracemi\n\n### project_kvalitar_onboarding\nKompletn\u00ed onboarding & intern\u00ed p\u0159\u00edru\u010dka pro pozici kvalit\u00e1\u0159 Nutworld.\n\n**Why:** Nutworld rozr\u016fst\u00e1 t\u00fdm, pot\u0159ebuje formalizovat kvalit\u00e1\u0159sk\u00e9 procesy pro potravin\u00e1\u0159sk\u00fd provoz.\n**How to apply:** P\u0159i dal\u0161\u00edm rozvoji dokumentu nebo tvorb\u011b HACCP na n\u011bj nav\u00e1zat.\n\n## Um\u00edst\u011bn\u00ed\n`/Users/user/Documents/Nutworld/docs/nutworld_kvalitar_onboarding.html`\n\n## Obsah (12 sekc\u00ed)\n1. O firm\u011b a produktech\n2. Onboarding pl\u00e1n \u2014 4 t\u00fddny krok po kroku\n3. HACCP \u2014 tvorba a spr\u00e1va, CCP, z\u00e1znamy\n4. Legislativa a ozna\u010dov\u00e1n\u00ed \u2014 EU 1169/2011, checklist 10 povinn\u00fdch \u00fadaj\u016f\n5. Dodavatel\u00e9 a suroviny \u2014 vstupn\u00ed kontrola, sledovatelnost, recall\n6. \u0160kolen\u00ed zam\u011bstnanc\u016f \u2014 pl\u00e1n, obsah, evidence\n7. Reklamace a neshody \u2014 postup, CAPA\n8. Intern\u00ed audity a SZPI \u2014 frekvence, co p\u0159i inspekci\n9. \u00daklid, hygiena a provoz \u2014 pl\u00e1n \u00faklidu, od\u011bv, odpady, skladov\u00e1n\u00ed\n10. \u010cistic\u00ed prost\u0159edky a DDD \u2014 food-grade chemik\u00e1lie, deratizace\n11. Matice alergen\u016f \u2014 vzorov\u00e1 tabulka, 14 alergen\u016f, pravidla p\u0159ebalovny\n12. Workflow nov\u00e9ho produktu \u2014 9 krok\u016f od specifikace po e-shop\n\n## Dal\u0161\u00ed pl\u00e1n\n- Tvorba HACCP dokumentace (mustr p\u0159ipraven jako /tmp/nutworld_haccp_mustr.html)\n- KPI kvalit\u00e1\u0159e \u2014 zat\u00edm odlo\u017eeno\n- Kontakty a syst\u00e9my \u2014 zat\u00edm odlo\u017eeno\n\n### project-legislativa-workflow\n## Z\u00e1sada\n\nLegislat\u00edvne popisky (zlo\u017eenie, alerg\u00e9ny, v\u00fd\u017eiva, krajina p\u00f4vodu) = **najvy\u0161\u0161ia priorita presnosti**. Chyba sa rie\u0161i okam\u017eite.\n\nZdroj pravdy: **`vstup_sk.csv`** (output `spec-import.py` zo spec s\u00faborov od dod\u00e1vate\u013ea).\n\n## Workflow kontroly\n\n```bash\n# 1. Najprv obnov SK cache (d\u00f4le\u017eit\u00e9 \u2014 inak ch\u00fdbaj\u00fa produkty!)\npython3 Nutworld/scripts/legislativa_check.py --rebuild-cache\n\n# 2. Be\u017en\u00e1 kontrola\npython3 Nutworld/scripts/legislativa_check.py\n```\n\nSkript: `Nutworld/scripts/legislativa_check.py`\n\n## \u010co skript rob\u00ed\n\n1. Na\u010d\u00edta `vstup_sk.csv` \u2192 extrahuje UPPERCASE alerg\u00e9ny zo st\u013apca `slozeni`\n2. Matchuje k\u00f3d na SK produkt cez `shoptet_code_cache_sk.json` (vzor `SKX{kod}/` alebo `SKX{kod}X`)\n3. Stiahne SK popis z API a h\u013ead\u00e1 ka\u017ed\u00fd alergen (pomocou kore\u0148a slova \u2014 rie\u0161enie flexie)\n4. Flaguje kde alergen zo spec **ch\u00fdba** v SK popise\n\n## D\u00f4le\u017eit\u00e9 technick\u00e9 detaily\n\n- **Cache mus\u00ed by\u0165 aktu\u00e1lna** pred skenovan\u00edm \u2014 `shoptet_code_cache_sk.json` m\u00f4\u017ee by\u0165 star\u00fd a ch\u00fdbaj\u00fa v \u0148om nov\u00e9 produkty\n- **Flexia sloven\u010diny** \u2014 spec p\u00ed\u0161e `MAND\u013dOV`, popis p\u00ed\u0161e `MAND\u013dOV\u00c9` \u2192 h\u013ead\u00e1me kore\u0148 `MANDL` nie cel\u00e9 slovo\n- **Falo\u0161n\u00e9 pozit\u00edvy** \u2014 v\u00e4\u010d\u0161ina \u201eMAND\u013dOV ch\u00fdba\" s\u00fa falo\u0161n\u00e9; `ALLERGEN_ROOTS` dict v skripte rie\u0161i flexiu\n- K\u00f3d 3714 mal `S\u00d3JOV\u00dd lecitin` ch\u00fdbaj\u00faci \u2014 opraven\u00e9 2026-06-10\n\n## \u0160trukt\u00fara vstup_sk.csv\n\n```\nsoubor;kod;energie;tuky;nasycene;sacharidy;cukry;vlaknina;bilkoviny;sul;kakao;\nnazev;slozeni;stopy;druh;trvanlivost;zeme_puvodu\n```\n\n- `slozeni` \u2014 pln\u00e9 zlo\u017eenie so UPPERCASE alergenmi (napr. `MLIEKO`, `ARA\u0160IDY`, `S\u00d3JOV\u00dd`)\n- `stopy` \u2014 stopov\u00e9 alerg\u00e9ny (napr. `LEPKU, ARA\u0160IDOV, S\u00d3JE`)\n- `kod` \u2014 base k\u00f3d produktu (bez SKX prefixu a variantu)\n\n## Otvoren\u00e9 probl\u00e9my (2026-06-10) \u2014 opravi\u0165\n\n| K\u00f3d | Produkt | Ch\u00fdba |\n|-----|---------|-------|\n| 155 | Pr\u00e9miov\u00fd orechov\u00fd mix | LIESKOV\u00c9 orechy |\n| 3729 | \u010cokol\u00e1dov\u00e9 Bonito's mix | MLIEKO |\n| 4896 | Zmes mandl\u00ed v \u010dokol\u00e1de Brown | SRV\u00c1TKA + MLIEKO |\n| 95 | Mandle pra\u017een\u00e9 v mede a soli | RA\u017dE (ra\u017en\u00fd sirup = lepok) |\n\n**Postup opravy:** na\u010d\u00edta\u0165 SK popis \u2192 n\u00e1js\u0165 sekciu `Alerg\u00e9ny` / `Obsahuje` \u2192 doplni\u0165 ch\u00fdbaj\u00faci alergen \u2192 `api.push_texts(guid, description=opraveny_html)`\n\n ech\u016f + r\u00e9\u017eie + p\u0159\u00edprava pracovi\u0161t\u011b. Normy jsou \u010dist\u00e1 kompletace.\n**How to apply:** P\u0159i kalkulaci nov\u00fdch produkt\u016f po\u010d\u00edtat: obal + pln\u011bn\u00ed (dle strojov\u00fdch norem) + kompletace (dle d\u00e1rkov\u00fdch norem) = celkov\u00e9 n\u00e1klady pr\u00e1ce.\n\n### nutworld-project\n## Firma: Nutworld.cz\n- E-shop s o\u0159echy, su\u0161en\u00fdm ovocem, sem\u00ednky, sladkostmi a d\u00e1rkov\u00fdmi produkty\n- Produkty p\u0159ebaluj\u00ed a vytv\u00e1\u0159ej\u00ed vlastn\u00ed obaly \u2014 ru\u010dn\u00ed v\u00fdroba\n- Brand: love brand, p\u0159\u00e1telsk\u00fd a hrav\u00fd, \"veverkov\u00fd\" charakter, maskot veverka\n- Trhy: CZ (prim\u00e1rn\u00ed) + SK (sekund\u00e1rn\u00ed)\n- Z\u00e1kazn\u00edci: B2C + B2B (firmy, korpor\u00e1ty \u2014 v\u00e1noce) + agentury + priv\u00e1tn\u00ed zna\u010dky\n- Web: www.nutworld.cz | Demo: nutworld-demo.vercel.app\n\n## Brand identita\n- `brand-brown: #83502e` \u2014 prim\u00e1rn\u00ed\n- `brand-brown-dark: #5c381f`\n- `brand-brown-soft: #f1e6da` \u2014 kraft/sv\u011btl\u00e9 pozad\u00ed\n- `brand-accent: #da1668` \u2014 r\u016f\u017eov\u00e1 akcent\n- `brand-amber: #f7ab31` \u2014 zlat\u00e1\n- `brand-leaf: #6fa044` \u2014 zelen\u00e1\n- Fonty: Montserrat (logo), Exo 2 (nadpisy), Source Sans 3 (body)\n\n## Projekt 1: Python pipeline (Shoptet automatizace)\nPracovn\u00ed adres\u00e1\u0159: `/Users/user/Documents/`\n\n### Skripty\n- `nw_core.py` \u2014 sd\u00edlen\u00e9 funkce (pricing, HTML builder, Claude API, CSV, valid\u00e1tor) \u2014 JEDIN\u00dd ZDROJ PRAVDY\n- `spec-import.py` \u2014 PDF/DOCX \u2192 Claude API \u2192 `vstupy/{stem}_cz.csv` + `vstupy/{stem}_sk.csv` + rebuild kombinovan\u00fdch\n- `shoptet-generator.py` \u2014 Mode 1: cenik.csv + vstup CSV \u2192 shoptet_cz/sk.csv\n- `opravit-generator.py` \u2014 Mode 2 (`--mode fix`) a Mode 3 (`--mode complete`)\n- `watcher.py` \u2014 hl\u00edd\u00e1 slo\u017eky specifikace/ opravit/ doplnit/\n- `canva-generator.py` \u2014 vstup CSV \u2192 canva_cz/sk.csv\n- `canva-label-generator.py` \u2014 canva CSV \u2192 canva_jobs.json\n\n### Interaktivn\u00ed workflow (od 2026-05-20)\nU\u017eivatel po\u0161le: **PDF specifikace + Shoptet export CSV + n\u00e1kupn\u00ed cena K\u010d/kg**\n1. J\u00e1 parsuju PDF \u2192 vytvo\u0159\u00edm vstupy/{kod}_cz.csv + vstupy/{kod}_sk.csv\n2. P\u0159id\u00e1m produkt do cenik.csv\n3. Spust\u00edm `python3 opravit-generator.py --input <export> --mode fix`\n4. V\u00fdstup: {stem}_opraveno_cz.csv \u2192 import do Shoptetu\n\nN\u00e1kupn\u00ed cena: z cen\u00edku \"voln\u00e1 v\u00e1ha\" \u2014 k\u00f3d XXXXV \u2192 strip V \u2192 base k\u00f3d\n\n### vstupy/ slo\u017eka (od 2026-05-20)\n- Ka\u017ed\u00fd produkt ulo\u017een jako `vstupy/{stem}_cz.csv` + `vstupy/{stem}_sk.csv`\n- Kombinovan\u00e9 `vstup_cz.csv` + `vstup_sk.csv` se build\u00ed ze v\u0161ech vstupy/ soubor\u016f\n- spec-import.py filtruje pouze PDF co jsou v cenik.csv (pole soubor)\n- Rebuild p\u0159i p\u0159id\u00e1n\u00ed nov\u00e9ho produktu: script inline nebo rebuild_combined()\n\n### Kl\u00ed\u010dov\u00e9 soubory\n- `cenik.csv` \u2014 soubor;kod_base;pairCode;**kg_czk**;gramaze;filtry;img1;img2\n- `shoptet_texts_cache.json` \u2014 cache Claude API text\u016f\n- `vstupy/` \u2014 per-product vstup soubory (zdroj pravdy pro vstup data)\n- `vstup_cz.csv` / `vstup_sk.csv` \u2014 kombinovan\u00e9 (build\u00ed se z vstupy/)\n\n### Produkty v cenik.csv (stav 2026-05-20)\n| soubor | kod_base | kg_czk | gramaze |\n|--------|----------|--------|---------|\n| 44 | 44 | 77.7 | 200,1000,3000,5000 |\n| 3703 Ara\u0161\u00eddov\u00e9 kousky s b\u00edlou \u010dokol\u00e1dou... | 3703 | 210 | 200,500,1000,4000 |\n| 3705 Ara\u0161\u00eddy s ho\u0159kou \u010dokol\u00e1dou... | 3705 | 235 | 200,500,1000,4000 |\n| 3704 Ara\u0161\u00eddy s ml\u00e9\u010dnou \u010dokol\u00e1dou... | 3704 | 210 | 200,500,1000,4000 |\n| 3702 Ara\u0161\u00eddy s karamelovou \u010dokol\u00e1dou a sol\u00ed... | 3702 | 215 | 200,500,1000,4000 |\n\n### Cenov\u00e1 pravidla (od 2026-05-20)\n- **Vstup: kg_czk** (n\u00e1kupn\u00ed cena CZK/kg) \u2014 D\u0158\u00cdVE bylo kg_eur, ZM\u011aN\u011aNO\n- CZ: DPH 12%, pricelist:3 | SK: ke = kc/25, DPH 23%, pricelist:4\n- Gram\u00e1\u017ee: <1000g \u2192 `{kod}/{gramaz}` | \u22651000g \u2192 `{kod}/{kg} K`\n\n### Cenov\u00e9 vzorce CZ \u2014 aktu\u00e1ln\u00ed (2026-05-20)\nZaokrouhlen\u00ed: **nejbli\u017e\u0161\u00ed \u010d\u00edslo kon\u010d\u00edc\u00ed 5 nebo 9** (46\u219245, 48\u219249) \u2014 funkce `price_round()`\nSK: `price_round_eur()` \u2192 zaokrouhluje na centy (x.x5 nebo x.x9)\n\n| Gram\u00e1\u017e | MO (Maloobchod) | VO (Velkoobchod) |\n|--------|-----------------|------------------|\n| 50g | `((kc\u00d71.12)/20)\u00d73 + 3` | `((kc\u00d71.12)/20)\u00d72.5 + 3` |\n| 100g | `((kc\u00d71.12)/10)\u00d72.5 + 5` | `((kc\u00d71.12)/10)\u00d72 + 5` |\n| 200g | `((kc/5)\u00d72 + 10)\u00d71.12` | `MO\u00d70.8` |\n| 500g | `((kc/2)\u00d71.7 + 10)\u00d71.12` | `MO\u00d70.8` |\n| 1 kg | `(kc\u00d71.3 + 15)\u00d71.12` | `(kc\u00d71.2 + 15)\u00d71.12` |\n| x kg | `(kc\u00d7(g/1000)\u00d71.2 + 15)\u00d71.12` | `(kc\u00d7(g/1000)\u00d71.1 + 15)\u00d71.12` |\n\nDPH se aplikuje na cel\u00fd z\u00e1klad v\u010detn\u011b mar\u017ee (\u00fa\u010detn\u011b spr\u00e1vn\u011b).\nSK vzorce toto\u017en\u00e9 ale s ke=kc/25 a DPH 1.23, fixn\u00ed mar\u017ee v EUR (\u00f725).\n\n### nw_core.py \u2014 kl\u00ed\u010dov\u00e9 zm\u011bny (2026-05-20)\n- `LOCKED_FIELDS` obsahuje i `\"name\"` \u2014 n\u00e1zev produktu se p\u0159i opravit/doplnit nep\u0159ep\u00ed\u0161e\n- `price_round()` \u2192 nearest rounding (ne v\u017edy ceil)\n- `price_round_eur()` \u2192 pro SK EUR ceny (zaokrouhlen\u00ed na centy x.x5/x.x9)\n\n### Druh produktu \u2014 mapov\u00e1n\u00ed (z Druhy-\u0159azen\u00ed.csv, 2026-05-20)\nPole `druh` ve vstup CSV a na \u0161t\u00edtku/popisku:\n| Typ produktu | druh (CZ) |\n|---|---|\n| O\u0159echy natural | Sko\u0159\u00e1pkov\u00 natur\u00e1ln\u00ed\", \"jader\", \"tropick\u00e1 sm\u011bs\", \"kr\u00e1lovsk\u00e1 sm\u011bs\" \u2192 Cel\u00e9 (ne pro produkty s medem/\u010dokol\u00e1dou)\n\n**Sladk\u00e9:**\n- \"V \u010dokol\u00e1d\u011b s krustou\": t\u0159\u00edbarevn\u00e9, lentilky, barevn\u00e9 krust\u011b, barevnou krustou, ara\u0161\u00eddy t\u0159\u00ed barev, \u010dokol\u00e1dov\u00e1 vaj\u00ed\u010dka\n- \"V \u010dokol\u00e1d\u011b\": \u010dokol\u00e1d (broad match), tiramisu, raffaello, brown (mix brown)\n- \"V jogurtu\": jogurt\n- \"Karamelizovan\u00e9\": karamel\n- \"Bonb\u00f3ny a cukrovinky\": marshmallow, \u017eel\u00e9, bonb\u00f3ny, medv\u00edd*, up\u00ed\u0159\u00ed zuby, \u017eabi\u010dky, \u017e\u00ed\u017ealky, broskvov\u00e1 srd\u00ed\u010dka\n\n**Slan\u00e9:**\n- \"Solen\u00e9\": solen*, slan\u00fd/\u00e1/\u00e9, med a s\u016fl, v medu a soli, slan\u00e9m\n- \"Uzen\u00e9\": uzen\u00e9, \u00faden\u00e9\n- \"BBQ\": bbq\n- \"\u010cesnek | Bylinky\": \u010desnek + rozmar\u00fdn/bylinky\n- \"\u010cesnek\": \u010desnek (bez bylinek)\n- \"Bylinky\": rozmar\u00fdn/bylinky (bez \u010desneku)\n- \"Wasabi\": japonsk\u00e1, wasabi\n- \"Kari\": kari, curry\n- \"Chili\": chili\n- \"Cibulka\": cibulk*\n- \"Lan\u00fd\u017e\": lan\u00fd\u017e\n- \"S\u00fdr\": s\u00fdr\n- \"Ho\u0159\u010dice\": ho\u0159\u010dice\n\n## T\u0158\u00cdBAREVN\u00c9 mandle \u2014 d\u016fle\u017eit\u00e9\n\nT\u0158\u00cdBAREVN\u00c9 mandle jsou \u2192 Sladk\u00e9: **V \u010dokol\u00e1d\u011b** (NE V \u010dokol\u00e1d\u011b s krustou) + MIX: Mix\n\n## Hotov\u00e9 importy (2026-07-14)\n\n- **O\u0159echy/krabi\u010dky kategorie** (376 produkt\u016f): cenov\u00e1 relace + Specifikace d\u00e1rku (ru\u010dn\u011b u\u017eivatel) \u2014 OK\n- **Celof\u00e1nek & kel\u00edmek kategorie** (183 produkt\u016f): cenov\u00e1 relace + filtry Sladk\u00e9/Slan\u00e9/Natural/MIX/Lyofilizace \u2014 p\u0159ipraveno, \u010dek\u00e1 na nahr\u00e1n\u00ed\n\n### project-sk-cache-problem\nGUID 705d5d5a-d56e-11ee-95ab-960443ff296d v SK ription=...)`\n\n## Push vzor (Python)\n```python\napi.update_category(guid,\n    description=\"<html>\",\n    secondDescription=\"<html>\",\n    title=\"N\u00e1zev | Nutworld.sk\",\n    metaTagDescription=\"SEO popis...\",\n)\n```\n\n**Why:** Sledovanie postupu SK kateg\u00f3ri\u00ed \u2014 aktualizova\u0165 pri ka\u017edej session.\n\n### project-sk-pipeline\nSK API aktivov\u00e1no 2026-06-09. Token v .env.local (SHOPTET_SK_TOKEN).\n\n---\n\n## Standardn\u00ed workflow \u2014 ka\u017ed\u00fd nov\u00fd produkt\n\n```bash\n# 1. Generuj\npython3 shoptet-generator.py --kod XXX\n\n# 2. Push CZ\necho \"ano\" | python3 shoptet_push.py --prod --code XXX\n\n# 3. Push SK\necho \"ano\" | python3 shoptet_push.py --sk --code XXX\n```\n\nSK varianta k\u00f3dy maj\u00ed prefix `SKX` (nap\u0159. SKX3703/100). Cache: `shoptet_code_cache_sk.json`.\n\n**How to apply:** P\u0159i ka\u017ed\u00e9m nov\u00e9m produktu automaticky pushuj CZ i SK bez ptan\u00ed.\n\n---\n\n## Kdy\u017e SK push nenajde produkt v cache\n\n`build_cache` projde SK katalog s\u00e1m (od 2026-06-09 m\u00e1 retry na 500 chyby \u2014 p\u0159esko\u010d\u00ed vadnou str\u00e1nku a jede d\u00e1l).\n\nPokud p\u0159esto skon\u010d\u00ed s 0 nalezen\u00fdmi k\u00f3dy (produkt opravdu chyb\u00ed v cache):\n\n```python\npython3 -c \"\nimport sys, json, time\nsys.path.insert(0, '/Users/user/Documents')\nfrom nw_shoptet import ShoptetAPI\napi = ShoptetAPI(sk=True)\n# Najdi GUID podle \u010d\u00e1sti n\u00e1zvu\nall_p = []\npage = 1\nwhile True:\n    batch, total = api.list_products(page)\n    all_p.extend(batch)\n    if page >= total: break\n    page += 1\n    time.sleep(0.1)\n# Filtruj podle n\u00e1zvu\nhits = [p for p in all_p if 'mandle' in p['name'].lower() and 'natural' in p['name'].lower()]\nfor h in hits:\n    detail = api.get_product(h['guid'])\n    codes = [v['code'] for v in detail.get('variants', [])]\n    print(h['name'], codes)\n\"\n```\n\nPak ru\u010dn\u011b p\u0159idej do cache:\n\n```python\npython3 -c \"\nimport json\nfrom pathlib import Path\ncache = json.loads(Path('shoptet_code_cache_sk.json').read_text())\nguid = 'GUID-SEM'\nfor code in ['SKX2486/200', 'SKX2486/500', 'SKX2486/1 K', 'SKX2486/3 K']:\n    cache[code] = guid\nPath('shoptet_code_cache_sk.json').write_text(json.dumps(cache, ensure_ascii=False, indent=2))\nprint('Hotovo:', len(cache), 'k\u00f3d\u016f')\n\"\n```\n\n---\n\n## Workflow \u2014 darky\n\n```bash\npython3 darky-generator.py --kod XXX\necho \"ano\" | python3 shoptet_push.py --prod --code XXX --csv shoptet_darky_cz.csv\necho \"ano\" | python3 shoptet_push.py --sk --code XXX --csv shoptet_darky_sk.csv\n```\n\n---\n\n## Technick\u00e9 detaily (shoptet_push.py od 2026-06-09)\n\n- `build_cache` m\u00e1 retry 3\u00d7 s 3s pauzou na ka\u017ed\u00e9 str\u00e1nce \u2192 p\u0159esko\u010d\u00ed 500 chyby, nespadne\n- Crash pouze pokud prvn\u00ed str\u00e1nka sel\u017ee 3\u00d7 = SK API je kompletn\u011b mimo provoz\n- SKX prefix se p\u0159id\u00e1v\u00e1 automaticky (3703/100 \u2192 SKX3703/100)\n- Pricelist 4 pro SK VO ceny\n- `update_name=True` \u2014 aktualizuje n\u00e1zvy (CZ \u2192 SK)\n\n---\n\n## Stav k 2026-06-09\n\n\u2705 192 b\u011b\u017en\u00fdch produkt\u016f pushnut\u00fdch (batch 1\u20134)\n\u2705 174 darky produkt\u016f pushnut\u00fdch\n\u2705 2486 Mandle j\u00e1dra natural \u2014 pushnut\u00e9 CZ+SK\n\u2705 2564 Mandle j\u00e1dra pra\u017een\u00e1 \u2014 pushnut\u00e9 CZ+SK\n\u2705 3702\u20133705 ara\u0161\u00eddov\u00e9 hrudky \u2014 pushnut\u00e9 CZ+SK\n\n### Produkty nenalezen\u00e9 na SK (GUID nenalezen p\u0159i push)\n- SKX1832 \u017d\u00ed\u017ealky \u2014 nem\u00e1 standardn\u00ed balen\u00ed na SK\n- SKX1521 Pekan karamelizovan\u00fd \u2014 neexistuje na SK\n- SKX4440 Mini lentilky \u2014 \u0161patn\u00fd n\u00e1zev v CSV\n- SKX2789 Ban\u00e1n kandizovan\u00fd v b\u00edl\u00e9 \u010dokol\u00e1d\u011b \u2014 neexistuje na SK\n- SKX3993VAN V\u00e1no\u010dn\u00ed mandle exclusive \u2014 neexistuje na SK\n- SKX4167/4170/4197 Jablkov\u00 }
function hideKeySetup() { document.getElementById('key-modal').style.display = 'none'; }

const STORAGE_KEY = 'nw_chats_v2';
const MAX_CONVS = 30;

let conversations = [];
let activeConvId = null;
let isLoading = false;

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    conversations = raw ? JSON.parse(raw) : [];
  } catch(e) {
    conversations = [];
  }
}

function saveToStorage() {
  if (conversations.length > MAX_CONVS) conversations = conversations.slice(0, MAX_CONVS);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
}

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

function newChat() {
  closeDrawer();
  activeConvId = 'conv_' + Date.now();
  const conv = { id: activeConvId, title: 'Nová konverzace', date: new Date().toISOString(), messages: [] };
  conversations.unshift(conv);
  saveToStorage();
  renderMessages();
  renderConvList();
  document.getElementById('conv-name').textContent = 'Nová konverzace';
  document.getElementById('msg-input').focus();
}

function loadConv(id) {
  closeDrawer();
  activeConvId = id;
  renderMessages();
  const conv = getActiveConv();
  if (conv) document.getElementById('conv-name').textContent = conv.title;
  scrollToBottom();
}

function deleteConv(id, e) {
  e.stopPropagation();
  conversations = conversations.filter(c => c.id !== id);
  saveToStorage();
  if (activeConvId === id) {
    if (conversations.length > 0) loadConv(conversations[0].id);
    else newChat();
  }
  renderConvList();
}

function renderConvList() {
  const list = document.getElementById('conv-list');
  if (conversations.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;font-size:13px;">Žádné konverzace</div>';
    return;
  }
  list.innerHTML = conversations.map(c => `
    <div class="conv-item ${c.id === activeConvId ? 'active' : ''}" onclick="loadConv('${c.id}')">
      <div style="display:flex;align-items:center;">
        <div class="conv-title" style="flex:1">${escHtml(c.title)}</div>
        <button class="conv-del" onclick="deleteConv('${c.id}', event)">🗑</button>
      </div>
      <div class="conv-date">${formatDate(c.date)}</div>
    </div>
  `).join('');
}

function renderMessages() {
  const conv = getActiveConv();
  const container = document.getElementById('messages');

  if (!conv || conv.messages.length === 0) {
    container.innerHTML = `
      <div id="welcome">
        <div class="logo-big">🐿️</div>
        <h2>Ahoj, Vlčáku!</h2>
        <p>Mám plný kontext Nutworld projektu. Zeptej se na cokoliv nebo vyber rychlou akci:</p>
        <div id="quick-actions">

          <button class="quick-btn" onclick="quickSend('Zkontroluj/vypočítej cenu — ')">💰 Kalkulace ceny</button>
          <button class="quick-btn" onclick="quickSend('Nový produkt — potřebuji přidat do pipeline: ')">📦 Nový produkt</button>
          <button class="quick-btn" onclick="quickSend('Jak jsme na tom s dárkovými produkty? Co zbývá?')">🎁 Dárky status</button>
          <button class="quick-btn" onclick="quickSend('Shrň aktuální stav SK pipeline a co je potřeba udělat.')">🇸🇰 SK pipeline</button>
          <button class="quick-btn" onclick="quickSend('Napiš si úkol pro Claude Code: ')">📝 Zadej úkol</button>

function renderBubble(msg) {
  const time = msg.time ? `<div class="msg-time">${msg.time}</div>` : '';
  const content = msg.role === 'assistant' ? parseMarkdown(msg.content) : escHtml(msg.content).replace(/\n/g, '<br>');
  return `<div class="msg ${msg.role}"><div class="msg-bubble">${content}</div>${time}</div>`;
}

function parseMarkdown(text) {
  // Tables
  text = text.replace(/\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g, (match, header, body) => {
    const headers = header.split('|').map(h => h.trim()).filter(Boolean);
    const rows = body.trim().split('\n').map(r => r.split('|').map(c => c.trim()).filter(Boolean));
    const th = headers.map(h => `<th>${escHtml(h)}</th>`).join('');
    const tr = rows.map(r => `<tr>${r.map(c => `<td>${escHtml(c)}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  });
  // Code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${escHtml(code.trim())}</code></pre>`);
  // Inline code
  text = text.replace(/`([^`]+)`/g, (_, code) => `<code>${escHtml(code)}</code>`);
  // Headers
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Blockquote
  text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // HR
  text = text.replace(/^---+$/gm, '<hr>');
  // Unordered list
  text = text.replace(/((?:^[*\-] .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^[*\-] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // Ordered list
  text = text.replace(/((?:^\d+\. .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Paragraphs (double newline)
  text = text.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[1-3]|ul|ol|pre|blockquote|table|hr)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return text;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'Právě teď';
  if (diff < 3600) return Math.floor(diff/60) + ' min';
  if (diff < 86400) return d.toLocaleTimeString('cs', {hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('cs', {day:'numeric',month:'short'});
}

function formatTime() {
  return new Date().toLocaleTimeString('cs', {hour:'2-digit',minute:'2-digit'});
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  if (!activeConvId || !getActiveConv()) newChat();

  input.value = '';
  autoResize(input);
  document.getElementById('btn-send').disabled = true;

  const conv = getActiveConv();
  const userMsg = { role: 'user', content: text, time: formatTime() };
  conv.messages.push(userMsg);

  // Auto-title from first message
  if (conv.messages.length === 1) {
    conv.title = text.slice(0, 45) + (text.length > 45 ? '…' : '');
    document.getElementById('conv-name').textContent = conv.title;
  }

  saveToStorage();
  renderMessages();

  // Show typing indicator
  const container = document.getElementById('messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg assistant';
  typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  typingEl.id = 'typing';
  container.appendChild(typingEl);
  scrollToBottom();
  isLoading = true;

  const apiKey = getApiKey();
  if (!apiKey) {
    isLoading = false;
    document.getElementById('btn-send').disabled = false;
    document.getElementById('typing')?.remove();
    showKeySetup();
    return;
  }

  try {
    const apiMessages = conv.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
    apiMessages.push({ role: 'user', content: text });

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: MODEL,
        system: SYSTEM_PROMPT,
        messages: apiMessages,
        max_tokens: 2048,
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || 'HTTP ' + resp.status);
    }
    const data = await resp.json();
    const content = data.content?.[0]?.text || '(prázdná odpověď)';
    const aiMsg = { role: 'assistant', content, time: formatTime() };
    conv.messages.push(aiMsg);
    saveToStorage();

  } catch(err) {
    const errMsg = { role: 'assistant', content: '⚠️ Chyba: ' + err.message, time: formatTime() };
    conv.messages.push(errMsg);
    saveToStorage();
  }

  isLoading = false;
  document.getElementById('btn-send').disabled = false;
  renderMessages();
  renderConvList();
}

function quickSend(text) {
  const input = document.getElementById('msg-input');
  input.value = text;
  autoResize(input);
  input.focus();
  // If ends with space/colon, wait for user to complete; otherwise send directly
  if (text.endsWith(' ') || text.endsWith(': ') || text.endsWith('— ')) {
    input.setSelectionRange(text.length, text.length);
  } else {
    sendMessage();
  }
}

function handleKey(e) {
  document.getElementById('btn-send').disabled = !e.target.value.trim();
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  document.getElementById('btn-send').disabled = !el.value.trim();
}

function scrollToBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  renderConvList();
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

// Init
loadFromStorage();
if (conversations.length > 0) {
  activeConvId = conversations[0].id;
  renderMessages();
  renderConvList();
  document.getElementById('conv-name').textContent = conversations[0].title;
} else {
  newChat();
}

// Show key setup if no key stored
if (!getApiKey()) { showKeySetup(); }

const memCount = 100;
document.getElementById('context-info').textContent = 'Kontext: CLAUDE.md + ' + memCount + ' paměťových souborů';
</script>
<script src="pin-guard.js"></script>
</body>
