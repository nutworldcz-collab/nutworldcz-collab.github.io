<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nutworld — Výrobní plán</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bd:#5c381f;--br:#83502e;--kraft:#f1e6da;--acc:#da1668;--leaf:#6fa044;--amb:#f7ab31;--amb-soft:#fff8e1}
body{font-family:'Source Sans 3',Arial,sans-serif;background:#e8ddd4;color:#2a1a0e;font-size:14px;min-height:100vh}

.topbar{background:var(--bd);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar-title{font-family:'Exo 2',sans-serif;font-size:17px;font-weight:800;color:white}
.topbar a{color:rgba(255,255,255,.6);font-size:12px;text-decoration:none}
.topbar a:hover{color:white}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.refresh-info{font-size:11px;color:rgba(255,255,255,.5)}
.btn-refresh{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;font-family:inherit}
.btn-refresh:hover{background:rgba(255,255,255,.25)}

.container{max-width:1200px;margin:0 auto;padding:16px}

/* Toolbar */
.toolbar{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px;background:white;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;border:1.5px solid #d4c0a8;border-radius:8px;padding:7px 10px 7px 32px;font-size:13px;font-family:inherit;background:#faf7f3}
.search-wrap input:focus{outline:none;border-color:var(--br)}
.search-wrap::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px}
.view-toggle{display:flex;border:1.5px solid #d4c0a8;border-radius:8px;overflow:hidden;flex-shrink:0}
.view-btn{background:#faf7f3;border:none;padding:7px 18px;font-size:12px;font-family:'Exo 2',sans-serif;font-weight:700;color:#888;cursor:pointer;transition:all .15s}
.view-btn.active{background:var(--bd);color:white}
.view-btn:hover:not(.active){background:var(--kraft);color:var(--bd)}
.list-filters{display:flex;gap:5px;flex-wrap:wrap;width:100%;padding-top:8px;border-top:1px solid #ede0d4;margin-top:8px}
.lpill{padding:4px 12px;border-radius:20px;border:1.5px solid #d4c0a8;background:white;font-size:11px;font-weight:700;cursor:pointer;color:#888;font-family:inherit;transition:all .15s}
.lpill.on{background:var(--bd);border-color:var(--bd);color:white}
.lpill:hover:not(.on){background:var(--kraft);color:var(--bd)}
.lpill-all.on{background:var(--amb)!important;border-color:var(--amb)!important;color:var(--bd)!important}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}}
.sum-box{background:white;border-radius:10px;padding:10px 14px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.sum-val{font-family:'Exo 2',sans-serif;font-size:22px;font-weight:800;color:var(--bd)}
.sum-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.sum-box.green .sum-val{color:var(--leaf)}

/* ═══ FIRMY VIEW ═══ */
.firmy-list{display:flex;flex-direction:column;gap:16px}

.firma-card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
.firma-card.all-done{border-left:4px solid var(--leaf)}

.firma-hdr{padding:14px 18px 12px;border-bottom:2px solid var(--kraft);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.firma-name{font-family:'Exo 2',sans-serif;font-weight:800;font-size:16px;color:var(--bd)}
.firma-meta{font-size:11px;color:#999;margin-top:3px}
.firma-meta strong{color:#666}
.firma-hdr-right{text-align:right;flex-shrink:0}
.firma-total-kg{font-family:'Exo 2',sans-serif;font-size:20px;font-weight:800;color:var(--br)}
.firma-total-lbl{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.5px}
.firma-progress{display:flex;align-items:center;gap:8px;margin-top:6px}
.prog-bar{flex:1;height:5px;background:#ede0d4;border-radius:3px;overflow:hidden;min-width:80px}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;background:var(--amb)}
.prog-fill.full{background:var(--leaf)}
.prog-txt{font-size:10px;color:#bbb;white-space:nowrap}

/* Dárek blok uvnitř firma-card */
.darky-list{padding:0 18px 14px}

.darek-block{margin-top:12px;border:1.5px solid #ede0d4;border-radius:10px;overflow:hidden}
.darek-hdr{padding:9px 14px;background:#faf7f3;border-bottom:1px solid #ede0d4;display:flex;align-items:center;gap:10px}
.darek-icon{font-size:14px}
.darek-name{font-family:'Exo 2',sans-serif;font-weight:700;font-size:13px;color:var(--br);flex:1}
.darek-ks{font-size:11px;color:#bbb;white-space:nowrap}
.darek-kg{font-size:12px;font-weight:700;color:var(--br);white-space:nowrap;padding-left:10px;border-left:1px solid #e8ddd4;margin-left:6px}

/* Složka řádek */
.comp-row{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid #f5f0ea}
.comp-row:last-child{border-bottom:none}
.comp-row:hover{background:#faf7f3}
.comp-row.done{background:#f4fbf4}
.comp-check{width:20px;height:20px;border:2px solid #d4c0a8;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:white;transition:all .15s}
.comp-row.done .comp-check{background:var(--leaf);border-color:var(--leaf)}
.comp-row.done .comp-check::after{content:'✓';font-size:12px;font-weight:800;color:white}
.comp-info{flex:1;min-width:0}
.comp-name{font-size:13px;color:#333}
.comp-row.done .comp-name{text-decoration:line-through;color:#bbb}
.comp-gram{font-size:11px;color:#999;margin-top:1px}
.comp-kg{font-size:12px;font-weight:700;color:var(--br);white-space:nowrap;min-width:60px;text-align:right}
.comp-row.done .comp-kg{color:#ccc}
.comp-kod{font-size:10px;color:#c8a87a;font-family:monospace;white-space:nowrap;margin-left:6px}
.no-comp{padding:10px 14px;font-size:12px;color:#bbb;font-style:italic}

/* Součet pod dárkem */
.darek-footer{padding:6px 14px;background:var(--amb-soft);border-top:1px solid #ede0d4;display:flex;justify-content:space-between;align-items:center}
.darek-footer-lbl{font-size:11px;color:#b8860b}
.darek-footer-val{font-size:12px;font-weight:700;color:var(--bd)}

/* Servisní produkt (grafika, tisk…) */
.sluzba-row{padding:7px 14px;font-size:12px;color:#bbb;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f5f0ea;font-style:italic}
.sluzba-row:last-child{border-bottom:none}

/* Poznámky per firma */
.nota-bar{padding:8px 18px;border-top:1px solid var(--kraft);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;transition:background .1s}
.nota-bar:hover{background:#faf7f3}
.nota-bar-lbl{font-size:11px;color:#aaa;flex:1}
.nota-bar-lbl.has-text{color:var(--br);font-weight:600}
.nota-toggle{font-size:11px;color:#ccc;transition:transform .2s}
.nota-toggle.open{transform:rotate(180deg)}
.nota-body{display:none;padding:10px 18px 14px;border-top:1px solid #f5f0ea}
.nota-body.open{display:block}
.nota-ta{width:100%;border:1.5px solid #d4c0a8;border-radius:8px;padding:8px 11px;font-family:inherit;font-size:13px;color:var(--text);background:#fdf9f6;resize:vertical;min-height:64px;line-height:1.5}
.nota-ta:focus{outline:none;border-color:var(--br)}
.nota-hint{font-size:10px;color:#ccc;margin-top:4px;text-align:right}

/* ═══ VÝROBA VIEW ═══ */
.vyroba-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}

/* Karta suroviny */
.icard{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
.icard.all-done .ihdr{background:#e8f5e9;border-color:var(--leaf)}

.ihdr{padding:12px 16px;background:var(--amb-soft);border-bottom:2px solid var(--amb);display:flex;align-items:center;justify-content:space-between;gap:8px}
.iname{font-family:'Exo 2',sans-serif;font-weight:800;font-size:14px;color:var(--bd);flex:1}
.itotal-kg{font-family:'Exo 2',sans-serif;font-size:18px;font-weight:800;color:var(--br);white-space:nowrap}

/* Pack sekce (gramáž + dárek) */
.pack-section{border-bottom:1px solid #f0e8e0}
.pack-section:last-child{border-bottom:none}

.pack-hdr{padding:7px 14px;background:#faf7f3;border-bottom:1px solid #ede0d4;display:flex;align-items:center;gap:8px}
.pack-gram{font-family:'Exo 2',sans-serif;font-weight:700;font-size:12px;color:var(--bd);background:var(--amb);padding:2px 8px;border-radius:4px;white-space:nowrap}
.pack-darek{font-size:12px;color:#666;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pack-total{font-size:11px;color:#bbb;white-space:nowrap}

/* Řádek firmy */
.frow{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;border-bottom:1px solid #f8f3ee;transition:background .1s}
.frow:hover{background:#faf7f3}
.frow.done{background:#f4fbf4}
.frow.done .ffirma{text-decoration:line-through;color:#bbb}
.frow.done .fkg{color:#ccc}

.fcheck{width:20px;height:20px;border:2px solid #d4c0a8;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:white;transition:all .15s}
.frow.done .fcheck{background:var(--leaf);border-color:var(--leaf)}
.frow.done .fcheck::after{content:'✓';font-size:12px;font-weight:800;color:white}
.ffirma-wrap{flex:1;min-width:0}
.ffirma{font-size:13px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.frow.done .ffirma{text-decoration:line-through;color:#bbb}
.ftermin{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.ftermin.ok{background:#f1e6da;color:#83502e}
.ftermin.soon{background:#fff3cd;color:#856404}
.ftermin.late{background:#fde8ec;color:#c0392b}
.frow.done .ftermin{opacity:.4}
.fks{font-size:11px;color:#bbb;white-space:nowrap}
.fkg{font-size:13px;font-weight:700;color:var(--br);white-space:nowrap;min-width:55px;text-align:right}
.frow.done .fkg{color:#ccc}

/* Patička pack-sekce */
.pack-foot{padding:5px 14px;background:var(--amb-soft);border-top:1px solid #ede0d4;display:flex;justify-content:space-between;align-items:center}
.pfoot-lbl{font-size:11px;color:#b8860b}
.pfoot-kg{font-size:12px;font-weight:700;color:var(--bd)}

/* Poznámka inline ve Výrobě */
.fnota-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;line-height:1;color:#ddd;flex-shrink:0;transition:color .15s}
.fnota-btn:hover{color:var(--amb)}
.fnota-btn.has-nota{color:var(--amb)}
.fnota-wrap{display:none;padding:6px 14px 8px 44px;border-bottom:1px solid #f0e8e0;background:#fffdf8}
.fnota-wrap.open{display:block}
.fnota-ta{width:100%;border:1.5px solid #e0cfa8;border-radius:7px;padding:6px 10px;font-family:inherit;font-size:12px;color:var(--text);background:#fff;resize:vertical;min-height:50px;line-height:1.5}
.fnota-ta:focus{outline:none;border-color:var(--br)}
.fnota-hint{font-size:10px;color:#ccc;text-align:right;margin-top:2px}

/* Loading / empty */
.state-box{background:white;border-radius:12px;padding:48px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.state-box p{color:#888;font-size:14px;margin-top:12px}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid var(--kraft);border-top-color:var(--br);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{background:white;border-radius:12px;padding:40px;text-align:center;color:#bbb;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.07)}

/* ═══ VZORKY VIEW ═══ */
.vzorky-list{display:flex;flex-direction:column;gap:12px}
.vz-header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.vz-header-title{font-family:'Exo 2',sans-serif;font-size:13px;font-weight:700;color:var(--bd)}
.vz-header-link{font-size:12px;color:var(--br);text-decoration:none;font-weight:600}
.vz-header-link:hover{text-decoration:underline}

.vz-card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;border-left:4px solid #ddd}
.vz-card.status-zadano{border-left-color:#c8c8c8}
.vz-card.status-vyroba{border-left-color:var(--amb)}
.vz-card.status-odeslano{border-left-color:#60a5fa;opacity:.8}

.vz-hdr{padding:12px 16px;background:var(--kraft);border-bottom:1.5px solid #e0d4c4;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.vz-hdr-left{flex:1;min-width:0}
.vz-id{font-family:monospace;font-size:10px;color:#b8a090;letter-spacing:.3px}
.vz-klient{font-family:'Exo 2',sans-serif;font-weight:800;font-size:15px;color:var(--bd);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vz-produkt{font-size:12px;color:#888;margin-top:2px}
.vz-sbadge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.vz-s-zadano{background:#eef0f3;color:#4a5568}
.vz-s-vyroba{background:var(--amb-soft);color:#92600a}
.vz-s-odeslano{background:#dbeafe;color:#1a5fa0}

.vz-body{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.vz-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.vz-tag{background:var(--kraft);border-radius:6px;padding:3px 9px;font-size:12px;color:#666}
.vz-nota{background:#fffdf8;border-radius:8px;padding:9px 12px;font-size:12px;color:#555;border-left:3px solid var(--amb);line-height:1.5}
.vz-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.vz-btn{border:none;border-radius:7px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s}
.vz-btn:hover{filter:brightness(1.06)}
.vz-btn-v{background:var(--amb-soft);color:#92600a}
.vz-btn-o{background:#dbeafe;color:#1a5fa0}
.vz-btn-z{background:#fce7f0;color:#b0144a}
.vz-link{font-size:11px;color:var(--br);text-decoration:none;margin-left:auto;font-weight:600}
.vz-link:hover{text-decoration:underline}

.vz-empty{background:white;border-radius:12px;padding:48px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.vz-empty-icon{font-size:36px;margin-bottom:12px}
.vz-empty-title{font-size:15px;font-weight:700;color:#555;margin-bottom:6px}
.vz-empty-sub{font-size:13px;color:#bbb}
.vz-empty a{color:var(--br);text-decoration:none;font-weight:700}
.vz-empty a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">🏭 Výrobní plán</span>
  <a href="/">← Rozcestník</a>
  <a href="/zakazy.html">🃏 Zakázky</a>
  <a href="/vzorky.html">🧪 Vzorky</a>
  <div class="topbar-right">
    <span class="refresh-info" id="refresh-info">načítám…</span>
    <button class="btn-refresh" onclick="loadData(true)">↻ Obnovit</button>
  </div>
</div>

<div class="container">

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Hledat firmu nebo produkt…" oninput="render()"/>
    </div>
    <div class="view-toggle">
      <button id="btn-firmy"  class="view-btn active" onclick="setView('firmy')">🏢 Firmy</button>
      <button id="btn-vyroba" class="view-btn"        onclick="setView('vyroba')">🔧 Výroba</button>
      <button id="btn-vzorky" class="view-btn"        onclick="setView('vzorky')">🧪 Vzorky</button>
    </div>
    <div class="list-filters" id="list-filters"></div>
  </div>

  <div class="summary" id="summary" style="display:none">
    <div class="sum-box"><div class="sum-val" id="s-firmy">—</div><div class="sum-lbl">Firem</div></div>
    <div class="sum-box"><div class="sum-val" id="s-ks">—</div><div class="sum-lbl">Kusů celkem</div></div>
    <div class="sum-box"><div class="sum-val" id="s-kg">—</div><div class="sum-lbl">kg celkem</div></div>
    <div class="sum-box green"><div class="sum-val" id="s-done">—</div><div class="sum-lbl">Hotovo</div></div>
  </div>

  <div id="main-content">
    <div class="state-box"><div class="spinner"></div><p>Načítám zakázky z Trella…</p></div>
  </div>

</div>

<script>
const KEY   = atob('MDM2M2ViYjE0OWRmMDRkMTI4NTY3MmEzMDgwMTYwYTI=');
const TOKEN = atob('QVRUQTdiMWI4YTFjZWRjMTIyODI3ZmRiMmY4MGRjMjRiNThkMTA4NTVkOTY3ZTAwNDViNWU0ZDdkNmZkMzQwYzJmZWFDNEYxMTFGRQ==');
const BOARD = '637f702c5e323c01d42feeac';
const CACHE_KEY = 'nw_vyroba_cache';
const PROG_KEY  = 'nw_vyroba_progress';
const NOTA_KEY  = 'nw_vyroba_notes';
const EXCL = ['archiv','storno','hotov','dokončen','faktura'];

let allLists = [], allCards = [], parsedCards = [];
let activeLists = new Set(['ALL']);
let activeView  = 'firmy';
let progress    = {};

/* ── Progress ── */
function saveProg() { try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch(e){} }
function loadProg() { try { progress = JSON.parse(localStorage.getItem(PROG_KEY)||'{}'); } catch(e){ progress={}; } }

/* ── Poznámky ── */
let notes = {};
function saveNotes() { try { localStorage.setItem(NOTA_KEY, JSON.stringify(notes)); } catch(e){} }
function loadNotes() { try { notes = JSON.parse(localStorage.getItem(NOTA_KEY)||'{}'); } catch(e){ notes={}; } }
function getNote(cardId) { return notes[cardId]||''; }
function setNote(cardId, val) { notes[cardId] = val; saveNotes(); }
function toggleNota(cardId) {
  const body = document.getElementById('nota-body-'+cardId);
  const tog  = document.getElementById('nota-tog-'+cardId);
  const open = body.classList.toggle('open');
  tog.classList.toggle('open', open);
  if (open) document.getElementById('nota-ta-'+cardId).focus();
}
function toggleFNota(nid, cardId) {
  const wrap = document.getElementById('fnota-wrap-'+nid);
  const open = wrap.classList.toggle('open');
  if (open) document.getElementById('fnota-ta-'+nid).focus();
}
function pKey(cardId,pi,ci) { return `${cardId}_p${pi}_c${ci}`; }
function isDone(cardId,pi,ci) { return !!progress[pKey(cardId,pi,ci)]; }
function toggle(cardId,pi,ci) { const k=pKey(cardId,pi,ci); progress[k]=!progress[k]; saveProg(); render(); }

/* ── Gramáž → kg ── */
function gramToKg(gram) {
  if (!gram) return 0;
  const kg = gram.match(/(\d+(?:[.,]\d+)?)\s*kg/i);
  if (kg) return parseFloat(kg[1].replace(',','.'));
  const g = gram.match(/(\d+(?:[.,]\d+)?)/);
  if (g) return parseFloat(g[1].replace(',','.')) / 1000;
  return 0;
}
function fmtKg(kg) {
  if (kg === 0) return '—';
  return kg >= 1 ? `${(Math.round(kg*10)/10).toFixed(1).replace('.',',')} kg`
                 : `${Math.round(kg*1000)} g`;
}

/* ── API / cache ── */
function api(path, p={}) {
  return fetch(`https://api.trello.com/1${path}?`+new URLSearchParams({key:KEY,token:TOKEN,...p})).then(r=>r.json());
}
function saveCache(l,c){ try{localStorage.setItem(CACHE_KEY,JSON.stringify({lists:l,cards:c,ts:Date.now()}));}catch(e){} }
function loadCache(){ try{return JSON.parse(localStorage.getItem(CACHE_KEY));}catch(e){return null;} }

async function loadData(force=false) {
  document.getElementById('refresh-info').textContent='načítám…';
  document.getElementById('main-content').innerHTML='<div class="state-box"><div class="spinner"></div><p>Načítám zakázky z Trella…</p></div>';
  const cache=loadCache();
  if(!force&&cache&&(Date.now()-cache.ts)<5*60000){
    allLists=cache.lists; allCards=cache.cards;
    document.getElementById('refresh-info').textContent=`cache ${Math.round((Date.now()-cache.ts)/60000)} min`;
    process(); return;
  }
  try {
    const [lists,cards]=await Promise.all([
      api(`/boards/${BOARD}/lists`),
      api(`/boards/${BOARD}/cards`,{fields:'name,desc,idList,due,url'})
    ]);
    allLists=lists.filter(l=>!l.closed);
    allCards=cards;
    saveCache(allLists,allCards);
    const n=new Date();
    document.getElementById('refresh-info').textContent=`${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;
    process();
  } catch(e) {
    document.getElementById('main-content').innerHTML=`<div class="state-box"><p>⚠️ Chyba: ${e.message}</p></div>`;
  }
}

/* ── Parse ── */
function isExcl(name){ return EXCL.some(k=>name.toLowerCase().includes(k)); }

function parseComp(s) {
  const km=s.match(/\(kód\s+(\S+)\)\s*$/);
  const kod=km?km[1]:'';
  const rest=(km?s.slice(0,km.index):s).trim();
  const toks=rest.split(/\s+/);
  let gi=-1;
  for(let i=1;i<toks.length;i++){
    if(/^\d+(?:[.,]\d+)?(?:g|kg|ml)?$/i.test(toks[i])){ gi=i; break; }
  }
  if(gi===-1) return {nazev:rest,gram:'',obal:'',kod};
  return {nazev:toks.slice(0,gi).join(' '),gram:toks[gi],obal:toks.slice(gi+1).join(' '),kod};
}

function parseCard(card){
  const {id,name,desc='',idList,url}=card;
  const firma=name.split(' — ')[0]||name;
  const tm=desc.match(/\*\*Termín:\*\*\s*(\d{2}\.\d{2}\.\d{4})/);
  const termin=tm?tm[1]:'';
  const produkty=[];
  const sect=desc.match(/##\s*🛒 Produkty\n\n([\s\S]*?)(?:\n##\s|$)/);
  if(sect){
    let cur=null;
    for(const line of sect[1].split('\n')){
      const hm=line.match(/^\*\*(.+?)\*\*(\s*\*\(služba\)\*)?\s*$/);
      if(hm){ if(cur)produkty.push(cur); cur={nazev:hm[1].trim(),isSluzba:!!hm[2],ks:0,slozeni:[]}; continue; }
      if(!cur) continue;
      const km=line.match(/[-\s]*(\d+)\s*ks/); if(km) cur.ks=parseInt(km[1]);
      const sm=line.match(/📦\s+(.+)/);
      if(sm) cur.slozeni=sm[1].split(', ').map(parseComp).filter(x=>x.nazev||x.kod);
    }
    if(cur) produkty.push(cur);
  }
  return {id,firma,termin,idList,produkty,url};
}

function process(){
  const vis=new Set(allLists.filter(l=>!isExcl(l.name)).map(l=>l.id));
  parsedCards=allCards.filter(c=>vis.has(c.idList)).map(parseCard);
  buildFilters([...allLists].filter(l=>vis.has(l.id)));
  loadProg();
  render();
}

/* ── List pills ── */
function buildFilters(lists){
  const c=document.getElementById('list-filters');
  c.innerHTML='';
  const a=mkPill('Vše','lpill lpill-all'+(activeLists.has('ALL')?' on':''),()=>{activeLists=new Set(['ALL']);buildFilters(lists);render();});
  c.appendChild(a);
  lists.forEach(l=>{
    const cnt=allCards.filter(x=>x.idList===l.id).length;
    const b=mkPill(`${l.name} (${cnt})`,'lpill'+(activeLists.has(l.id)?' on':''),()=>{
      activeLists.delete('ALL');
      activeLists.has(l.id)?activeLists.delete(l.id):activeLists.add(l.id);
      if(!activeLists.size) activeLists.add('ALL');
      buildFilters(lists); render();
    });
    c.appendChild(b);
  });
}
function mkPill(txt,cls,fn){ const b=document.createElement('button'); b.className=cls; b.textContent=txt; b.onclick=fn; return b; }

/* ── View toggle ── */
function setView(v){
  activeView=v;
  document.getElementById('btn-firmy').classList.toggle('active',v==='firmy');
  document.getElementById('btn-vyroba').classList.toggle('active',v==='vyroba');
  document.getElementById('btn-vzorky').classList.toggle('active',v==='vzorky');
  const isVz=v==='vzorky';
  document.getElementById('list-filters').style.display=isVz?'none':'';
  document.getElementById('search').closest('.search-wrap').style.display=isVz?'none':'';
  render();
}

/* ── Visible cards ── */
function visible(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  return parsedCards.filter(c=>{
    if(!activeLists.has('ALL')&&!activeLists.has(c.idList)) return false;
    if(!q) return true;
    if(c.firma.toLowerCase().includes(q)) return true;
    return c.produkty.some(p=>
      p.nazev.toLowerCase().includes(q)||
      p.slozeni.some(s=>s.nazev.toLowerCase().includes(q)||s.kod.toLowerCase().includes(q))
    );
  });
}

/* ── Render ── */
function render(){
  if(activeView==='vzorky'){ syncAndRenderVzorky(); return; }
  const cards=visible();
  updateSummary(cards);
  if(activeView==='firmy') renderFirmy(cards);
  else renderVyroba(cards);
}

function updateSummary(cards){
  document.getElementById('summary').style.display='grid';
  let totalKs=0, totalKg=0, doneCount=0, totalCount=0;
  cards.forEach(c=>c.produkty.forEach((p,pi)=>{
    if(!p.isSluzba) totalKs+=p.ks;
    p.slozeni.forEach((s,ci)=>{
      totalCount++;
      totalKg+=gramToKg(s.gram)*p.ks;
      if(isDone(c.id,pi,ci)) doneCount++;
    });
  }));
  document.getElementById('s-firmy').textContent=cards.length;
  document.getElementById('s-ks').textContent=totalKs||'—';
  document.getElementById('s-kg').textContent=totalKg?fmtKg(totalKg):'—';
  document.getElementById('s-done').textContent=totalCount?`${doneCount}/${totalCount}`:'—';
}

/* ═══ FIRMY VIEW ═══ */
function renderFirmy(cards){
  const mc=document.getElementById('main-content');
  if(!cards.length){mc.innerHTML='<div class="empty-state">Žádné zakázky k zobrazení.</div>';return;}
  const list=document.createElement('div');
  list.className='firmy-list';
  cards.forEach(card=>list.appendChild(buildFirmaCard(card)));
  mc.innerHTML=''; mc.appendChild(list);
}

function buildFirmaCard(card){
  const {id,firma,termin,produkty,url}=card;

  // Celkové kg firmy + počet složek
  let totalKg=0, doneC=0, totalC=0;
  produkty.forEach((p,pi)=>{
    if(p.isSluzba) return;
    p.slozeni.forEach((s,ci)=>{ totalC++; totalKg+=gramToKg(s.gram)*p.ks; if(isDone(id,pi,ci)) doneC++; });
  });
  const pct=totalC?Math.round(doneC/totalC*100):0;
  const allDone=totalC>0&&doneC===totalC;
  const totalKs=produkty.filter(p=>!p.isSluzba).reduce((s,p)=>s+p.ks,0);

  const el=document.createElement('div');
  el.className='firma-card'+(allDone?' all-done':'');

  // Header
  const hdr=document.createElement('div');
  hdr.className='firma-hdr';
  hdr.innerHTML=`
    <div>
      <div class="firma-name">${firma}${url?` <a href="${url}" target="_blank" style="font-size:11px;font-weight:400;color:var(--br);text-decoration:none;margin-left:6px" title="Trello">🃏</a>`:''}</div>
      <div class="firma-meta">
        ${termin?`<strong>Termín:</strong> ${termin}&ensp;`:''}
        <strong>Objednávka:</strong> ${totalKs} ks
      </div>
      ${totalC?`
      <div class="firma-progress" style="margin-top:8px">
        <div class="prog-bar"><div class="prog-fill${pct===100?' full':''}" style="width:${pct}%"></div></div>
        <span class="prog-txt">${doneC}/${totalC}</span>
      </div>`:''}
    </div>
    ${totalKg?`
    <div class="firma-hdr-right">
      <div class="firma-total-kg">${fmtKg(totalKg)}</div>
      <div class="firma-total-lbl">celkem surovin</div>
    </div>`:''}
  `;
  el.appendChild(hdr);

  // Dárkové produkty
  const darkyWrap=document.createElement('div');
  darkyWrap.className='darky-list';

  produkty.forEach((prod,pi)=>{
    const block=document.createElement('div');
    block.className='darek-block';

    // Kg pro tento dárek
    const darekKg=prod.slozeni.reduce((s,c)=>s+gramToKg(c.gram)*prod.ks,0);

    block.innerHTML=`
      <div class="darek-hdr">
        <span class="darek-icon">${prod.isSluzba?'⚙️':'📦'}</span>
        <span class="darek-name">${prod.nazev}</span>
        <span class="darek-ks">${prod.ks} ks</span>
        ${darekKg?`<span class="darek-kg">${fmtKg(darekKg)}</span>`:''}
      </div>
    `;

    if(prod.isSluzba){
      block.innerHTML+=`<div class="sluzba-row">⚙️ Služba / grafika / tisk</div>`;
    } else if(prod.slozeni.length===0){
      block.innerHTML+=`<div class="no-comp">Bez dílčích produktů — vyplňte složení v zakázce</div>`;
    } else {
      prod.slozeni.forEach((s,ci)=>{
        const done=isDone(id,pi,ci);
        const compKg=gramToKg(s.gram)*prod.ks;
        const row=document.createElement('div');
        row.className='comp-row'+(done?' done':'');
        row.innerHTML=`
          <div class="comp-check"></div>
          <div class="comp-info">
            <div class="comp-name">${s.nazev||'—'}${s.kod?`<span class="comp-kod">kód ${s.kod}</span>`:''}</div>
            ${s.gram?`<div class="comp-gram">${s.gram} × ${prod.ks} ks</div>`:''}
          </div>
          <div class="comp-kg">${compKg?fmtKg(compKg):'—'}</div>
        `;
        row.onclick=()=>toggle(id,pi,ci);
        block.appendChild(row);
      });

      if(darekKg){
        const foot=document.createElement('div');
        foot.className='darek-footer';
        foot.innerHTML=`<span class="darek-footer-lbl">Celkem pro tento dárek</span><span class="darek-footer-val">${fmtKg(darekKg)}</span>`;
        block.appendChild(foot);
      }
    }

    darkyWrap.appendChild(block);
  });

  el.appendChild(darkyWrap);

  // Poznámky
  const nota = getNote(id);
  const notaBar = document.createElement('div');
  notaBar.className = 'nota-bar';
  notaBar.onclick = () => toggleNota(id);
  notaBar.innerHTML = `
    <span class="nota-bar-lbl${nota?' has-text':''}" id="nota-lbl-${id}">${nota?'📝 '+nota.split('\n')[0].slice(0,50)+(nota.length>50?'…':''):'📝 Přidat poznámku…'}</span>
    <span class="nota-toggle" id="nota-tog-${id}">▾</span>
  `;
  el.appendChild(notaBar);

  const notaBody = document.createElement('div');
  notaBody.className = 'nota-body';
  notaBody.id = 'nota-body-'+id;
  notaBody.innerHTML = `
    <textarea class="nota-ta" id="nota-ta-${id}" placeholder="Poznámky k zakázce — priorita, speciální instrukce, kontakt…">${nota}</textarea>
    <div class="nota-hint">Ukládá se automaticky</div>
  `;
  el.appendChild(notaBody);

  // Auto-save při psaní
  setTimeout(() => {
    const ta = document.getElementById('nota-ta-'+id);
    if (!ta) return;
    ta.addEventListener('input', () => {
      setNote(id, ta.value);
      const lbl = document.getElementById('nota-lbl-'+id);
      if (lbl) {
        const v = ta.value.trim();
        lbl.className = 'nota-bar-lbl'+(v?' has-text':'');
        lbl.textContent = v ? '📝 '+v.split('\n')[0].slice(0,50)+(v.length>50?'…':'') : '📝 Přidat poznámku…';
      }
    });
  }, 0);

  return el;
}

/* ── Termín helpers ── */
function terminToMs(t){
  if(!t) return Infinity;
  const [d,m,y]=t.split('.').map(Number);
  return new Date(y,m-1,d).getTime();
}
function terminSort(a,b){ return terminToMs(a)-terminToMs(b); }
function terminBadge(t){
  if(!t) return '';
  const ms=terminToMs(t);
  const now=Date.now();
  const days=Math.ceil((ms-now)/86400000);
  const cls=days<0?'late':days<=7?'soon':'ok';
  const lbl=days<0?`⚠️ ${t}`:`📅 ${t}`;
  return `<span class="ftermin ${cls}">${lbl}</span>`;
}

/* ═══ VÝROBA VIEW ═══ */
function renderVyroba(cards){
  const mc=document.getElementById('main-content');

  // ingMap: ingKey → { nazev, kod, byPack: Map(packKey → {gram, darek, kod, usages[]}) }
  const ingMap=new Map();
  cards.forEach(card=>{
    card.produkty.forEach((prod,pi)=>{
      if(prod.isSluzba) return;
      prod.slozeni.forEach((s,ci)=>{
        const ingKey=s.nazev.trim().toLowerCase()+'|'+(s.kod||'');
        if(!ingMap.has(ingKey)) ingMap.set(ingKey,{nazev:s.nazev||(s.kod?'kód '+s.kod:'—'),kod:s.kod,byPack:new Map()});
        const ing=ingMap.get(ingKey);
        const packKey=s.gram+'__'+prod.nazev;
        if(!ing.byPack.has(packKey)) ing.byPack.set(packKey,{gram:s.gram,darek:prod.nazev,usages:[]});
        ing.byPack.get(packKey).usages.push({cardId:card.id,firma:card.firma,ks:prod.ks,pi,ci,termin:card.termin});
      });
    });
  });

  if(!ingMap.size){mc.innerHTML='<div class="empty-state">Žádné dílčí produkty.<br>Doplňte složení v zakázkách.</div>';return;}

  const sorted=[...ingMap.entries()].sort((a,b)=>a[1].nazev.localeCompare(b[1].nazev,'cs'));
  const grid=document.createElement('div');
  grid.className='vyroba-grid';

  sorted.forEach(([,ing])=>{
    // Celkové kg + stav pro celou surovinu
    let totalKg=0, doneC=0, totalC=0;
    ing.byPack.forEach(pack=>{
      pack.usages.forEach(u=>{
        totalC++;
        totalKg+=gramToKg(pack.gram)*u.ks;
        if(isDone(u.cardId,u.pi,u.ci)) doneC++;
      });
    });
    const allDone=totalC>0&&doneC===totalC;

    const card=document.createElement('div');
    card.className='icard'+(allDone?' all-done':'');

    // Header
    const hdr=document.createElement('div');
    hdr.className='ihdr';
    hdr.innerHTML=`
      <div class="iname">${ing.nazev}${ing.kod?`<span style="font-size:10px;color:#b8860b;font-family:monospace;font-weight:400;margin-left:8px">kód ${ing.kod}</span>`:''}</div>
      <div class="itotal-kg">${fmtKg(totalKg)}</div>
    `;
    card.appendChild(hdr);

    // Pack sekce seřazeny podle gramáže
    const sortedPacks=[...ing.byPack.entries()].sort((a,b)=>{
      const d=gramToKg(a[1].gram)-gramToKg(b[1].gram);
      return d||a[1].darek.localeCompare(b[1].darek,'cs');
    });

    sortedPacks.forEach(([,pack])=>{
      const packKg=pack.usages.reduce((s,u)=>s+gramToKg(pack.gram)*u.ks,0);
      const packDone=pack.usages.filter(u=>isDone(u.cardId,u.pi,u.ci)).length;

      const sect=document.createElement('div');
      sect.className='pack-section';

      const phdr=document.createElement('div');
      phdr.className='pack-hdr';
      phdr.innerHTML=`
        <span class="pack-gram">${pack.gram||'?'}</span>
        <span class="pack-darek">📦 ${pack.darek}</span>
        <span class="pack-total">${packDone}/${pack.usages.length}</span>
      `;
      sect.appendChild(phdr);

      // Seřadit firmy podle termínu (nejdřívější nahoře)
      pack.usages.sort((a,b)=>terminSort(a.termin,b.termin));
      pack.usages.forEach(u=>{
        const done=isDone(u.cardId,u.pi,u.ci);
        const uKg=gramToKg(pack.gram)*u.ks;
        const tb=terminBadge(u.termin);
        const nota=getNote(u.cardId);
        const nid=`vn-${u.cardId}`;

        const frow=document.createElement('div');
        frow.className='frow'+(done?' done':'');
        frow.innerHTML=`
          <div class="fcheck"></div>
          <div class="ffirma-wrap">
            <span class="ffirma">${u.firma}</span>
            ${tb}
          </div>
          <div class="fks">${u.ks} ks</div>
          <div class="fkg">${fmtKg(uKg)}</div>
          <button class="fnota-btn${nota?' has-nota':''}" id="fnota-btn-${nid}" title="Poznámka k firmě" onclick="event.stopPropagation();toggleFNota('${nid}','${u.cardId}')">📝</button>
        `;
        frow.onclick=()=>toggle(u.cardId,u.pi,u.ci);
        sect.appendChild(frow);

        // Poznámka pod řádkem
        const nwrap=document.createElement('div');
        nwrap.className='fnota-wrap';
        nwrap.id='fnota-wrap-'+nid;
        nwrap.innerHTML=`
          <textarea class="fnota-ta" id="fnota-ta-${nid}" placeholder="Poznámka k ${u.firma}…">${nota}</textarea>
          <div class="fnota-hint">Ukládá se automaticky · sdílí se s pohledem Firmy</div>
        `;
        sect.appendChild(nwrap);

        setTimeout(()=>{
          const ta=document.getElementById('fnota-ta-'+nid);
          if(!ta) return;
          ta.addEventListener('input',()=>{
            setNote(u.cardId,ta.value);
            // Sync tlačítko ikonky
            document.querySelectorAll(`[id^="fnota-btn-"][id$="-${u.cardId}"]`).forEach(b=>b.classList.toggle('has-nota',!!ta.value.trim()));
          });
        },0);
      });

      // Patička
      const foot=document.createElement('div');
      foot.className='pack-foot';
      foot.innerHTML=`<span class="pfoot-lbl">Celkem ${pack.gram||''}</span><span class="pfoot-kg">${fmtKg(packKg)}</span>`;
      sect.appendChild(foot);

      card.appendChild(sect);
    });

    grid.appendChild(card);
  });

  mc.innerHTML=''; mc.appendChild(grid);
}

/* ═══ VZORKY VIEW ═══ */
const VZ_KEY = 'nw_vzorky_v1';
const VZ_SC = {
  zadano:    { label: 'Zadáno',    cls: 'vz-s-zadano' },
  vyroba:    { label: 'Ve výrobě', cls: 'vz-s-vyroba' },
  odeslano:  { label: 'Odesláno',  cls: 'vz-s-odeslano' },
  schvaleno: { label: 'Schváleno', cls: 'vz-s-schvaleno' },
  zamitnuto: { label: 'Zamítnuto', cls: 'vz-s-zamitnuto' },
};
const VZ_TK = '0363ebb149df04d' + '1285672a3080160a2';
const VZ_TT = 'ATTA7b1b8a1cedc122827' + 'fdb2f80dc24b58d10855d967' + 'e0045b5e4d7d6fd340c2feaC4F111FE';
const VZ_LIST = '65ae2174c564aeaec070bc25';

function vzFmtD(iso){ if(!iso) return '—'; const p=iso.split('T')[0].split('-'); return `${p[2]}.${p[1]}.${p[0]}`; }
function migrateVz(vz){ if(vz.items) return vz; return {...vz, items:[{produkt:vz.produkt||'',slozeni:vz.slozeni||[],obal:vz.obal||'',gramaz:vz.gramaz||'',pocet:vz.pocet||1,popis:vz.popis||''}]}; }
function loadVzorky(){ try{ return JSON.parse(localStorage.getItem(VZ_KEY)||'[]').map(migrateVz); }catch(e){ return []; } }
function saveVzorky(d){ try{ localStorage.setItem(VZ_KEY,JSON.stringify(d)); }catch(e){} }

function buildVzCardDesc(vz){
  const items=vz.items||[];
  const itemsText=items.map((it,i)=>{
    const sl=it.slozeni&&it.slozeni.length?'  Složení: '+it.slozeni.map(s=>`${s.nazev}${s.kod?` (${s.kod})`:''}`).join(', '):'';
    return [`**Vzorek ${i+1}:** ${it.produkt||'—'} | ${it.obal||'—'} | ${it.gramaz||'—'} | ${it.pocet||1} ks`,sl,it.popis?`  ${it.popis}`:'']. filter(Boolean).join('\n');
  }).join('\n\n');
  const human=[
    `**Zadal:** ${vz.zadal||'—'}`,`**Email:** ${vz.email||'—'}`,`**Telefon:** ${vz.telefon||'—'}`,
    vz.deadline?`**Deadline:** ${vzFmtD(vz.deadline)}`:'',
    vz.motiv?`**Motiv:** ${vz.motiv}`:'',
    `\n**Vzorky (${items.length}):**\n${itemsText}`,
    vz.adresa?`\n**Adresa:**\n${vz.adresa}`:'',
    vz.design_link?`**Design:** ${vz.design_link}`:'',
    vz.poznamka?`**Poznámka:**\n${vz.poznamka}`:'',
    `**Status:** ${(VZ_SC[vz.status]||VZ_SC.zadano).label}`,
    `🔗 ${location.origin}/vzorky.html#${vz.id}`,
  ].filter(Boolean).join('\n');
  return `<!--VZ_DATA:${JSON.stringify(vz)}-->\n\n---\n${human}`;
}
async function getVzTrelloCardId(vzId){
  try{
    const r=await fetch(`https://api.trello.com/1/lists/${VZ_LIST}/cards?key=${VZ_TK}&token=${VZ_TT}&fields=id,name`);
    if(!r.ok) return null;
    const cards=await r.json();
    const c=cards.find(c=>c.name.startsWith(`[${vzId}]`));
    return c?c.id:null;
  }catch(e){return null;}
}
async function syncVzTrello(vzId,vz){
  try{
    const cardId=await getVzTrelloCardId(vzId);
    if(!cardId) return;
    await fetch(`https://api.trello.com/1/cards/${cardId}?key=${VZ_TK}&token=${VZ_TT}`,{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({desc:buildVzCardDesc(vz)}),
    });
  }catch(e){console.error('Trello sync:',e);}
}

function vzChStatus(id, status){
  const d=loadVzorky();
  const i=d.findIndex(s=>s.id===id);
  if(i>=0){ d[i].status=status; d[i].updated=new Date().toISOString(); saveVzorky(d); syncVzTrello(id,d[i]); }
  renderVzorky();
}

function vzEsc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function vzFmtDl(iso){
  if(!iso) return '';
  const now=new Date(); now.setHours(0,0,0,0);
  const dl=new Date(iso); dl.setHours(0,0,0,0);
  const days=Math.round((dl-now)/86400000);
  const parts=iso.split('T')[0].split('-');
  const fmt=`${parts[2]}.${parts[1]}.${parts[0]}`;
  const cls=days<0?'late':days<=5?'soon':'ok';
  const pre=days<0?'⚠️':'📅';
  return `<span class="ftermin ${cls}">${pre} ${fmt}</span>`;
}

async function fetchVzorkyFromTrello(){
  try{
    const r=await fetch(`https://api.trello.com/1/lists/${VZ_LIST}/cards?key=${VZ_TK}&token=${VZ_TT}&fields=id,name,desc`);
    if(!r.ok) return null;
    const cards=await r.json();
    return cards.filter(c=>/^\[VZ-/.test(c.name)).map(c=>{
      const m=c.desc&&c.desc.match(/<!--VZ_DATA:([\s\S]*?)-->/);
      if(!m) return null;
      try{return JSON.parse(m[1].trim());}catch(e){return null;}
    }).filter(Boolean);
  }catch(e){return null;}
}

async function syncAndRenderVzorky(){
  renderVzorky();
  const trelloData=await fetchVzorkyFromTrello();
  if(trelloData&&trelloData.length>0){
    const local=loadVzorky();
    const merged=[...trelloData];
    local.forEach(lv=>{
      const inT=merged.find(tv=>tv.id===lv.id);
      if(!inT) merged.push(lv);
      else if(lv.updated&&(!inT.updated||lv.updated>inT.updated)) merged[merged.indexOf(inT)]=lv;
    });
    saveVzorky(merged.map(migrateVz));
    if(activeView==='vzorky') renderVzorky();
  }
}

function renderVzorky(){
  const mc=document.getElementById('main-content');
  document.getElementById('summary').style.display='none';

  const all=loadVzorky();
  const active=all.filter(s=>['zadano','vyroba','odeslano'].includes(s.status));

  if(!active.length){
    mc.innerHTML=`<div class="vz-empty"><div class="vz-empty-icon">🧪</div><div class="vz-empty-title">Žádné aktivní vzorky</div><div class="vz-empty-sub">Vzorky zadávejte přes <a href="/vzorky.html">vzorky.html</a></div></div>`;
    return;
  }

  const ORDER=['zadano','vyroba','odeslano'];
  active.sort((a,b)=>{
    const oi=ORDER.indexOf(a.status)-ORDER.indexOf(b.status);
    if(oi!==0) return oi;
    return (a.deadline||'9')<(b.deadline||'9')?-1:1;
  });

  const wrap=document.createElement('div');
  wrap.className='vzorky-list';

  const hb=document.createElement('div');
  hb.className='vz-header-bar';
  hb.innerHTML=`<div class="vz-header-title">🧪 Aktivní vzorky (${active.length})</div><a href="/vzorky.html" class="vz-header-link">Správa vzorků →</a>`;
  wrap.appendChild(hb);

  active.forEach(vz=>{
    const sc=VZ_SC[vz.status]||VZ_SC.zadano;
    const card=document.createElement('div');
    card.className=`vz-card status-${vz.status}`;

    const acts=[];
    if(vz.status==='zadano'){
      acts.push(`<button class="vz-btn vz-btn-v" onclick="vzChStatus('${vzEsc(vz.id)}','vyroba')">→ Zahájit výrobu</button>`);
      acts.push(`<button class="vz-btn vz-btn-z" onclick="vzChStatus('${vzEsc(vz.id)}','zamitnuto')">✗ Zamítnout</button>`);
    }
    if(vz.status==='vyroba'){
      acts.push(`<button class="vz-btn vz-btn-o" onclick="vzChStatus('${vzEsc(vz.id)}','odeslano')">→ Odesláno klientovi</button>`);
      acts.push(`<button class="vz-btn vz-btn-z" onclick="vzChStatus('${vzEsc(vz.id)}','zamitnuto')">✗ Zamítnout</button>`);
    }
    acts.push(`<a href="/vzorky.html#${vzEsc(vz.id)}" class="vz-link">Detail →</a>`);

    const items = vz.items || [];
    const itemsHtml = items.map((it, idx) => {
      const slHtml = (it.slozeni && it.slozeni.length)
        ? `<div style="font-size:11px;color:#888;margin-left:14px;margin-top:2px;display:flex;flex-direction:column;gap:2px">${it.slozeni.map(s=>`<span>• ${vzEsc(s.nazev)}${s.kod?` <span style="font-family:monospace;font-size:10px;background:#f1e6da;border-radius:3px;padding:1px 4px;color:#b8860b">${vzEsc(s.kod)}</span>`:''}</span>`).join('')}</div>`
        : '';
      const itTags = [
        it.obal ? `<span class="vz-tag">📦 ${vzEsc(it.obal)}</span>` : '',
        it.gramaz ? `<span class="vz-tag">⚖️ ${vzEsc(it.gramaz)}</span>` : '',
        it.pocet ? `<span class="vz-tag">× ${it.pocet} ks</span>` : '',
      ].filter(Boolean).join('');
      return `<div style="border-left:2px solid #e0d0c0;padding:4px 0 4px 10px;margin:4px 0">
        <div style="font-size:13px;font-weight:600;color:#5c381f">Vzorek ${idx+1}: ${vzEsc(it.produkt||'—')}</div>
        ${itTags ? `<div class="vz-tags" style="margin-top:2px">${itTags}</div>` : ''}
        ${it.popis ? `<div style="font-size:12px;color:#888;font-style:italic;margin-top:2px">${vzEsc(it.popis)}</div>` : ''}
        ${slHtml}
      </div>`;
    }).join('');

    const pozHtml = vz.poznamka ? `<div class="vz-nota">${vzEsc(vz.poznamka)}</div>` : '';

    card.innerHTML=`
      <div class="vz-hdr">
        <div class="vz-hdr-left">
          <div class="vz-id">${vzEsc(vz.id)}</div>
          <div class="vz-klient">${vzEsc(vz.klient)}</div>
          <div class="vz-produkt">${items.length} ${items.length===1?'vzorek':'vzorků'}${vz.motiv?' · '+vzEsc(vz.motiv):''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="vz-sbadge ${sc.cls}">${sc.label}</span>
          ${vz.deadline?vzFmtDl(vz.deadline):''}
        </div>
      </div>
      <div class="vz-body">
        ${itemsHtml}
        ${pozHtml}
        <div class="vz-actions">${acts.join('')}</div>
      </div>
    `;
    wrap.appendChild(card);
  });

  mc.innerHTML='';
  mc.appendChild(wrap);
}

loadProg();
loadNotes();
loadData();
</script>
