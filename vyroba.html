<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nutworld — Výrobní plán</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bd:#5c381f;--br:#83502e;--kraft:#f1e6da;--acc:#da1668;--leaf:#6fa044;--amb:#f7ab31;--amb-soft:#fff8e1}
body{font-family:'Source Sans 3',Arial,sans-serif;background:#e8ddd4;color:#2a1a0e;font-size:14px;min-height:100vh}

.topbar{background:var(--bd);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar-title{font-family:'Exo 2',sans-serif;font-size:17px;font-weight:800;color:white}
.topbar a{color:rgba(255,255,255,.6);font-size:12px;text-decoration:none}
.topbar a:hover{color:white}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.refresh-info{font-size:11px;color:rgba(255,255,255,.5)}
.btn-refresh{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;font-family:inherit}
.btn-refresh:hover{background:rgba(255,255,255,.25)}

.container{max-width:1200px;margin:0 auto;padding:16px}

/* Toolbar */
.toolbar{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px;background:white;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;border:1.5px solid #d4c0a8;border-radius:8px;padding:7px 10px 7px 32px;font-size:13px;font-family:inherit;background:#faf7f3}
.search-wrap input:focus{outline:none;border-color:var(--br)}
.search-wrap::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px}

.list-filters{display:flex;gap:5px;flex-wrap:wrap;width:100%;padding-top:8px;border-top:1px solid #ede0d4;margin-top:8px}
.lpill{padding:4px 12px;border-radius:20px;border:1.5px solid #d4c0a8;background:white;font-size:11px;font-weight:700;cursor:pointer;color:#888;font-family:inherit;transition:all .15s}
.lpill.on{background:var(--bd);border-color:var(--bd);color:white}
.lpill:hover:not(.on){background:var(--kraft);color:var(--bd)}
.lpill-all.on{background:var(--amb)!important;border-color:var(--amb)!important;color:var(--bd)!important}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}}
.sum-box{background:white;border-radius:10px;padding:10px 14px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.sum-val{font-family:'Exo 2',sans-serif;font-size:22px;font-weight:800;color:var(--bd)}
.sum-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.sum-box.green .sum-val{color:var(--leaf)}

/* Grid výroby */
.vyroba-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* Karta ingredience */
.ing-card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;transition:box-shadow .15s}
.ing-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.ing-card.all-done .ing-header{background:#e8f5e9;border-color:var(--leaf)}
.ing-card.all-done .ing-gram{background:var(--leaf);color:white}

.ing-header{padding:12px 15px;background:var(--amb-soft);border-bottom:2px solid var(--amb);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ing-name{font-family:'Exo 2',sans-serif;font-weight:800;font-size:14px;color:var(--bd);flex:1}
.ing-gram{font-size:11px;background:var(--amb);color:var(--bd);border-radius:4px;padding:2px 8px;font-weight:700;white-space:nowrap}
.ing-kod{font-size:10px;color:#b8860b;font-family:monospace}

.ing-stats{font-size:11px;color:#999;padding:6px 15px;border-bottom:1px solid #f0e8e0;display:flex;justify-content:space-between;align-items:center}
.ing-stats-done{color:var(--leaf);font-weight:700}

.ing-rows{padding:4px 0}

/* Řádek firmy */
.ing-row{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid #f8f3ee}
.ing-row:last-child{border-bottom:none}
.ing-row:hover{background:#faf7f3}
.ing-row.checked{background:#f4fbf4}
.ing-row.checked .ing-firma{color:#bbb}
.ing-row.checked .ing-darku{color:#ccc}

.ing-check{width:20px;height:20px;border:2px solid #d4c0a8;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:white;margin-top:1px}
.ing-row.checked .ing-check{background:var(--leaf);border-color:var(--leaf)}
.ing-row.checked .ing-check::after{content:'✓';font-size:12px;font-weight:800;color:white}

.ing-info{flex:1;min-width:0}
.ing-firma{font-size:13px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ing-row.checked .ing-firma{text-decoration:line-through}
.ing-darku{font-size:11px;color:#999;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ing-ks{font-size:12px;color:#aaa;white-space:nowrap;flex-shrink:0;align-self:flex-start;margin-top:3px}

/* Loading / prázdný stav */
.state-box{background:white;border-radius:12px;padding:48px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.state-box p{color:#888;font-size:14px;margin-top:10px}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid var(--kraft);border-top-color:var(--br);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{background:white;border-radius:12px;padding:40px;text-align:center;color:#bbb;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">🏭 Výrobní plán</span>
  <a href="/">← Rozcestník</a>
  <a href="/zakazy.html">🃏 Zakázky</a>
  <div class="topbar-right">
    <span class="refresh-info" id="refresh-info">načítám…</span>
    <button class="btn-refresh" onclick="loadData(true)">↻ Obnovit</button>
  </div>
</div>

<div class="container">

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Hledat produkt, firmu nebo kód…" oninput="render()"/>
    </div>
    <div class="list-filters" id="list-filters"></div>
  </div>

  <div class="summary" id="summary" style="display:none">
    <div class="sum-box"><div class="sum-val" id="s-firmy">—</div><div class="sum-lbl">Firem</div></div>
    <div class="sum-box"><div class="sum-val" id="s-ing">—</div><div class="sum-lbl">Produktů k výrobě</div></div>
    <div class="sum-box green"><div class="sum-val" id="s-done">—</div><div class="sum-lbl">Hotovo</div></div>
    <div class="sum-box"><div class="sum-val" id="s-zbyvá">—</div><div class="sum-lbl">Zbývá</div></div>
  </div>

  <div id="main-content">
    <div class="state-box"><div class="spinner"></div><p>Načítám zakázky z Trella…</p></div>
  </div>

</div>

<script>
const KEY   = atob('MDM2M2ViYjE0OWRmMDRkMTI4NTY3MmEzMDgwMTYwYTI=');
const TOKEN = atob('QVRUQTdiMWI4YTFjZWRjMTIyODI3ZmRiMmY4MGRjMjRiNThkMTA4NTVkOTY3ZTAwNDViNWU0ZDdkNmZkMzQwYzJmZWFDNEYxMTFGRQ==');
const BOARD = '637f702c5e323c01d42feeac';
const CACHE_KEY = 'nw_vyroba_cache';
const PROG_KEY  = 'nw_vyroba_progress';
const EXCLUDE   = ['archiv','storno','hotov','dokončen','faktura'];

let allLists    = [];
let allCards    = [];
let parsedCards = [];
let activeLists = new Set(['ALL']);
let progress    = {};

/* ── Progress ── */
function saveProg() { try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch(e){} }
function loadProg() { try { progress = JSON.parse(localStorage.getItem(PROG_KEY)||'{}'); } catch(e){ progress={}; } }
function pKey(cardId, pi, ci) { return `${cardId}_p${pi}_c${ci}`; }
function isDone(cardId, pi, ci) { return !!progress[pKey(cardId,pi,ci)]; }
function toggle(cardId, pi, ci) { const k=pKey(cardId,pi,ci); progress[k]=!progress[k]; saveProg(); render(); }

/* ── API ── */
function api(path, params={}) {
  return fetch(`https://api.trello.com/1${path}?`+new URLSearchParams({key:KEY,token:TOKEN,...params})).then(r=>r.json());
}
function saveCache(lists,cards){ try{localStorage.setItem(CACHE_KEY,JSON.stringify({lists,cards,ts:Date.now()}));}catch(e){} }
function loadCache(){ try{return JSON.parse(localStorage.getItem(CACHE_KEY));}catch(e){return null;} }

async function loadData(force=false) {
  document.getElementById('refresh-info').textContent='načítám…';
  document.getElementById('main-content').innerHTML='<div class="state-box"><div class="spinner"></div><p>Načítám zakázky z Trella…</p></div>';
  const cache=loadCache();
  if(!force && cache && (Date.now()-cache.ts)<5*60000){
    allLists=cache.lists; allCards=cache.cards;
    document.getElementById('refresh-info').textContent=`cache ${Math.round((Date.now()-cache.ts)/60000)} min`;
    process(); return;
  }
  try {
    const [lists,cards]=await Promise.all([
      api(`/boards/${BOARD}/lists`),
      api(`/boards/${BOARD}/cards`,{fields:'name,desc,idList,due,url'})
    ]);
    allLists=lists.filter(l=>!l.closed);
    allCards=cards;
    saveCache(allLists,allCards);
    const n=new Date();
    document.getElementById('refresh-info').textContent=`${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;
    process();
  } catch(e) {
    document.getElementById('main-content').innerHTML=`<div class="state-box"><p>⚠️ Chyba: ${e.message}</p></div>`;
  }
}

/* ── Parse ── */
function excl(name){ return EXCLUDE.some(k=>name.toLowerCase().includes(k)); }

function parseComp(s) {
  const km=s.match(/\(kód\s+(\S+)\)\s*$/);
  const kod=km?km[1]:'';
  const rest=(km?s.slice(0,km.index):s).trim();
  const toks=rest.split(/\s+/);
  let gi=-1;
  for(let i=1;i<toks.length;i++){
    if(/^\d+(?:[.,]\d+)?(?:g|kg|ml)?$/i.test(toks[i])){ gi=i; break; }
  }
  if(gi===-1) return {nazev:rest,gram:'',obal:'',kod};
  return {nazev:toks.slice(0,gi).join(' '),gram:toks[gi],obal:toks.slice(gi+1).join(' '),kod};
}

function parseCard(card) {
  const {id,name,desc='',idList,url}=card;
  const firma=name.split(' — ')[0]||name;
  const tm=desc.match(/\*\*Termín:\*\*\s*(\d{2}\.\d{2}\.\d{4})/);
  const termin=tm?tm[1]:'';
  const produkty=[];
  const sect=desc.match(/##\s*🛒 Produkty\n\n([\s\S]*?)(?:\n##\s|$)/);
  if(sect){
    let cur=null;
    for(const line of sect[1].split('\n')){
      const hm=line.match(/^\*\*(.+?)\*\*(\s*\*\(služba\)\*)?\s*$/);
      if(hm){ if(cur)produkty.push(cur); cur={nazev:hm[1].trim(),isSluzba:!!hm[2],ks:0,slozeni:[]}; continue; }
      if(!cur) continue;
      const km=line.match(/[-\s]*(\d+)\s*ks/); if(km) cur.ks=parseInt(km[1]);
      const sm=line.match(/📦\s+(.+)/);
      if(sm) cur.slozeni=sm[1].split(', ').map(parseComp).filter(x=>x.nazev||x.kod);
    }
    if(cur) produkty.push(cur);
  }
  return {id,firma,termin,idList,produkty,url};
}

function process(){
  const vis=new Set(allLists.filter(l=>!excl(l.name)).map(l=>l.id));
  parsedCards=allCards.filter(c=>vis.has(c.idList)).map(parseCard);
  buildFilters([...allLists].filter(l=>vis.has(l.id)));
  loadProg();
  render();
}

/* ── List filter pills ── */
function buildFilters(lists){
  const c=document.getElementById('list-filters');
  c.innerHTML='';
  const a=document.createElement('button');
  a.className='lpill lpill-all'+(activeLists.has('ALL')?' on':'');
  a.textContent='Vše';
  a.onclick=()=>{ activeLists=new Set(['ALL']); buildFilters(lists); render(); };
  c.appendChild(a);
  lists.forEach(l=>{
    const cnt=allCards.filter(x=>x.idList===l.id).length;
    const b=document.createElement('button');
    b.className='lpill'+(activeLists.has(l.id)?' on':'');
    b.textContent=`${l.name} (${cnt})`;
    b.onclick=()=>{
      activeLists.delete('ALL');
      activeLists.has(l.id)?activeLists.delete(l.id):activeLists.add(l.id);
      if(!activeLists.size) activeLists.add('ALL');
      buildFilters(lists); render();
    };
    c.appendChild(b);
  });
}

/* ── Render ── */
function visible(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  return parsedCards.filter(c=>{
    if(!activeLists.has('ALL')&&!activeLists.has(c.idList)) return false;
    if(!q) return true;
    if(c.firma.toLowerCase().includes(q)) return true;
    return c.produkty.some(p=>
      p.nazev.toLowerCase().includes(q)||
      p.slozeni.some(s=>s.nazev.toLowerCase().includes(q)||s.kod.toLowerCase().includes(q))
    );
  });
}

function render(){
  const cards=visible();

  // Build ingredient map
  // Key: normalized name+gram (or kod)
  // Value: {displayNazev, gram, kod, usages:[{cardId,firma,prodNazev,prodIdx,compIdx,ks}]}
  const ingMap=new Map();
  cards.forEach(card=>{
    card.produkty.forEach((prod,pi)=>{
      if(prod.isSluzba) return;
      prod.slozeni.forEach((s,ci)=>{
        const key=(s.kod?'k_'+s.kod:'')+'|'+s.nazev.toLowerCase().trim()+'|'+s.gram.toLowerCase();
        if(!ingMap.has(key)) ingMap.set(key,{displayNazev:s.nazev||(s.kod?'kód '+s.kod:'—'),gram:s.gram,kod:s.kod,usages:[]});
        ingMap.get(key).usages.push({cardId:card.id,firma:card.firma,prodNazev:prod.nazev,prodKs:prod.ks,pi,ci});
      });
    });
  });

  // Summary
  const el=document.getElementById('summary');
  el.style.display='grid';
  const firmy=new Set(cards.map(c=>c.id));
  let totalRows=0,doneRows=0;
  ingMap.forEach(ing=>{ ing.usages.forEach(u=>{ totalRows++; if(isDone(u.cardId,u.pi,u.ci)) doneRows++; }); });
  document.getElementById('s-firmy').textContent=firmy.size;
  document.getElementById('s-ing').textContent=ingMap.size||'—';
  document.getElementById('s-done').textContent=totalRows?`${doneRows}/${totalRows}`:'—';
  document.getElementById('s-zbývá').textContent=totalRows-doneRows||'—';

  const mc=document.getElementById('main-content');
  if(!ingMap.size){
    mc.innerHTML='<div class="empty-state">Žádné dílčí produkty k zobrazení.<br>Doplňte složení v zakázkách.</div>';
    return;
  }

  // Sort by name
  const sorted=[...ingMap.entries()].sort((a,b)=>a[1].displayNazev.localeCompare(b[1].displayNazev,'cs'));

  const grid=document.createElement('div');
  grid.className='vyroba-grid';

  sorted.forEach(([,ing])=>{
    const totalU=ing.usages.length;
    const doneU=ing.usages.filter(u=>isDone(u.cardId,u.pi,u.ci)).length;
    const allDone=doneU===totalU&&totalU>0;

    const card=document.createElement('div');
    card.className='ing-card'+(allDone?' all-done':'');

    card.innerHTML=`
      <div class="ing-header">
        <span class="ing-name">${ing.displayNazev}</span>
        ${ing.gram?`<span class="ing-gram">${ing.gram}</span>`:''}
        ${ing.kod?`<span class="ing-kod">kód ${ing.kod}</span>`:''}
      </div>
      <div class="ing-stats">
        <span>${totalU} firma${totalU===1?'':'y/firem'}</span>
        <span class="ing-stats-done">${doneU}/${totalU} hotovo</span>
      </div>
    `;

    const rows=document.createElement('div');
    rows.className='ing-rows';

    ing.usages.forEach(u=>{
      const done=isDone(u.cardId,u.pi,u.ci);
      const row=document.createElement('div');
      row.className='ing-row'+(done?' checked':'');
      row.innerHTML=`
        <div class="ing-check"></div>
        <div class="ing-info">
          <div class="ing-firma">${u.firma}</div>
          <div class="ing-darku">📦 ${u.prodNazev}</div>
        </div>
        <span class="ing-ks">× ${u.prodKs} ks</span>
      `;
      row.onclick=()=>toggle(u.cardId,u.pi,u.ci);
      rows.appendChild(row);
    });

    card.appendChild(rows);
    grid.appendChild(card);
  });

  mc.innerHTML='';
  mc.appendChild(grid);
}

loadProg();
loadData();
</script>
</body>
</html>
