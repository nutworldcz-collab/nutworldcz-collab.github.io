<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<script>
  // server features (login, chat, push, clock-in, documents, bank, company calendar) live on the tools server only —
  // the GitHub copy forwards there so both addresses work 1:1 (Jan 2026-11-27)
  if (/github\.io$/.test(location.hostname)) location.replace('https://nastroje.nutworld.cz' + location.pathname + location.search + location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutworld – aplikace</title>
<meta name="theme-color" content="#5c381f">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/pwa/aplikace.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" href="/pwa/favicon-64.png">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutworld">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--hn:#83502e;--tm:#5c381f;--kr:#f1e6da;--ru:#da1668;--zl:#f7ab31;--ze:#6fa044;
  --bg:#faf6f1;--tx:#2a1a0e;--mu:#7a6656;--ca:#fff;--li:#e5d6c6;--navh:64px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1c140e;--tx:#f3e9df;--mu:#bfa995;--ca:#2a1f17;--li:#4a3828;--kr:#3a2a1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Source Sans 3",Arial,sans-serif;line-height:1.45;font-size:16px;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:var(--hn)}

/* top bar */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--tm);color:#fff;
  padding:calc(var(--st) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;min-height:calc(var(--st) + 58px)}
#bar .t{flex:1;min-width:0;font-family:"Exo 2",Arial,sans-serif;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .ib{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:18px;cursor:pointer;color:#fff;flex:none}
#bar .ib:active{background:rgba(255,255,255,.25)}
#bar [hidden]{display:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--zl);display:grid;place-items:center;font-weight:700;color:var(--tm);font-size:14px;flex:none;border:0;cursor:pointer}

/* views */
#views{position:fixed;top:calc(var(--st) + 58px);left:0;right:0;bottom:calc(var(--navh) + var(--sb))}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px;display:none}
.view.on{display:block}
.view.frame{padding:0;overflow:hidden}
.view.frame iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.wrap{max-width:860px;margin:0 auto}

/* bottom nav (phone) / side rail (big screen) */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ca);border-top:1px solid var(--li);
  display:flex;justify-content:space-around;padding:6px 4px calc(var(--sb) + 6px);height:calc(var(--navh) + var(--sb))}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);cursor:pointer;padding:2px 0;border-radius:12px}
#nav button .i{font-size:22px;line-height:1.1}
#nav button.a{color:var(--hn);font-weight:700}
#nav button.a .i{transform:scale(1.08)}
@media (min-width:900px){
  #views{left:220px;bottom:0}
  #nav{top:calc(var(--st) + 58px);bottom:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;
    border-top:0;border-right:1px solid var(--li);padding:12px 10px;gap:4px}
  #nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;justify-content:flex-start}
  #nav button.a{background:var(--kr)}
  .view{padding:24px 28px 40px}
}

/* cards */
.card{background:var(--ca);border:1px solid var(--li);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card .h{font-weight:700;color:var(--hn);font-size:15.5px}
.card .s{color:var(--mu);font-size:13.5px}
h2.sek{font-family:"Exo 2",Arial,sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);margin:18px 2px 8px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;font-weight:700}
.t-r{background:#fde7f0;color:#b0104f}.t-z{background:#fff1d6;color:#8a5a00}.t-g{background:#e9f3e1;color:#3f6d22}
.click{cursor:pointer;transition:transform .08s}
.click:active{transform:scale(.98)}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.nums{grid-template-columns:repeat(4,1fr)}}
.nums .card{text-align:center;margin:0;padding:14px 8px}
.nums .i{font-size:22px}.nums b{display:block;font-size:24px;font-family:"Exo 2",Arial,sans-serif;color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--ca);border:1px solid var(--li);border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tile .i{font-size:26px}.tile .n{font-weight:700;font-size:14.5px;color:var(--tx);line-height:1.25}
.tile:active{transform:scale(.97)}
.big{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:8px;cursor:pointer;text-align:center;text-decoration:none}
.b-h{background:var(--hn);color:#fff}.b-z{background:var(--zl);color:var(--tm)}.b-l{background:var(--kr);color:var(--tm)}
.hello{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.hello img{width:58px;height:58px;border-radius:16px}
.hello .g{font-family:"Exo 2",Arial,sans-serif;font-size:22px;font-weight:700;color:var(--tx)}
.hello .d{color:var(--mu);font-size:14px}

/* ask */
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;padding:13px 14px;border:2px solid var(--li);border-radius:12px;background:var(--ca);color:var(--tx);font-size:16px}
.ask input:focus{outline:none;border-color:var(--hn)}
.ask button{border:0;border-radius:12px;background:var(--hn);color:#fff;font-weight:700;padding:0 16px;cursor:pointer}
.odp{white-space:pre-wrap;font-size:15px}
.akce{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.akce button{border:0;background:var(--kr);color:var(--tm);font-weight:700;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}

/* více */
.find{width:100%;padding:13px 14px;border:2px solid var(--li);border-radius:12px;background:var(--ca);color:var(--tx);font-size:16px;margin-bottom:6px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--li);cursor:pointer}
.list .it .i{font-size:22px;width:30px;text-align:center;flex:none}
.list .it .n{font-weight:700;font-size:15px}
.list .it .p{color:var(--mu);font-size:13px}
.list .it:active{background:var(--kr)}

/* install */
.steps{margin:6px 0 0;padding-left:22px}.steps li{margin:7px 0}
.kbd{display:inline-block;background:var(--kr);border-radius:7px;padding:0 7px;font-weight:700}
.hint{background:#fff1d6;border:1px solid var(--zl);color:#2a1a0e;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hint .x{float:right;background:none;border:0;font-size:18px;cursor:pointer;color:#7a6656}

#load{position:fixed;inset:0;z-index:50;background:var(--tm);display:grid;place-items:center;color:#fff;font-family:"Exo 2",Arial,sans-serif;transition:opacity .25s}
#load img{width:110px;height:110px;border-radius:28px;display:block;margin:0 auto 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.err{color:var(--ru);font-weight:700}
/* team chat */
#nav button{position:relative}
.bdg{position:absolute;top:0;left:calc(50% + 6px);background:var(--ru);color:#fff;border-radius:10px;font-size:10.5px;font-weight:700;padding:0 5px;min-width:17px;line-height:17px}
@media (min-width:900px){.bdg{position:static;margin-left:auto}}
.ch{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--li);cursor:pointer}
.ch:active{background:var(--kr)}
.ch .ic{width:40px;height:40px;border-radius:12px;background:var(--kr);display:grid;place-items:center;font-size:18px;flex:none;font-weight:700;color:var(--tm)}
.ch .tx{flex:1;min-width:0}.ch .n{font-weight:700}.ch .l{color:var(--mu);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .u{background:var(--ru);color:#fff;border-radius:11px;font-size:12px;font-weight:700;padding:1px 8px}
.ch.unread .n{color:var(--hn)}
.view.tk{padding:0;display:none;flex-direction:column}.view.tk.on{display:flex}
.tk-list{flex:1;overflow-y:auto;padding:12px 12px 6px;-webkit-overflow-scrolling:touch}
.tk-form{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px);border-top:1px solid var(--li);background:var(--ca)}
.tk-form textarea{flex:1;resize:none;border:2px solid var(--li);border-radius:18px;padding:9px 13px;font:inherit;font-size:16px;max-height:140px;background:var(--bg);color:var(--tx)}
.tk-form textarea:focus{outline:none;border-color:var(--hn)}
.tk-ib{width:40px;height:42px;display:grid;place-items:center;font-size:21px;cursor:pointer;background:none;border:0;border-radius:12px;flex:none;user-select:none;-webkit-user-select:none}
.tk-ib.rec{background:var(--ru);animation:pulse 1s infinite}.tk-ib.dict{background:var(--zl)}
@keyframes pulse{50%{opacity:.6}}
.tk-send{width:44px;height:42px;border:0;border-radius:50%;background:var(--hn);color:#fff;font-size:18px;cursor:pointer;flex:none}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin:3px 0;max-width:100%}
.msg.me{align-items:flex-end}
.msg .who{font-size:12px;color:var(--mu);margin:8px 6px 2px;font-weight:700}
.bub{max-width:min(82%,560px);padding:8px 12px;border-radius:16px;background:var(--ca);border:1px solid var(--li);white-space:pre-wrap;word-wrap:break-word;font-size:15.5px;line-height:1.4;cursor:pointer}
.msg.me .bub{background:var(--hn);color:#fff;border-color:var(--hn);border-bottom-right-radius:4px}
.msg:not(.me) .bub{border-bottom-left-radius:4px}
.msg.bot .bub{background:#fff8ec;border-color:var(--zl);color:#2a1a0e}
.bub .mn{font-weight:700;color:var(--hn)}
.msg.bot .bub{white-space:normal}.mdt{border-collapse:collapse;font-size:13px;margin:6px 0;display:block;overflow-x:auto;max-width:100%}
.mdt th,.mdt td{border-bottom:1px solid #ecd9b8;padding:3px 6px;text-align:left;white-space:nowrap}.mdt th{font-size:11px;color:#8a5a00}.msg.me .bub .mn{color:#ffe2a8}
.bub img{max-width:100%;max-height:340px;border-radius:10px;display:block;margin:2px 0}
.bub audio{max-width:240px;display:block}
.bub .ct{border-left:3px solid var(--zl);padding:2px 8px;margin-bottom:4px;font-size:13px;opacity:.85}
.bub.del{font-style:italic;opacity:.6}
.meta{font-size:11px;color:var(--mu);margin:2px 8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rx{display:inline-flex;gap:2px;background:var(--kr);border-radius:10px;padding:0 6px;font-size:12.5px;color:var(--tm);cursor:pointer}
.rx.mine{outline:1.5px solid var(--hn)}
.day-sep{text-align:center;color:var(--mu);font-size:12px;margin:14px 0 6px;font-weight:700}
.tk-mention{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;background:var(--ca);border-top:1px solid var(--li)}
.tk-mention button,.tk-reply button{border:0;background:var(--kr);color:var(--tm);border-radius:14px;padding:5px 11px;font-weight:700;cursor:pointer;font-size:14px}
.tk-mention[hidden],.tk-reply[hidden]{display:none}
.tk-rec .dot{width:12px;height:12px;border-radius:50%;background:var(--ru);animation:pulse 1s infinite}
.tk-rec button.ok{background:var(--hn);color:#fff}
.more{border:0;background:none;color:var(--mu);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.ed{font-style:italic}
.tk-reply{padding:6px 10px;background:var(--ca);border-top:1px solid var(--li);font-size:13px;color:var(--mu);display:flex;gap:8px;align-items:center}
.sheet{position:fixed;inset:0;background:rgba(30,15,5,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--ca);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + var(--sb))}
.sheet .emo{display:flex;justify-content:space-around;font-size:28px;margin-bottom:8px}.sheet .emo span{cursor:pointer;padding:4px}
.sheet button.big{margin-top:6px}
.toast{position:fixed;left:12px;right:12px;top:calc(var(--st) + 10px);z-index:60;background:var(--ca);color:var(--tx);border:2px solid var(--zl);
  border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-140%);transition:transform .3s;cursor:pointer;max-width:520px;margin:0 auto}
.toast.on{transform:none}.toast div{color:var(--mu);font-size:14px}
label.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--li);cursor:pointer}
label.sw:last-child{border-bottom:0}
label.sw .i{font-size:22px;width:30px;text-align:center;flex:none}
label.sw .tx{flex:1;display:flex;flex-direction:column}
label.sw input{width:24px;height:24px;accent-color:var(--ze);flex:none}
select.find{appearance:auto}
.rule{padding:9px 0;border-bottom:1px solid var(--li)}.rule:last-child{border-bottom:0}
.rule summary{cursor:pointer;color:var(--hn);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:14px}
</style>
</head>
<body>
<div id="load"><div style="text-align:center"><img src="/pwa/ikona-192.png" alt=""><div>Nutworld</div></div></div>

<div id="bar">
  <button class="ib" id="zpet" hidden aria-label="Zpět">←</button>
  <span class="t" id="titul">Nutworld</span>
  <button class="ib" id="obnov" hidden aria-label="Obnovit" title="Obnovit stránku">⟳</button>
  <button class="ib" id="ven" hidden aria-label="Otevřít zvlášť" title="Otevřít v novém okně">↗</button>
  <button class="ib" id="kalb" hidden aria-label="Firemní kalendář" title="Firemní kalendář">📅</button>
  <button class="av" id="av" aria-label="Můj účet">·</button>
</div>

<div id="views">
  <section class="view" id="v-domu"><div class="wrap" id="domu"></div></section>
  <section class="view" id="v-skenovat"><div class="wrap" id="skenovat"></div></section>
  <section class="view" id="v-vice"><div class="wrap" id="vice"></div></section>
  <section class="view" id="v-instalace"><div class="wrap" id="instalace"></div></section>
  <section class="view" id="v-ucet"><div class="wrap" id="ucet"></div></section>
  <section class="view" id="v-upozorneni"><div class="wrap" id="upozorneni"></div></section>
  <section class="view" id="v-tym"><div class="wrap" id="tym"></div></section>
  <section class="view" id="v-pich"><div class="wrap" id="pich"></div></section>
  <section class="view" id="v-smeny"><div class="wrap" id="smeny"></div></section>
  <section class="view tk" id="v-tymk"><div id="tk-list" class="tk-list"></div><div id="tk-mention" class="tk-mention" hidden></div>
    <div id="tk-reply" class="tk-reply" hidden></div>
    <div id="tk-recbar" class="tk-reply tk-rec" hidden><span class="dot"></span><b id="tk-rect">0:00</b><span>Nahrávám…</span>
      <button type="button" id="tk-recx" style="margin-left:auto">Zrušit</button><button type="button" id="tk-recok" class="ok">Odeslat ➤</button></div>
    <form id="tk-form" class="tk-form"><label class="tk-ib" title="Fotka">📷<input type="file" id="tk-foto" accept="image/*" hidden></label>
      <textarea id="tk-text" rows="1" placeholder="Zpráva… (@jméno)" enterkeyhint="send"></textarea>
      <button type="button" class="tk-ib" id="tk-mic" title="Hlasová zpráva">🎤</button>
      <button class="tk-send" id="tk-send" aria-label="Odeslat">➤</button></form></section>
</div>

<nav id="nav"></nav>

<script src="stranky-data.js"></script>
<script>
'use strict';
// Staff app (PWA) — one icon, one login, menu by role. Phase 1: shell + role menu + today's tool pages inside the app.
// Same data and pages as nastroje.nutworld.cz; nothing is copied. Works on GitHub Pages too (PIN guard, full menu).
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
const ON_SERVER = /^https?:$/.test(location.protocol) && !/github\.io$/.test(location.hostname)
  && !['localhost', '127.0.0.1'].includes(location.hostname);
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const STRANKY = (window.NW_STRANKY || []).filter(p => p.soubor && p.soubor !== 'aplikace.html');
const SKUPINY = window.NW_SKUPINY || [];
const PAGE = Object.fromEntries(STRANKY.map(p => [p.soubor, p]));

let ME = {jmeno: '', role: 'plny', stranky: ['*']}, ROLE_VSE = null, NAHLED_ROLE = null;
let ALLOWED = null;          // Set of page files the role may open (null = all)

// ── bottom menu per role (preview approved 27. 11. 2026); first allowed candidate wins in each slot ──
const NAV = {
  admin:     [['domu'], ['wolf.html'], ['tym'], ['chat.html'], ['vice']],
  plny:      [['domu'], ['vyroba.html'], ['tym', 'skenovat'], ['chat.html', 'nastenky.html'], ['vice']],
  vyroba:    [['domu'], ['vyroba.html'], ['tym', 'skenovat'], ['stitky-kontrola.html', 'stitky.html'], ['vice']],
  obchod:    [['domu'], ['zakazy.html', 'nastenky.html'], ['nabidky.html'], ['tym', 'chat.html', 'kalkulator.html'], ['vice']],
  marketing: [['domu'], ['bannery.html'], ['tym', 'nastenky.html'], ['popupy.html', 'chat.html'], ['vice']],
  brigadnik: [['pich'], ['smeny'], ['vice']],
};
const NAV_LABEL = {domu: ['🏠', 'Domů'], skenovat: ['📷', 'Skenovat'], vice: ['☰', 'Více'],
  'vyroba.html': ['🏭', 'Výroba'], 'chat.html': ['🛍️', 'Zákazníci'], tym: ['💬', 'Tým'], pich: ['⏱', 'Píchačka'], smeny: ['👷', 'Kdy přijdu'], 'nastenky.html': ['📌', 'Nástěnky'],
  'stitky-kontrola.html': ['🏷️', 'Štítky'], 'stitky.html': ['🏷️', 'Štítky'], 'zakazy.html': ['📋', 'Zakázky'],
  'nabidky.html': ['🧾', 'Nabídky'], 'kalkulator.html': ['🧮', 'Kalkulátor'], 'bannery.html': ['🖼️', 'Bannery'],
  'popupy.html': ['💬', 'Popupy'], 'wolf.html': ['🐺', 'Přehled'], 'kalendar.html': ['📅', 'Kalendář']};

function can(soubor) {
  const p = PAGE[soubor];
  if (p && p.jen) return p.jen.includes(ME.jmeno);            // named people only (e.g. Pohledávky: Jan + Jana, 2026-11-27)
  if (p && p.skupina === 'jan' && ME.role !== 'admin') return false;
  return !ALLOWED || ALLOWED.has(soubor);
}

// ── who am I ──
async function whoami() {
  if (!ON_SERVER) {   // GitHub Pages: pin-guard.js handles the PIN, everyone sees the full menu
    ME = {jmeno: ls.get('nw_me') || '', role: ls.get('nw_master') ? 'admin' : 'plny', stranky: ['*']};
    return;
  }
  const r = await fetch('/api/asistent/stav', {credentials: 'same-origin', cache: 'no-store'}).catch(() => null);
  if (r && r.status === 401) { location.href = '/_auth/login?next=' + encodeURIComponent('/aplikace.html'); throw 0; }
  if (r && r.ok) { const j = await r.json(); ME = {jmeno: j.jmeno || '', role: j.role || 'plny', stranky: j.stranky || null}; ls.set('nw_app_me', JSON.stringify(ME));
    ROLE_VSE = j.role_vse || null;
    // Jan: preview the app as another role (menu, home, pages it may open) — data still come with Jan's rights
    const nr = sessionStorage.getItem('nw_app_nahled');

  else { const c = ls.get('nw_app_me'); if (c) ME = JSON.parse(c); }   // offline -> last known

// older server without `stranky` in /api/asistent/stav: ask the login server page by page (HEAD), cached for the session
async function probe() {
  const key = 'nw_app_allowed_' + ME.role, c = sessionStorage.getItem(key);
  if (c) return new Set(JSON.parse(c));
  const ok = [];
  const files = STRANKY.map(p => p.soubor);
  for (let i = 0; i < files.length; i += 12) {
    await Promise.all(files.slice(i, i + 12).map(f => fetch('/' + f, {method: 'HEAD', credentials: 'same-origin', redirect: 'manual'})
      .then(r => { if (r.ok) ok.push(f); }).catch(() => {})));
  }
  sessionStorage.setItem(key, JSON.stringify(ok));
  return new Set(ok);
}

// ── routing: #/domu, #/skenovat, #/vice, #/instalace, #/ucet, #/s/<page.html?query> ──
const FRAMES = {};            // keep up to 4 tool pages alive (switching tabs keeps their state)
let CUR = '';
function go(r) { location.hash = '#/' + r; }
function route() {
  let h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || (ME.role === 'brigadnik' ? 'pich' : 'domu');
  if (h.startsWith('pich?')) { const m = h.match(/nahled=([\w-]+)/); PICH_NAHLED = m && ME.role === 'admin' ? m[1] : null; h = 'pich'; }
  else if (h === 'pich') PICH_NAHLED = PICH_NAHLED || null;
  if (ME.role === 'brigadnik' && !['pich', 'smeny', 'vice', 'instalace', 'ucet', 'upozorneni'].includes(h)) h = 'pich';
  if (h.startsWith('stranka/')) h = 's/' + h.slice(8);     // manifest shortcuts
  CUR = h;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  const isPage = h.startsWith('s/');
  $('#zpet').hidden = !isPage; $('#obnov').hidden = !isPage; $('#ven').hidden = !isPage;
  if (h === 'tym' || h.startsWith('tym/')) {
    $('#zpet').hidden = h === 'tym';
    if (h === 'tym') { showView('tym'); markNav('tym'); drawTym(); } else { showView('tymk'); markNav('tym'); openTymK(h.slice(4)); }
    return;
  }
  tymLeave();
  if (isPage) {
    const url = h.slice(2), file = url.split(/[?#]/)[0];
    if (!can(file)) { $('#titul').textContent = 'Bez přístupu'; showView('ucet'); $('#ucet').innerHTML = `<div class="card"><div class="h">Sem nemáš přístup</div><div class="s">Když to potřebuješ, napiš Honzovi přes „Napsat, co je potřeba“ na rozcestníku.</div></div>`; markNav(''); return; }
    let f = FRAMES[url];
    if (!f) {
      f = document.createElement('section'); f.className = 'view frame';
      f.innerHTML = `<iframe title="${esc(file)}" src="/${esc(url)}" allow="camera; microphone; clipboard-write; geolocation"></iframe>`;
      $('#views').appendChild(f); FRAMES[url] = f; f._t = Date.now();
      const keys = Object.keys(FRAMES);
      if (keys.length > 4) { const old = keys.sort((a, b) => FRAMES[a]._t - FRAMES[b]._t)[0]; FRAMES[old].remove(); delete FRAMES[old]; }
    }
    f._t = Date.now(); f.classList.add('on');
    $('#titul').textContent = (PAGE[file] && PAGE[file].nazev) || (NAV_LABEL[file] || [, file])[1];
    markNav(file);
    return;
  }
  const v = ['domu', 'skenovat', 'vice', 'instalace', 'ucet', 'upozorneni', 'pich', 'smeny'].includes(h) ? h : 'domu';
  showView(v); markNav(v);
  ({domu: drawHome, skenovat: drawScan, vice: drawMore, instalace: drawInstall, ucet: drawAccount, upozorneni: drawPush, pich: drawPich, smeny: drawSmeny})[v]();
}
function showView(v) { $('#v-' + v).classList.add('on'); }
function markNav(k) { document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('a', b.dataset.k === k)); }
function openPage(url) { go('s/' + String(url).replace(/^\//, '').replace(/^https?:\/\/[^/]+\//, '')); }

function drawNav() {
  $('#nav').innerHTML = navItems().map(k => {
    const [i, n] = NAV_LABEL[k] || [(PAGE[k] || {}).ikona || '📄', (PAGE[k] || {}).nazev || k];
    return `<button data-k="${esc(k)}"><span class="i">${i}</span>${esc(n)}</button>`;
  }).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k.includes('.')) {
      // tapping the active tab again = reload that page from its start (like any app)
      if (CUR === 's/' + k && FRAMES[k]) FRAMES[k].querySelector('iframe').src = '/' + k;
      openPage(k);
    } else go(k);
  });
}

  const box = $('#den'); if (!box) return;

  const d0 = new Date(), d1 = new Date(Date.now() + 864e5), f = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const [kal, pre] = await Promise.all([can('kalendar.html') ? get(`/api/nastenky/kalendar?od=${f(d0)}&do=${f(d1)}&moje=1`) : null,
    can('nastenky.html') ? get('/api/nastenky/prehled') : null]);
  const ud = ((kal && kal.udalosti) || []).slice(0, 5), today = f(d0);
  // same rule as the morning summary: the label-making column is left out (Jan 2026-11-27)
  const bez = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim() === 'tvorba stitku firmy';
  const moje = ((pre && pre.karty) || []).filter(k => k.moje && k.termin && !k.termin_hotovo && !bez(k.sloupec));

const HIST = [];
async function ask() {
  const q = $('#q'), text = q.value.trim(); if (!text) return;
  const ans = $('#ans'); $('#go').disabled = true;
  ans.innerHTML = `<div class="card"><div class="s">🐿️ Přemýšlím…</div></div>`;
  try {
    const r = await fetch('/api/asistent/dotaz', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, historie: HIST.slice(-4)})});
    const j = await r.json().catch(() => ({chyba: 'Asistent teď neodpověděl.'}));
    if (!r.ok || j.chyba) throw new Error(j.chyba || 'chyba ' + r.status);
    HIST.push({q: text, a: j.odpoved});
    ans.innerHTML = `<div class="card"><div class="odp">${esc(j.odpoved)}</div>${(j.akce || []).length ? `<div class="akce">${j.akce.map((a, i) => `<button data-i="${i}">${a.ikona || ''} ${esc(a.nazev)}</button>`).join('')}</div>` : ''}</div>`;

}

// ── phase 2: push notifications (server nw_push.py) ──
const PUSH_OK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const pushApi = async (path, body) => {
  const r = await fetch('/api/push/' + path, body ? {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {credentials: 'same-origin', cache: 'no-store'});
  const j = await r.json().catch(() => ({chyba: 'Server neodpověděl.'}));
  if (!r.ok || j.chyba) throw new Error(j.chyba || 'chyba ' + r.status);
  return j;
};
const b64key = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '=='.slice(0, (4 - s.length % 4) % 4)), c => c.charCodeAt(0));
async function mySub() {
  if (!PUSH_OK) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
const DEV_NAME = () => ({iphone: 'iPhone', ipad: 'iPad', android: 'Android', 'mac-safari': 'Mac', 'mac-chrome': 'Mac', pc: 'Počítač'})[device()];

async function pushHint() {

  if (Notification.permission === 'denied') return;
  const s = await mySub().catch(() => null); if (s) return;

    Zpráva do telefonu, když se děje něco pro tebe. <a href="#/upozorneni">Nastavit →</a></div>`;

async function drawPush() {
  $('#titul').textContent = 'Upozornění';
  const box = $('#upozorneni');
  if (!ON_SERVER) { box.innerHTML = `<div class="card"><div class="s">Upozornění fungují jen na <b>nastroje.nutworld.cz/aplikace.html</b> (s přihlášením).</div></div>`; return; }

    <div id="p-msg"></div></div>`;
  h += `<h2 class="sek">Co mi má chodit</h2><div class="card">${st.kategorie.map(k => `
    <label class="sw"><span class="i">${k.ikona}</span><span class="tx"><b>${esc(k.nazev)}</b><span class="s">${esc(k.popis)}${k.dostava === false ? ' <i>Teď ti nechodí — změníš níže v „Kdo dostává co“.</i>' : ''}</span></span>
    <input type="checkbox" data-k="${k.key}" ${k.zapnuto ? 'checked' : ''} ${k.povinna || k.dostava === false ? 'disabled' : ''}></label>`).join('')}</div>`;
  if (st.zarizeni.length) h += `<h2 class="sek">Moje zařízení</h2><div class="card">${st.zarizeni.map(d => `<div class="s">📱 ${esc(d.zarizeni || 'zařízení')} · od ${esc(String(d.od || '').slice(0, 10).split('-').reverse().join('. '))}${sub && d.endpoint === sub.endpoint ? ' · <b>toto</b>' : ''}</div>`).join('')}</div>`;
  if (st.admin) h += `<div id="p-admin"></div>`;
  box.innerHTML = h;
  const msg = (t, err) => { $('#p-msg').innerHTML = `<div class="${err ? 'err' : 's'}" style="margin-top:8px">${esc(t)}</div>`; };
  const on = $('#p-on'); if (on) on.onclick = async () => {
    on.disabled = true;
    try {
      if (await Notification.requestPermission() !== 'granted') throw new Error('Bez povolení to nepůjde — zkus znovu a dej Povolit.');
      const reg = await navigator.serviceWorker.ready;
      const s = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64key(st.klic)});
      await pushApi('odber', {sub: s.toJSON(), zarizeni: DEV_NAME()});
      ls.set('nw_push_hint_off', '1'); drawPush();
    } catch (e) { msg(e.message, true); on.disabled = false; }
  };
  const off = $('#p-off'); if (off) off.onclick = async () => {
    try { const ep = sub.endpoint; await sub.unsubscribe(); await pushApi('zrusit', {endpoint: ep}); drawPush(); } catch (e) { msg(e.message, true); }
  };
  const tst = $('#p-test'); if (tst) tst.onclick = async () => {
    try { const j = await pushApi('test', {zpozdeni: 10}); msg(j.odeslano ? 'Za 10 s přijde — teď aplikaci zavři nebo zamkni telefon.' : 'Nic neodešlo — zkus upozornění vypnout a zapnout.', !j.odeslano); } catch (e) { msg(e.message, true); }
  };
  box.querySelectorAll('input[data-k]').forEach(c => c.onchange = async () => {
    try { await pushApi('nastaveni', {kategorie: c.dataset.k, zapnuto: c.checked}); } catch (e) { c.checked = !c.checked; alert(e.message); }
  });
  if (st.admin) drawPushAdmin();
}

function scanQR(title) {
  return new Promise(resolve => {
    const pos = new Promise(ok => { if (!navigator.geolocation) return ok(null);
      navigator.geolocation.getCurrentPosition(p => ok({lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy}), () => ok(null), {enableHighAccuracy: true, timeout: 15000, maximumAge: 0}); });
    const s = document.createElement('div'); s.className = 'sheet';
    s.innerHTML = `<div class="in" style="text-align:center"><b style="font-size:17px">${esc(title)}</b>
      <div class="s" style="margin:4px 0 8px">Namiř telefon na QR kód u šatny</div>
      <div style="position:relative;border-radius:14px;overflow:hidden;background:#222;aspect-ratio:1/1;max-height:52vh;margin:0 auto">
        <video id="qv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
        <div style="position:absolute;inset:18%;border:3px solid #f7ab31;border-radius:14px"></div></div>
      <div id="qs" class="s" style="margin-top:8px">Spouštím kameru…</div>
      <button class="big b-l" id="qno">Zapsat bez QR (bude označeno)</button><button class="big b-l" id="qx">Zrušit</button></div>`;
    document.body.appendChild(s);
    let stream = null, done = false, raf = 0;
    const finish = async qr => { if (done) return; done = true; cancelAnimationFrame(raf); stream && stream.getTracks().forEach(x => x.stop());
      $('#qs').textContent = 'Zjišťuji polohu…'; const p = await pos; s.remove(); resolve({qr, ...(p || {})}); };
    $('#qx').onclick = () => { done = true; cancelAnimationFrame(raf); stream && stream.getTracks().forEach(x => x.stop()); s.remove(); resolve(null); };
    $('#qno').onclick = () => finish('');
    const load = window.jsQR ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = '/vendor/jsQR-1.4.0.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    Promise.all([load, navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false})]).then(([, st]) => {
      stream = st; const v = $('#qv'); v.srcObject = st; v.play(); $('#qs').textContent = 'Hledám QR kód…';
      const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently: true});
      const tick = () => { if (done) return;
        if (v.readyState >= 2) { const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth) || 480; cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
          const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: 'dontInvert'});
          if (r && r.data) { const m = r.data.match(/[?&]qr=([\w-]+)/); if (m) return finish(m[1]); $('#qs').textContent = 'Tohle není náš QR kód.'; } }
        raf = requestAnimationFrame(tick); };
      tick();
    }).catch(() => { $('#qs').innerHTML = '<span class="err">Kamera nejde spustit — povol ji v nastavení telefonu, nebo zapiš bez QR.</span>'; });
  });
}

async function drawPich() {
  $('#titul').textContent = 'Píchačka';
  const box = $('#pich');
  if (!ON_SERVER) { box.innerHTML = `<div class="card"><div class="s">Píchačka funguje na nastroje.nutworld.cz.</div></div>`; return; }
  let j; try { j = PICH = PICH_NAHLED ? await (await fetch('/api/nastenky/pichacky?osoba=' + encodeURIComponent(PICH_NAHLED), {credentials: 'same-origin', cache: 'no-store'})).json() : await pApi(); if (j.chyba) throw new Error(j.chyba); } catch (e) { box.innerHTML = `<div class="card"><div class="h">⏱ Píchačka</div><div class="s">${esc(e.message)}</div></div>` + (ME.role === 'admin' ? '<div id="p-adm"></div>' : ''); if (ME.role === 'admin') pichAdmin(); return; }
  const d = j.dny[j.dnes] || {}, inWork = d.from && !d.to, pz = d.pauzy || [], open = pz.length && !pz[pz.length - 1].do ? pz[pz.length - 1] : null;
  const tiers = j.pauzy_narok || [[4, 15], [8, 30], [12, 60]];
  const presence = d.from ? (d.to ? (d.to < d.from ? mins(d.from, '24:00') + mins('00:00', d.to) : mins(d.from, d.to)) : (j.ted < d.from ? mins(d.from, '24:00') + mins('00:00', j.ted) : mins(d.from, j.ted))) : 0;
  const narok = h => tiers.reduce((a, [od, p]) => h >= od ? p : a, 0);
  const sm = {pauza: narok(presence / 60)}, used = pauseM(d) + (open ? mins(open.od, j.ted) : 0);
  const pravidla = 'do 4 h bez pauzy · od 4 h 15 min · od 8 h 30 min · od 12 h 60 min';
  const month = j.dnes.slice(0, 7), days = Object.entries(j.dny).filter(([k]) => k.startsWith(month)).sort((a, b) => b[0].localeCompare(a[0]));
  const total = days.reduce((a, [, r]) => a + workM(r), 0);
  const badge = r => { const o = r.overeni || {}, b = x => !x ? '' : x.ok ? '📍' : '⚠️';
    const pzBad = (r.pauzy || []).some(p => (p.ov_od && !p.ov_od.ok) || (p.ov_do && !p.ov_do.ok));
    return b(o.prichod) + b(o.odchod) + (r.rucne ? '✍️' : '') + (pzBad ? '⚠️☕' : ''); };
  box.innerHTML = (PICH_NAHLED ? `<div class="hint" style="background:#e8f0fb;border-color:#2c7fb8"><b>👁 Náhled — takhle to vidí ${esc(j.ja.jmeno)}</b><br>Jen pro čtení, obnovuje se samo každých 20 s.</div>` : '')
    + `<div class="hello"><img src="/pwa/ikona-192.png" alt=""><div><div class="g">${PICH_NAHLED ? 'Dobrý den, ' + esc(String(j.ja.jmeno).split(' ')[0]) : esc(greeting())}</div><div class="d">${today()}</div></div></div>
    <div class="card" style="text-align:center;padding:18px 14px">
      <div class="s">${open ? (open.typ === 'koureni' ? '🚬 Kouříš od' : '☕ Pauza od') : inWork ? 'Jsi v práci od' : d.from && d.to ? 'Dnes odpracováno' : 'Dnes ještě nepíchnuto'}</div>
      <div style="font:800 34px 'Exo 2',Arial;color:var(--tm);margin:4px 0">${open ? esc(open.od) : inWork ? esc(d.from) : d.from && d.to ? hm(workM(d)) : '—'}</div>
      ${d.from ? `<div class="s">${esc(d.from)} – ${esc(d.to || '…')} ${badge(d)} · v práci ${hm(presence)} h · pauzy ${used} / ${sm.pauza} min</div>` : ''}
      ${!d.from ? `<div class="s" style="margin-top:8px">Pauzy: ${pravidla}</div>
        <button class="big b-h" id="p-in" style="font-size:19px;padding:18px">✅ Přišel(a) jsem — načíst QR</button>` : ''}
      ${inWork && !open ? `<div style="display:flex;gap:8px"><button class="big b-l" id="p-ko" style="flex:1">🚬 Kouření · QR</button><button class="big b-l" id="p-ji" style="flex:1">☕ Jídlo · QR</button></div>
        <button class="big b-z" id="p-out" style="font-size:19px;padding:18px">👋 Odcházím — načíst QR</button>` : ''}
      ${open ? `<button class="big b-h" id="p-back" style="font-size:19px;padding:18px">↩️ Zpět z pauzy — načíst QR</button>` : ''}
      ${inWork && used > sm.pauza ? `<div class="err" style="margin-top:6px">Pauzy ${used} min — teď máš nárok na ${sm.pauza} min (${pravidla}).</div>` : ''}
      <div id="p-m" class="s" style="margin-top:6px"></div></div>
    <div id="p-dok"></div>
    <h2 class="sek">Moje hodiny · ${['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'][+month.slice(5) - 1]}</h2>
    <div class="card"><div style="display:flex;justify-content:space-between"><b>Celkem ${hm(total)} h</b><span class="s">${days.length} dní · bez pauz</span></div>
      ${days.map(([k, r]) => { const x = new Date(k + 'T12:00');
        return `<div data-d="${k}" style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--li);cursor:pointer"><span style="width:86px">${DNY[x.getDay()].slice(0, 2)} ${x.getDate()}. ${x.getMonth() + 1}.</span>
          <span style="flex:1">${esc(r.from || '?')} – ${esc(r.to || '…')} ${badge(r)}${pauseM(r) ? `<span class="s"> · pauzy ${pauseM(r)} min</span>` : ''}${r.note ? `<span class="s"> · ${esc(r.note)}</span>` : ''}</span><b>${r.from && r.to ? hm(workM(r)) : ''}</b></div>`; }).join('') || '<div class="s" style="margin-top:6px">Tento měsíc zatím nic.</div>'}
      <button class="big b-l" id="p-add">✏️ Zapsat / opravit den ručně</button></div>
    <div class="s" style="margin:6px 4px">📍 = načteno QR na provozovně · ⚠️ = bez QR nebo mimo provozovnu · ✍️ = zapsáno ručně. Každou pauzu (kouření i jídlo) si odpíchni — do hodin se nepočítá. Honza vidí v píchačkách totéž co ty.</div>
    ${ME.role === 'admin' ? '<div id="p-adm"></div>' : ''}`;
  pichDocs();
  clearTimeout(PICH_T);
  if (PICH_NAHLED) {                      // preview: read-only, live
    box.querySelectorAll('button').forEach(b => { b.disabled = true; b.style.opacity = .55; });
    box.querySelectorAll('[data-d]').forEach(el => el.style.pointerEvents = 'none');
    PICH_T = setTimeout(() => { if (CUR === 'pich' && PICH_NAHLED) drawPich(); }, 20000);
    $('#titul').textContent = '👁 ' + j.ja.jmeno;
    return;
  }
  const msg = (t, bad) => $('#p-m').innerHTML = `<span class="${bad ? 'err' : ''}">${esc(t)}</span>`;
  const send = async (body, el) => { if (el) el.disabled = true; try { const r = await pApi(body); const o = (r.zaznam && r.zaznam.overeni) || {}, lp = ((r.zaznam && r.zaznam.pauzy) || []).slice(-1)[0] || {};
      const v = body.akce === 'pauza' ? lp.ov_od : body.akce === 'konec_pauzy' ? lp.ov_do : o[body.akce === 'prisel' ? 'prichod' : 'odchod'];
      if (v && !v.ok) toast({title: '⚠️ Zapsáno s označením', body: !v.qr ? 'Bez QR kódu.' : v.m == null ? 'Poloha se nepodařila zjistit.' : `Telefon byl ${v.m} m od provozovny.`});
      drawPich(); } catch (e) { msg(e.message, true); if (el) el.disabled = false; } };
  const clock = async (akce, el, extra) => {
    let r;
    if (PICH_QR) { const p = await new Promise(ok => navigator.geolocation ? navigator.geolocation.getCurrentPosition(x => ok({lat: x.coords.latitude, lng: x.coords.longitude, acc: x.coords.accuracy}), () => ok({}), {enableHighAccuracy: true, timeout: 15000}) : ok({}));
      r = {qr: PICH_QR, ...p}; PICH_QR = null; }
    else r = await scanQR({prisel: '✅ Příchod', odchod: '👋 Odchod', pauza: extra && extra.typ === 'koureni' ? '🚬 Začátek kouření' : '☕ Začátek pauzy', konec_pauzy: '↩️ Konec pauzy'}[akce]);
    if (!r) return;
    send({akce, ...r, ...(extra || {})}, el);
  };
  if ($('#p-in')) $('#p-in').onclick = e => clock('prisel', e.target);
  if ($('#p-out')) $('#p-out').onclick = e => clock('odchod', e.target);
  // breaks also by the QR next to the changing room (Jan 2026-11-27) — start and end
  if ($('#p-ko')) $('#p-ko').onclick = e => clock('pauza', e.target, {typ: 'koureni'});
  if ($('#p-ji')) $('#p-ji').onclick = e => clock('pauza', e.target, {typ: 'jidlo'});
  if ($('#p-back')) $('#p-back').onclick = e => clock('konec_pauzy', e.target);
  if (PICH_QR && !d.from) msg('QR načten — klepni na „Přišel(a) jsem“.');
  const edit = k => {
    const r = j.dny[k] || {}, s = document.createElement('div'); s.className = 'sheet';
    s.innerHTML = `<div class="in"><b style="font-size:17px">✏️ Zapsat den ručně</b><div class="s">Ručně zapsané časy uvidí Honza označené ✍️.</div>
      <input class="find" type="date" id="pe-d" style="margin-top:10px" value="${k || j.dnes}" max="${j.dnes}">
      <div style="display:flex;gap:8px"><label style="flex:1" class="s">Příchod<input class="find" type="time" id="pe-o" value="${esc(r.from || '')}"></label>
        <label style="flex:1" class="s">Odchod<input class="find" type="time" id="pe-t" value="${esc(r.to || '')}"></label></div>
      <div class="s" style="margin:2px 0 4px">Pauzy (kouření, jídlo):</div><div id="pe-pz"></div>
      <button type="button" class="big b-l" id="pe-addpz" style="margin:0 0 8px;padding:9px">+ Přidat pauzu</button>
      <input class="find" id="pe-n" maxlength="200" placeholder="Poznámka (proč ručně)" value="${esc(r.note || '')}">
      <button class="big b-h" id="pe-ok">Uložit</button><button class="big b-l" id="pe-x">Zrušit</button></div>`;
    document.body.appendChild(s);
    s.onclick = e => { if (e.target === s) s.remove(); }; $('#pe-x').onclick = () => s.remove();
    let PZ = JSON.parse(JSON.stringify(r.pauzy || []));
    const drawPz = () => { $('#pe-pz').innerHTML = PZ.map((p, i) => `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <select class="find" data-i="${i}" data-k="typ" style="margin:0;flex:1.2"><option value="koureni" ${p.typ === 'koureni' ? 'selected' : ''}>🚬 kouření</option><option value="jidlo" ${p.typ !== 'koureni' ? 'selected' : ''}>☕ jídlo</option></select>
        <input class="find" type="time" data-i="${i}" data-k="od" value="${esc(p.od || '')}" style="margin:0;flex:1"><input class="find" type="time" data-i="${i}" data-k="do" value="${esc(p.do || '')}" style="margin:0;flex:1">
        <button type="button" class="tk-ib" data-x="${i}" style="font-size:18px">×</button></div>`).join('') || '<div class="s">Žádná pauza.</div>';
      $('#pe-pz').querySelectorAll('[data-k]').forEach(el => el.onchange = () => { PZ[el.dataset.i][el.dataset.k] = el.value; });
      $('#pe-pz').querySelectorAll('[data-x]').forEach(el => el.onclick = () => { PZ.splice(+el.dataset.x, 1); drawPz(); }); };
    drawPz(); $('#pe-addpz').onclick = () => { PZ.push({typ: 'koureni', od: '', do: ''}); drawPz(); };
    $('#pe-d').onchange = e => { const x = j.dny[e.target.value] || {}; $('#pe-o').value = x.from || ''; $('#pe-t').value = x.to || ''; $('#pe-n').value = x.note || ''; PZ = JSON.parse(JSON.stringify(x.pauzy || [])); drawPz(); };
    $('#pe-ok').onclick = async () => { try { await pApi({datum: $('#pe-d').value, od: $('#pe-o').value, do: $('#pe-t').value, pozn: $('#pe-n').value, pauzy: PZ.filter(p => p.od)}); s.remove(); drawPich(); } catch (e) { alert(e.message); } };
  };
  $('#p-add').onclick = () => edit(j.dnes);
  box.querySelectorAll('[data-d]').forEach(el => el.onclick = () => edit(el.dataset.d));
  if (ME.role === 'admin') pichAdmin();
}

// 📄 documents to confirm (BOZP, hygiene, company rules, GDPR…) — open, then „Přečetl(a) jsem a rozumím“
async function pichDocs() {
  const box = $('#p-dok'); if (!box) return;
  let j; try { const r = await fetch('/api/nastenky/pichacky/dokumenty', {credentials: 'same-origin', cache: 'no-store'}); if (!r.ok) return; j = await r.json(); } catch (e) { return; }
  if (!j.dokumenty.length) return;
  const done = id => j.potvrzeni.find(p => p.dokument === id && (!PICH_NAHLED || p.osoba === PICH_NAHLED));
  const open = j.dokumenty.filter(d => !done(d.id)).length;
  const opened = new Set(JSON.parse(sessionStorage.getItem('nw_dok_open') || '[]'));
  box.innerHTML = `<h2 class="sek">📄 Dokumenty ${open ? `<span class="tag t-r">${open} k potvrzení</span>` : '<span class="tag t-g">vše potvrzeno</span>'}</h2><div class="card">`
    + j.dokumenty.map(d => { const x = done(d.id);
      return `<div style="padding:10px 0;border-bottom:1px solid var(--li)"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">${esc(d.nazev)}</b>${x ? `<span class="tag t-g">✓ ${esc(x.cas.slice(8, 10) + '. ' + x.cas.slice(5, 7) + '.')}</span>` : ''}</div>
        <div style="display:flex;gap:8px;margin-top:6px"><button class="big b-l" style="flex:1;margin:0;padding:10px" data-open="${d.id}">📖 Otevřít</button>
        ${x ? '' : `<button class="big b-h" style="flex:1.4;margin:0;padding:10px" data-ok="${d.id}" ${opened.has(d.id) ? '' : 'disabled title="Nejdřív otevři"'}>✅ Přečetl(a) jsem a rozumím</button>`}</div></div>`; }).join('')
    + `<div class="s" style="margin-top:8px">Potvrzení se uloží k tvé píchačce (datum, čas, přesné znění dokumentu).</div></div>`;
  if (PICH_NAHLED) { box.querySelectorAll('[data-ok]').forEach(b => { b.disabled = true; b.style.opacity = .55; }); }
  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { opened.add(b.dataset.open); sessionStorage.setItem('nw_dok_open', JSON.stringify([...opened]));
    window.open('/api/nastenky/pichacky/dokument/' + b.dataset.open, '_blank'); const ok = box.querySelector(`[data-ok="${b.dataset.open}"]`); if (ok) { ok.disabled = false; ok.title = ''; } });
  box.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => { b.disabled = true;
    try { const r = await fetch('/api/nastenky/pichacky/potvrdit', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: b.dataset.ok})});
      const x = await r.json(); if (!r.ok || x.chyba) throw new Error(x.chyba || 'chyba'); pichDocs(); } catch (e) { alert(e.message); b.disabled = false; } });
}

// Jan: site position (stand at the QR on the spot and tap), QR for print, new QR (old one stops working)
async function pichAdmin() {
  const box = $('#p-adm'); if (!box) return;
  const adm = b => fetch('/api/nastenky/pichacky/nastaveni', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b)})
    .then(async r => { const j = await r.json(); if (!r.ok || j.chyba) throw new Error(j.chyba || 'chyba'); return j; });
  let s; try { s = await adm({akce: 'stav'}); } catch (e) { return; }
  box.innerHTML = `<h2 class="sek">Nastavení píchání (jen ty)</h2><div class="card">
    <div class="s">${s.poloha ? `📍 Poloha provozovny nastavena ${esc(String(s.poloha.kdy).replace('T', ' '))} (přesnost ±${s.poloha.acc} m) · zóna ${s.zona_m} m` : '📍 Poloha provozovny zatím není — postav se k místu QR u šatny a klepni níže.'}</div>
    <button class="big b-h" id="pa-pol">📍 Jsem u QR u šatny — uložit polohu</button>
    <button class="big b-z" id="pa-qr">🖨 QR kód k vytištění</button>
    <button class="big b-l" id="pa-new">🔄 Nový QR (starý přestane platit)</button><div id="pa-m" class="s"></div></div>`;
  $('#pa-pol').onclick = () => { $('#pa-m').textContent = 'Zjišťuji polohu… (venku nebo u okna je přesnější)';
    navigator.geolocation.getCurrentPosition(async p => { try { await adm({akce: 'poloha', lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy}); pichAdmin(); } catch (e) { $('#pa-m').textContent = e.message; } },
      () => $('#pa-m').textContent = 'Poloha nejde zjistit — povol ji aplikaci v nastavení telefonu.', {enableHighAccuracy: true, timeout: 20000, maximumAge: 0}); };
  const print = svg => { const w = window.open('', '_blank'); if (!w) return alert('Povol vyskakovací okna.');
    w.document.write(`<!doctype html><meta charset="utf-8"><title>QR píchačka</title><body style="font-family:Arial;text-align:center;padding:30px">
      <h1 style="color:#5c381f;font-size:40px;margin:0">⏱ Píchačka</h1><p style="font-size:22px">Příchod, odchod i každou pauzu: aplikace Nutworld → <b>Přišel(a) jsem · Kouření · Jídlo · Zpět z pauzy · Odcházím</b> → načti tento kód</p>
      <div style="width:70%;margin:20px auto">${svg.replace('<svg', '<svg style="width:100%;height:auto"')}</div><p style="font-size:18px;color:#7a6656">Nutworld · nefotit a nesdílet</p><script>setTimeout(()=>print(),400)<\/script></body>`); w.document.close(); };
  $('#pa-qr').onclick = () => s.qr_svg ? print(s.qr_svg) : alert('QR se nepodařilo vytvořit.');
  $('#pa-new').onclick = async () => { if (!confirm('Vytvořit nový QR? Starý vytištěný přestane platit a budeš muset vytisknout nový.')) return; s = await adm({akce: 'novy_qr'}); print(s.qr_svg); };
}

  let ev = [];
  try { const r = await fetch(`/api/nastenky/kalendar?od=${d10(a)}&do=${d10(b)}&moje=1`, {credentials: 'same-origin'}); if (r.ok) ev = ((await r.json()).udalosti || []).filter(u => u.kategorie === 'smena'); } catch (e) {}
  const t = new Date(); t.setDate(t.getDate() + 1);
  box.innerHTML = `<div class="card"><div class="h">👷 Zapiš, kdy budeš v práci</div><div class="s">Tým uvidí v kalendáři, kdo kdy dorazí.</div>
      <input class="find" type="date" id="sm-d" style="margin-top:10px" value="${d10(t)}" min="${d10(a)}">
      <div style="display:flex;gap:8px"><label style="flex:1" class="s">Od<input class="find" type="time" id="sm-o" value="08:00"></label>
        <label style="flex:1" class="s">Do<input class="find" type="time" id="sm-t" value="14:00"></label></div>
      <input class="find" id="sm-n" maxlength="200" placeholder="Poznámka (nepovinné)">
      <button class="big b-h" id="sm-ok">Uložit</button><div id="sm-m"></div></div>
    <h2 class="sek">Moje naplánované dny</h2><div class="card">${ev.length ? ev.map(u => { const x = new Date(u.od.slice(0, 10) + 'T12:00');
      return `<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--li)"><b style="width:96px">${DNY[x.getDay()].slice(0, 2)} ${x.getDate()}. ${x.getMonth() + 1}.</b>
        <span style="flex:1">${esc(u.od.slice(11, 16))} – ${esc((u.do || '').slice(11, 16))}${u.popis ? `<span class="s"> · ${esc(u.popis)}</span>` : ''}</span>
        ${u.lze_upravit ? `<button class="tk-ib" data-del="${esc(u.id)}" title="Smazat" style="font-size:17px">🗑</button>` : ''}</div>`; }).join('') : '<div class="s">Zatím nic. Přidej první den nahoře.</div>'}</div>`;
  $('#sm-ok').onclick = async () => {
    const d = $('#sm-d').value, o = $('#sm-o').value, tt = $('#sm-t').value;
    if (!d || !o || !tt || tt <= o) return $('#sm-m').innerHTML = '<div class="err" style="margin-top:6px">Vyplň den a čas (do musí být po od).</div>';
    try {
      const r = await fetch('/api/nastenky/kalendar', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({nazev: `${ME.jmeno} — v práci`, kategorie: 'smena', od: `${d}T${o}`, do: `${d}T${tt}`, cely_den: false, ucastnici: [ME.jmeno], viditelnost: 'vsichni', pripomenout: 0, popis: $('#sm-n').value.trim()})});
      const j = await r.json().catch(() => ({})); if (!r.ok || j.chyba) throw new Error(j.chyba || 'Neuloženo.');
      drawSmeny();
    } catch (e) { $('#sm-m').innerHTML = `<div class="err" style="margin-top:6px">${esc(e.message)}</div>`; }
  };
  box.querySelectorAll('[data-del]').forEach(el => el.onclick = async () => {
    if (!confirm('Smazat tenhle den?')) return;
    await fetch(`/api/nastenky/kalendar/${el.dataset.del}/smazat`, {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: '{}'});
    drawSmeny();
  });
}

// ── top bar buttons ──
$('#zpet').onclick = () => CUR.startsWith('tym/') ? go('tym') : history.length > 1 ? history.back() : go('domu');
$('#obnov').onclick = () => { const f = FRAMES[CUR.slice(2)]; if (f) { const i = f.querySelector('iframe'); i.src = i.src; } };
$('#ven').onclick = () => window.open('/' + CUR.slice(2), '_blank');
$('#av').onclick = () => go('ucet');
$('#kalb').onclick = () => openPage('kalendar.html');

// ── start ──
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw-aplikace.js', {scope: '/'}).catch(() => {});
  // iPhone only suspends an app from the home screen -> on return check the server for a newer version and reload
  const ver = () => fetch('/aplikace.html', {method: 'HEAD', cache: 'no-store', credentials: 'same-origin'})
    .then(r => r.ok ? (r.headers.get('etag') || r.headers.get('last-modified') || '') : '').catch(() => '');
  let V0 = await ver();
  const checkVer = async () => {
    if (document.hidden || !V0) return;
    const v = await ver(); if (!v || v === V0) return;
    const busy = (typeof REC !== 'undefined' && REC) || ($('#tk-text') && $('#tk-text').value.trim());
    if (busy) { V0 = v; return; }
    navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    location.reload();
  };
  document.addEventListener('visibilitychange', checkVer);
  setInterval(checkVer, 10 * 60e3);
  try { await whoami(); } catch (e) { return; }
  if (ON_SERVER) { const r = await fetch('/api/tym/stav', {credentials: 'same-origin'}).catch(() => null); TYM_OK = !!(r && r.ok); if (TYM_OK) TYM = await r.json(); }
  const ini = (ME.jmeno || 'NW').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
  $('#av').textContent = ini;
  if (NAHLED_ROLE) {
    if (NAHLED_ROLE === 'brigadnik') TYM_OK = false;
    const bn = document.createElement('div');
    bn.style.cssText = 'position:fixed;left:0;right:0;bottom:calc(var(--navh) + var(--sb));z-index:30;background:#2c7fb8;color:#fff;font-weight:700;font-size:13px;padding:7px 12px;display:flex;gap:10px;align-items:center';
    bn.innerHTML = `<span style="flex:1">👁 Náhled: ${esc((ROLE_VSE[NAHLED_ROLE] || {}).nazev || NAHLED_ROLE)}</span><button style="border:0;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer">Ukončit</button>`;
    bn.querySelector('button').onclick = () => { sessionStorage.removeItem('nw_app_nahled'); location.hash = '#/domu'; location.reload(); };
    document.body.appendChild(bn);
  }
  $('#kalb').hidden = !(ON_SERVER && can('kalendar.html'));
  drawNav(); tymBadge(); setInterval(() => { if (!document.hidden && TYM_OK) tymPoll(); }, 15000);
  addEventListener('hashchange', route);
  route();
  $('#load').style.opacity = 0; setTimeout(() => $('#load').remove(), 300);
})();
</script>
<script src="pin-guard.js"></script>
</body>
</html>
