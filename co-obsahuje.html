*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bd:#5c381f;--br:#83502e;--kraft:#f1e6da;--acc:#da1668;--amb:#f7ab31;--leaf:#6fa044}
body{font-family:"Source Sans 3",Arial,sans-serif;background:#e8ddd4;color:#2a1a0e;min-height:100vh}
.topbar{background:var(--bd);padding:11px 20px;display:flex;align-items:center;gap:12px}
.topbar-title{font-family:"Exo 2",sans-serif;font-size:16px;font-weight:800;color:white}
.topbar a{color:rgba(255,255,255,.6);font-size:12px;text-decoration:none}
.topbar a:hover{color:white}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px}
.search-box{background:white;border-radius:16px;padding:28px 28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:22px}
.search-box h1{font-family:"Exo 2",sans-serif;font-size:22px;font-weight:800;color:var(--bd);margin-bottom:6px}
.search-box p{font-size:13px;color:#6b4c30;margin-bottom:18px}
.search-input{width:100%;border:2px solid #d4c0a8;border-radius:10px;padding:12px 16px;font-size:16px;font-family:inherit;background:#fdf9f6;transition:border-color .15s}
.search-input:focus{outline:none;border-color:var(--br);background:white}
.updated{font-size:11px;color:#b0966a;margin-top:14px}

/* Result cards */
.result-section{background:white;border-radius:14px;padding:22px 24px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:16px}
.result-label{font-family:"Exo 2",sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a07850;margin-bottom:4px}
.result-title{font-family:"Exo 2",sans-serif;font-size:18px;font-weight:800;color:var(--bd);margin-bottom:4px}
.result-kod{display:inline-block;background:var(--br);color:white;border-radius:6px;padding:2px 9px;font-size:12px;font-weight:700;margin-right:8px}
.result-sub{font-size:12px;color:#a07850;margin-bottom:16px}
.chip{display:inline-block;background:var(--kraft);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--br);margin-bottom:14px}

/* Obsah produktů (darky) */
.obsah-list{display:flex;flex-direction:column;gap:8px}
.obsah-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#fdf9f6;border:1.5px solid #e8ddd4}
.obsah-item-kod{font-family:"Exo 2",sans-serif;font-size:12px;font-weight:700;color:white;background:var(--br);border-radius:6px;padding:2px 8px;flex-shrink:0}
.obsah-item-name{font-size:14px;font-weight:600;color:var(--bd);flex:1}
.obsah-item-name small{display:block;font-size:11px;color:#a07850;font-weight:400;margin-top:1px}
.obsah-item-gram{font-family:"Exo 2",sans-serif;font-size:14px;font-weight:800;color:var(--acc);flex-shrink:0}

.ceny{display:flex;gap:16px;margin-top:16px;padding-top:14px;border-top:1.5px solid var(--kraft)}
.cena-mo{font-family:"Exo 2",sans-serif;font-size:19px;font-weight:800;color:var(--acc)}
.cena-vo{font-size:12px;color:#888;align-self:flex-end;padding-bottom:2px}

/* Složení produktu */
.slozeni-text{font-size:14px;line-height:1.8;color:#3d2310;background:#fdf9f6;border-radius:10px;padding:14px 16px;border:1.5px solid #e8ddd4}
.alg{font-weight:700;color:var(--bd);background:rgba(247,171,49,.18);border-radius:3px;padding:0 2px}
.meta-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--kraft)}
.meta-item{font-size:13px;color:#6b4c30}
.meta-item strong{color:var(--bd);font-weight:700}

/* Empty/hint */
.hint{text-align:center;padding:48px 20px;color:#a08060}
.hint .icon{font-size:48px;margin-bottom:12px}
.hint p{font-size:14px;line-height:1.8}
.hint code{background:var(--kraft);padding:2px 8px;border-radius:4px;font-family:monospace;color:var(--bd)}
.empty{text-align:center;padding:36px 20px;color:#a08060;font-size:14px}
</style>

const darky = DATA.darky;
const cenik = DATA.cenik;
const vstup = DATA.vstup;

// Index darků podle kódu
const darkyByKod = {};
darky.forEach(d => { darkyByKod[d.kod] = d; });

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlightAlergeny(text) {
  // Zvýrazni UPPERCASE slova (alergeny dle EU legislativy)
  return esc(text).replace(/([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]{2,}(?:[ -][A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]{2,})*)/g,
    '<span class="alg">$1</span>');
}

function getProductName(kod) {
  const v = vstup[kod];
  if (v && v.nazev) return v.nazev;
  const c = cenik[kod];
  if (c) return c;
  return kod;
}

function renderDarek(d) {
  const items = d.obsah.split(',').map(item => {
    const [kod, gram] = item.trim().split(':');
    const name = getProductName(kod);
    const druh = (vstup[kod] || {}).druh || '';
    return `<div class="obsah-item">
      <span class="obsah-item-kod">${esc(kod)}</span>
      <div class="obsah-item-name">${esc(name)}${druh ? '<small>'+esc(druh)+'</small>' : ''}</div>
      <div class="obsah-item-gram">${esc(gram || '?')} g</div>
    </div>`;
  }).join('');

  return `<div class="result-section">
    <div class="result-label">🎁 Dárkový produkt</div>
    <div class="result-title"><span class="result-kod">${esc(d.kod)}</span>${esc(d.nazev)}</div>
    <div class="result-sub"><span class="chip">${esc(d.obal)}</span></div>
    <div class="obsah-list">${items}</div>
    <div class="ceny">
      <div class="cena-mo">${esc(d.cena)} Kč</div>
      <div class="cena-vo">VO ${esc(d.vo)} Kč</div>
    </div>
  </div>`;
}

function renderProdukt(kod, v) {
  const meta = [];
  if (v.zeme) meta.push(`<div class="meta-item"><strong>Původ:</strong> ${esc(v.zeme)}</div>`);
  if (v.trvanlivost) meta.push(`<div class="meta-item"><strong>Trvanlivost:</strong> ${esc(v.trvanlivost)}</div>`);
  if (v.druh) meta.push(`<div class="meta-item"><strong>Druh:</strong> ${esc(v.druh)}</div>`);

  return `<div class="result-section">
    <div class="result-label">📋 Složení produktu</div>
    <div class="result-title"><span class="result-kod">${esc(kod)}</span>${esc(v.nazev)}</div>
    <div class="slozeni-text">${highlightAlergeny(v.slozeni)}</div>
    ${meta.length ? '<div class="meta-row">'+meta.join('')+'</div>' : ''}
  </div>`;
}

function search(q) {
  q = q.trim();
  const el = document.getElementById('results');
  if (!q) { el.innerHTML = renderHint(); return; }

  let html = '';
  let found = false;

  // 1. Hledej v dárcích (přesný kód)
  const darek = darkyByKod[q];
  if (darek) { html += renderDarek(darek); found = true; }

  // 2. Hledej v produktech/směsích (přesný kód)
  const prod = vstup[q];
  if (prod && prod.slozeni) { html += renderProdukt(q, prod); found = true; }

  // 3. Částečná shoda v dárcích
  if (!found) {
    const partialDarky = darky.filter(d => d.kod.startsWith(q) || d.nazev.toLowerCase().includes(q.toLowerCase()));
    if (partialDarky.length) {
      html += partialDarky.slice(0,5).map(renderDarek).join('');
      found = true;
    }
  }

  // 4. Částečná shoda v produktech
  if (!found) {
    const partialProds = Object.entries(vstup).filter(([k, v]) =>
      k.startsWith(q) || v.nazev.toLowerCase().includes(q.toLowerCase())
    );
    if (partialProds.length) {
      html += partialProds.slice(0,3).map(([k,v]) => renderProdukt(k,v)).join('');
      found = true;
    }
  }

  if (!found) {
    html = `<div class="empty">Kód <strong>${esc(q)}</strong> nenalezen v dárcích ani v produktech.</div>`;
  }

  el.innerHTML = html;
}

function renderHint() {
  return `<div class="hint">
    <div class="icon">📦</div>
    <p>
      Zadej kód <strong>dárku</strong> → uvidíš jaké produkty obsahuje:<br>
      <code>4700</code> → Mandle uzené 50 g + Mandle karamel 50 g<br><br>
      Zadej kód <strong>produktu nebo směsi</strong> → uvidíš složení:<br>
      <code>2342</code> → Arašídy 20 %, Kešu 30 %, Mandle 30 %…
    </p>
  </div>`;
}

document.getElementById('results').innerHTML = renderHint();
</script>
</body>
</html>
